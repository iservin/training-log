ar on the thighs.","Squat down with the elbows fully extended until the bar touches the floor.","Start over at Phase 1 and repeat for the recommended amount of repetitions."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"power-snatch","name":"Power Snatch","group":"Full Body","primary":"Hamstrings","secondary":["Calves","Glutes","Lower Back","Quads","Front Delts"],"split":"full","pattern":"Olympic","focus":"Hamstrings","guide":null,"steps":["Begin with a loaded barbell on the floor. The bar should be close to or touching the shins, and a wide grip should be taken on the bar. The feet should be directly below the hips, with the feet turned out as needed. Lower the hips, with the chest up and the head looking forward. The shoulders should be just in front of the bar. This will be the starting position.","Begin the first pull by driving through the front of the heels, raising the bar from the ground. The back angle should stay the same until the bar passes the knees.","Transition into the second pull by extending through the hips knees and ankles, driving the bar up as quickly as possible. The bar should be close to the body. At peak extension, shrug the shoulders and allow the elbows to flex to the side.","As you move your feet into the receiving position, a slightly wider position, pull yourself below the bar as you elevate the bar overhead. The bar should be received in a partial squat. Continue raising the bar to the overhead position, receiving the bar locked out overhead.","Return to a standing position with the weight over head."],"equipment":["Barbell"],"metric":"reps","level":"expert","src":"freedb"},{"id":"power-stairs","name":"Power Stairs","group":"Full Body","primary":"Hamstrings","secondary":["Adductors","Calves","Glutes","Lower Back","Quads"],"split":"full","pattern":"Other","focus":"Hamstrings","guide":null,"steps":["In the power stairs, implements are moved up a staircase. For training purposes, these can be performed with a tire or box.","Begin by taking the implement with both hands. Set your feet wide, with your head and chest up. Drive through the ground with your heels, extending your knees and hips to raise the weight from the ground.","As you lean back, attempt to swing the weight onto the stairs, which are usually around 16-18\" high. You can use your legs to help push the weight onto the stair."],"equipment":["Strongman"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"preacher-curl","name":"Preacher Curl","group":"Arms","primary":"Biceps","secondary":["Forearms"],"split":"pull","pattern":"Curl","focus":"Biceps","guide":"Rest arms on angled pad. Focus on slow negatives and full stretch at bottom. Avoid using momentum from shoulders.","steps":["To perform this movement you will need a preacher bench and an E-Z bar. Grab the E-Z curl bar at the close inner handle (either have someone hand you the bar which is preferable or grab the bar from the front bar rest provided by most preacher benches). The palm of your hands should be facing forward and they should be slightly tilted inwards due to the shape of the bar.","With the upper arms positioned against the preacher bench pad and the chest against it, hold the E-Z Curl Bar at shoulder length. This will be your starting position.","As you breathe in, slowly lower the bar until your upper arm is extended and the biceps is fully stretched.","As you exhale, use the biceps to curl the weight up until your biceps is fully contracted and the bar is at shoulder height. Squeeze the biceps hard and hold this position for a second."],"equipment":["EZ Bar","Dumbbell","Machine","Barbell","Cable"],"metric":"reps","level":"beginner","src":"both"},{"id":"preacher-hammer-curl","name":"Preacher Hammer Curl","group":"Arms","primary":"Biceps","secondary":["Forearms"],"split":"pull","pattern":"Curl","focus":"Biceps","guide":null,"steps":["Place the upper part of both arms on top of the preacher bench as you hold a dumbbell in each hand with the palms facing each other (neutral grip).","As you breathe in, slowly lower the dumbbells until your upper arm is extended and the biceps is fully stretched.","As you exhale, use the biceps to curl the weight up until your biceps is fully contracted and the dumbbells are at shoulder height.","Squeeze the biceps hard for a second at the contracted position and repeat for the recommended amount of repetitions."],"equipment":["Dumbbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"press-sit-up","name":"Press Sit-Up","group":"Core","primary":"Abs","secondary":["Mid Chest","Front Delts","Triceps"],"split":"core","pattern":"Crunch","focus":"Abs","guide":null,"steps":["To begin, lie down on a bench with a barbell resting on your chest. Position your legs so they are secure on the extension of the abdominal bench. This is the starting position.","While inhaling, tighten your abdominals and glutes. Simultaneously curl your torso as you do when performing a sit-up and press the barbell to an overhead position while exhaling. Tip: Use your arms to push the barbell out as you perform this exercise while still focusing on the abdominal muscles.","Lower your upper body back down to the starting position while bringing the barbell back down to your torso. Remember to breathe in while lowering the body."],"equipment":["Barbell"],"metric":"reps","level":"expert","src":"freedb"},{"id":"prone-incline-rear-delt-row","name":"Prone Incline Rear Delt Row","group":"Shoulders","primary":"Rear Delts","secondary":[],"split":"pull","pattern":"Row","focus":"Rear Delts","guide":"Lie face down on incline bench. Row with elbows out wide. Keeps body stable and isolates rear delts.","steps":["Lie face down on an incline bench with a dumbbell in each hand, arms hanging.","Row the weights up with the elbows out wide, level with the shoulders.","Pause at the top, then lower slowly."],"equipment":["Dumbbell"],"metric":"reps","level":"beginner","src":"ivan"},{"id":"pull-up","name":"Pull-Up","group":"Back","primary":"Lats","secondary":["Biceps","Upper Back"],"split":"pull","pattern":"Vertical Pull","focus":"Lats","guide":"Hands just outside shoulder width. Start from dead hang, pull chest toward bar, elbows tracking down and back. Engage lats and avoid swinging.","steps":["Grab the pull-up bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than your shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","Pull your torso up until the bar touches your upper chest by drawing the shoulders and the upper arms down and back. Exhale as you perform this portion of the movement. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary as it moves through space and only the arms should move. The forearms should do no other work other than hold the bar.","After a second on the contracted position, start to inhale and slowly lower your torso back to the starting position when your arms are fully extended and the lats are fully stretched."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight","Band"],"metric":"reps","level":"beginner","src":"both"},{"id":"push-jerk","name":"Push Jerk","group":"Full Body","primary":"Quads","secondary":["Calves","Triceps","Abs","Glutes","Hamstrings"],"split":"full","pattern":"Overhead Press","focus":"Quads","guide":null,"steps":["Standing with the weight racked on the front of the shoulders, begin with the dip. With your feet directly under your hips, flex the knees without moving the hips backward. Go down only slightly, and reverse direction as powerfully as possible.","Drive through the heels create as much speed and force as possible, and be sure to move your head out of the way as the bar leaves the shoulders.","At this moment as the feet leave the floor, the feet must be placed into the receiving position as quickly as possible. In the brief moment the feet are not actively driving against the platform, the athletes effort to push the bar up will drive them down. The feet should be moved to a slightly wider stance, with the knees partially bent.","Receive the bar with the arms locked out overhead.","Return to a standing position."],"equipment":["Kettlebell","Barbell"],"metric":"reps","level":"expert","src":"freedb"},{"id":"push-press","name":"Push Press","group":"Shoulders","primary":"Front Delts","secondary":["Triceps","Side Delts"],"split":"push","pattern":"Press","focus":"Full Delts","guide":"Initiate with slight leg drive to assist overhead press. Emphasizes strength and power development in full shoulder complex.","steps":["Hold a barbell at the shoulders with the elbows slightly in front of the bar. Feet shoulder width apart.","Dip a few inches by bending the knees, then drive up hard and press the bar overhead as the legs extend.","Lock out overhead, then lower the bar back to the shoulders under control."],"equipment":["Barbell","Dumbbell","Kettlebell"],"metric":"reps","level":"expert","src":"both"},{"id":"standard-push-up","name":"Push-Up","group":"Chest","primary":"Mid Chest","secondary":[],"split":"push","pattern":"Calisthenics","focus":"Full Chest","guide":"Perform with tight core and flat back. Hands slightly wider than shoulder-width. Full range of motion.","steps":["Lie on the floor face down and place your hands about 36 inches apart while holding your torso up at arms length.","Next, lower yourself downward until your chest almost touches the floor as you inhale.","Now breathe out and press your upper body back up to the starting position while squeezing your chest.","After a brief pause at the top contracted position, you can begin to lower yourself downward again for as many repetitions as needed."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"beginner","src":"both"},{"id":"push-up-to-side-plank","name":"Push-Up to Side Plank","group":"Chest","primary":"Mid Chest","secondary":["Obliques","Front Delts","Triceps"],"split":"push","pattern":"Press","focus":"Mid Chest","guide":null,"steps":["Get into pushup position on the toes with your hands just outside of shoulder width.","Perform a pushup by allowing the elbows to flex. As you descend, keep your body straight.","Do one pushup and as you come up, shift your weight on the left side of the body, twist to the side while bringing the right arm up towards the ceiling in a side plank.","Lower the arm back to the floor for another pushup and then twist to the other side."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"time","level":"beginner","src":"freedb"},{"id":"rack-pull","name":"Rack Pull","group":"Back","primary":"Lower Back","secondary":["Traps","Upper Back","Glutes","Forearms"],"split":"pull","pattern":"Pull","focus":"Lats & Mid Back","guide":"Deadlift from elevated position. Focus on upper back and lockout strength. Great for heavy partials and reducing strain.","steps":["Set up in a power rack with the bar on the pins. The pins should be set to the desired point; just below the knees, just above, or in the mid thigh position. Position yourself against the bar in proper deadlifting position. Your feet should be under your hips, your grip shoulder width, back arched, and hips back to engage the hamstrings. Since the weight is typically heavy, you may use a mixed grip, a hook grip, or use straps to aid in holding the weight.","With your head looking forward, extend through the hips and knees, pulling the weight up and back until lockout. Be sure to pull your shoulders back as you complete the movement.","Return the weight to the pins and repeat."],"equipment":["Barbell","Band"],"metric":"reps","level":"intermediate","src":"both"},{"id":"rear-delt-row","name":"Rear Delt Row","group":"Shoulders","primary":"Rear Delts","secondary":["Upper Back"],"split":"pull","pattern":"Isolation","focus":"Rear Delts","guide":"Row with wide grip and high elbows. Keep tension on upper back and rear delts, not biceps.","steps":["Stand up straight while holding a barbell using a wide (higher than shoulder width) and overhand (palms facing your body) grip.","Bend knees slightly and bend over as you keep the natural arch of your back. Let the arms hang in front of you as they hold the bar. Once your torso is parallel to the floor, flare the elbows out and away from your body. Tip: Your torso and your arms should resemble the letter \"T\". Now you are ready to begin the exercise.","While keeping the upper arms perpendicular to the torso, pull the barbell up towards your upper chest as you squeeze the rear delts and you breathe out. Tip: When performed correctly, this exercise should resemble a bench press in reverse. Also, refrain from using your biceps to do the work. Focus on targeting the rear delts; the arms should only act as hooks.","Slowly go back to the initial position as you breathe in."],"equipment":["Dumbbell","Cable","Barbell"],"metric":"reps","level":"beginner","src":"both"},{"id":"renegade-row","name":"Renegade Row","group":"Back","primary":"Lats","secondary":["Abs","Upper Back","Biceps"],"split":"pull","pattern":"Horizontal Row","focus":"Lats, Core, Rhomboids","guide":"Hold a plank with dumbbells. Row one arm at a time while stabilizing core. Avoid torso rotation. Builds back, core, and anti-rotation strength.","steps":["Place two kettlebells on the floor about shoulder width apart. Position yourself on your toes and your hands as though you were doing a pushup, with the body straight and extended. Use the handles of the kettlebells to support your upper body. You may need to position your feet wide for support.","Push one kettlebell into the floor and row the other kettlebell, retracting the shoulder blade of the working side as you flex the elbow, pulling it to your side.","Then lower the kettlebell to the floor and begin the kettlebell in the opposite hand. Repeat for several reps."],"equipment":["Dumbbell","Kettlebell"],"metric":"reps","level":"expert","src":"both"},{"id":"reverse-band-press","name":"Reverse Band Press","group":"Chest","primary":"Mid Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Press","focus":"Mid Chest","guide":"Bands attached above deload the bottom portion. Great for overload with protection at weakest joint angle. Enhances lockout power.","steps":["Position a bench inside a power rack, with the bar set to the correct height. Begin by anchoring bands either to band pegs or to the top of the rack. Ensure that you will be position properly under the bands. Attach the other end to the barbell.","Lie on the bench, tuck your feet underneath you and arch your back. Using the bar to help support your weight, lift your shoulder off the bench and retract them, squeezing the shoulder blades together. Use your feet to drive your traps into the bench. Maintain this tight body position throughout the movement. However wide your grip, it should cover the ring on the bar.","Pull the bar out of the rack without protracting your shoulders. Focus on squeezing the bar and trying to pull it apart. Lower the bar to your lower chest or upper stomach. The bar, wrist, and elbow should stay in line at all times.","Pause when the barbell touches your torso, and then drive the bar up with as much force as possible. The elbows should be tucked in until lockout."],"equipment":["Barbell","Band"],"metric":"reps","level":"intermediate","src":"both"},{"id":"reverse-crunch","name":"Reverse Crunch","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Leg Raise","focus":"Lower Abs","guide":"Lie on back, curl pelvis upward and off floor. Focus on using lower abs, not momentum. Small range, high tension.","steps":["Connect an ankle strap attachment to a low pulley cable and position a mat on the floor in front of it.","Sit down with your feet toward the pulley and attach the cable to your ankles.","Lie down, elevate your legs and bend your knees at a 90-degree angle. Your legs and the cable should be aligned. If not, adjust the pulley up or down until they are.","With your hands behind your head, bring your knees inward to your torso and elevate your hips off the floor.","Pause for a moment and in a slow and controlled manner drop your hips and bring your legs back to the starting 90-degree angle. You should still have tension on your abs in the resting position."],"equipment":["Bodyweight","Cable","Suspension"],"metric":"reps","level":"beginner","src":"both"},{"id":"reverse-curl","name":"Reverse Curl","group":"Arms","primary":"Forearms","secondary":["Biceps"],"split":"pull","pattern":"Curl","focus":"Biceps","guide":"Pronated grip. Focuses on brachioradialis and outer biceps. Keep wrists neutral and controlled tempo.","steps":["Stand up with your torso upright while holding a barbell at shoulder width with the elbows close to the torso. The palm of your hands should be facing down (pronated grip). This will be your starting position.","While holding the upper arms stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second as you squeeze the muscle.","Slowly begin to bring the bar back to starting position as your breathe in."],"equipment":["EZ Bar","Barbell","Cable","Dumbbell","Machine","Plate"],"metric":"reps","level":"beginner","src":"both"},{"id":"reverse-fly","name":"Reverse Fly","group":"Shoulders","primary":"Rear Delts","secondary":["Upper Back"],"split":"pull","pattern":"Isolation","focus":"Rear Delts","guide":"Sit or bend forward, raise arms out to sides with soft elbows. Focus on controlled movement and rear delt contraction.","steps":["To begin, lie down on an incline bench with the chest and stomach pressing against the incline. Have the dumbbells in each hand with the palms facing each other (neutral grip).","Extend the arms in front of you so that they are perpendicular to the angle of the bench. The legs should be stationary while applying pressure with the ball of your toes. This is the starting position.","Maintaining the slight bend of the elbows, move the weights out and away from each other (to the side) in an arc motion while exhaling. Tip: Try to squeeze your shoulder blades together to get the best results from this exercise.","The arms should be elevated until they are parallel to the floor.","Feel the contraction and slowly lower the weights back down to the starting position while inhaling."],"equipment":["Machine","Cable","Dumbbell","Band"],"metric":"reps","level":"beginner","src":"both"},{"id":"reverse-fly-with-external-rotation","name":"Reverse Fly with External Rotation","group":"Shoulders","primary":"Rear Delts","secondary":[],"split":"pull","pattern":"Fly","focus":"Rear Delts","guide":null,"steps":["To begin, lie down on an incline bench set at a 30-degree angle with the chest and stomach pressing against the incline.","Have the dumbbells in each hand with the palms facing down to the floor. Your arms should be in front of you so that they are perpendicular to the angle of the bench. Tip: Your elbows should have a slight bend. The legs should be stationary while applying pressure with the ball of your toes (your heels should not be touching the floor). This is the starting position.","Maintaining the slight bend of the elbows, move the weights out and away from each other in an arc motion while exhaling.","As you lift the weight, your wrist should externally rotate by 90-degrees so that you go from a palms down (pronated) grip to a palms facing each other (neutral) grip. Tip: Try to squeeze your shoulder blades together to get the best results from this exercise.","The arms should be elevated until they are level with the head.","Feel the contraction and slowly lower the weights back down to the starting position while inhaling."],"equipment":["Dumbbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"reverse-hyperextension","name":"Reverse Hyperextension","group":"Legs","primary":"Hamstrings","secondary":["Calves","Glutes"],"split":"legs","pattern":"Extension","focus":"Hamstrings","guide":null,"steps":["Place your feet between the pads after loading an appropriate weight. Lay on the top pad, allowing your hips to hang off the back, while grasping the handles to hold your position.","To begin the movement, flex the hips, pulling the legs forward.","Reverse the motion by extending the hips, kicking the leg back. It is very important not to over-extend the hip on this movement, stopping short of your full range of motion.","Return by again flexing the hip, pulling the carriage forward as far as you can."],"equipment":["Machine"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"reverse-lunge","name":"Reverse Lunge","group":"Legs","primary":"Quads","secondary":["Calves","Glutes","Hamstrings"],"split":"legs","pattern":"Lunge","focus":"Quads","guide":null,"steps":["Stand with your torso upright holding two dumbbells in your hands by your sides. This will be your starting position.","Step backward with your right leg around two feet or so from the left foot and lower your upper body down, while keeping the torso upright and maintaining balance. Inhale as you go down. Tip: As in the other exercises, do not allow your knee to go forward beyond your toes as you come down, as this will put undue stress on the knee joint. Make sure that you keep your front shin perpendicular to the ground. Keep the torso upright during the lunge; flexible hip flexors are important. A long lunge emphasizes the Gluteus Maximus; a short lunge emphasizes Quadriceps.","Push up and go back to the starting position as you exhale. Tip: Use the ball of your feet to push in order to accentuate the quadriceps. To focus on the glutes, press with your heels.","Now repeat with the opposite leg."],"equipment":["Dumbbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"reverse-nordic-curl","name":"Reverse Nordic Curl","group":"Legs","primary":"Quads","secondary":[],"split":"legs","pattern":"Extension","focus":"Quads/Hip Flexors","guide":"Lean back from kneeling while keeping hips extended. Stretches quads under load.","steps":["Kneel on a pad with the hips and torso upright. Anchor your feet if needed.","Lean back slowly, keeping the hips extended and a straight line from the knees to the shoulders.","Go as far back as you can control, then use the quads to return to the start."],"equipment":["Bodyweight","Band"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"reverse-preacher-curl","name":"Reverse Preacher Curl","group":"Arms","primary":"Biceps","secondary":["Forearms"],"split":"pull","pattern":"Curl","focus":"Biceps","guide":null,"steps":["Grab an EZ-bar using a shoulder width and palms down (pronated) grip.","Now place the upper part of both arms on top of the preacher bench and have your arms extended. This will be your starting position.","As you exhale, use the biceps to curl the weight up until your biceps are fully contracted and the barbell is at shoulder height. Squeeze the biceps hard for a second at the contracted position.","As you breathe in, slowly lower the barbell until your upper arms are extended and the biceps is fully stretched."],"equipment":["EZ Bar"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"reverse-wrist-curl","name":"Reverse Wrist Curl","group":"Arms","primary":"Forearms","secondary":[],"split":"pull","pattern":"Curl","focus":"Forearms","guide":"Palms down, curl wrists upward. Hits extensors. Light weight and slow tempo are key.","steps":["Start out by placing a barbell on one side of a flat bench.","Kneel down on both of your knees so that your body is facing the flat bench.","Use your arms to grab the barbell with a pronated grip (palms down) and bring them up so that your forearms are resting against the flat bench. Your wrists should be hanging over the edge.","Start out by curling your wrist upwards and exhaling.","Slowly lower your wrists back down to the starting position while inhaling.","Your forearms should be stationary as your wrist is the only movement needed to perform this exercise."],"equipment":["Dumbbell","Barbell","Cable"],"metric":"reps","level":"beginner","src":"both"},{"id":"reverse-grip-bent-over-row","name":"Reverse-Grip Bent-Over Row","group":"Back","primary":"Upper Back","secondary":["Biceps","Lats","Front Delts"],"split":"pull","pattern":"Row","focus":"Upper Back","guide":null,"steps":["Stand erect while holding a barbell with a supinated grip (palms facing up).","Bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The barbell should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.","While keeping the torso stationary, lift the barbell as you breathe out, keeping the elbows close to the body and not doing any force with the forearm other than holding the weights. On the top contracted position, squeeze the back muscles and hold for a second.","Slowly lower the weight again to the starting position as you inhale."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"reverse-grip-lat-pulldown","name":"Reverse-Grip Lat Pulldown","group":"Back","primary":"Lats","secondary":["Biceps","Upper Back","Front Delts"],"split":"pull","pattern":"Vertical Pull","focus":"Lats","guide":null,"steps":["Sit down on a pull-down machine with a wide bar attached to the top pulley. Adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the pull-down bar with the palms facing your torso (a supinated grip). Make sure that the hands are placed closer than the shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","As you breathe out, pull the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the fully contracted position and keep the elbows close to your body. The upper torso should remain stationary as your bring the bar to you and only the arms should move. The forearms should do no other work other than hold the bar.","After a second on the contracted position, while breathing in, slowly bring the bar back to the starting position when your arms are fully extended and the lats are fully stretched."],"equipment":["Cable"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"reverse-grip-press","name":"Reverse-Grip Press","group":"Chest","primary":"Mid Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Press","focus":"Mid Chest","guide":"Use underhand grip to shift focus toward upper/mid chest. Tuck elbows and keep movement smooth.","steps":["Lie back on a flat bench. Using a close, supinated grip (around shoulder width), lift the bar from the rack and hold it straight over you with your arms locked extended in front of you and perpendicular to the floor. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on your middle chest. Tip: Make sure that as opposed to a regular bench press, you keep the elbows close to the torso at all times in order to maximize triceps involvement.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your triceps muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."],"equipment":["Barbell","Dumbbell","Smith Machine"],"metric":"reps","level":"intermediate","src":"both"},{"id":"reverse-grip-push-up","name":"Reverse-Grip Push-Up","group":"Chest","primary":"Upper Chest","secondary":["Abs","Front Delts","Triceps"],"split":"push","pattern":"Press","focus":"Upper Chest","guide":null,"steps":["Stand facing a Smith machine bar or sturdy elevated platform at an appropriate height.","Place your hands on the bar palms up, with your hands about shoulder width apart.","Position your feet back from the bar with arms and body straight. This will be your starting position.","Keeping your body straight, lower your chest to the bar by bending the arms.","Return to the starting position by extending the elbows, pressing yourself back up."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"reverse-grip-pushdown","name":"Reverse-Grip Pushdown","group":"Arms","primary":"Triceps","secondary":[],"split":"push","pattern":"Extension","focus":"Triceps","guide":"Palms up grip. Hits medial head. Use light weight to keep elbows pinned and avoid cheating.","steps":["Start by setting a bar attachment (straight or e-z) on a high pulley machine.","Facing the bar attachment, grab it with the palms facing up (supinated grip) at shoulder width. Lower the bar by using your lats until your arms are fully extended by your sides. Tip: Elbows should be in by your sides and your feet should be shoulder width apart from each other. This is the starting position.","Slowly elevate the bar attachment up as you inhale so it is aligned with your chest. Only the forearms should move and the elbows/upper arms should be stationary by your side at all times.","Then begin to lower the cable bar back down to the original staring position while exhaling and contracting the triceps hard."],"equipment":["Cable","Dumbbell","EZ Bar","Barbell"],"metric":"reps","level":"beginner","src":"both"},{"id":"rickshaw-carry","name":"Rickshaw Carry","group":"Full Body","primary":"Forearms","secondary":["Abs","Calves","Glutes","Hamstrings","Lower Back"],"split":"full","pattern":"Carry","focus":"Forearms","guide":null,"steps":["Position the frame at the starting point, and load with the appropriate weight. Standing in the center of the frame, begin by gripping the handles and driving through your heels to lift the frame. Ensure your chest and head are up and your back is straight.","Immediately begin walking briskly with quick, controlled steps. Keep your chest up and head forward, and make sure you continue breathing. Bring the frame to the ground after you have reached the end point."],"equipment":["Strongman"],"metric":"distance","level":"intermediate","src":"freedb"},{"id":"rickshaw-deadlift","name":"Rickshaw Deadlift","group":"Full Body","primary":"Quads","secondary":["Forearms","Glutes","Hamstrings","Lower Back","Traps"],"split":"full","pattern":"Hinge","focus":"Quads","guide":null,"steps":["Load the frame with the desired weight. Center yourself between the handles. You feet should be about hip width apart. Bend at the hips to grip the handles, allowing your shoulder blades to protract.","With your feet and your grip set, take a big breath and then lower your hips and flex the knees. Look forward with your head, keep your chest up and your back arched, and begin driving through the heels to move the weight upward. As the weight comes up, pull your shoulder blades together as you drive your hips forward.","Lower the weight by bending at the hips and guiding it to the ground."],"equipment":["Strongman"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"ring-dip","name":"Ring Dip","group":"Arms","primary":"Triceps","secondary":["Mid Chest","Front Delts"],"split":"push","pattern":"Press","focus":"Triceps","guide":null,"steps":["Grip a ring in each hand, and then take a small jump to help you get into the starting position with your arms locked out.","Begin by flexing the elbow, lowering your body until your arms break 90 degrees. Avoid swinging, and maintain good posture throughout the descent.","Reverse the motion by extending the elbow, pushing yourself back up into the starting position."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"rocket-jump","name":"Rocket Jump","group":"Legs","primary":"Quads","secondary":["Calves","Hamstrings"],"split":"legs","pattern":"Plyometric","focus":"Quads","guide":null,"steps":["Begin in a relaxed stance with your feet shoulder width apart and hold your arms close to the body.","To initiate the move, squat down halfway and explode back up as high as possible.","Fully extend your entire body, reaching overhead as far as possible. As you land, absorb your impact through the legs."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"romanian-deadlift","name":"Romanian Deadlift","group":"Legs","primary":"Hamstrings","secondary":["Glutes","Lower Back"],"split":"legs","pattern":"Hinge","focus":"Hamstrings","guide":"Hinge at hips with slight knee bend. Lower weight down legs until hamstrings stretch. Keep spine neutral and drive hips forward to stand.","steps":["Put a barbell in front of you on the ground and grab it using a pronated (palms facing down) grip that a little wider than shoulder width. Tip: Depending on the weight used, you may need wrist wraps to perform the exercise and also a raised platform in order to allow for better range of motion.","Bend the knees slightly and keep the shins vertical, hips back and back straight. This will be your starting position.","Keeping your back and arms completely straight at all times, use your hips to lift the bar as you exhale. Tip: The movement should not be fast but steady and under control.","Once you are standing completely straight up, lower the bar by pushing the hips back, only slightly bending the knees, unlike when squatting. Tip: Take a deep breath at the start of the movement and keep your chest up. Hold your breath as you lower and exhale as you complete the movement."],"equipment":["Barbell","Dumbbell","Trap Bar","Smith Machine"],"metric":"reps","level":"intermediate","src":"both"},{"id":"rope-climb","name":"Rope Climb","group":"Back","primary":"Lats","secondary":["Biceps","Forearms","Upper Back","Front Delts"],"split":"pull","pattern":"Vertical Pull","focus":"Lats","guide":null,"steps":["Grab the rope with both hands above your head. Pull down on the rope as you take a small jump.","Wrap the rope around one leg, using your feet to pinch the rope. Reach up as high as possible with your arms, gripping the rope tightly.","Release the rope from your feet as you pull yourself up with your arms, bringing your knees towards your chest.","Resecure your feet on the rope, and then stand up to take another high hold on the rope. Continue until you reach the top of the rope.","To lower yourself, loosen the grip of your feet on the rope as you slide down using a hand over hand motion."],"equipment":["Bodyweight"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"rope-triceps-pushaway","name":"Rope Triceps Pushaway","group":"Arms","primary":"Triceps","secondary":[],"split":"push","pattern":"Extension","focus":"Triceps","guide":"Leaning forward at cable station, push rope down and away from body. Long head focused.","steps":["Set a cable at upper-chest height with a rope and lean forward with the elbows bent and pinned.","Push the rope forward and down by extending the elbows, splitting the rope at the end.","Return slowly to the start without moving the upper arms."],"equipment":["Cable"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"rowing","name":"Rowing","group":"Cardio","primary":null,"secondary":[],"split":"cardio","pattern":"Mixed-Modality","focus":"Full Body","guide":"Drive through legs, hinge at hips, then pull with arms. Keep cadence smooth. Excellent for full-body cardio and conditioning.","steps":["To begin, seat yourself on the rower. Make sure that your heels are resting comfortably against the base of the foot pedals and that the straps are secured. Select the program that you wish to use, if applicable. Sit up straight and bend forward at the hips.","There are three phases of movement when using a rower. The first phase is when you come forward on the rower. Your knees are bent and against your chest. Your upper body is leaning slightly forward while still maintaining good posture. Next, push against the foot pedals and extend your legs while bringing your hands to your upper abdominal area, squeezing your shoulders back as you do so. To avoid straining your back, use primarily your leg and hip muscles.","The recovery phase simply involves straightening your arms, bending the knees, and bringing your body forward again as you transition back into the first phase."],"equipment":["Rower","Stationary Bike"],"metric":"duration","level":"intermediate","src":"both"},{"id":"running","name":"Running","group":"Cardio","primary":null,"secondary":[],"split":"cardio","pattern":"Steady-State","focus":"Legs, Core","guide":"Maintain a comfortable pace. Focus on midfoot strike, upright posture, and relaxed shoulders.","steps":["To begin, step onto the treadmill and select the desired option from the menu. Most treadmills have a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Elevation can be adjusted to change the intensity of the workout.","Treadmills offer convenience, cardiovascular benefits, and usually have less impact than jogging outside. A 150 lb person will burn almost 250 calories jogging for 30 minutes, compared to more than 450 calories running. Maintain proper posture as you jog, and only hold onto the handles when necessary, such as when dismounting or checking your heart rate."],"equipment":["Outdoor","Treadmill"],"metric":"duration","level":"beginner","src":"both"},{"id":"russian-twist","name":"Russian Twist","group":"Core","primary":"Obliques","secondary":[],"split":"core","pattern":"Twist","focus":"Obliques","guide":"Sit in V-position, rotate torso side to side. Use weight for added resistance. Keep core tight and avoid rounding back.","steps":["Connect a standard handle attachment, and position the cable to a middle pulley position.","Lie on a stability ball perpendicular to the cable and grab the handle with one hand. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable.","Grab the handle with both hands and fully extend your arms above your chest. You hands should be directly in-line with the pulley. If not, adjust the pulley up or down until they are.","Keep your hips elevated and abs engaged. Rotate your torso away from the pulley for a full-quarter rotation. Your body should be flat from head to knees.","Pause for a moment and in a slow and controlled manner reset to the starting position. You should still have side tension on the cable in the resting position.","Repeat the same movement to failure.","Then, reposition and repeat the same series of movements on the opposite side."],"equipment":["Bodyweight","Plate","Med Ball","Dumbbell","Cable"],"metric":"reps","level":"beginner","src":"both"},{"id":"safety-bar-squat","name":"Safety Bar Squat","group":"Legs","primary":"Quads","secondary":["Glutes"],"split":"legs","pattern":"Squat","focus":"Quads","guide":"Hands hold handles with bar on traps. Slight forward lean is okay; keeps tension on quads and reduces shoulder stress.","steps":["Set the safety bar on the upper back and grip the handles. Un-rack and step back.","Sit down and back, allowing a slight forward lean while the bar stays over the mid-foot.","Drive up through the whole foot to stand."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"sandbag-load","name":"Sandbag Load","group":"Full Body","primary":"Quads","secondary":["Abs","Biceps","Calves","Forearms","Glutes"],"split":"full","pattern":"Other","focus":"Quads","guide":null,"steps":["To load sandbags or other objects, begin with the implements placed a distance from the loading platform, typically 50 feet.","Begin by lifting the sandbag. Sandbags are extremely awkward, and the manner of lifting them can vary depending on the particular sandbag used. Reach as far around it as possible, extending through the hips and knees to pull it up high. Shouldering is usually not allowed.","Move as quickly as possible to the platform, and load it, extending through your hips, knees, and ankles to get it as high as possible. Place it onto the platform, ensuring it doesn't fall off.","Return to the starting position to retrieve the next sandbag, and repeat until the event is completed."],"equipment":["Strongman"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"scaption","name":"Scaption","group":"Shoulders","primary":"Side Delts","secondary":["Traps"],"split":"push","pattern":"Raise","focus":"Side Delts","guide":null,"steps":["This corrective exercise strengthens the muscles that stabilize your shoulder blade. Hold a light weight in each hand, hanging at your sides. Your thumbs should pointing up.","Begin the movement raising your arms out in front of you, about 30 degrees off center. Your arms should be fully extended as you perform the movement.","Continue until your arms are parallel to the ground, and then return to the starting position."],"equipment":["Dumbbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"scapular-pull-up","name":"Scapular Pull-Up","group":"Back","primary":"Traps","secondary":["Lats","Upper Back"],"split":"pull","pattern":"Vertical Pull","focus":"Traps","guide":null,"steps":["Take a pronated grip on a pull-up bar.","From a hanging position, raise yourself a few inches without using your arms. Do this by depressing your shoulder girdle in a reverse shrugging motion.","Pause at the completion of the movement, and then slowly return to the starting position before performing more repetitions."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"scapular-retraction-shrug","name":"Scapular Retraction Shrug","group":"Back","primary":"Upper Back","secondary":[],"split":"pull","pattern":"Shrug","focus":"Upper Back","guide":null,"steps":["Lie facedown on an incline bench while holding a dumbbell in each hand. Your arms should be fully extended hanging down and pointing towards the floor. The palms of your hands should be facing each other. This will be your starting position.","As you exhale, squeeze your shoulder blades together and hold the contraction for a full second. Tip: This movement is just like the reverse action of a hug, or trying to perform rear laterals as if you had no arms.","As you inhale go back to the starting position."],"equipment":["Dumbbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"seal-row","name":"Seal Row","group":"Back","primary":"Upper Back","secondary":["Lats","Biceps","Rear Delts"],"split":"pull","pattern":"Horizontal Row","focus":"Mid Back","guide":"Chest supported on bench. Row with full ROM and minimal momentum. Great for isolating mid-back without lower back strain.","steps":["Grab a dumbbell in each hand and lie face down on an incline bench that is set to an incline that is approximately 30 degrees.","Let the arms hang to your sides fully extended as they point to the floor.","Turn the wrists until your hands have a pronated (palms down) grip.","Now flare the elbows out. This will be your starting position.","As you breathe out, start to pull the dumbbells up as if you are doing a reverse bench press. You will do this by bending at the elbows and bringing the upper arms up as you let the forearms hang. Continue this motion until the upper arms are at the same level as your back. Tip: The elbows will come out to the side and your upper arms and torso should make the letter \"T\" at the top of the movement. Hold the contraction at the top for a second.","Slowly go back down to the starting position as you breathe in."],"equipment":["Barbell","Dumbbell"],"metric":"reps","level":"beginner","src":"both"},{"id":"seated-bar-twist","name":"Seated Bar Twist","group":"Core","primary":"Obliques","secondary":[],"split":"core","pattern":"Rotation","focus":"Obliques","guide":null,"steps":["Start out by sitting at the end of a flat bench with a barbell placed on top of your thighs. Your feet should be shoulder width apart from each other.","Grip the bar with your palms facing down and make sure your hands are wider than shoulder width apart from each other. Begin to lift the barbell up over your head until your arms are fully extended.","Now lower the barbell behind your head until it is resting along the base of your neck. This is the starting position.","While keeping your feet and head stationary, move your waist from side to side so that your oblique muscles feel the contraction. Only move from side to side as far as your waist will allow you to go. Stretching or moving too far can cause an injury to occur. Tip: Use a slow and controlled motion.","Remember to breathe out while twisting your body to the side and in when moving back to the starting position."],"equipment":["Barbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"seated-box-jump","name":"Seated Box Jump","group":"Legs","primary":"Quads","secondary":["Calves","Glutes","Hamstrings"],"split":"legs","pattern":"Plyometric","focus":"Quads","guide":null,"steps":["Position a box a couple feet to the side of a bench. Hold a dumbbell to your chest with both hands and seat yourself on the bench facing the box. This will be your starting position.","Plant your feet firmly on the ground as you lean forward, extending through the hips and knees to jump up and forward.","Land on the box with both feet, absorbing the impact by allowing the hips and knees to bend.","Step down and return to the starting position."],"equipment":["Dumbbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"seated-bradford-press","name":"Seated Bradford Press","group":"Shoulders","primary":"Side Delts","secondary":[],"split":"push","pattern":"Press","focus":"Front / Side Delts","guide":"Alternate pressing bar just over and behind head without locking out. Maintains tension across full shoulder complex.","steps":["Sit on a Military Press Bench with a bar at shoulder level with a pronated grip (palms facing forward). Tip: Your grip should be wider than shoulder width and it should create a 90-degree angle between the forearm and the upper arm as the barbell goes down. This is your starting position.","Once you pick up the barbell with the correct grip, lift the bar up over your head by locking your arms.","Now lower the bar down to the back of the head slowly as you inhale.","Lift the bar back up to the starting position as you exhale.","Lower the bar down to the starting position slowly as you inhale. This is one repetition.","Alternate in this manner until you complete the recommended amount of repetitions."],"equipment":["Barbell","Smith Machine"],"metric":"reps","level":"beginner","src":"both"},{"id":"seated-calf-raise","name":"Seated Calf Raise","group":"Legs","primary":"Calves","secondary":[],"split":"legs","pattern":"Raise","focus":"Calves (Soleus)","guide":"Seated with knees bent, pad over thighs. Target soleus with full range and slow tempo.","steps":["Place a block about 12 inches in front of a flat bench.","Sit on the bench and place the ball of your feet on the block.","Have someone place a barbell over your upper thighs about 3 inches above your knees and hold it there. This will be your starting position.","Raise up on your toes as high as possible as you squeeze the calves and as you breathe out.","After a second contraction, slowly go back to the starting position. Tip: To get maximum benefit stretch your calves as far as you can."],"equipment":["Machine","Dumbbell","Plate","Barbell"],"metric":"reps","level":"beginner","src":"both"},{"id":"seated-curl","name":"Seated Curl","group":"Arms","primary":"Biceps","secondary":[],"split":"pull","pattern":"Curl","focus":"Biceps","guide":null,"steps":["Sit on a flat bench with a dumbbell on each hand being held at arms length. The elbows should be close to the torso.","Rotate the palms of the hands so that they are facing your torso. This will be your starting position.","While holding the upper arm stationary, curl the weights and start twisting the wrists once the dumbbells pass your thighs so that the palms of your hands face forward at the end of the movement. Make sure that you contract the biceps as you breathe out and make sure that only the forearms move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the biceps.","Slowly begin to bring the dumbbells back to the starting position as your breathe in and as you rotate the wrists back to a neutral grip."],"equipment":["Dumbbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"seated-good-morning","name":"Seated Good Morning","group":"Back","primary":"Lower Back","secondary":["Glutes"],"split":"pull","pattern":"Hinge","focus":"Lower Back","guide":null,"steps":["Set up a box in a power rack. The pins should be set at an appropriate height. Begin by stepping under the bar and placing it across the back of the shoulders, not on top of your traps. Squeeze your shoulder blades together and rotate your elbows forward, attempting to bend the bar across your shoulders.","Remove the bar from the rack, creating a tight arch in your lower back. Keep your head facing forward. With your back, shoulders, and core tight, push your knees and butt out and you begin your descent. Sit back with your hips until you are seated on the box. This will be your starting position.","Keeping the bar tight, bend forward at the hips as much as possible. If you set the pins to what would be parallel, you not only have a safety if you fail, but know when to stop.","Pause just above the pins and reverse the motion until your torso it upright."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"seated-knee-tuck","name":"Seated Knee Tuck","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Leg Raise","focus":"Abs","guide":null,"steps":["Sit on a bench with the legs stretched out in front of you slightly below parallel and your arms holding on to the sides of the bench. Your torso should be leaning backwards around a 45-degree angle from the bench. This will be your starting position.","Bring the knees in toward you as you move your torso closer to them at the same time. Breathe out as you perform this movement.","After a second pause, go back to the starting position as you inhale."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"seated-lateral-raise","name":"Seated Lateral Raise","group":"Shoulders","primary":"Side Delts","secondary":[],"split":"push","pattern":"Raise","focus":"Side Delts","guide":"Reduces momentum and focuses on isolating delts. Avoid shrugging; keep traps down and arms moving smoothly.","steps":["Pick a couple of dumbbells and sit at the end of a flat bench with your feet firmly on the floor. Hold the dumbbells with your palms facing in and your arms straight down at your sides at arms' length. This will be your starting position.","While maintaining the torso stationary (no swinging), lift the dumbbells to your side with a slight bend on the elbow and the hands slightly tilted forward as if pouring water in a glass. Continue to go up until you arms are parallel to the floor. Exhale as you execute this movement and pause for a second at the top.","Lower the dumbbells back down slowly to the starting position as you inhale."],"equipment":["Dumbbell","Cable"],"metric":"reps","level":"beginner","src":"both"},{"id":"seated-leg-curl","name":"Seated Leg Curl","group":"Legs","primary":"Hamstrings","secondary":[],"split":"legs","pattern":"Curl","focus":"Hamstrings","guide":"Sit with pad locked against ankles and thighs. Emphasizes lengthened hamstring position.","steps":["Adjust the machine lever to fit your height and sit on the machine with your back against the back support pad.","Place the back of lower leg on top of padded lever (just a few inches under the calves) and secure the lap pad against your thighs, just above the knees. Then grasp the side handles on the machine as you point your toes straight (or you can also use any of the other two stances) and ensure that the legs are fully straight right in front of you. This will be your starting position.","As you exhale, pull the machine lever as far as possible to the back of your thighs by flexing at the knees. Keep your torso stationary at all times. Hold the contracted position for a second.","Slowly return to the starting position as you breathe in."],"equipment":["Machine","Band"],"metric":"reps","level":"beginner","src":"both"},{"id":"seated-row","name":"Seated Row","group":"Back","primary":"Upper Back","secondary":["Lats","Biceps","Rear Delts"],"split":"pull","pattern":"Horizontal Row","focus":"Mid Back","guide":"Sit upright with slight lean forward. Pull handle to torso, squeeze shoulder blades. Maintain control throughout full ROM.","steps":["For this exercise you will need access to a low pulley row machine with a V-bar. Note: The V-bar will enable you to have a neutral grip where the palms of your hands face each other. To get into the starting position, first sit down on the machine and place your feet on the front platform or crossbar provided making sure that your knees are slightly bent and not locked.","Lean over as you keep the natural alignment of your back and grab the V-bar handles.","With your arms extended pull back until your torso is at a 90-degree angle from your legs. Your back should be slightly arched and your chest should be sticking out. You should be feeling a nice stretch on your lats as you hold the bar in front of you. This is the starting position of the exercise.","Keeping the torso stationary, pull the handles back towards your torso while keeping the arms close to it until you touch the abdominals. Breathe out as you perform that movement. At that point you should be squeezing your back muscles hard. Hold that contraction for a second and slowly go back to the original position while breathing in."],"equipment":["Cable","Machine"],"metric":"reps","level":"beginner","src":"both"},{"id":"see-saw-press","name":"See-Saw Press","group":"Shoulders","primary":"Front Delts","secondary":["Abs","Triceps"],"split":"push","pattern":"Overhead Press","focus":"Front Delts","guide":null,"steps":["Grab a dumbbell with each hand and stand up erect.","Clean (lift) the dumbbells to the chest/shoulder level and then rotate your wrists so that your palms are facing towards you as if you were getting ready to perform an Arnold Press. This will be your starting position.","Now start extending your left arm overhead as you rotate the wrist so that the palm of your hand faces forward as you go up. Your elbows should come out also as you lift the weight. Simultaneously, you will also be bending from your hip to your opposite side. Tip: If you perform the exercise correctly, is should look as if you are trying to reach for something overhead on the right hand side of your body, but with your left arm. Breathe out as you perform this movement.","Once you reach the top position breathe in. Then, with the weight fully extended overhead and you bent over to your right hand side, begin the movement to the left side."],"equipment":["Dumbbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"shoulder-pro","name":"Shoulder Pro","group":"Shoulders","primary":"Front Delts","secondary":["Triceps","Side Delts"],"split":"push","pattern":"Press / Rotation","focus":"Full Delts","guide":"Without resting, do 10 reps of reverse flies, 10 lateral raises, 10 rotator cuff rotations, 10 front raises, and 10 shoulder presses. Great pump builder across full ROM.","steps":["Pick a pair of light dumbbells. Do 10 reverse flies without resting.","Go straight into 10 lateral raises, then 10 rotator cuff rotations, 10 front raises and 10 shoulder presses.","Rest only after the full circuit. Use light weight and controlled reps."],"equipment":["Dumbbell"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"shrug","name":"Shrug","group":"Back","primary":"Traps","secondary":[],"split":"pull","pattern":"Shrug","focus":"Traps","guide":"Stand upright, pull shoulders straight up toward ears. Hold peak contraction and control descent.","steps":["Stand up straight with your feet at shoulder width as you hold a barbell with both hands in front of you using a pronated grip (palms facing the thighs). Tip: Your hands should be a little wider than shoulder width apart. You can use wrist wraps for this exercise for a better grip. This will be your starting position.","Raise your shoulders up as far as you can go as you breathe out and hold the contraction for a second. Tip: Refrain from trying to lift the barbell by using your biceps.","Slowly return to the starting position as you breathe in."],"equipment":["Barbell","Dumbbell","Trap Bar","Machine","Smith Machine","Cable"],"metric":"reps","level":"beginner","src":"both"},{"id":"side-bend","name":"Side Bend","group":"Core","primary":"Obliques","secondary":[],"split":"core","pattern":"Lateral Flexion","focus":"Obliques","guide":"Stand upright and bend sideways, stretching and contracting obliques. Avoid rotating torso or using momentum.","steps":["Stand up straight while holding a barbell placed on the back of your shoulders (slightly below the neck). Your feet should be shoulder width apart. This will be your starting position.","While keeping your back straight and your head up, bend only at the waist to the right as far as possible. Breathe in as you bend to the side. Then hold for a second and come back up to the starting position as you exhale. Tip: Keep the rest of the body stationary.","Now repeat the movement but bending to the left instead. Hold for a second and come back to the starting position."],"equipment":["Dumbbell","Cable","Kettlebell","Barbell","Stability Ball"],"metric":"reps","level":"beginner","src":"both"},{"id":"side-jackknife","name":"Side Jackknife","group":"Core","primary":"Obliques","secondary":[],"split":"core","pattern":"Crunch","focus":"Obliques","guide":null,"steps":["Lie on your side with the bottom arm extended overhead and the top hand behind the head.","Lift the top leg and your torso toward each other, folding sideways.","Lower slowly and finish the reps before switching sides."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"side-lunge","name":"Side Lunge","group":"Legs","primary":"Glutes","secondary":["Adductors","Quads"],"split":"legs","pattern":"Lateral Lunge","focus":"Glutes/Adductors","guide":"Adds lateral force with band. Step wide and sit back into hip. Great for hip stability.","steps":["Stand up straight while holding a barbell placed on the back of your shoulders (slightly below the neck). Your feet should be placed wide apart with the foot of the lead leg angled out to the side. This will be your starting position.","Lower your body towards the side of your angled foot by bending the knee and hip of your lead leg and while keeping the opposite leg only slightly bent. Breathe in as you lower your body.","Return to the starting position by extending the hip and knee of the lead leg. Breathe out as you perform this movement.","After performing the recommended amount of reps, repeat the movement with the opposite leg."],"equipment":["Dumbbell","Kettlebell","Bodyweight","Band","Barbell"],"metric":"reps","level":"beginner","src":"both"},{"id":"side-plank","name":"Side Plank","group":"Core","primary":"Obliques","secondary":[],"split":"core","pattern":"Stability","focus":"Full Core","guide":"Support body on forearm and foot, keeping hips elevated. Targets obliques and deep core muscles.","steps":["Lie on your side with the elbow under the shoulder and the legs stacked.","Lift the hips so the body forms a straight line from head to feet.","Hold without letting the hips sag. Switch sides."],"equipment":["Bodyweight"],"metric":"time","level":"beginner","src":"both"},{"id":"side-lying-leg-raise","name":"Side-Lying Leg Raise","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Leg Raise","focus":"Obliques","guide":"Lie on side, raise top leg upward. Activates lateral chain including obliques and hip stabilizers.","steps":["Lie on your side with the legs straight and stacked, head resting on the bottom arm.","Raise the top leg up to about 45° without rolling the hips back.","Lower slowly. Finish the reps, then switch sides."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"ivan"},{"id":"single-arm-bench-press","name":"Single-Arm Bench Press","group":"Chest","primary":"Mid Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Press","focus":"Mid Chest","guide":null,"steps":["Lie down on a flat bench with a dumbbell in one hand on top of your thigh.","By using your thigh to help you get the dumbbell up, clean the dumbbell up so that you can hold it in front of you at shoulder width. Use the hand you are not lifting with to help position the dumbbell over you properly.","Once at shoulder width, rotate your wrist forward so that the palm of your hand is facing away from you. This will be your starting position.","Bring down the weights slowly to your side as you breathe in. Keep full control of the dumbbell at all times. Tip: Use the hand that you are not lifting with to help keep the dumbbell balance as you may struggle a bit at first. Only use your non-lifting hand if it is needed. Otherwise, keep it resting to the side.","As you breathe out, push the dumbbells up using your pectoral muscles. Lock your arms in the contracted position, squeeze your chest, hold for a second and then start coming down slowly. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions of your training program.","Switch arms and repeat the movement."],"equipment":["Dumbbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"single-arm-cable-crossover","name":"Single-Arm Cable Crossover","group":"Chest","primary":"Mid Chest","secondary":[],"split":"push","pattern":"Fly","focus":"Mid Chest","guide":null,"steps":["Begin by moving the pulleys to the high position, select the resistance to be used, and take a handle in each hand.","Step forward in front of both pulleys with your arms extended in front of you, bringing your hands together. Your head and chest should be up as you lean forward, while your feet should be staggered. This will be your starting position.","Keeping your left arm in place, allow your right arm to extend out to the side, maintaining a slight bend at the elbow. The right arm should be perpendicular to the body at approximately shoulder level.","Return your arm back to the starting position by pulling your hand back to the midline of the body.","Hold for a second at the starting position and repeat the movement on the opposite side. Continue alternating back and forth for the prescribed number of repetitions."],"equipment":["Cable"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"one-arm-cable-press","name":"Single-Arm Cable Press","group":"Chest","primary":"Mid Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Press","focus":"Full Chest","guide":"Performed with one cable. Forces core stability and unilateral pec control. Great for identifying imbalances.","steps":["Set a cable at chest height and take the handle in one hand, standing in a split stance away from the stack.","Press the handle straight out in front of the chest, resisting rotation of the torso.","Return slowly under control."],"equipment":["Cable"],"metric":"reps","level":"beginner","src":"ivan"},{"id":"single-arm-cable-triceps-extension","name":"Single-Arm Cable Triceps Extension","group":"Arms","primary":"Triceps","secondary":["Mid Chest","Front Delts"],"split":"push","pattern":"Extension","focus":"Triceps","guide":null,"steps":["With your right hand, grasp a single handle attached to the high-cable pulley using a supinated (underhand; palms facing up) grip. You should be standing directly in front of the weight stack.","Now pull the handle down so that your upper arm and elbow are locked in to the side of your body. Your upper arm and forearm should form an acute angle (less than 90-degrees). You can keep the other arm by the waist and you can have one leg in front of you and the other one back for better balance. This will be your starting position.","As you contract the triceps, move the single handle attachment down to your side until your arm is straight. Breathe out as you perform this movement. Tip: Only the forearms should move. Your upper arms should remain stationary at all times.","Squeeze the triceps and hold for a second in this contracted position.","Slowly return the handle to the starting position."],"equipment":["Cable"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"single-arm-chest-fly","name":"Single-Arm Chest Fly","group":"Chest","primary":"Mid Chest","secondary":[],"split":"push","pattern":"Fly","focus":"Mid Chest","guide":null,"steps":["Lie down on a flat bench with a dumbbell in one hand resting on top of your thigh. The palm of your hand with the dumbbell in it should be at a neutral grip.","By using your thighs to help you get the dumbbell up, clean the dumbbell so that you can hold it in front of you with your lifting arm being fully extended. Remember to maintain a neutral grip with this exercise. Your non lifting hand should be to the side holding the flat bench for better support. This will be your starting position.","Your arm with the weight should have a slight bend on your elbow in order to prevent stress at the biceps tendon. Begin by lowering your arm with the weight in it out in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, your lifting arm should remain stationary; the movement should only occur at the shoulder joint.","Return your lifting arm back to the starting position as you squeeze your chest muscles and breathe out. Tip: Make sure to use the same arc of motion used to lower the weights.","Hold for a second at the contracted position and repeat the movement for the prescribed amount of repetitions.","Switch arms and repeat the exercise."],"equipment":["Dumbbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"single-arm-chin-up","name":"Single-Arm Chin-Up","group":"Back","primary":"Upper Back","secondary":["Biceps","Forearms","Lats"],"split":"pull","pattern":"Vertical Pull","focus":"Upper Back","guide":null,"steps":["For this exercise, start out by placing a towel around a chin up bar.","Grab the chin-up bar with your palm facing you. One hand will be grabbing the chin-up bar and the other will be grabbing the towel.","Bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.v","Pull your torso up until the bar touches your upper chest by drawing the shoulders and the upper arms down and back. Exhale as you perform this portion of the movement. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary as it moves through space and only the arms should move. The forearms should do no other work other than hold the bar.","After a second on the contracted position, start to inhale and slowly lower your torso back to the starting position when your arms are fully extended and the lats are fully stretched.","Repeat this motion for the prescribed amount of repetitions.","Switch arms and repeat the movement."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"expert","src":"freedb"},{"id":"single-arm-clean","name":"Single-Arm Clean","group":"Full Body","primary":"Hamstrings","secondary":["Glutes","Lower Back","Front Delts","Traps","Forearms"],"split":"full","pattern":"Olympic","focus":"Hamstrings","guide":null,"steps":["Place a kettlebell between your feet. As you bend down to grab the kettlebell, push your butt back and keep your eyes looking forward.","Clean the kettlebell to your shoulders by extending through the legs and hips as you raise the kettlebell towards your shoulder. The wrist should rotate as you do so.","Return the weight to the starting position."],"equipment":["Kettlebell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"single-arm-curl","name":"Single-Arm Curl","group":"Arms","primary":"Biceps","secondary":["Forearms"],"split":"pull","pattern":"Curl","focus":"Biceps","guide":"Performed with a D-handle; allows maximum focus on each arm. Keep elbow fixed and supinate hard at top. Great for peak contraction.","steps":["Start out by grabbing single handle next to the low pulley machine. Make sure you are far enough from the machine so that your arm is supporting the weight.","Make sure that your upper arm is stationary, perpendicular to the floor with elbows in and palms facing forward. Your non lifting arm should be grabbing your waist. This will allow you to keep your balance.","Slowly begin to curl the single handle upwards while keeping the upper arm stationary until your forearm touches your bicep while exhaling. Tip: Only the forearm should move.","Hold the contraction position as you squeeze the bicep and then lower the single handle back down to the starting position as you inhale.","Repeat for the recommended amount of repetitions.","Switch arms while performing this exercise."],"equipment":["Cable","Dumbbell"],"metric":"reps","level":"intermediate","src":"both"},{"id":"single-arm-floor-press","name":"Single-Arm Floor Press","group":"Arms","primary":"Triceps","secondary":["Front Delts","Mid Chest"],"split":"push","pattern":"Press","focus":"Triceps","guide":null,"steps":["Lie down on a flat surface with your back pressing against the floor or an exercise mat. Make sure your knees are bent.","Have a partner hand you the bar on one hand. When starting, your arm should be just about fully extended, similar to the starting position of a barbell bench press. However, this time your grip will be neutral (palms facing your torso).","Make sure the hand you are not using to lift the weight is placed by your side.","Begin the exercise by lowering the barbell until your elbow touches the ground. Make sure to breathe in as this is the eccentric (lowering part of the exercise).","Then start lifting the barbell back up to the original starting position. Remember to breathe out during the concentric (lifting part of the exercise).","Repeat until you have performed your recommended repetitions.","Switch arms and repeat the movement."],"equipment":["Kettlebell","Barbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"single-arm-high-row","name":"Single-Arm High Row","group":"Back","primary":"Lats","secondary":["Biceps","Upper Back"],"split":"pull","pattern":"Row","focus":"Lats","guide":null,"steps":["Attach a single handle to a high pulley and make your weight selection.","Kneel in front of the cable tower, taking the cable with one hand with your arm extended. This will be your starting position.","Starting with your palm facing forward, pull the weight down to your torso by flexing the elbow and retract the shoulder blade. As you do so, rotate the wrist so that at the completion of the movement, your palm is now facing you.","After a brief pause, return to the starting position."],"equipment":["Cable"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"single-arm-lat-pulldown","name":"Single-Arm Lat Pulldown","group":"Back","primary":"Lats","secondary":["Biceps","Upper Back"],"split":"pull","pattern":"Vertical Pull","focus":"Lats","guide":null,"steps":["Select an appropriate weight and adjust the knee pad to help keep you down. Grasp the handle with a pronated grip. This will be your starting position.","Pull the handle down, squeezing your elbow to your side as you flex the elbow.","Pause at the bottom of the motion, and then slowly return the handle to the starting position.","For multiple repetitions, avoid completely returning the weight to keep tension on the muscles being worked."],"equipment":["Cable"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"single-arm-lateral-raise","name":"Single-Arm Lateral Raise","group":"Shoulders","primary":"Side Delts","secondary":["Forearms"],"split":"push","pattern":"Raise","focus":"Side Delts","guide":null,"steps":["Pick a dumbbell and place it in one of your hands. Your non lifting hand should be used to grab something steady such as an incline bench press. Lean towards your lifting arm and away from the hand that is gripping the incline bench as this will allow you to keep your balance.","Stand with a straight torso and have the dumbbell by your side at arm's length with the palm of the hand facing you. This will be your starting position.","While maintaining the torso stationary (no swinging), lift the dumbbell to your side with a slight bend on the elbow and your hand slightly tilted forward as if pouring water in a glass. Continue to go up until you arm is parallel to the floor. Exhale as you execute this movement and pause for a second at the top.","Lower the dumbbell back down slowly to the starting position as you inhale.","Repeat for the recommended amount of repetitions.","Switch arms and repeat the exercise."],"equipment":["Dumbbell","Cable"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"single-arm-lying-triceps-extension","name":"Single-Arm Lying Triceps Extension","group":"Arms","primary":"Triceps","secondary":[],"split":"push","pattern":"Extension","focus":"Triceps","guide":null,"steps":["Lie flat on a bench while holding a dumbbell at arms length. Your arm should be perpendicular to your body. The palm of your hand should be facing towards your feet as a pronated grip is required to perform this exercise.","Place your non lifting hand on your bicep for support.","Slowly begin to lower the dumbbell down as you breathe in.","Then, begin lifting the dumbbell upward as you contract the triceps. Remember to breathe out during the concentric (lifting part of the exercise).","Repeat until you have performed your set repetitions.","Switch arms and repeat the movement."],"equipment":["Dumbbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"single-arm-overhead-press","name":"Single-Arm Overhead Press","group":"Shoulders","primary":"Front Delts","secondary":["Triceps","Side Delts"],"split":"push","pattern":"Press","focus":"Full Delts","guide":"Stabilization-heavy unilateral press with barbell held in center. Demands core and shoulder coordination.","steps":["Grab a dumbbell and either sit on a military press bench or a utility bench that has a back support on it as you place the dumbbells upright on top of your thighs or stand up straight.","Clean the dumbbell up to bring it to shoulder height. The other hand can be kept fully extended to the side, by the waist or grabbing a fixed surface.","Rotate the wrist so that the palm of your hand is facing forward. This is your starting position.","As you exhale, push the dumbbell up until your arm is fully extended.","After a second pause, slowly come down back to the starting position as you inhale."],"equipment":["Dumbbell","Kettlebell","Barbell"],"metric":"reps","level":"intermediate","src":"both"},{"id":"single-arm-overhead-squat","name":"Single-Arm Overhead Squat","group":"Full Body","primary":"Quads","secondary":["Calves","Glutes","Hamstrings","Front Delts"],"split":"full","pattern":"Squat","focus":"Quads","guide":null,"steps":["Clean and press a kettlebell with one arm. Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulder. Rotate your wrist as you do so. Press the weight overhead by extending through the elbow.This will be your starting position.","Looking straight ahead and keeping a kettlebell locked out above you, flex the knees and hips and lower your torso between your legs, keeping your head and chest up.","Pause at the bottom position for a second before rising back to the top, driving through the heels of your feet."],"equipment":["Kettlebell"],"metric":"reps","level":"expert","src":"freedb"},{"id":"single-arm-overhead-triceps-extension","name":"Single-Arm Overhead Triceps Extension","group":"Arms","primary":"Triceps","secondary":["Mid Chest","Front Delts"],"split":"push","pattern":"Extension","focus":"Triceps","guide":null,"steps":["Grab a dumbbell and either sit on a military press bench or a utility bench that has a back support on it as you place the dumbbells upright on top of your thighs or stand up straight.","Clean the dumbbell up to bring it to shoulder height and then extend the arm over your head so that the whole arm is perpendicular to the floor and next to your head. The dumbbell should be on top of you. The other hand can be kept fully extended to the side, by the waist, supporting the upper arm that has the dumbbell or grabbing a fixed surface.","Rotate the wrist so that the palm of your hand is facing forward and the pinkie is facing the ceiling. This will be your starting position.","Slowly lower the dumbbell behind your head as you hold the upper arm stationary. Inhale as you perform this movement and pause when your triceps are fully stretched.","Return to the starting position by flexing your triceps as you breathe out. Tip: It is imperative that only the forearm moves. The upper arm should remain at all times stationary next to your head."],"equipment":["Dumbbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"single-arm-preacher-curl","name":"Single-Arm Preacher Curl","group":"Arms","primary":"Biceps","secondary":[],"split":"pull","pattern":"Curl","focus":"Biceps","guide":null,"steps":["Grab a dumbbell with the right arm and place the upper arm on top of the preacher bench or the incline bench. The dumbbell should be held at shoulder length. This will be your starting position.","As you breathe in, slowly lower the dumbbell until your upper arm is extended and the biceps is fully stretched.","As you exhale, use the biceps to curl the weight up until your biceps is fully contracted and the dumbbell is at shoulder height. Again, remember that to ensure full contraction you need to bring that small finger higher than the thumb.","Squeeze the biceps hard for a second at the contracted position and repeat for the recommended amount of repetitions.","Switch arms and repeat the movement."],"equipment":["Dumbbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"single-arm-push-up","
