name":"Single-Arm Push-Up","group":"Chest","primary":"Mid Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Press","focus":"Mid Chest","guide":null,"steps":["Begin laying prone on the ground. Move yourself into a position supporting your weight on your toes and one arm. Your working arm should be placed directly under the shoulder, fully extended. Your legs should be extended, and for this movement you may need a wider base, placing your feet further apart than in a normal push-up.","Maintain good posture, and place your free hand behind your back. This will be your starting position.","Lower yourself by allowing the elbow to flex until you touch the ground.","Descend slowly, and reverse direction be extending the arm to return to the starting position."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"single-arm-row","name":"Single-Arm Row","group":"Back","primary":"Upper Back","secondary":["Lats","Biceps","Rear Delts"],"split":"pull","pattern":"Horizontal Row","focus":"Mid Back","guide":"One knee and hand on bench. Row dumbbell toward hip. Focus on full stretch at bottom and squeeze at top.","steps":["Choose a flat bench and place a dumbbell on each side of it.","Place the right leg on top of the end of the bench, bend your torso forward from the waist until your upper body is parallel to the floor, and place your right hand on the other end of the bench for support.","Use the left hand to pick up the dumbbell on the floor and hold the weight while keeping your lower back straight. The palm of the hand should be facing your torso. This will be your starting position.","Pull the resistance straight up to the side of your chest, keeping your upper arm close to your side and keeping the torso stationary. Breathe out as you perform this step. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. Also, make sure that the force is performed with the back muscles and not the arms. Finally, the upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the dumbbell; therefore do not try to pull the dumbbell up using the forearms.","Lower the resistance straight down to the starting position. Breathe in as you perform this step.","Repeat the movement for the specified amount of repetitions.","Switch sides and repeat again with the other arm."],"equipment":["Dumbbell","Cable","Machine","Kettlebell"],"metric":"reps","level":"beginner","src":"both"},{"id":"single-arm-upright-row","name":"Single-Arm Upright Row","group":"Shoulders","primary":"Side Delts","secondary":["Biceps","Traps"],"split":"push","pattern":"Row","focus":"Side Delts","guide":null,"steps":["Grab a dumbbell and stand up straight with your arm extended in front of you with a slight bend at the elbows and your back straight. This will be your starting position. Tip: The dumbbell should be resting on top of your thigh with the palm of your hands facing your thighs.","Keep the other hand can be kept fully extended to the side, by the waist or grabbing a fixed surface. This will be your starting position.","Use your side shoulders to lift the dumbbell as you exhale. The dumbbell should be close to the body as you move it up. Continue to lift it until the dumbbell is nearly in line with your chin. Tip: Your elbows should drive the motion. As you lift the dumbbell, your elbow should always be higher than your forearm. Also, keep your torso stationary and pause for a second at the top of the movement.","Lower the dumbbell back down slowly to the starting position. Inhale as you perform this portion of the movement."],"equipment":["Dumbbell","Smith Machine"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"single-leg-box-squat","name":"Single-Leg Box Squat","group":"Legs","primary":"Quads","secondary":["Glutes","Hamstrings"],"split":"legs","pattern":"Squat","focus":"Quads","guide":null,"steps":["Position a box in a rack. Secure a band or rope in place above the box.","Standing in front of it, step onto the box to a full standing position, letting your other leg remain unsupported. Hold onto the band for balance",". Continue stepping up and down on the same leg before switching to the opposite side."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"single-leg-calf-raise","name":"Single-Leg Calf Raise","group":"Legs","primary":"Calves","secondary":[],"split":"legs","pattern":"Raise","focus":"Calves (Unilateral)","guide":"Performed one leg at a time for balance and strength symmetry. Hold something for stability.","steps":["Hang on to a sturdy object for balance and stand on a dumbbell handle, preferably one with round plates so that it rolls as in this manner you have to work harder to stabilize yourself; thus increasing the effectiveness of the exercise.","Now roll your foot slightly forward so that you can get a nice stretch of the calf. This will be your starting position.","Lift the calf as you roll your foot over the top of the handle so that you get a full extension. Exhale during the execution of this movement. Contract the calf hard at the top and hold for a second. Tip: As you come up, roll the dumbbell slightly backward.","Now inhale as you roll the dumbbell slightly forward as you come down to get a better stretch."],"equipment":["Bodyweight","Dumbbell"],"metric":"reps","level":"intermediate","src":"both"},{"id":"single-leg-extension","name":"Single-Leg Extension","group":"Legs","primary":"Quads","secondary":[],"split":"legs","pattern":"Extension","focus":"Quads","guide":"Use ankle strap and pulley at low setting. Control each rep to isolate the quads one leg at a time.","steps":["Seat yourself in the machine and adjust it so that you are positioned properly. The pad should be against the lower part of the shin but not in contact with the ankle. Adjust the seat so that the pivot point is in line with your knee. Select a weight appropriate for your abilities.","Maintaining good posture, fully extend one leg, pausing at the top of the motion.","Return to the starting position without letting the weight stop, keeping tension on the muscle."],"equipment":["Machine","Cable"],"metric":"reps","level":"beginner","src":"both"},{"id":"single-leg-glute-bridge","name":"Single-Leg Glute Bridge","group":"Legs","primary":"Glutes","secondary":["Hamstrings"],"split":"legs","pattern":"Hinge","focus":"Glutes","guide":"Like glute bridge, but performed with one leg. Forces stronger glute activation and pelvic control.","steps":["Lay on the floor with your feet flat and knees bent.","Raise one leg off of the ground, pulling the knee to your chest. This will be your starting position.","Execute the movement by driving through the heel, extending your hip upward and raising your glutes off of the ground.","Extend as far as possible, pause and then return to the starting position."],"equipment":["Bodyweight","Dumbbell"],"metric":"reps","level":"beginner","src":"both"},{"id":"single-leg-hip-thrust","name":"Single-Leg Hip Thrust","group":"Legs","primary":"Glutes","secondary":["Hamstrings"],"split":"legs","pattern":"Hinge","focus":"Glutes","guide":"Performed unilaterally for better glute focus and asymmetry correction. Maintain hip alignment.","steps":["Sit on the floor with your upper back against a bench and one foot flat on the floor, the other leg lifted.","Drive through the heel to lift the hips until the body is flat.","Squeeze the glute at the top, lower slowly, and finish the reps before switching legs."],"equipment":["Bodyweight","Dumbbell"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"single-leg-hop","name":"Single-Leg Hop","group":"Legs","primary":"Quads","secondary":["Abductors","Adductors","Calves","Hamstrings"],"split":"legs","pattern":"Plyometric","focus":"Quads","guide":null,"steps":["Arrange a line of cones in front of you. Assume a relaxed standing position, balanced on one leg. Raise the knee of your opposite leg. This will be your starting position.","Hop forward, jumping and landing with the same leg over the cone.","Use a countermovement jump to hop from cone to cone.","At the end, turn around and go back on the other leg."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"single-leg-lateral-hop","name":"Single-Leg Lateral Hop","group":"Legs","primary":"Quads","secondary":["Abductors","Adductors","Calves","Hamstrings"],"split":"legs","pattern":"Plyometric","focus":"Quads","guide":null,"steps":["Stand to the side of a cone or hurdle. To get into the start position, stand on one leg with your knee slightly bent.","To begin, execute a counterjump to hop sideways over the cone.","Land on your jumping leg, and immediately rebound out of it by jumping back to the start position.","Continue hopping back and forth."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"single-leg-rdl","name":"Single-Leg RDL","group":"Legs","primary":"Hamstrings","secondary":["Glutes","Lower Back"],"split":"legs","pattern":"Hinge","focus":"Hamstrings/Glutes","guide":"Maintain soft knee, reach back with rear leg as torso lowers. Improves balance and unilateral posterior chain strength.","steps":["Hold a kettlebell by the handle in one hand. Stand on one leg, on the same side that you hold the kettlebell.","Keeping that knee slightly bent, perform a stiff legged deadlift by bending at the hip, extending your free leg behind you for balance.","Continue lowering the kettlebell until you are parallel to the ground, and then return to the upright position."],"equipment":["Dumbbell","Kettlebell","Barbell"],"metric":"reps","level":"intermediate","src":"both"},{"id":"single-leg-squat","name":"Single-Leg Squat","group":"Legs","primary":"Quads","secondary":["Calves","Glutes","Hamstrings"],"split":"legs","pattern":"Squat","focus":"Quads","guide":null,"steps":["Start by standing about 2 to 3 feet in front of a flat bench with your back facing the bench. Have a barbell in front of you on the floor. Tip: Your feet should be shoulder width apart from each other.","Bend the knees and use a pronated grip with your hands being wider than shoulder width apart from each other to lift the barbell up until you can rest it on your chest.","Then lift the barbell over your head and rest it on the base of your neck. Move one foot back so that your toe is resting on the flat bench. Your other foot should be stationary in front of you. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. Tip: Make sure your back is straight and chest is out while performing this exercise.","As you inhale, slowly lower your leg until your thigh is parallel to the floor. At this point, your knee should be over your toes. Your chest should be directly above the middle of your thigh.","Leading with the chest and hips and contracting the quadriceps, elevate your leg back to the starting position as you exhale.","Repeat for the recommended amount of repetitions.","Switch legs and repeat the movement."],"equipment":["Barbell"],"metric":"reps","level":"expert","src":"freedb"},{"id":"sissy-squat","name":"Sissy Squat","group":"Legs","primary":"Quads","secondary":[],"split":"legs","pattern":"Calisthenics","focus":"Quads","guide":"Lean torso back while pushing knees forward over toes. Extreme quad stretch—use support as needed.","steps":["Standing upright, with feet at shoulder width and toes raised, use one hand to hold onto the beams of a squat rack and the opposite arm to hold a plate on top of your chest. This is your starting position.","As you use one arm to hold yourself, bend at the knees and slowly lower your torso toward the ground by bringing your pelvis and knees forward. Inhale as you go down and stop when your upper and lower legs almost create a 90-degree angle. Hold the stretch position for a second.","After your one second hold, use your thigh muscles to bring your torso back up to the starting position. Exhale as you move up."],"equipment":["Bodyweight","Plate","Machine","Barbell"],"metric":"reps","level":"expert","src":"both"},{"id":"sit-up","name":"Sit-Up","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Crunch","focus":"Abs","guide":null,"steps":["Lie down on the floor placing your feet either under something that will not move or by having a partner hold them. Your legs should be bent at the knees.","Place your hands behind your head and lock them together by clasping your fingers. This is the starting position.","Elevate your upper body so that it creates an imaginary V-shape with your thighs. Breathe out when performing this part of the exercise.","Once you feel the contraction for a second, lower your upper body back down to the starting position while inhaling."],"equipment":["Bodyweight","Band"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"skating","name":"Skating","group":"Cardio","primary":null,"secondary":[],"split":"cardio","pattern":"Steady-State","focus":null,"guide":null,"steps":["Roller skating is a fun activity which can be effective in improving cardiorespiratory fitness and muscular endurance. It requires relatively good balance and coordination. It is necessary to learn the basics of skating including turning and stopping and to wear protective gear to avoid possible injury.","You can skate at a comfortable pace for 30 minutes straight. If you want a cardio challenge, do interval skating — speed skate two minutes of every five minutes, using the remaining three minutes to recover. A 150 lb person will typically burn about 175 calories in 30 minutes skating at a comfortable pace, similar to brisk walking."],"equipment":["Outdoor"],"metric":"duration","level":"intermediate","src":"freedb"},{"id":"skierg","name":"SkiErg","group":"Cardio","primary":null,"secondary":[],"split":"cardio","pattern":"Mixed-Modality","focus":"Full Body","guide":"Pull handles downward using arms and hinge motion. Great for shoulders, lats, and core. Mimics skiing.","steps":["Stand with the feet shoulder width apart and take a handle in each hand with the arms overhead.","Pull the handles down while hinging forward at the hips and bending the knees slightly.","Return to standing with the arms overhead and repeat in a steady rhythm."],"equipment":["Machine"],"metric":"duration","level":"beginner","src":"ivan"},{"id":"skullcrusher","name":"Skullcrusher","group":"Arms","primary":"Triceps","secondary":[],"split":"push","pattern":"Extension","focus":"Triceps","guide":"Lower bar to forehead or behind head, keeping elbows in. Avoid flaring. Control weight and avoid excessive stretch.","steps":["Lie on a flat bench while holding two dumbbells directly in front of you. Your arms should be fully extended at a 90-degree angle from your torso and the floor. The palms should be facing in and the elbows should be tucked in. This is the starting position.","As you breathe in and you keep the upper arms stationary with the elbows in, slowly lower the weight until the dumbbells are near your ears.","At that point, while keeping the elbows in and the upper arms stationary, use the triceps to bring the weight back up to the starting position as you breathe out."],"equipment":["EZ Bar","Barbell","Dumbbell","Band","Cable"],"metric":"reps","level":"intermediate","src":"both"},{"id":"sled-drag","name":"Sled Drag","group":"Full Body","primary":"Quads","secondary":["Glutes","Hamstrings","Calves"],"split":"full","pattern":"Loaded Carry / Drag","focus":"Quads, Glutes","guide":"Strap or handle on the sled. Backward: lean back, small fast steps driving through the forefoot - knee-friendly quad work. Forward: lean in and drive the hips.","steps":["To begin, load the sled with the desired weight and attach the pulling strap. You can pull with handles, use a harness, or attach the pulling strap to a weight belt.","Whether pulling forwards or backwards, lean in the direction of travel and progress by extending through the hips and knees."],"equipment":["Sled"],"metric":"distance","level":"beginner","src":"both"},{"id":"sled-drag-with-press","name":"Sled Drag with Press","group":"Full Body","primary":"Mid Chest","secondary":["Calves","Glutes","Hamstrings","Quads","Front Delts"],"split":"full","pattern":"Carry","focus":"Mid Chest","guide":null,"steps":["Attach a dual handled chain or rope attachment to the sled. You should be facing away from the sled, holding a handle in each hand.","Begin the movement by moving forward for one step. Leaning forward, extend through the legs and hips to move, pausing with each step to extend through the elbows, pressing your hands forward. Step forward until you return to the start position prepared to press."],"equipment":["Sled"],"metric":"distance","level":"intermediate","src":"freedb"},{"id":"sled-overhead-walk","name":"Sled Overhead Walk","group":"Full Body","primary":"Front Delts","secondary":["Calves","Upper Back","Quads"],"split":"full","pattern":"Carry","focus":"Front Delts","guide":null,"steps":["Attach dual handles to a sled connected by a rope or chain. Load the sled to a light weight.","Face the sled, backing up until there is some tension in the line. Hold your hands directly above your head with your elbows extended. This will be your starting position.","Walk backwards, keeping your arms raised above your head. Avoid jerky movements."],"equipment":["Sled"],"metric":"distance","level":"beginner","src":"freedb"},{"id":"sled-push","name":"Sled Push","group":"Full Body","primary":"Quads","secondary":["Glutes","Calves","Abs"],"split":"full","pattern":"Carry","focus":"Glutes, Quads, Core","guide":"Push or drag loaded sled. Improves leg drive, total-body power, and conditioning. Keep spine neutral and push through entire foot.","steps":["Load your pushing sled with the desired weight.","Take an athletic posture, leaning into the sled with your arms fully extended, grasping the handles. Push the sled as fast as possible, focusing on extending your hips and knees to strengthen your posterior chain."],"equipment":["Sled"],"metric":"distance","level":"beginner","src":"both"},{"id":"sled-reverse-fly","name":"Sled Reverse Fly","group":"Shoulders","primary":"Rear Delts","secondary":[],"split":"pull","pattern":"Fly","focus":"Rear Delts","guide":null,"steps":["Attach dual handles to a sled connected by a rope or chain. Load the sled to a light weight.","Face the sled, backing up until there is some tension in the line. Take both handles at arms length at about waist level. Bend the knees slightly and keep your chest and head up. This will be your starting position.","Without flexing the elbow, pull the handles upward and apart, performing a reverse fly with some external rotation. Your palms should be facing forward as you do this.","Return to the starting position, taking a couple steps back to take the slack out of the line."],"equipment":["Sled"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"sled-row","name":"Sled Row","group":"Back","primary":"Upper Back","secondary":["Biceps","Lats"],"split":"pull","pattern":"Row","focus":"Upper Back","guide":null,"steps":["Attach dual handles to a sled connected by a rope or chain. Load the sled to an appropriate weight. Face the sled, backing up until there is some tension in the line.","With a handle in each hand, bend the knees slightly, keep your head and chest up, and begin with your arms extended.","To initiate the movement, flex the elbow as you retract your shoulder blades, pulling the sled towards you.","Take a step or two back to get tension in the line and repeat."],"equipment":["Sled"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"sled-triceps-extension","name":"Sled Triceps Extension","group":"Arms","primary":"Triceps","secondary":[],"split":"push","pattern":"Extension","focus":"Triceps","guide":null,"steps":["Attach dual handles to a sled using a chain or rope. Load the sled to an appropriate load.","Facing away from the sled, step away until there is tension in the line. Raise your hands above your head, keeping them together, palms facing each other. Your elbows should be pointed upward with the elbows flexed. This will be your starting position.","Extend through the elbow to straighten the arm. Ensure that your upper arm stays in position to isolate the triceps.","Upon full extension, step forward to take the slack out of the line. You may keep your feet staggered for more stability."],"equipment":["Sled"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"sledgehammer-swing","name":"Sledgehammer Swing","group":"Full Body","primary":"Abs","secondary":["Calves","Forearms","Lats","Upper Back","Front Delts"],"split":"full","pattern":"Combo","focus":"Abs","guide":null,"steps":["You will need a tire and a sledgehammer for this exercise. Stand in front of the tire about two feet away from it with a staggered stance. Grip the sledgehammer.","If you are right handed, your left hand should be at the bottom of the handle, and your right hand should be choking up closer to the head.","As you bring the sledge up, your right hand slides toward the head; as you swing down, your right hand will slide down to join your left hand. Slam it down as hard as you can against the tire. Control the bounce of the hammer off of the tire."],"equipment":["Other"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"snatch","name":"Snatch","group":"Full Body","primary":"Hamstrings","secondary":["Front Delts"],"split":"full","pattern":"Pull + Press","focus":"Posterior Chain + Shoulders","guide":"Wide-grip pull from ground to overhead in one motion. Demands coordination, mobility, and total-body strength.","steps":["Place your feet at a shoulder width stance with the barbell resting right above the connection between the toes and the rest of the foot.","With a palms facing down grip, bend at the knees and keeping the back flat grab the bar using a wider than shoulder width grip. Bring the hips down and make sure that your body drops as if you were going to sit on a chair. This will be your starting position.","Start pushing the floor as if it were a moving platform with your feet and simultaneously start lifting the barbell keeping it close to your legs.","As the bar reaches the middle of your thighs, push the floor with your legs and lift your body to a complete extension in an explosive motion.","Lift your shoulders back in a shrugging movement as you bring the bar up while lifting your elbows out to the side and keeping them above the bar for as long as possible.","Now in a very quick but powerful motion, you have to get your body under the barbell when it has reached a high enough point where it can be controlled and drop while locking your arms and holding the barbell overhead as you assume a squat position.","Finalize the movement by rising up out of the squat position to finish the lift. At the end of the lift both feet should be on line and the arms fully extended holding the barbell overhead."],"equipment":["Barbell","Dumbbell","Kettlebell"],"metric":"reps","level":"intermediate","src":"both"},{"id":"snatch-balance","name":"Snatch Balance","group":"Full Body","primary":"Quads","secondary":["Abs","Forearms","Glutes","Hamstrings","Front Delts"],"split":"full","pattern":"Olympic","focus":"Quads","guide":null,"steps":["Begin with the feet in the pulling position, the bar racked across the back of the shoulders, and the hands placed in a wide snatch grip.","Pop the bar with an abrupt dip and drive of the knees, and aggressively drive under the bar, transitioning the feet into the receiving position.","Receive the bar locked out overhead near the bottom of the squat. The torso should remain vertical, lowering the hips between the legs.","Continue to descend to full depth, and return to a standing position. Carefully lower the weight."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"snatch-pull","name":"Snatch Pull","group":"Legs","primary":"Hamstrings","secondary":["Calves","Glutes","Lower Back","Quads","Traps"],"split":"legs","pattern":"Olympic","focus":"Hamstrings","guide":null,"steps":["With a barbell on the floor close to the shins, take a wide snatch grip. Lower your hips with the weight focused on the heels, back straight, head facing forward, chest up, with your shoulders just in front of the bar. This will be your starting position.","Begin the first pull by driving through the heels, extending your knees. Your back angle should stay the same, and your arms should remain straight. Move the weight with control as you continue to above the knees.","Next comes the second pull, the main source of acceleration for the pull. As the bar approaches the mid-thigh position, begin extending through the hips. In a jumping motion, accelerate by extending the hips, knees, and ankles, using speed to move the bar upward.","There should be no need to actively pull through the arms to accelerate the weight; at the end of the second pull, the body should be fully extended, leaning slightly back. Full extension should be violent and abrupt, and ensure that you do not prolong the extension for longer than necessary."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"snatch-shrug","name":"Snatch Shrug","group":"Back","primary":"Traps","secondary":["Forearms","Front Delts"],"split":"pull","pattern":"Shrug","focus":"Traps","guide":null,"steps":["Begin with a wide grip, with the bar hanging at the mid thigh position. You can use a hook or overhand grip. Your back should be straight and inclined slightly forward.","Shrug your shoulders towards your ears. While this exercise can usually by loaded with heavier weight than a snatch, avoid overloading to the point that the execution slows down."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"snatch-grip-deadlift","name":"Snatch-Grip Deadlift","group":"Back","primary":"Lats","secondary":["Upper Back","Biceps"],"split":"pull","pattern":"Pull","focus":"Lats & Mid Back","guide":"Wide grip increases ROM and back recruitment. Maintain tight lats and tension throughout lift.","steps":["The snatch deadlift strengthens the first pull of the snatch. Begin with a wide snatch grip with the barbell placed on the platform. The feet should be directly under the hips, with the feet turned out. Squat down to the bar, keeping the back in absolute extension with the head facing forward.","Initiate the movement by driving through the heels, raising the hips. The back angle should remain the same until the bar passes the knees.","At that point, drive your hips through the bar as you lay back. Return the bar to the platform by reversing the motion."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"both"},{"id":"spanish-squat","name":"Spanish Squat","group":"Legs","primary":"Quads","secondary":["Glutes"],"split":"legs","pattern":"Isometric/Squat","focus":"Quads","guide":"Band behind knees keeps vertical tibia while squatting. Torches quads without knee strain. Great rehab/prehab.","steps":["Anchor a strong band at knee height and step into it so it sits behind both knees. Lean back against it with straight arms.","Sit back and down so the shins stay vertical and the quads do the work.","Stand up while keeping the tension on the band."],"equipment":["Band"],"metric":"time","level":"beginner","src":"ivan"},{"id":"speed-squat","name":"Speed Squat","group":"Legs","primary":"Quads","secondary":["Calves","Glutes","Hamstrings","Lower Back"],"split":"legs","pattern":"Squat","focus":"Quads","guide":null,"steps":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance which targets overall development; however you can choose any of the three stances discussed in the foot stances section).","Begin to lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as fast as possible without involving momentum as you exhale by pushing the floor with the heel of your foot mainly as you straighten the legs again and go back to the starting position. Note: You should perform these exercises as fast as possible but without breaking perfect form and without involving momentum."],"equipment":["Barbell"],"metric":"reps","level":"expert","src":"freedb"},{"id":"spell-caster","name":"Spell Caster","group":"Core","primary":"Obliques","secondary":["Glutes","Front Delts"],"split":"core","pattern":"Other","focus":"Obliques","guide":null,"steps":["Hold a dumbbell in each hand with a pronated grip. Your feet should be wide with your hips and knees extended. This will be your starting position.","Begin the movement by pulling both of the dumbbells to one side next to your hip, rotating your torso.","Keeping your arms straight and the dumbbells parallel to the ground, rotate your torso to swing the weights to your opposite side.","Continue alternating, rotating from one side to the other until the set is complete."],"equipment":["Dumbbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"spider-crawl","name":"Spider Crawl","group":"Core","primary":"Abs","secondary":["Mid Chest","Front Delts","Triceps"],"split":"core","pattern":"Other","focus":"Abs","guide":null,"steps":["Begin in a prone position on the floor. Support your weight on your hands and toes, with your feet together and your body straight. Your arms should be bent to 90 degrees. This will be your starting position.","Initiate the movement by raising one foot off of the ground. Externally rotate the leg and bring the knee toward your elbow, as far forward as possible.","Return this leg to the starting position and repeat on the opposite side."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"spider-curl","name":"Spider Curl","group":"Arms","primary":"Biceps","secondary":["Forearms"],"split":"pull","pattern":"Curl","focus":"Biceps","guide":"Chest supported on incline bench. Curl with elbows forward, emphasizing the short head and constant tension.","steps":["Lie face forward on a tall flat bench while holding a barbell with a supinated grip (palms facing up). Tip: If you are holding a barbell grab it using a shoulder-width grip and if you are using an E-Z Bar grab it on the inner handles. Your upper body should be positioned in a way that the upper chest is over the end of the bench and the barbell is hanging in front of you with the arms extended and perpendicular to the floor. This will be your starting position.","While keeping the elbows in and the upper arms stationary, curl the weight up in a semi-circular motion as you contract the biceps and exhale. Hold at the top of the movement for a second.","As you inhale, slowly go back to the starting position. Tip: Maintain full control of the weight at all times and avoid any swinging. Remember, only the forearms should move throughout the movement."],"equipment":["Dumbbell","EZ Bar","Barbell"],"metric":"reps","level":"intermediate","src":"both"},{"id":"split-clean","name":"Split Clean","group":"Full Body","primary":"Quads","secondary":["Calves","Forearms","Glutes","Hamstrings","Lower Back"],"split":"full","pattern":"Olympic","focus":"Quads","guide":null,"steps":["With a barbell on the floor close to the shins, take an overhand grip just outside the legs. Lower your hips with the weight focused on the heels, back straight, head facing forward, chest up, with your shoulders just in front of the bar. This will be your starting position.","Begin the first pull by driving through the heels, extending your knees. Your back angle should stay the same, and your arms should remain straight. Move the weight with control as you continue to above the knees.","Next comes the second pull, the main source of acceleration for the clean. As the bar approaches the mid-thigh position, begin extending through the hips. In a jumping motion, accelerate by extending the hips, knees, and ankles, using speed to move the bar upward. There should be no need to actively pull through the arms to accelerate the weight; at the end of the second pull, the body should be fully extended, leaning slightly back, with the arms still extended.","As full extension is achieved, transition into the third pull by aggressively shrugging and flexing the arms with the elbows up and out. At peak extension, aggressively pull yourself down, rotating your elbows under the bar as you do so.","Receive the bar with the feet split, aggressively moving one foot forward and one foot back. The bar should be racked onto the protracted shoulders, lightly touching the throat with the hands relaxed. Continue to descend to the bottom position, which will help in the recovery.","Immediately recover by driving through the heels, keeping the torso upright and elbows up. Bring the feet together as you stand up."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"split-jerk","name":"Split Jerk","group":"Full Body","primary":"Quads","secondary":["Glutes","Hamstrings","Triceps","Front Delts"],"split":"full","pattern":"Overhead Press","focus":"Quads","guide":null,"steps":["Standing with the weight racked on the front of the shoulders, begin with the dip. With your feet directly under your hips, flex the knees without moving the hips backward.","Go down only slightly, and reverse direction as powerfully as possible. Drive through the heels create as much speed and force as possible, and be sure to move your head out of the way as the bar leaves the shoulders. At this moment as the feet leave the floor, the feet must be placed into the receiving position as quickly as possible.","In the brief moment the feet are not actively driving against the platform, the athlete's effort to push the bar up will drive them down. The feet should be moved to a split stance, one foot forward, one foot back, with the knees partially bent. Receive the bar with the arms locked out overhead.","Return to a standing position, bringing the feet together."],"equipment":["Kettlebell","Barbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"split-jump","name":"Split Jump","group":"Legs","primary":"Quads","secondary":["Glutes","Hamstrings","Calves"],"split":"legs","pattern":"Lunge","focus":"Quads","guide":null,"steps":["Assume a lunge stance position with one foot forward with the knee bent, and the rear knee nearly touching the ground.","Ensure that the front knee is over the midline of the foot.","Extending through both legs, jump as high as possible, swinging your arms to gain lift.","As you jump, bring your feet together, and move them back to their initial positions as you land.","Absorb the impact by reverting back to the starting position."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"split-snatch","name":"Split Snatch","group":"Full Body","primary":"Hamstrings","secondary":["Quads","Calves","Forearms","Glutes","Lower Back"],"split":"full","pattern":"Olympic","focus":"Hamstrings","guide":null,"steps":["Begin with a loaded barbell on the floor. The bar should be close to or touching the shins, and a wide grip should be taken on the bar. The feet should be directly below the hips, with the feet turned out as needed. Lower the hips, with the chest up and the head looking forward. The shoulders should be just in front of the bar. This will be the starting position.","Begin the first pull by driving through the front of the heels, raising the bar from the ground. The back angle should stay the same until the bar passes the knees.","Transition into the second pull by extending through the hips knees and ankles, driving the bar up as quickly as possible. The bar should be close to the body. At peak extension, shrug the shoulders and allow the elbows to flex to the side.","As you move your feet into the receiving position, forcefully pull yourself below the bar as you elevate the bar overhead. The feet should move forcefully to a split position, one foot forward one foot back. Receive the bar with your body as low as possible and the arms fully extended overhead.","Keeping the bar aligned over the front of the heels, your head and chest up, drive through heels of the feet to move to a standing position, bringing your feet together.","Carefully return the weight to floor."],"equipment":["Kettlebell","Barbell"],"metric":"reps","level":"expert","src":"freedb"},{"id":"split-squat","name":"Split Squat","group":"Legs","primary":"Quads","secondary":["Glutes","Hamstrings"],"split":"legs","pattern":"Squat","focus":"Quads","guide":null,"steps":["Position yourself into a staggered stance with the rear foot elevated and front foot forward.","Hold a dumbbell in each hand, letting them hang at the sides. This will be your starting position.","Begin by descending, flexing your knee and hip to lower your body down. Maintain good posture througout the movement. Keep the front knee in line with the foot as you perform the exercise.","At the bottom of the movement, drive through the heel to extend the knee and hip to return to the starting position."],"equipment":["Dumbbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"sprints","name":"Sprints","group":"Cardio","primary":null,"secondary":[],"split":"cardio","pattern":"Intervals","focus":"Legs, Core, Glutes","guide":"Alternate short bursts of sprinting with periods of walking or rest. Excellent for fat loss and speed development.","steps":["Warm up with a jog and dynamic stretches.","Sprint hard for 10–30 seconds on a flat surface, driving the knees and arms.","Walk or rest until fully recovered, then repeat. Stop when speed drops."],"equipment":["Outdoor","Treadmill"],"metric":"duration","level":"intermediate","src":"ivan"},{"id":"squat-jerk","name":"Squat Jerk","group":"Full Body","primary":"Quads","secondary":["Calves","Glutes","Hamstrings","Front Delts","Triceps"],"split":"full","pattern":"Overhead Press","focus":"Quads","guide":null,"steps":["Standing with the weight racked on the front of the shoulders, begin with the dip. With your feet directly under your hips, flex the knees without moving the hips backward. Go down only slightly, and reverse direction as powerfully as possible. Drive through the heels create as much speed and force as possible, and be sure to move your head out of the way as the bar leaves the shoulders.","At this moment as the feet leave the floor, the feet must be placed into the receiving position as quickly as possible. In the brief moment the feet are not actively driving against the platform, the athlete's effort to push the bar up will drive them down. The feet should move forcefully to just outside the hips, turned out as necessary. Receive the bar with your body in a full squat and the arms fully extended overhead.","Keeping the bar aligned over the front of the heels, your head and chest up, drive throught heels of the feet to move to a standing position. Carefully return the weight to floor."],"equipment":["Barbell"],"metric":"reps","level":"expert","src":"freedb"},{"id":"squat-to-press","name":"Squat to Press","group":"Full Body","primary":"Quads","secondary":["Front Delts","Abs"],"split":"full","pattern":"Combo","focus":"Quads, Shoulders, Core","guide":"Start in front squat position, rise up and immediately press overhead. Maintain clean movement transition and keep knees aligned over toes.","steps":["Hold two dumbbells at the shoulders in a front squat position.","Sit into a squat, then drive up and press the weights overhead in one motion.","Lower the weights to the shoulders and go straight into the next squat."],"equipment":["Dumbbell","Kettlebell","Barbell"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"stability-ball-back-extension","name":"Stability Ball Back Extension","group":"Back","primary":"Lower Back","secondary":["Glutes","Hamstrings","Upper Back"],"split":"pull","pattern":"Extension","focus":"Lower Back","guide":null,"steps":["To begin, lie down on an exercise ball with your torso pressing against the ball and parallel to the floor. The ball of your feet should be pressed against the floor to help keep you balanced. Place a weighted plate under your chin or behind your neck. This is the starting position.","Slowly raise your torso up by bending at the waist and lower back. Remember to exhale during this movement.","Hold the contraction on your lower back for a second and lower your torso back down to the starting position while inhaling."],"equipment":["Stability Ball"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"stability-ball-crunch","name":"Stability Ball Crunch","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Crunch","focus":"Upper Abs","guide":"Lie on stability ball to allow spinal extension. Crunch upward with controlled form and squeeze abs at top.","steps":["Lie on an exercise ball with your lower back curvature pressed against the spherical surface of the ball. Your feet should be bent at the knee and pressed firmly against the floor. The upper torso should be hanging off the top of the ball. The arms should either be kept alongside the body or crossed on top of your chest as these positions avoid neck strains (as opposed to the hands behind the back of the head position).","Lower your torso into a stretch position keeping the neck stationary at all times. This will be your starting position.","With the hips stationary, flex the waist by contracting the abdominals and curl the shoulders and trunk upward until you feel a nice contraction on your abdominals. The arms should simply slide up the side of your legs if you have them at the side or just stay on top of your chest if you have them crossed. The lower back should always stay in contact with the ball. Exhale as you perform this movement and hold the contraction for a second.","As you inhale, go back to the starting position."],"equipment":["Stability Ball"],"metric":"reps","level":"beginner","src":"both"},{"id":"stability-ball-hip-bridge","name":"Stability Ball Hip Bridge","group":"Legs","primary":"Glutes","secondary":["Hamstrings"],"split":"legs","pattern":"Hinge","focus":"Glutes","guide":null,"steps":["Lay on a ball so that your upper back is on the ball with your hips unsupported. Both feet should be flat on the floor, hip width apart or wider. This will be your starting position.","Begin by extending the hips using your glutes and hamstrings, raising your hips upward as you bridge.","Pause at the top of the motion and return to the starting position."],"equipment":["Stability Ball"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"stability-ball-leg-curl","name":"Stability Ball Leg Curl","group":"Legs","primary":"Hamstrings","secondary":[],"split":"legs","pattern":"Curl","focus":"Hamstrings","guide":"Bodyweight movement with ball. Roll it in using heels. Great for hamstring isolation and core engagement.","steps":["Begin on the floor laying on your back with your feet on top of the ball.","Position the ball so that when your legs are extended your ankles are on top of the ball. This will be your starting position.","Raise your hips off of the ground, keeping your weight on the shoulder blades and your feet.","Flex the knees, pulling the ball as close to you as you can, contracting the hamstrings.","After a brief pause, return to the starting position."],"equipment":["Stability Ball"],"metric":"reps","level":"beginner","src":"both"},{"id":"stability-ball-pike","name":"Stability Ball Pike","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Leg Raise","focus":"Abs","guide":null,"steps":["Place an exercise ball nearby and lay on the floor in front of it with your hands on the floor shoulder width apart in a push-up position.","Now place your lower shins on top of an exercise ball. Tip: At this point your legs should be fully extended with the shins on top of the ball and the upper body should be in a push-up type of position being supported by your two extended arms in front of you. This will be your starting position.","While keeping your back completely straight and the upper body stationary, pull your knees in towards your chest as you exhale, allowing the ball to roll forward under your ankles. Squeeze your abs and hold that position for a second.","Now slowly straighten your legs, rolling the ball back to the starting position as you inhale."],"equipment":["Stability Ball"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"stability-ball-push-up","name":"Stability Ball Push-Up","group":"Chest","primary":"Mid Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Press","focus":"Mid Chest","guide":null,"steps":["Lie on the floor face down and place your hands about 36 inches apart from each other holding your torso up at arms length.","Place your toes on top of an exercise ball. This will allow your body to be elevated.","Lower yourself until your chest almost touches the floor as you inhale.","Using your pectoral muscles, press your upper body back up to the starting position and squeeze your chest. Breathe out as you perform this step.","After a second pause at the contracted position, repeat the movement for the prescribed amount of repetitions."],"equipment":["Stability Ball"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"stability-ball-rollout","name":"Stability Ball Rollout","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Extension","focus":"Full Core","guide":"Forearms on ball, roll forward while maintaining straight body line. Return with abs, not hip flexors.","steps":["Kneel behind a stability ball with the forearms on top and the hips tucked.","Roll the ball forward by extending the arms, keeping a straight line from the knees to the head.","Pull the ball back with the abs, not the hip flexors."],"equipment":["Stability Ball"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"stair-climber","name":"Stair Climber","group":"Cardio","primary":null,"secondary":[],"split":"cardio","pattern":"Steady-State","focus":"Quads, Glutes, Calves","guide":"Keep upright posture. Drive through heels. Builds endurance while targeting legs. Adjust speed for intervals.","steps":["To begin, step onto the stepmill and select the desired option from the menu. You can choose a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Use caution so that you don't trip as you climb the stairs. It is recommended that you maintain your grip on the handles so that you don't fall.","Stepmills offer convenience, cardiovascular benefits, and usually have less impact than running outside while offering a similar rate of calories burned. They are typically much harder than other cardio equipment. A 150 lb person will typically burn over 300 calories in 30 minutes, compared to about 175 calories walking."],"equipment":["Machine"],"metric":"duration","level":"intermediate","src":"both"},{"id":"standing-abduction","name":"Standing Abduction","group":"Legs","primary":"Abductors","secondary":[],"split":"legs","pattern":"Lateral Movement","focus":"Abductors","guide":"Attach cable to ankle and lift leg sideways. Use slow, controlled motion and balance support if needed.","steps":["Attach an ankle cuff to a low cable and stand side-on to the stack, holding a support.","Lift the working leg out to the side, keeping the toes forward and the torso upright.","Lower slowly. Finish the reps, then switch legs."],"equipment":["Cable","Band"],"metric":"reps","level":"beginner","src":"ivan"},{"id":"standing-adduction","name":"Standing Adduction","group":"Legs","primary":"Adductors","secondary":[],"split":"legs","pattern":"Isolation","focus":"Adductors","guide":"Cable hooked to ankle, pull leg across body against resistance. Slow, controlled motion.","steps":["Stand in front of a low pulley facing forward with one leg next to the pulley and the other one away.","Attach the ankle cuff to the cable and also to the ankle of the leg that is next to the pulley.","Now step out and away from the stack with a wide stance and grasp the bar of the pulley system.","Stand on the foot that does not have the ankle cuff (the far foot) and allow the leg with the cuff to be pulled towards the low pulley. This will be your starting position.","Now perform the movement by moving the leg with the ankle cuff in front of the far leg by using the inner thighs to abduct the hip. Breathe out during this portion of the movement.","Slowly return to the starting position as you breathe in."],"equipment":["Cable","Band"],"metric":"reps","level":"beginner","src":"both"},{"id":"standing-cable-crunch","name":"Standing Cable Crunch","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Crunch","focus":"Abs","guide":null,"steps":["Attach a rope to a high pulley and select an appropriate weight.","Stand with your back to the cable tower. Take the rope with both hands over your shoulders, holding it to your upper chest. This will be your starting position.","Perform the movement by flexing the spine, crunching the weight down as far as you can.","Hold the peak contraction for a moment before returning to the starting position."],"equipment":["Cable"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"standing-cable-y-raise","name":"Standing Cable Y-Raise","group":"Shoulders","primary":"Side Delts","secondary":[],"split":"push","pattern":"Raise","focus":"Rear / Side Delts","guide":"Set cables low and raise arms in a Y-shape. Targets both rear and lateral delts while keeping tension constant.","steps":["Set two low cables and stand between them, holding a handle in each hand.","Raise the arms up and out in a Y shape to ear level.","Lower slowly, keeping the shoulders down."],"equipment":["Cable"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"standing-calf-raise","name":"Standing Calf Raise","group":"Legs","primary":"Calves","secondary":[],"split":"legs","pattern":"Raise","focus":"Calves (Gastrocnemius)","guide":"Stand tall, heels off edge. Push through ball of foot to raise heels. Emphasizes upper calf.","steps":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place it on the back of your shoulders (slightly below the neck).","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance. Also maintain a straight back and keep the knees with a slight bend; never locked. This will be your starting position.","Raise your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending (other than the slight initial bend we created during positioning) at any time. Hold the contracted position by a second before you start to go back down.","Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched.","Now lift your toes by contracting the tibia muscles in the front of the calves as you breathe out.","Hold for a second and bring them back down as you breathe in."],"equipment":["Machine","Smith Machine","Dumbbell","Bodyweight","Band","Barbell"],"metric":"reps","level":"beginner","src":"both"},{"id":"standing-hip-thrust","name":"Standing Hip Thrust","group":"Legs","primary":"Glutes","secondary":["Hamstrings"],"split":"legs","pattern":"Hinge","focus":"Glutes","guide":"Use cable at low pulley, stand slightly forward, thrust hips forward for constant tension. Cable-friendly glute activation.","steps":["Set a cable low and attach a belt or handle at the hips. Stand facing away with a slight forward lean.","Drive the hips forward until the body is upright, squeezing the glutes.","Return slowly without letting the cable pull you off balance."],"equipment":["Cable"],"metric":"reps","level":"beginner","src":"ivan"},{"id":"standing-leg-curl","name":"Standing Leg Curl","group":"Legs","primary":"Hamstrings","secondary":[],"split":"legs","pattern":"Curl","focus":"Hamstrings","guide":"Unilateral hamstring work. Focus on squeezing at the top and resisting on the way down.","steps":["Adjust the machine lever to fit your height and lie with your torso bent at the waist facing forward around 30-45 degrees (since an angled position is more favorable for hamstrings recruitment) with the pad of the lever on the back of your right leg (just a few inches under the calves) and the front of the right leg on top of the machine pad.","Keeping the torso bent forward, ensure your leg is fully stretched and grab the side handles of the machine. Position your toes straight. This will be your starting position.","As you exhale, curl your right leg up as far as possible without lifting the upper leg from the pad. Once you hit the fully contracted position, hold it for a second.","As you inhale, bring the legs back to the initial position. Repeat for the recommended amount of repetitions.","Perform the same exercise now for the left leg."],"equipment":["Machine","Cable"],"metric":"reps","level":"beginner","src":"both"},{"id":"star-jump","name":"Star Jump","group":"Legs","primary":"Quads","secondary":["Calves","Glutes","Hamstrings","Front Delts"],"split":"legs","pattern":"Plyometric","focus":"Quads","guide":null,"steps":["Begin in a relaxed stance with your feet shoulder width apart and hold your arms close to the body.","To initiate the move, squat down halfway and explode back up as high as possible. Fully extend your entire body, spreading your legs and arms away from the body.","As you land, bring your limbs back in and absorb your impact through the legs."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"step-through-lunge","name":"Step-Through Lunge","group":"Legs","primary":"Quads","secondary":[],"split":"legs","pattern":"Calisthenics","focus":"Full Legs","guide":"Step forward then backward in one fluid motion. Challenges control, balance, and muscular endurance.","steps":["Stand holding dumbbells at your sides.","Step forward into a lunge and push off, stepping the same back leg through into a lunge on the other side.","Move in one smooth line. Keep the torso tall and the steps controlled."],"equipment":["Dumbbell","Bodyweight"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"step-up","name":"Step-Up","group":"Legs","primary":"Glutes","secondary":["Quads"],"split":"legs","pattern":"Lunge","focus":"Glutes","guide":"Step onto platform with front leg and drive through heel. Avoid pushing off the back foot. Higher box increases glute activation.","steps":["Stand up straight while holding a barbell placed on the back of your shoulders (slightly below the neck) and stand upright behind an elevated platform (such as the one used for spotting behind a flat bench). This is your starting position.","Place the right foot on the elevated platform. Step on the platform by extending the hip and the knee of your right leg. Use the heel mainly to lift the rest of your body up and place the foot of the left leg on the platform as well. Breathe out as you execute the force required to come up.","Step down with the left leg by flexing the hip and knee of the right leg as you inhale. Return to the original standing position by placing the right foot of to next to the left foot on the initial position."],"equipment":["Dumbbell","Barbell","Bodyweight"],"metric":"reps","level":"intermediate","src":"both"},{"id":"step-up-with-knee-drive","name":"Step-Up with Knee Drive","group":"Legs","primary":"Glutes","secondary":["Hamstrings","Quads"],"split":"legs","pattern":"Lunge","focus":"Glutes","guide":null,"steps":["Stand facing a box or bench of an appropriate height with your feet together. This will be your starting position.","Begin the movement by stepping up, putting your left foot on the top of the bench. Extend through the hip and knee of your front leg to stand up on the box. As you stand on the box with your left leg, flex your right knee and hip, bringing your knee as high as you can.","Reverse this motion to step down off the box, and then repeat the sequence on the opposite leg."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"sternum-chin-up","name":"Sternum Chin-Up","group":"Back","primary":"Lats","secondary":["Biceps","Upper Back"],"split":"pull","pattern":"Vertical Pull","focus":"Lats","guide":null,"steps":["Grasp the pull-up bar with a shoulder width underhand grip.","Now hang with your arms fully extended and stick your chest out and lean back. Tip: You will be leaning back throughout the entire movement. This will be your starting position.","Start pulling yourself towards the bar with your spine arched throughout the movement and your head leaning back as far away from the bar as possible. Exhale as you perform this portion of the movement. Tip: At the upper end of the movement, your hips and legs will be at about a 45-degree angle to the floor.","Keep pulling until your collarbone passes the bar and your lower chest or sternum area touches it. Hold that contraction for a second. Tip: By the time you've completed this portion of the movement; your head will be parallel to the floor.","Slowly start going back to the starting position as you inhale."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"stiff-leg-deadlift","name":"Stiff-Leg Deadlift","group":"Legs","primary":"Hamstrings","secondary":["Glutes","Lower Back"],"split":"legs","pattern":"Hinge","focus":"Hamstrings","guide":"Less knee bend than RDL. Emphasizes hamstrings through longer stretch. Maintain tight core and flat back throughout.","steps":["Grasp a bar using an overhand grip (palms facing down). You may need some wrist wraps if using a significant amount of weight.","Stand with your torso straight and your legs spaced using a shoulder width or narrower stance. The knees should be slightly bent. This is your starting position.","Keeping the knees stationary, lower the barbell to over the top of your feet by bending at the hips while keeping your back straight. Keep moving forward as if you were going to pick something from the floor until you feel a stretch on the hamstrings. Inhale as you perform this movement.","Start bringing your torso up straight again by extending your hips until you are back at the starting position. Exhale as you perform this movement."],"equipment":["Barbell","Dumbbell","Smith Machine"],"metric":"reps","level":"intermediate","src":"both"},{"id":"straight-arm-pullover","name":"Straight-Arm Pullover","group":"Back","primary":"Lats","secondary":[],"split":"pull","pattern":"Vertical Pull","focus":"Lats","guide":"Arms straight, hinge at hips, pull bar down to thighs. Focus on keeping tension in lats throughout.","steps":["You will start by grabbing the wide bar from the top pulley of a pulldown machine and using a wider than shoulder-width pronated (palms down) grip. Step backwards two feet or so.","Bend your torso forward at the waist by around 30-degrees with your arms fully extended in front of you and a slight bend at the elbows. If your arms are not fully extended then you need to step a bit more backwards until they are. Once your arms are fully extended and your torso is slightly bent at the waist, tighten the lats and then you are ready to begin.","While keeping the arms straight, pull the bar down by contracting the lats until your hands are next to the side of the thighs. Breathe out as you perform this step.","While keeping the arms straight, go back to the starting position while breathing in."],"equipment":["Cable","Band","Dumbbell"],"metric":"reps","level":"beginner","src":"both"},{"id":"stride-jump","name":"Stride Jump","group":"Legs","primary":"Quads","secondary":["Abductors","Adductors","Calves","Hamstrings"],"split":"legs","pattern":"Plyometric","focus":"Quads","guide":null,"steps":["Stand to the side of a box with your inside foot on top of it, close to the edge.","Begin by swinging the arms upward as you push through the top leg, jumping upward as high as possible. Attempt to drive the opposite knee upward.","Land in the same position that you started, using your inside leg to decelerate the impact."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"suitcase-carry","name":"Suitcase Carry","group":"Core","primary":"Obliques","secondary":["Forearms","Traps"],"split":"core","pattern":"Carry","focus":"Full Core","guide":"Hold weight in one hand and walk slowly. Resist lateral bend to engage obliques and stabilizers. Maintain tall posture.","steps":["Pick up a heavy dumbbell or kettlebell in one hand and stand tall.","Brace the core and keep the shoulders level, resisting the lean toward the weight.","Walk slowly for a set distance, then switch hands."],"equipment":["Dumbbell","Kettlebell"],"metric":"distance","level":"beginner","src":"ivan"},{"id":"suitcase-deadlift","name":"Suitcase Deadlift","group":"Legs","primary":"Quads","secondary":["Obliques","Calves","Glutes","Hamstrings","Lower Back"],"split":"legs","pattern":"Hinge","focus":"Quads","guide":null,"steps":["Stand to the side of a barbell next to its center. Bend your knees and lower your body until you are able to reach the barbell.","Grasp the bar as if you were grabbing a briefcase (palms facing you since the bar is sideways). You may need a wrist wrap if you are using a significant amount of weight. This is your starting position.","Use your legs to help lift the barbell up while exhaling. Your arms should extend fully as bring the barbell up until you are in a standing position.","Slowly bring the barbell back down while inhaling. Tip: Make sure to bend your knees while lowering the weight to avoid any injury from occurring.","Repeat for the recommended amount of repetitions.","Switch arms and repeat the movement."],"equipment":["Barbell"],"metric":"reps","level":"expert","src":"freedb"},{"id":"sumo-deadlift","name":"Sumo Deadlift","group":"Legs","primary":"Glutes","secondary":["Hamstrings","Adductors"],"split":"legs","pattern":"Hinge","focus":"Glutes/Hamstrings/Adductors","guide":"Wide stance, toes slightly pointed out. Grip inside knees. Focus on driving knees out and hips forward. Targets glutes, inner thighs, and hamstrings more than conventional deadlift.","steps":["Begin with a bar loaded on the ground. Approach the bar so that the bar intersects the middle of the feet. The feet should be set very wide, near the collars. Bend at the hips to grip the bar. The arms should be directly below the shoulders, inside the legs, and you can use a pronated grip, a mixed grip, or hook grip. Relax the shoulders, which in effect lengthens your arms.","Take a breath, and then lower your hips, looking forward with your head with your chest up. Drive through the floor, spreading your feet apart, with your weight on the back half of your feet. Extend through the hips and knees.","As the bar passes through the knees, lean back and drive the hips into the bar, pulling your shoulder blades together.","Return the weight to the ground by bending at the hips and controlling the weight on the way down."],"equipment":["Barbell","Band"],"metric":"reps","level":"intermediate","src":"both"},{"id":"sumo-high-pull","name":"Sumo High Pull","group":"Back","primary":"Traps","secondary":["Adductors","Glutes","Hamstrings","Quads","Front Delts"],"split":"pull","pattern":"Other","focus":"Traps","guide":null,"steps":["Place a kettlebell on the ground between your feet. Position your feet in a wide stance, and grasp the kettlebell with two hands. Set your hips back as far as possible, with your knees bent. Keep your chest and head up. This will be your starting position.","Begin by extending the hips and knees, simultaneously pulling the kettlebell to your shoulders, raising your elbows as you do so. Reverse the motion to return to the starting position."],"equipment":["Kettlebell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"sumo-squat","name":"Sumo Squat","group":"Legs","primary":"Glutes","secondary":["Adductors","Quads"],"split":"legs","pattern":"Squat","focus":"Glutes/Adductors","guide":"Wide stance, toes out. Sit between hips. Emphasizes glutes and inner thighs. Dumbbell or barbell held center.","steps":["Hold a dumbbell at the base with both hands and stand straight up. Move your legs so that they are wider than shoulder width apart from each other with your knees slightly bent.","Your toes should be facing out. Note: Your arms should be stationary while performing the exercise. This is the starting position.","Slowly bend the knees and lower your legs until your thighs are parallel to the floor. Make sure to inhale as this is the eccentric part of the exercise.","Press mainly with the heel of the foot to bring the body back to the starting position while exhaling."],"equipment":["Dumbbell","Kettlebell","Barbell"],"metric":"reps","level":"beginner","src":"both"},{"id":"superman-hold","name":"Superman Hold","group":"Back","primary":"Lower Back","secondary":[],"split":"pull","pattern":"Extension","focus":"Erectors","guide":"Lie face down, lift arms and legs simultaneously. Hold for time. Focus on squeezing glutes and lower back.","steps":["Lie face down with the arms extended overhead.","Lift the arms, chest and legs off the floor at the same time and squeeze the glutes and lower back.","Hold for time, then lower and repeat."],"equipment":["Bodyweight"],"metric":"time","level":"beginner","src":"ivan"},{"id":"superman-row","name":"Superman Row","group":"Back","primary":"Upper Back","secondary":[],"split":"pull","pattern":"Calisthenics","focus":"Full Back","guide":"Lie face down, lift chest and arms, then perform row motion. Targets upper and lower back with bodyweight.","steps":["Lie face down with the arms extended overhead.","Lift the chest and arms off the floor and draw the elbows back toward the ribs.","Reach forward again and lower. Keep the neck neutral."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"beginner","src":"ivan"},{"id":"supinated-fly","name":"Supinated Fly","group":"Chest","primary":"Mid Chest","secondary":["Front Delts"],"split":"push","pattern":"Fly","focus":"Mid Chest","guide":"Perform fly with palms rotated up throughout. Increases pec activation through range.","steps":["Set the cables at shoulder height and take a handle in each hand with the palms facing up.","Bring the arms together in front of the chest, keeping the palms up and a soft elbow.","Return slowly to a stretch across the chest."],"equipment":["Cable","Dumbbell"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"suspension-fallout","name":"Suspension Fallout","group":"Core","primary":"Abs","secondary":["Mid Chest","Lower Back","Front Delts"],"split":"core","pattern":"Stability","focus":"Abs","guide":null,"steps":["Adjust the straps so the handles are at an appropriate height, below waist level.","Begin standing and grasping the handles. Lean into the straps, moving to an incline push-up position. This will be your starting position.","Keeping your arms straight, lean further into the suspension straps, bringing your body closer to the ground, allowing your shoulders to extend, raising your arms up and over your head.","Maintain a neutral spine and keep the rest of your body straight, your shoulders being the only joints allowed to move.","Pause during the peak contraction, and then return to the starting position."],"equipment":["Suspension"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"suspension-push-up","name":"Suspension Push-Up","group":"Chest","primary":"Mid Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Press","focus":"Mid Chest","guide":null,"steps":["Anchor your suspension straps securely to the top of a rack or other object.","Leaning into the straps, take a handle in each hand and move into a push-up plank position. You should be as close to parallel to the ground as you can manage with your arms fully extended, maintaining good posture.","Maintaining a straight, rigid torso, descend slowly by allowing the elbows to flex.","Continue until your elbows break 90 degrees, pausing before you extend to return to the starting position."],"equipment":["Suspension"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"t-bar-row","name":"T-Bar Row","group":"Back","primary":"Upper Back","secondary":["Lats","Biceps","Rear Delts"],"split":"pull","pattern":"Horizontal Row","focus":"Mid Back","guide":"Feet planted, chest up. Pull with elbows close and drive through upper back. Avoid jerking or bouncing.","steps":["Position a bar into a landmine or in a corner to keep it from moving. Load an appropriate weight onto your end.","Stand over the bar, and position a Double D row handle around the bar next to the collar. Using your hips and legs, rise to a standing position.","Assume a wide stance with your hips back and your chest up. Your arms should be extended. This will be your starting position.","Pull the weight to your upper abdomen by retracting the shoulder blades and flexing the elbows. Do not jerk the weight or cheat during the movement.","After a brief pause, return to the starting position."],"equipment":["T-Bar","Landmine","Machine"],"metric":"reps","level":"beginner","src":"both"},{"id":"tate-press","name":"Tate Press","group":"Arms","primary":"Triceps","secondary":["Mid Chest","Front Delts"],"split":"push","pattern":"Press","focus":"Triceps","guide":null,"steps":["Lie down on a flat bench with a dumbbell in each hand on top of your thighs. The palms of your hand will be facing each other.","By using your thighs to help you get the dumbbells up, clean the dumbbells one arm at a time so that you can hold them in front of you at shoulder width. Note: when holding the dumbbells in front of you, make sure your arms are wider than shoulder width apart from each other using a pronated (palms forward) grip. Allow your elbows to point out. This is your starting position.","Keeping the upper arms stationary, slowly move the dumbbells in and down in a semi circular motion until they touch the upper chest while inhaling. Keep full control of the dumbbells at all times and do not move the upper arms nor rest the dumbbells on the chest.","As you breathe out, move the dumbbells up using your triceps and the same semi-circular motion but in reverse. Attempt to keep the dumbbells together as they move up. Lock your arms in the contracted position, hold for a second and then start coming down again slowly again. Tip: It should take at least twice as long to go down than to come up."],"equipment":["Dumbbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"thruster","name":"Thruster","group":"Full Body","primary":"Quads","secondary":["Front Delts","Abs","Glutes"],"split":"full","pattern":"Squat + Press","focus":"Quads, Shoulders, Core","guide":"Front squat into an overhead press. Explosive, high-output movement. Keep core braced and drive weight overhead in one fluid motion.","steps":["Clean two kettlebells to your shoulders. Clean the kettlebells to your shoulders by extending through the legs and hips as you pull the kettlebells towards your shoulders. Rotate your wrists as you do so. This will be your starting position.","Begin to squat by flexing your hips and knees, lowering your hips between your legs. Maintain an upright, straight back as you descend as low as you can.","At the bottom, reverse direction and squat by extending your knees and hips, driving through your heels. As you do so, press both kettlebells overhead by extending your arms straight up, using the momentum from the squat to help drive the weights upward.","As you begin the next repetition, return the weights to the shoulders."],"equipment":["Barbell","Dumbbell","Kettlebell"],"metric":"reps","level":"intermediate","src":"both"},{"id":"tibialis-raise","name":"Tibialis Raise","group":"Legs","primary":"Calves","secondary":[],"split":"legs","pattern":"Raise (Dorsiflexion)","focus":"Anterior Tibialis","guide":"Stand with heels down, lift toes off floor. Strengthens front of shin—great for ankle health.","steps":["Adjust the barbell on the smith machine to fit your height and align a raised platform right under the bar.","Stand on the platform with the heels of your feet secured on top of it with the balls of your feet extending off it. Position your toes facing forward with a shoulder width stance.","Now, place your shoulders under the barbell while maintaining the foot positioning described and push the barbell up by extending your hips and knees until your torso is standing erect. The knees should be kept with a slight bend; never locked. This will be your starting position. Tip: The barbell on your back is only for balance purposes.","Raise the balls of your feet as you breathe out by extending your toes as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position for a second before you start to go back down.","Slowly go back down to the starting position as you breathe in by lowering the balls of your feet and toes."],"equipment":["Bodyweight","Plate","Machine","Smith Machine"],"metric":"reps","level":"beginner","src":"both"},{"id":"tire-flip","name":"Tire Flip","group":"Full Body","primary":"Quads","secondary":["Calves","Mid Chest","Forearms","Glutes","Hamstrings"],"split":"full","pattern":"Other","focus":"Quads","guide":null,"steps":["Begin by gripping the bottom of the tire on the tread, and position your feet back a bit. Your chest should be driving into the tire.","To lift the tire, extend through the hips, knees, and ankles, driving into the tire and up.","As the tire reaches a 45 degree angle, step forward and drive a knee into the tire. As you do so adjust your grip to the upper portion of the tire and push it forward as hard as possible to complete the turn. Repeat as necessary."],"equipment":["Strongman"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"toes-to-bar","name":"Toes-to-Bar","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Leg Raise","focus":"Lower Abs","guide":"Hang from bar, raise legs all the way to touch bar. Engage entire core and keep swing minimal.","steps":["Hang from a chin-up bar with your legs and feet together using an overhand grip (palms facing away from you) that is slightly wider than shoulder width. Tip: You may use wrist wraps in order to facilitate holding on to the bar.","Now bend your knees at a 90 degree angle and bring the upper legs forward so that the calves are perpendicular to the floor while the thighs remain parallel to it. This will be your starting position.","Pull your legs up as you exhale until you almost touch your shins with the bar above you. Tip: Try to straighten your legs as much as possible while at the top.","Lower your legs as slowly as possible until you reach the starting position. Tip: Avoid swinging and using momentum at all times."],"equipment":["Bodyweight"],"metric":"reps","level":"expert","src":"both"},{"id":"towel-row","name":"Towel Row","group":"Back","primary":"Upper Back","secondary":[],"split":"pull","pattern":"Calisthenics","focus":"Full Back","guide":"Use towel over bar or rings. Row body toward anchor while keeping torso aligned. Builds grip and upper back.","steps":["Loop a towel over a bar or around rings and hold both ends. Walk the feet forward and lean back.","Pull the chest toward the towel, keeping the body in a straight line.","Lower under control to straight arms."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"towel-triceps-extension","name":"Towel Triceps Extension","group":"Arms","primary":"Triceps","secondary":[],"split":"push","pattern":"Extension","focus":"Triceps","guide":null,"steps":["To begin, stand up with both arms fully extended above the head holding one end of a towel with both hands. Your elbows should be in and the arms perpendicular to the floor with the palms facing each other while your feet should be shoulder width apart from each other. This is the starting position.","Now communicate with your partner so that he/she can grip the other side of the towel to apply resistance. Keeping your upper arms close to your head (elbows in) and perpendicular to the floor, lower the resistance in a semicircular motion behind your head until your forearms touch your biceps. Tip: The upper arms should remain stationary and only the forearms should move. Breathe in as you perform this step.","Go back to the starting position by using the triceps to raise the towel. Breathe out as you perform this step."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"trap-3-raise","name":"Trap-3 Raise","group":"Shoulders","primary":"Rear Delts","secondary":[],"split":"pull","pattern":"Raise","focus":"Rear Delts","guide":"Performed prone on incline. Raise arm at ~120° angle (thumbs up). Emphasizes mid-lower traps + rear delt coordination.","steps":["Lie face down on an incline bench with light dumbbells, arms hanging, thumbs up.","Raise the arms at about a 120° angle (a Y shape) until in line with the torso.","Lower slowly. Keep the neck relaxed."],"equipment":["Dumbbell","Cable"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"triceps-extension-machine","name":"Triceps Extension Machine","group":"Arms","primary":"Triceps","secondary":[],"split":"push","pattern":"Vertical Pull","focus":"Triceps","guide":null,"steps":["Adjust the seat to the appropriate height and make your weight selection. Place your upper arms against the pads and grasp the handles. This will be your starting position.","Perform the movement by extending the elbow, pulling your lower arm away from your upper arm.","Pause at the completion of the movement, and then slowly return the weight to the starting po
