ttlebell towards your shoulder. The wrist should rotate as you do so. This will be your starting position.","Begin my leaning to the side opposite the kettlebell, continuing until you are able to touch the ground with your free hand, keeping your eyes on the kettlebell. As you do so, press the weight vertically be extending through the elbow, keeping your arm perpendicular to the ground.","Return to an upright position, with the kettlebell above your head. Return the kettlebell to the shoulder and repeat for the desired number of repetitions."],"equipment":["Kettlebell"],"metric":"reps","level":"expert","src":"freedb"},{"id":"bent-over-rear-delt-raise","name":"Bent-Over Rear Delt Raise","group":"Shoulders","primary":"Rear Delts","secondary":["Lower Back","Upper Back","Traps"],"split":"pull","pattern":"Raise","focus":"Rear Delts","guide":null,"steps":["Place a couple of dumbbells looking forward in front of a flat bench.","Sit on the end of the bench with your legs together and the dumbbells behind your calves.","Bend at the waist while keeping the back straight in order to pick up the dumbbells. The palms of your hands should be facing each other as you pick them. This will be your starting position.","Keeping your torso forward and stationary, and the arms slightly bent at the elbows, lift the dumbbells straight to the side until both arms are parallel to the floor. Exhale as you lift the weights. (Note: avoid swinging the torso or bringing the arms back as opposed to the side.)","After a one second contraction at the top, slowly lower the dumbbells back to the starting position."],"equipment":["Dumbbell","Cable"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"bent-over-row","name":"Bent-Over Row","group":"Back","primary":"Upper Back","secondary":["Lats","Biceps","Rear Delts"],"split":"pull","pattern":"Horizontal Row","focus":"Mid Back","guide":"Hinge at hips, bar or handles close to torso. Pull to navel area while keeping elbows close. Keep back flat and core braced.","steps":["Holding a barbell with a pronated grip (palms facing down), bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The barbell should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.","Now, while keeping the torso stationary, breathe out and lift the barbell to you. Keep the elbows close to the body and only use the forearms to hold the weight. At the top contracted position, squeeze the back muscles and hold for a brief pause.","Then inhale and slowly lower the barbell back to the starting position."],"equipment":["Barbell","Dumbbell","Smith Machine","Kettlebell"],"metric":"reps","level":"beginner","src":"both"},{"id":"biceps-curl","name":"Biceps Curl","group":"Arms","primary":"Biceps","secondary":["Forearms"],"split":"pull","pattern":"Curl","focus":"Biceps","guide":"Elbows close to sides, curl through full ROM without swinging. Supinate the wrists early and contract biceps hard at the top.","steps":["Stand up with your torso upright while holding a barbell at a shoulder-width grip. The palm of your hands should be facing forward and the elbows should be close to the torso. This will be your starting position.","While holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Tip: Only the forearms should move.","Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.","Slowly begin to bring the bar back to starting position as your breathe in."],"equipment":["Dumbbell","Barbell","EZ Bar","Cable","Machine","Band"],"metric":"reps","level":"beginner","src":"both"},{"id":"bicycle-crunch","name":"Bicycle Crunch","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Crunch","focus":"Abs","guide":null,"steps":["Lie flat on the floor with your lower back pressed to the ground. For this exercise, you will need to put your hands beside your head. Be careful however to not strain with the neck as you perform it. Now lift your shoulders into the crunch position.","Bring knees up to where they are perpendicular to the floor, with your lower legs parallel to the floor. This will be your starting position.","Now simultaneously, slowly go through a cycle pedal motion kicking forward with the right leg and bringing in the knee of the left leg. Bring your right elbow close to your left knee by crunching to the side, as you breathe out.","Go back to the initial position as you breathe in.","Crunch to the opposite side as you cycle your legs and bring closer your left elbow to your right knee and exhale.","Continue alternating in this manner until all of the recommended repetitions for each side have been completed."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"bird-dog","name":"Bird Dog","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Stability","focus":"Transverse Abdominis","guide":"Start on all fours, extend opposite limbs while keeping hips level and core tight. Pause briefly at top for control.","steps":["Start on all fours, hands under the shoulders and knees under the hips, back flat.","Reach the right arm forward and the left leg back at the same time until both are in line with your torso.","Pause, return under control and switch sides. Keep the hips level and avoid rocking."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"ivan"},{"id":"board-press","name":"Board Press","group":"Arms","primary":"Triceps","secondary":["Mid Chest","Forearms","Lats","Front Delts"],"split":"push","pattern":"Press","focus":"Triceps","guide":null,"steps":["Begin by lying on the bench, getting your head beyond the bar if possible. One to five boards, made out of 2x6's, can be screwed together and held in place by a training partner, bands, or just tucked under your shirt.","Tuck your feet underneath you and arch your back. Using the bar to help support your weight, lift your shoulder off the bench and retract them, squeezing the shoulder blades together. Use your feet to drive your traps into the bench. Maintain this tight body position throughout the movement.","You can take a standard bench grip, or shoulder width to focus on the triceps. Pull the bar out of the rack without protracting your shoulders. The bar, wrist, and elbow should stay in line at all times. Focus on squeezing the bar and trying to pull it apart.","Lower the bar to the boards, and then drive the bar up with as much force as possible. The elbows should be tucked in until lockout."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"bodyweight-squat","name":"Bodyweight Squat","group":"Legs","primary":"Quads","secondary":[],"split":"legs","pattern":"Calisthenics","focus":"Full Legs","guide":"Stand shoulder-width, squat with upright posture. Ideal for warmups, rehab, or high-rep endurance work.","steps":["Stand with your feet shoulder width apart. You can place your hands behind your head. This will be your starting position.","Begin the movement by flexing your knees and hips, sitting back with your hips.","Continue down to full depth if you are able,and quickly reverse the motion until you return to the starting position. As you squat, keep your head and chest up and push your knees out."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"both"},{"id":"bodyweight-triceps-extension","name":"Bodyweight Triceps Extension","group":"Arms","primary":"Triceps","secondary":[],"split":"push","pattern":"Extension","focus":"Triceps","guide":null,"steps":["Position a bar in a rack at chest height.","Standing, take a shoulder width grip on the bar and step a yard or two back, feet together and arms extended so that you are leaning on the bar. This will be your starting position.","Begin by flexing the elbow, lowering yourself towards the bar.","Pause, and then reverse the motion by extending the elbows.","Progress from bodyweight by adding chains over your shoulders."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"bottoms-up-clean","name":"Bottoms-Up Clean","group":"Full Body","primary":"Forearms","secondary":["Biceps","Front Delts"],"split":"full","pattern":"Olympic","focus":"Forearms","guide":null,"steps":["Initiate the exercise by standing upright with a kettlebell in one hand.","Swing the kettlebell back forcefully and then reverse the motion forcefully. Crush the kettlebell handle as hard as possible and raise the kettlebell to your shoulder."],"equipment":["Kettlebell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"bottoms-up-press","name":"Bottoms-Up Press","group":"Shoulders","primary":"Front Delts","secondary":["Triceps","Side Delts"],"split":"push","pattern":"Press","focus":"Full Delts / Stability","guide":"KB held upside down forces stabilizer engagement. Demands control, balance, and strict form.","steps":["Clean a kettlebell to the rack position and hold it upside down, handle in your fist and the bell above your hand.","Squeeze the handle hard and press straight overhead, keeping the bell balanced.","Lower to the shoulder under control. If the bell tips, use a lighter weight."],"equipment":["Kettlebell"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"box-jump","name":"Box Jump","group":"Full Body","primary":"Quads","secondary":["Glutes","Abs"],"split":"full","pattern":"Jump","focus":"Quads, Glutes, Core","guide":"Jump onto stable box with soft knees and hips loaded. Land softly and step down under control. Great for power and coordination.","steps":["Begin with a box of an appropriate height 1-2 feet in front of you. Stand with your feet should width apart. This will be your starting position.","Perform a short squat in preparation for jumping, swinging your arms behind you.","Rebound out of this position, extending through the hips, knees, and ankles to jump as high as possible. Swing your arms forward and up.","Land on the box with the knees bent, absorbing the impact through the legs. You can jump from the box back to the ground, or preferably step down one leg at a time."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"both"},{"id":"box-shuffle","name":"Box Shuffle","group":"Legs","primary":"Quads","secondary":["Abductors","Adductors","Calves","Hamstrings"],"split":"legs","pattern":"Plyometric","focus":"Quads","guide":null,"steps":["Stand to one side of the box with your left foot resting on the middle of it.","To begin, jump up and over to the other side of the box, landing with your right foot on top of the box and your left foot on the floor. Swing your arms to aid your movement.","Continue shuffling back and forth across the box."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"box-skip","name":"Box Skip","group":"Legs","primary":"Hamstrings","secondary":["Abductors","Adductors","Calves","Glutes","Quads"],"split":"legs","pattern":"Plyometric","focus":"Hamstrings","guide":null,"steps":["You will need several boxes lined up about 8 feet apart.","Begin facing the first box with one leg slightly behind the other.","Drive off the back leg, attempting to gain as much height with the hips as possible.","Immediately upon landing on the box, drive the other leg forward and upward to gain height and distance, leaping from the box. Land between the first two boxes with the same leg that landed on the first box.","Then, step to the next box and repeat."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"box-squat","name":"Box Squat","group":"Legs","primary":"Quads","secondary":["Glutes"],"split":"legs","pattern":"Squat","focus":"Full Legs","guide":"Sit back onto box with control, then drive up explosively. Encourages hip engagement and teaches squat depth.","steps":["The box squat allows you to squat to desired depth and develop explosive strength in the squat movement. Begin in a power rack with a box at the appropriate height behind you. Typically, you would aim for a box height that brings you to a parallel squat, but you can train higher or lower if desired.","Begin by stepping under the bar and placing it across the back of the shoulders. Squeeze your shoulder blades together and rotate your elbows forward, attempting to bend the bar across your shoulders. Remove the bar from the rack, creating a tight arch in your lower back, and step back into position. Place your feet wider for more emphasis on the back, glutes, adductors, and hamstrings, or closer together for more quad development. Keep your head facing forward.","With your back, shoulders, and core tight, push your knees and butt out and you begin your descent. Sit back with your hips until you are seated on the box. Ideally, your shins should be perpendicular to the ground. Pause when you reach the box, and relax the hip flexors. Never bounce off of a box.","Keeping the weight on your heels and pushing your feet and knees out, drive upward off of the box as you lead the movement with your head. Continue upward, maintaining tightness head to toe."],"equipment":["Barbell","Smith Machine","Band","Dumbbell"],"metric":"reps","level":"intermediate","src":"both"},{"id":"broad-jump","name":"Broad Jump","group":"Legs","primary":"Quads","secondary":["Calves","Glutes","Hamstrings"],"split":"legs","pattern":"Plyometric","focus":"Quads","guide":null,"steps":["This drill is best done in sand or other soft landing surface. Ensure that you are able to measure distance. Stand in a partial squat stance with feet shoulder width apart.","Utilizing a big arm swing and a countermovement of the legs, jump forward as far as you can.","Attempt to land with your feet out in front you, reaching as far as possible with your legs.","Measure the distance from your landing point to the starting point and track results."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"bulgarian-rdl","name":"Bulgarian RDL","group":"Legs","primary":"Hamstrings","secondary":["Glutes","Lower Back"],"split":"legs","pattern":"Hinge","focus":"Hamstrings/Glutes","guide":"Rear foot elevated RDL. Great for hamstring stretch and glute loading while minimizing low-back strain.","steps":["Place the top of the rear foot on a bench behind you and hold dumbbells at your sides.","Hinge at the hip on the front leg, pushing the hips back with a flat back until the hamstring stretches.","Drive the hips forward to stand. Finish the reps, then swap legs."],"equipment":["Dumbbell","Barbell"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"bulgarian-split-squat","name":"Bulgarian Split Squat","group":"Legs","primary":"Quads","secondary":["Glutes"],"split":"legs","pattern":"Lunge","focus":"Quads","guide":"Rear foot elevated. Drop hips straight down and keep front knee over ankle. Quad-dominant when staying upright.","steps":["Suspend your straps so the handles are 18-30 inches from the floor.","Facing away from the setup, place your rear foot into the handle behind you. Keep your head looking forward and your chest up, with your knee slightly bent. This will be your starting position.","Descend by flexing the knee and hips, lowering yourself to the ground. Keep your weight on the heel of your foot and maintain your posture throughout the exercise.","At the bottom of the movement, reverse the motion, extending through the hip and knee to return to the starting position."],"equipment":["Dumbbell","Barbell","Smith Machine","Bodyweight","Suspension"],"metric":"reps","level":"intermediate","src":"both"},{"id":"burpee","name":"Burpee","group":"Cardio","primary":null,"secondary":[],"split":"cardio","pattern":"Calisthenics / Circuit","focus":"Full Body","guide":"Perform burpees for time or reps with rest between rounds. High heart rate and metabolic demand.","steps":["From standing, drop your hands to the floor and jump or step the feet back to a plank.","Lower the chest to the floor (optional), push up, and jump the feet back under your hips.","Explode up into a jump with the arms overhead. Land softly and repeat."],"equipment":["Bodyweight"],"metric":"duration","level":"beginner","src":"ivan"},{"id":"burpee-pull-up","name":"Burpee Pull-Up","group":"Full Body","primary":"Upper Back","secondary":["Biceps","Abs"],"split":"full","pattern":"Calisthenics","focus":"Back, Arms, Core","guide":"Perform burpee, then immediately jump into pull-up. Combination of strength and metabolic conditioning.","steps":["Stand under a pull-up bar. Do a burpee: hands down, feet back, chest to floor, push up, feet in.","Jump up, grab the bar and do a strict or kipping pull-up so the chin clears the bar.","Drop to the floor and go straight into the next burpee."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"expert","src":"ivan"},{"id":"bus-drivers","name":"Bus Driver","group":"Shoulders","primary":"Side Delts","secondary":[],"split":"push","pattern":"Raise / Isometric","focus":"Front / Side Delts","guide":"Hold a plate straight out in front and rotate side to side like turning a wheel. Great for delts, rotator control, and endurance.","steps":["While standing upright, hold a barbell plate in both hands at the 3 and 9 o'clock positions. Your palms should be facing each other and your arms should be extended straight out in front of you. This will be your starting position.","Initiate the movement by rotating the plate as far to one side as possible. Use the same type of movement you would use to turn a steering wheel to one side.","Reverse the motion, turning it all the way to the opposite side."],"equipment":["Plate","Barbell"],"metric":"time","level":"beginner","src":"both"},{"id":"butt-kick-jump","name":"Butt Kick Jump","group":"Legs","primary":"Quads","secondary":["Abductors","Adductors","Calves","Glutes","Hamstrings"],"split":"legs","pattern":"Plyometric","focus":"Quads","guide":null,"steps":["Begin standing with your knees slightly bent.","Quickly squat a short distance, flexing the hips and knees, and immediately extend to jump for maximum vertical height.","As you go up, tuck your heels by flexing the knees, attempting to touch the buttocks.","Finish the motion by landing with the knees only partially bent, using your legs to absorb the impact."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"cable-chest-press","name":"Cable Chest Press","group":"Chest","primary":"Mid Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Press","focus":"Mid Chest","guide":null,"steps":["Adjust the weight to an appropriate amount and be seated, grasping the handles. Your upper arms should be about 45 degrees to the body, with your head and chest up. The elbows should be bent to about 90 degrees. This will be your starting position.","Begin by extending through the elbow, pressing the handles together straight in front of you. Keep your shoulder blades retracted as you execute the movement.","After pausing at full extension, return to th starting position, keeping tension on the cables.","You can also execute this movement with your back off the pad, at an incline or decline, or alternate hands."],"equipment":["Cable"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"cable-crossover","name":"Cable Crossover","group":"Chest","primary":"Mid Chest","secondary":["Front Delts","Biceps"],"split":"push","pattern":"Fly","focus":"Mid Chest","guide":null,"steps":["To get yourself into the starting position, place the pulleys on a high position (above your head), select the resistance to be used and hold the pulleys in each hand.","Step forward in front of an imaginary straight line between both pulleys while pulling your arms together in front of you. Your torso should have a small forward bend from the waist. This will be your starting position.","With a slight bend on your elbows in order to prevent stress at the biceps tendon, extend your arms to the side (straight out at both sides) in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms and torso should remain stationary; the movement should only occur at the shoulder joint.","Return your arms back to the starting position as you breathe out. Make sure to use the same arc of motion used to lower the weights.","Hold for a second at the starting position and repeat the movement for the prescribed amount of repetitions."],"equipment":["Cable","Band"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"cable-crossover-iso-hold","name":"Cable Crossover Iso Hold","group":"Chest","primary":"Mid Chest","secondary":[],"split":"push","pattern":"Isometric","focus":"Full Chest","guide":"At peak of cable crossover, hold the position with max contraction for 10–20 sec. Great for MMC and fiber recruitment.","steps":["Set both pulleys high, take a handle in each hand and step forward into a split stance with a slight forward lean.","Bring the handles together in front of your lower chest and squeeze the chest hard.","Hold the peak contraction for 10–20 seconds without letting the arms drift apart or the shoulders roll forward."],"equipment":["Cable"],"metric":"time","level":"intermediate","src":"ivan"},{"id":"cable-crunch","name":"Cable Crunch","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Crunch","focus":"Upper Abs","guide":"Kneel facing cable, hold rope behind head, and crunch down using abs. Keep hips stationary and control return.","steps":["Kneel 1-2 feet in front of a cable system with a rope attached.","After selecting an appropriate weight, grasp the rope with both hands reaching overhead. Your torso should be upright in the starting position.","To begin, flex at the spine, attempting to bring your rib cage to your legs as you pull the cable down.","Pause at the bottom of the motion, and then slowly return to the starting position.","These can be done with twists or to the side to hit the obliques."],"equipment":["Cable"],"metric":"reps","level":"beginner","src":"both"},{"id":"cable-iron-cross","name":"Cable Iron Cross","group":"Chest","primary":"Mid Chest","secondary":[],"split":"push","pattern":"Fly","focus":"Mid Chest","guide":null,"steps":["Begin by moving the pulleys to the high position, select the resistance to be used, and take a handle in each hand.","Stand directly between both pulleys with your arms extended out to your sides. Your head and chest should be up while your arms form a \"T\". This will be your starting position.","Keeping the elbows extended, pull your arms straight to your sides.","Return your arms back to the starting position after a pause at the peak contraction.","Continue the movement for the prescribed number of repetitions."],"equipment":["Cable"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"cable-judo-flip","name":"Cable Judo Flip","group":"Core","primary":"Obliques","secondary":[],"split":"core","pattern":"Rotation","focus":"Obliques","guide":null,"steps":["Connect a rope attachment to a tower, and move the cable to the lowest pulley position. Stand with your side to the cable with a wide stance, and grab the rope with both hands.","Twist your body away from the pulley as you bring the rope over your shoulder like you're performing a judo flip.","Shift your weight between your feet as you twist and crunch forward, pulling the cable downward.","Return to the starting position and repeat until failure.","Then, reposition and repeat the same series of movements on the opposite side."],"equipment":["Cable"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"cable-lift","name":"Cable Lift","group":"Core","primary":"Abs","secondary":["Front Delts"],"split":"core","pattern":"Rotation","focus":"Abs","guide":null,"steps":["Connect a standard handle on a tower, and move the cable to the lowest pulley position.","With your side to the cable, grab the handle with one hand and step away from the tower. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable. Your outstretched arm should be aligned with the cable.","With your feet positioned shoulder width apart, squat down and grab the handle with both hands. Your arms should still be fully extended.","In one motion, pull the handle up and across your body until your arms are in a fully-extended position above your head.","Keep your back straight and your arms close to your body as you pivot your back foot and straighten your legs to get a full range of motion.","Retract your arms and then your body. Return to the neutral position in a slow and controlled manner.","Repeat to failure.","Then, reposition and repeat the same series of movements on the opposite side."],"equipment":["Cable"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"cable-oblique-crunch","name":"Cable Oblique Crunch","group":"Core","primary":"Obliques","secondary":[],"split":"core","pattern":"Crunch","focus":"Obliques","guide":null,"steps":["Connect a standard handle to each arm of a cable machine, and position them in the most downward position.","Grab a Bosu Ball and position it in front and center of the cable machine.","Lie down on the Bosu Ball with the small of your back arched around the ball. Your rear end should be close to the floor without touching it.","With both hands, reach back and grab the handle of each cable.","With your feet positioned in a wide stance, extend your arms straight out in front of you and in between your knees. Your hands should be at knee level.","Keep your arms straight and in-line with the upward angle of the cable. Elevate your torso in a crunching motion without dropping or bending your arms.","Maintain the rigid position with your arms. Slowly descend back to the starting position with your back arched around the Bosu Ball and your abdominals elongated.","Repeat the same series of movements to failure.","Once you reach failure, keep your abs tight and raise your torso into plank position so your back is elevated off the Bosu Ball.","Lower your arms down to your side; keep them straight. Start doing alternating side bends; reach for your heels! This finishing movement will focus on your obliques."],"equipment":["Cable"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"cable-pull-through","name":"Cable Pull-Through","group":"Legs","primary":"Glutes","secondary":["Hamstrings"],"split":"legs","pattern":"Hinge","focus":"Glutes","guide":"Emphasizes hip extension with glute focus. Keep spine neutral and push hips back deep.","steps":["Begin standing a few feet in front of a low pulley with a rope or handle attached. Face away from the machine, straddling the cable, with your feet set wide apart.","Begin the movement by reaching through your legs as far as possible, bending at the hips. Keep your knees slightly bent. Keeping your arms straight, extend through the hip to stand straight up. Avoid pulling upward through the shoulders; all of the motion should originate through the hips."],"equipment":["Cable","Band"],"metric":"reps","level":"beginner","src":"both"},{"id":"cable-step-up","name":"Cable Step-Up","group":"Legs","primary":"Quads","secondary":["Glutes"],"split":"legs","pattern":"Lunge","focus":"Quads/Glutes","guide":"Cable tension increases glute activation at peak. Use slow, controlled reps.","steps":["Stand facing a low box with a cable attached at hip height behind you (or hold a handle at your side).","Step up with one foot and drive through that heel until the leg is straight and the other knee is up.","Lower slowly with the same leg working. Finish the reps, then switch."],"equipment":["Cable"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"cable-woodchopper","name":"Cable Woodchopper","group":"Core","primary":"Obliques","secondary":[],"split":"core","pattern":"Rotation","focus":"Obliques","guide":"Pull cable across body in a diagonal path. Rotate through torso and hips, not arms. Great for rotational strength.","steps":["Connect a standard handle to a tower, and move the cable to the highest pulley position.","With your side to the cable, grab the handle with one hand and step away from the tower. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable. Your outstretched arm should be aligned with the cable.","With your feet positioned shoulder width apart, reach upward with your other hand and grab the handle with both hands. Your arms should still be fully extended.","In one motion, pull the handle down and across your body to your front knee while rotating your torso.","Keep your back and arms straight and core tight while you pivot your back foot and bend your knees to get a full range of motion.","Maintain your stance and straight arms. Return to the neutral position in a slow and controlled manner.","Repeat to failure.","Then, reposition and repeat the same series of movements on the opposite side."],"equipment":["Cable"],"metric":"reps","level":"beginner","src":"both"},{"id":"cable-y-raise","name":"Cable Y Raise","group":"Back","primary":"Traps","secondary":[],"split":"pull","pattern":"Isolation","focus":"Lower Traps","guide":"Use light weight, pull cable into a “Y” shape from low pulley. Builds lower trap stability and scapular control.","steps":["Set a low pulley and hold a handle in each hand, crossing the cables if you like.","Pull the cables up and out in a Y shape, thumbs up, until the arms are in line with the ears.","Lower slowly. Keep the ribs down and the neck relaxed."],"equipment":["Cable"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"calf-press","name":"Calf Press","group":"Legs","primary":"Calves","secondary":[],"split":"legs","pattern":"Raise","focus":"Calves (Both)","guide":"On leg press, push through toes with knees locked or slightly bent. Control both directions.","steps":["Adjust the seat so that your legs are only slightly bent in the start position. The balls of your feet should be firmly on the platform.","Select an appropriate weight, and grasp the handles. This will be your starting position.","Straighten the legs by extending the knees, just barely lifting the weight from the stack. Your ankle should be fully flexed, toes pointing up. Execute the movement by pressing downward through the balls of your feet as far as possible.","After a brief pause, reverse the motion and repeat."],"equipment":["Machine"],"metric":"reps","level":"beginner","src":"both"},{"id":"captain-s-chair-knee-raise","name":"Captain's Chair Knee Raise","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Raise","focus":"Abs","guide":null,"steps":["Position your body on the vertical leg raise bench so that your forearms are resting on the pads next to the torso and holding on to the handles. Your arms will be bent at a 90 degree angle.","The torso should be straight with the lower back pressed against the pad of the machine and the legs extended pointing towards the floor. This will be your starting position.","Now as you breathe out, lift your legs up as you keep them extended. Continue this movement until your legs are roughly parallel to the floor and then hold the contraction for a second. Tip: Do not use any momentum or swinging as you perform this exercise.","Slowly go back to the starting position as you breathe in."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"car-deadlift","name":"Car Deadlift","group":"Full Body","primary":"Quads","secondary":["Forearms","Glutes","Hamstrings","Lower Back","Traps"],"split":"full","pattern":"Hinge","focus":"Quads","guide":null,"steps":["This event apparatus typically has neutral grip handles, however some have a straight bar that you can approach like a normal deadlift. The apparatus can be loaded with a vehicle or other heavy objects such as tractor tires or kegs.","Center yourself between the handles if you are a strong squatter, or back a couple inches if you are a strong deadlifter. You feet should be about hip width apart. Bend at the hip to grip the handles. With your feet and your grip set, take a big breath and then lower your hips and flex the knees.","Look forward with your head, keep your chest up and your back arched, and begin driving through the heels to move the weight upward. As the weight comes up, pull your shoulder blades together as you drive your hips forward.","Lower the weight by bending at the hips and guiding it to the floor."],"equipment":["Strongman"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"chaos-push-up","name":"Chaos Push-Up","group":"Chest","primary":"Mid Chest","secondary":[],"split":"push","pattern":"Calisthenics","focus":"Full Chest","guide":"Performed with hands on suspended rings or bands. Demands extreme stability and lights up chest, core, and stabilizers.","steps":["Set up in a push-up position with the hands on rings, a suspension trainer or a band that can move.","Lower the chest between the hands while keeping the body in one straight line.","Press up and resist the handles wobbling. Use a regular push-up first if you cannot hold the shape."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"expert","src":"ivan"},{"id":"chest-dip","name":"Chest Dip","group":"Chest","primary":"Mid Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Press","focus":"Mid Chest","guide":null,"steps":["For this exercise you will need access to parallel bars. To get yourself into the starting position, hold your body at arms length (arms locked) above the bars.","While breathing in, lower yourself slowly with your torso leaning forward around 30 degrees or so and your elbows flared out slightly until you feel a slight stretch in the chest.","Once you feel the stretch, use your chest to bring your body back to the starting position as you breathe out. Tip: Remember to squeeze the chest at the top of the movement for a second."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"chest-fly","name":"Chest Fly","group":"Chest","primary":"Mid Chest","secondary":["Front Delts"],"split":"push","pattern":"Fly","focus":"Mid Chest","guide":"Lower arms in wide arc on flat surface. Keep soft elbows and emphasize pec stretch and contraction.","steps":["Lie down on a flat bench with a dumbbell on each hand resting on top of your thighs. The palms of your hand will be facing each other.","Then using your thighs to help raise the dumbbells, lift the dumbbells one at a time so you can hold them in front of you at shoulder width with the palms of your hands facing each other. Raise the dumbbells up like you're pressing them, but stop and hold just before you lock out. This will be your starting position.","With a slight bend on your elbows in order to prevent stress at the biceps tendon, lower your arms out at both sides in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms should remain stationary; the movement should only occur at the shoulder joint.","Return your arms back to the starting position as you squeeze your chest muscles and breathe out. Tip: Make sure to use the same arc of motion used to lower the weights.","Hold for a second at the contracted position and repeat the movement for the prescribed amount of repetitions."],"equipment":["Machine","Cable","Dumbbell"],"metric":"reps","level":"beginner","src":"both"},{"id":"pullover-chest-focused","name":"Chest Pullover","group":"Back","primary":"Lats","secondary":["Mid Chest","Triceps"],"split":"pull","pattern":"Pullover","focus":"Full Chest","guide":"Lower arms in arc from above head to over chest. Focus on deep stretch and pec contraction. Avoid letting lats take over.","steps":["Lie on a flat bench with a barbell using a shoulder grip width.","Hold the bar straight over your chest with a bend in your arms. This will be your starting position.","While keeping your arms in the bent arm position, lower the weight slowly in an arc behind your head while breathing in until you feel a stretch on the chest.","At that point, bring the barbell back to the starting position using the arc through which the weight was lowered and exhale as you perform this movement.","Hold the weight on the initial position for a second and repeat the motion for the prescribed number of repetitions."],"equipment":["Dumbbell","Cable","Machine","Barbell"],"metric":"reps","level":"intermediate","src":"both"},{"id":"chest-supported-row","name":"Chest-Supported Row","group":"Back","primary":"Upper Back","secondary":["Lats","Biceps","Rear Delts"],"split":"pull","pattern":"Horizontal Row","focus":"Mid Back","guide":"Performed on incline bench. Pull elbows back and squeeze shoulder blades. Reduces compensation from lower body.","steps":["Using a neutral grip, lean into an incline bench.","Take a dumbbell in each hand with a neutral grip, beginning with the arms straight. This will be your starting position.","Retract the shoulder blades and flex the elbows to row the dumbbells to your side.","Pause at the top of the motion, and then return to the starting position."],"equipment":["Machine","Dumbbell","T-Bar"],"metric":"reps","level":"beginner","src":"both"},{"id":"chin-up","name":"Chin-Up","group":"Back","primary":"Lats","secondary":["Biceps","Upper Back"],"split":"pull","pattern":"Vertical Pull","focus":"Lats","guide":"Supinated grip. Emphasizes lower lats and biceps. Pull sternum to bar and control descent.","steps":["Grab the pull-up bar with the palms facing your torso and a grip closer than the shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, keep your torso as straight as possible while creating a curvature on your lower back and sticking your chest out. This is your starting position. Tip: Keeping the torso as straight as possible maximizes biceps stimulation while minimizing back involvement.","As you breathe out, pull your torso up until your head is around the level of the pull-up bar. Concentrate on using the biceps muscles in order to perform the movement. Keep the elbows close to your body. Tip: The upper torso should remain stationary as it moves through space and only the arms should move. The forearms should do no other work other than hold the bar.","After a second of squeezing the biceps in the contracted position, slowly lower your torso back to the starting position; when your arms are fully extended. Breathe in as you perform this portion of the movement."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"beginner","src":"both"},{"id":"circus-dumbbell-press","name":"Circus Dumbbell Press","group":"Full Body","primary":"Front Delts","secondary":["Forearms","Glutes","Hamstrings","Lower Back","Traps"],"split":"full","pattern":"Overhead Press","focus":"Front Delts","guide":null,"steps":["The circus bell is an oversized dumbbell with a thick handle. Begin with the dumbbell between your feet, and grip the handle with both hands.","Clean the dumbbell by extending through your hips and knees to deliver the implement to the desired shoulder, letting go with the extra hand.","Ensure that you get one of the dumbbell heads behind the shoulder to keep from being thrown off balance. To raise it overhead, dip by flexing the knees, and the drive upwards as you extend the dumbbell overhead, leaning slightly away from it as you do so.","Carefully guide the bell back to the floor, keeping it under control as much as possible. It is best to perform this event on a thick rubber mat to prevent damage to the floor."],"equipment":["Strongman"],"metric":"reps","level":"expert","src":"freedb"},{"id":"clean","name":"Clean","group":"Full Body","primary":"Hamstrings","secondary":[],"split":"full","pattern":"Combo","focus":"Posterior Chain","guide":"Pull from floor and catch in front rack. Strong hip drive and upright posture are essential. Great for power and speed development.","steps":["With a barbell on the floor close to the shins, take an overhand (or hook) grip just outside the legs. Lower your hips with the weight focused on the heels, back straight, head facing forward, chest up, with your shoulders just in front of the bar. This will be your starting position.","Begin the first pull by driving through the heels, extending your knees. Your back angle should stay the same, and your arms should remain straight. Move the weight with control as you continue to above the knees.","Next comes the second pull, the main source of acceleration for the clean. As the bar approaches the mid-thigh position, begin extending through the hips. In a jumping motion, accelerate by extending the hips, knees, and ankles, using speed to move the bar upward. There should be no need to actively pull through the arms to accelerate the weight; at the end of the second pull, the body should be fully extended, leaning slightly back, with the arms still extended.","As full extension is achieved, transition into the third pull by aggressively shrugging and flexing the arms with the elbows up and out. At peak extension, aggressively pull yourself down, rotating your elbows under the bar as you do so. Receive the bar in a front squat position, the depth of which is dependent upon the height of the bar at the end of the third pull. The bar should be racked onto the protracted shoulders, lightly touching the throat with the hands relaxed. Continue to descend to the bottom squat position, which will help in the recovery.","Immediately recover by driving through the heels, keeping the torso upright and elbows up. Continue until you have risen to a standing position."],"equipment":["Barbell","Dumbbell","Kettlebell"],"metric":"reps","level":"intermediate","src":"both"},{"id":"clean-and-jerk","name":"Clean and Jerk","group":"Full Body","primary":"Front Delts","secondary":["Abs","Glutes","Hamstrings","Lower Back","Quads"],"split":"full","pattern":"Overhead Press","focus":"Front Delts","guide":null,"steps":["With a barbell on the floor close to the shins, take an overhand or hook grip just outside the legs. Lower your hips with the weight focused on the heels, back straight, head facing forward, chest up, with your shoulders just in front of the bar. This will be your starting position.","Begin the first pull by driving through the heels, extending your knees. Your back angle should stay the same, and your arms should remain straight. Move the weight with control as you continue to above the knees.","Next comes the second pull, the main source of acceleration for the clean. As the bar approaches the mid-thigh position, begin extending through the hips. In a jumping motion, accelerate by extending the hips, knees, and ankles, using speed to move the bar upward. There should be no need to actively pull through the arms to accelerate the weight; at the end of the second pull, the body should be fully extended, leaning slightly back, with the arms still extended.","As full extension is achieved, transition into the third pull by aggressively shrugging and flexing the arms with the elbows up and out. At peak extension, aggressively pull yourself down, rotating your elbows under the bar as you do so. Receive the bar in a front squat position, the depth of which is dependent upon the height of the bar at the end of the third pull. The bar should be racked onto the protracted shoulders, lightly touching the throat with the hands relaxed. Continue to descend to the bottom squat position, which will help in the recovery.","Immediately recover by driving through the heels, keeping the torso upright and elbows up. Continue until you have risen to a standing position.","The second phase is the jerk, which raises the weight overhead. Standing with the weight racked on the front of the shoulders, begin with the dip. With your feet directly under your hips, flex the knees without moving the hips backward. Go down only slightly, and reverse direction as powerfully as possible.","Drive through the heels create as much speed and force as possible, and be sure to move your head out of the way as the bar leaves the shoulders.","At this moment as the feet leave the floor, the feet must be placed into the receiving position as quickly as possible. In the brief moment the feet are not actively driving against the platform, the athletes effort to push the bar up will drive them down. The feet should be split, with one foot forward, and one foot back. Receive the bar with the arms locked out overhead. Return to a standing position."],"equipment":["Barbell","Kettlebell"],"metric":"reps","level":"expert","src":"freedb"},{"id":"clean-and-press","name":"Clean and Press","group":"Full Body","primary":"Hamstrings","secondary":["Front Delts"],"split":"full","pattern":"Pull + Press","focus":"Posterior Chain + Shoulders","guide":"Pull weight from floor, catch at shoulders, then press overhead. Explosive and complex — maintain tight form throughout.","steps":["Assume a shoulder-width stance, with knees inside the arms. Now while keeping the back flat, bend at the knees and hips so that you can grab the bar with the arms fully extended and a pronated grip that is slightly wider than shoulder width. Point the elbows out to sides. The bar should be close to the shins. Position the shoulders over or slightly ahead of the bar. Establish a flat back posture. This will be your starting position.","Begin to pull the bar by extending the knees. Move your hips forward and raise the shoulders at the same rate while keeping the angle of the back constant; continue to lift the bar straight up while keeping it close to your body.","As the bar passes the knee, extend at the ankles, knees, and hips forcefully, similar to a jumping motion. As you do so, continue to guide the bar with your hands, shrugging your shoulders and using the momentum from your movement to pull the bar as high as possible. The bar should travel close to your body, and you should keep your elbows out.","At maximum elevation, your feet should clear the floor and you should start to pull yourself under the bar. The mechanics of this could change slightly, depending on the weight used. You should descend into a squatting position as you pull yourself under the bar.","As the bar hits terminal height, rotate your elbows around and under the bar. Rack the bar across the front of the shoulders while keeping the torso erect and flexing the hips and knees to absorb the weight of the bar.","Stand to full height, holding the bar in the clean position.","Without moving your feet, press the bar overhead as you exhale. Lower the bar under control ."],"equipment":["Barbell","Dumbbell","Kettlebell"],"metric":"reps","level":"intermediate","src":"both"},{"id":"clean-deadlift","name":"Clean Deadlift","group":"Legs","primary":"Hamstrings","secondary":["Forearms","Glutes","Lower Back","Upper Back","Quads"],"split":"legs","pattern":"Olympic","focus":"Hamstrings","guide":null,"steps":["Begin standing with a barbell close to your shins. Your feet should be directly under your hips with your feet turned out slightly. Grip the bar with a double overhand grip or hook grip, about shoulder width apart. Squat down to the bar. Your spine should be in full extension, with a back angle that places your shoulders in front of the bar and your back as vertical as possible.","Begin by driving through the floor through the front of your heels. As the bar travels upward, maintain a constant back angle. Flare your knees out to the side to help keep them out of the bar's path.","After the bar crosses the knees, complete the lift by driving the hips into the bar until your hips and knees are extended."],"equipment":["Barbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"clean-pull","name":"Clean Pull","group":"Legs","primary":"Quads","secondary":["Forearms","Glutes","Hamstrings","Lower Back","Traps"],"split":"legs","pattern":"Olympic","focus":"Quads","guide":null,"steps":["With a barbell on the floor close to the shins, take an overhand or hook grip just outside the legs. Lower your hips with the weight focused on the heels, back straight, head facing forward, chest up, with your shoulders just in front of the bar. This will be your starting position.","Begin the first pull by driving through the heels, extending your knees. Your back angle should stay the same, and your arms should remain straight and elbows out. Move the weight with control as you continue to above the knees.","Next comes the second pull, the main source of acceleration for the clean. As the bar approaches the mid-thigh position, begin extending through the hips. In a jumping motion, accelerate by extending the hips, knees, and ankles, using speed to move the bar upward. There should be no need to actively pull through the arms to accelerate the weight; at the end of the second pull, the body should be fully extended, leaning slightly back, with the arms still extended. Full extension should be violent and abrupt, and ensure that you do not prolong the extension for longer than necessary."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"clean-shrug","name":"Clean Shrug","group":"Back","primary":"Traps","secondary":["Forearms","Front Delts"],"split":"pull","pattern":"Shrug","focus":"Traps","guide":null,"steps":["Begin with a shoulder width, double overhand or hook grip, with the bar hanging at the mid thigh position. Your back should be straight and inclined slightly forward.","Shrug your shoulders towards your ears. While this exercise can usually by loaded with heavier weight than a clean, avoid overloading to the point that the execution slows down."],"equipment":["Barbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"clock-push-up","name":"Clock Push-Up","group":"Chest","primary":"Mid Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Press","focus":"Mid Chest","guide":null,"steps":["Move into a prone position on the floor, supporting your weight on your hands and toes.","Your arms should be fully extended with the hands around shoulder width. Keep your body straight throughout the movement. This will be your starting position.","Descend by flexing at the elbow, lowering your chest toward the ground.","At the bottom, reverse the motion by pushing yourself up through elbow extension as quickly as possible until you are air borne. Aim to \"jump\" 12-18 inches to one side.","As you accelerate up, move your outside foot away from your direction of travel. Leaving the ground, shift your body about 30 degrees for the next repetition.","Return to the starting position and repeat the exercise, working all the way around until you are back where you started."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"close-grip-press","name":"Close-Grip Bench Press","group":"Arms","primary":"Triceps","secondary":["Mid Chest","Front Delts"],"split":"push","pattern":"Press","focus":"Triceps","guide":"Hands shoulder-width apart, elbows tucked. Press through triceps while minimizing chest and front delt involvement.","steps":["Lie back on a flat bench. Using a close grip (around shoulder width), lift the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on your middle chest. Tip: Make sure that - as opposed to a regular bench press - you keep the elbows close to the torso at all times in order to maximize triceps involvement.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your triceps muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."],"equipment":["Barbell","Smith Machine","Dumbbell","EZ Bar"],"metric":"reps","level":"beginner","src":"both"},{"id":"close-grip-curl","name":"Close-Grip Curl","group":"Arms","primary":"Biceps","secondary":["Forearms"],"split":"pull","pattern":"Curl","focus":"Biceps","guide":null,"steps":["Hold a barbell with both hands, palms up and a few inches apart.","Stand with your torso straight and your head up. Your feet should be about shoulder width and your elbows close to your torso. This will be your starting position. Tip: You will keep your upper arms and elbows stationary throughout the movement.","Curl the bar up in a semicircular motion until the forearms touch your biceps. Exhale as you perform this portion of the movement and contract your biceps hard for a second at the top. Tip: Avoid bending the back or using swinging motions as you lift the weight. Only the forearms should move.","Slowly go back down to the starting position as you inhale."],"equipment":["EZ Bar","Band","Barbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"close-grip-lat-pulldown","name":"Close-Grip Lat Pulldown","group":"Back","primary":"Lats","secondary":["Biceps","Upper Back","Front Delts"],"split":"pull","pattern":"Vertical Pull","focus":"Lats","guide":null,"steps":["Sit down on a pull-down machine with a V-Bar attached to the top pulley.","Adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the V-bar with the palms facing each other (a neutral grip). Stick your chest out and lean yourself back slightly (around 30-degrees) in order to better engage the lats. This will be your starting position.","Using your lats, pull the bar down as you squeeze your shoulder blades. Continue until your chest nearly touches the V-bar. Exhale as you execute this motion. Tip: Keep the torso stationary throughout the movement.","After a second hold on the contracted position, slowly bring the bar back to the starting position as you breathe in."],"equipment":["Cable"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"close-grip-push-up","name":"Close-Grip Push-Up","group":"Chest","primary":"Mid Chest","secondary":[],"split":"push","pattern":"Calisthenics","focus":"Full Chest","guide":"Hands under shoulders or narrower. Focuses more on inner chest and triceps.","steps":["Stand facing a Smith machine bar or sturdy elevated platform at an appropriate height.","Place your hands next to one another on the bar.","Position your feet back from the bar with arms and body straight. This will be your starting position.","Keeping your body straight, lower your chest to the bar by bending the arms.","Return to the starting position by extending the elbows, pressing yourself back up."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"beginner","src":"both"},{"id":"conan-s-wheel","name":"Conan's Wheel","group":"Full Body","primary":"Quads","secondary":["Abs","Biceps","Calves","Forearms","Lower Back"],"split":"full","pattern":"Other","focus":"Quads","guide":null,"steps":["With the weight loaded, take a zurcher hold on the end of the implement. Place the bar in the crook of the elbow and hold onto your wrist. Try to keep the weight off of the forearms.","Begin by lifting the weight from the ground. Keep a tight, upright posture as you being to walk, taking short, fast steps. Look up and away as you turn in a circle. Do not hold your breath during the event. Continue walking until you complete one or more complete turns."],"equipment":["Strongman"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"concentration-curl","name":"Concentration Curl","group":"Arms","primary":"Biceps","secondary":["Forearms"],"split":"pull","pattern":"Curl","focus":"Biceps","guide":"Seated with elbow braced against inner thigh. Strict form isolates biceps peak. Squeeze hard at top.","steps":["Sit down on a flat bench with a barbell or E-Z Bar in front of you in between your legs. Your legs should be spread with the knees bent and the feet on the floor.","Use your arms to pick the barbell up and place the back of your upper arms on top of your inner thighs (around three and a half inches away from the front of the knee). A supinated grip closer than shoulder width is needed to perform this exercise. Tip: Your arm should be extended at arms length and the barbell should be above the floor. This will be your starting position.","While holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the biceps.","Slowly begin to bring the barbell back to starting position as your breathe in. Tip: Avoid swinging motions at any time."],"equipment":["Dumbbell","Cable","Barbell"],"metric":"reps","level":"intermediate","src":"both"},{"id":"copenhagen-plank","name":"Copenhagen Plank","group":"Legs","primary":"Adductors","secondary":[],"split":"legs","pattern":"Isometric","focus":"Adductors","guide":"Side plank with inner thigh on bench. Active adductor contraction—brutal for groin stability.","steps":["Lie on your side with the top leg on a bench (inner thigh or knee on the edge) and the forearm under the shoulder.","Lift the hips so the body forms a straight line, lower leg tucked or hanging under the bench.","Hold, squeezing the inner thigh of the top leg. Swap sides."],"equipment":["Bodyweight"],"metric":"time","level":"expert","src":"ivan"},{"id":"cossack-squat","name":"Cossack Squat","group":"Legs","primary":"Adductors","secondary":[],"split":"legs","pattern":"Lateral Squat","focus":"Adductors","guide":"Wide stance, squat side-to-side. Hits adductors, glutes, and quads. Improve mobility and strength.","steps":["Stand in a wide stance with the toes turned slightly out.","Shift your weight to one side and sit down into that leg, keeping the other leg straight with the toes up.","Push back to the middle and repeat on the other side. Keep the chest tall."],"equipment":["Bodyweight","Dumbbell","Kettlebell"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"cross-body-crunch","name":"Cross-Body Crunch","group":"Core","primary":"Obliques","secondary":[],"split":"core","pattern":"Crunch","focus":"Obliques","guide":null,"steps":["Lie on the floor, crossing your right leg across your bent left knee. Clasp your hands behind your head, beginning with your shoulder blades on the ground. This will be your starting position.","Perform the motion by flexing the spine and rotating your torso to bring the left elbow to the right knee.","Return to the starting position and repeat the movement for the desired number of repetitions before switching sides."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"cross-body-hammer-curl","name":"Cross-Body Hammer Curl","group":"Arms","primary":"Biceps","secondary":["Forearms"],"split":"pull","pattern":"Curl","focus":"Biceps","guide":"Curl across torso with neutral grip. Targets brachialis and adds thickness to upper arms.","steps":["Stand up straight with a dumbbell in each hand. Your hands should be down at your side with your palms facing in.","While keeping your palms facing in and without twisting your arm, curl the dumbbell of the right arm up towards your left shoulder as you exhale. Touch the top of the dumbbell to your shoulder and hold the contraction for a second.","Slowly lower the dumbbell along the same path as you inhale and then repeat the same movement for the left arm.","Continue alternating in this fashion until the recommended amount of repetitions is performed for each arm."],"equipment":["Dumbbell","Cable"],"metric":"reps","level":"beginner","src":"both"},{"id":"cross-body-kickback","name":"Cross-Body Kickback","group":"Arms","primary":"Triceps","secondary":[],"split":"push","pattern":"Extension","focus":"Triceps","guide":"Kick dumbbell across body rather than straight back. Hits lateral head and emphasizes contraction.","steps":["Hinge forward with a flat back and bend the elbow of the working arm to 90°.","Extend the arm back and across the body toward the opposite hip.","Squeeze the triceps, then bend the elbow back to 90° without letting the upper arm drop."],"equipment":["Dumbbell","Cable"],"metric":"reps","level":"beginner","src":"ivan"},{"id":"cross-body-lateral-raise","name":"Cross-Body Lateral Raise","group":"Shoulders","primary":"Side Delts","secondary":[],"split":"push","pattern":"Raise","focus":"Side Delts","guide":"Cable comes from behind opposite leg. Better alignment with deltoid fiber direction. Isolates lateral head.","steps":["Set a low pulley and stand sideways so the handle hand is across your body, taking the handle with the far hand.","Raise the arm out to the side to about shoulder height with a slight bend in the elbow.","Lower slowly and keep the shoulder down, not shrugged."],"equipment":["Cable"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"crossbody-cable-extension","name":"Crossbody Cable Extension","group":"Arms","primary":"Triceps","secondary":[],"split":"push","pattern":"Extension","focus":"Triceps","guide":"Single-arm movement with palm facing inward. Keeps long head under tension. Use slow, controlled tempo.","steps":["Set a cable high and take the handle with the opposite hand, elbow bent and pinned close to the body.","Extend the elbow, pushing the hand down and across the body.","Squeeze the triceps, then return slowly to the start."],"equipment":["Cable"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"crossbody-fly","name":"Crossbody Fly","group":"Chest","primary":"Mid Chest","secondary":["Front Delts"],"split":"push","pattern":"Fly","focus":"Mid Chest","guide":"Move one arm across body toward opposite shoulder, emphasizing peak contraction.","steps":["Set a cable at shoulder height, step forward and take a single handle with the arm out to the side.","Sweep the hand across the body toward the opposite shoulder with a soft elbow.","Squeeze the chest at the end, then return slowly to a stretch."],"equipment":["Cable"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"crossface-triceps-extension","name":"Crossface Triceps Extension","group":"Arms","primary":"Triceps","secondary":[],"split":"push","pattern":"Extension","focus":"Triceps","guide":"Lie sideways on bench, extend dumbbell across face. Hits long head hard with a unique angle.","steps":["Lie on your side on a bench (or on your back) and hold a dumbbell with the arm pointed up.","Bend the elbow and lower the dumbbell across your face toward the opposite shoulder.","Extend the elbow back to straight, keeping the upper arm still."],"equipment":["Dumbbell"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"crucifix-hold","name":"Crucifix Hold","group":"Full Body","primary":"Side Delts","secondary":["Forearms"],"split":"full","pattern":"Stability","focus":"Side Delts","guide":null,"steps":["In the crucifix, you statically hold weights out to the side for time. While the event can be practiced using dumbbells, it is best to practice with one of the various implements used, such as axes and hammers, as it feels different.","Begin standing, and raise your arms out to the side holding the implements. Your arms should be parallel to the ground. In competition, judges or sensors are used to let you know when you break parallel. Hold for as long as you can. Typically, the weights should be heavy enough that you fail in 30-60 seconds."],"equipment":["Other"],"metric":"time","level":"beginner","src":"freedb"},{"id":"crunch","name":"Crunch","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Crunch","focus":"Upper Abs","guide":"Lie on back with knees bent, curl shoulder blades off floor by engaging abs. Avoid pulling on neck and focus on spinal flexion.","steps":["Lie flat on your back with your feet flat on the ground, or resting on a bench with your knees bent at a 90 degree angle. If you are resting your feet on a bench, place them three to four inches apart and point your toes inward so they touch.","Now place your hands lightly on either side of your head keeping your elbows in. Tip: Don't lock your fingers behind your head.","While pushing the small of your back down in the floor to better isolate your abdominal muscles, begin to roll your shoulders off the floor.","Continue to push down as hard as you can with your lower back as you contract your abdominals and exhale. Your shoulders should come up off the floor only about four inches, and your lower back should remain on the floor. At the top of the movement, contract your abdominals hard and keep the contraction for a second. Tip: Focus on slow, controlled movement - don't cheat yourself by using momentum.","After the one second contraction, begin to come down slowly again to the starting position as you inhale."],"equipment":["Bodyweight","Plate","Machine","Med Ball"],"metric":"reps","level":"beginner","src":"both"},{"id":"crush-press","name":"Crush Press","group":"Chest","primary":"Mid Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Press","focus":"Mid Chest","guide":"Press two dumbbells together throughout the movement. Increases internal tension and midline pec activation. Not just a DB variation—adds a unique isometric squeeze component.","steps":["Lie on a bench holding two dumbbells together above your chest, palms facing each other.","Squeeze the dumbbells together as hard as you can and lower them to the chest.","Press up while still squeezing. Keep the pressure between the dumbbells the whole time."],"equipment":["Dumbbell"],"metric":"reps","level":"beginner","src":"ivan"},{"id":"cuban-press","name":"Cuban Press","group":"Shoulders","primary":"Rear Delts","secondary":[],"split":"pull","pattern":"Press / Rotation","focus":"Rear Delts / Rotator Cuff","guide":"Start in upright row, rotate to overhead press. Excellent for rear delts and rotator cuff health. Use light weight.","steps":["Take a dumbbell in each hand with a pronated grip in a standing position. Raise your upper arms so that they are parallel to the floor, allowing your lower arms to hang in the \"scarecrow\" position. This will be your starting position.","To initiate the movement, externally rotate the shoulders to move the upper arm 180 degrees. Keep the upper arms in place, rotating the upper arms until the wrists are directly above the elbows, the forearms perpendicular to the floor.","Now press the dumbbells by extending at the elbows, straightening your arms overhead.","Return to the starting position as you breathe in by reversing the steps."],"equipment":["Dumbbell","Barbell"],"metric":"reps","level":"intermediate","src":"both"},{"id":"cuban-rotation","name":"Cuban Rotation","group":"Shoulders","primary":"Rear Delts","secondary":[],"split":"pull","pattern":"Isolation","focus":"Rotator Cuff/Rear Delts","guide":"Start with elbows bent at 90°, raise dumbbells or barbell to shoulder height (external rotation). Excellent for shoulder health and rotator cuff strengthening. Use light weight with strict form.","steps":["Stand with light dumbbells and the upper arms out to the side, elbows bent at 90° and the weights hanging down.","Rotate the forearms up until they point at the ceiling, keeping the upper arms level.","Lower slowly back to the start. Use a light weight and strict form."],"equipment":["Dumbbell","Cable","Band"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"curtsy-lunge","name":"Curtsy Lunge","group":"Legs","primary":"Glutes","secondary":["Quads"],"split":"legs","pattern":"Lunge","focus":"Glutes","guide":"Step back and across midline. Emphasizes glute medius for lateral stability and shape.","steps":["Stand tall with dumbbells at your sides or at the chest.","Step one foot back and across behind the other leg and lower until the front thigh is near parallel.","Drive through the front foot to return to standing. Finish the reps, then swap legs."],"equipment":["Dumbbell","Bodyweight"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"cycling","name":"Cycling","group":"Cardio","primary":null,"secondary":[],"split":"cardio","pattern":"Steady-State","focus":"Glutes, Hamstrings, Quads","guide":"Maintain cadence with even pedal strokes. Use gears to regulate intensity. Good for knees and endurance.","steps":["To begin, seat yourself on the bike and adjust the seat to your height.","Select the desired option from the menu. You may have to start pedaling to turn it on. You can use the manual setting, or you can select a program to use. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. The level of resistance can be changed throughout the workout. The handles can be used to monitor your heart rate to help you stay at an appropriate intensity.","Recumbent bikes offer convenience, cardiovascular benefits, and have less impact than other activities. A 150 lb person will burn about 230 calories cycling at a moderate rate for 30 minutes, compared to 450 calories or more running."],"equipment":["Stationary Bike","Outdoor"],"metric":"duration","level":"beginner","src":"both"},{"id":"cyclist-squat","name":"Cyclist Squat","group":"Legs","primary":"Quads","secondary":["Glutes"],"split":"legs","pattern":"Squat","focus":"Quads","guide":"Heels elevated closely together to emphasize quads. Allows deep knee flexion and upright torso. Ideal for hypertrophy.","steps":["Place your heels on a plate or wedge with the feet close together. Hold the bar on your upper back or a goblet hold.","Keep the torso upright and bend the knees forward over the toes as you sit down deep.","Drive up through the whole foot. Use a lighter load than your regular squat."],"equipment":["Barbell","Dumbbell","Smith Machine"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"dead-bug","name":"Dead Bug","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Stability","focus":"Transverse Abdominis","guide":"Lie on back, move opposite arm and leg while keeping lower back flat on floor. Focus on deep core engagement and control.","steps":["Begin lying on your back with your hands extended above you toward the ceiling.","Bring your feet, knees, and hips up to 90 degrees.","Exhale hard to bring your ribcage down and flatten your back onto the floor, rotating your pelvis up and squeezing your glutes. Hold this position throughout the movement. This will be your starting position.","Initiate the exercise by extending one leg, straightening the knee and hip to bring the leg just above the ground.","Maintain the position of your lumbar and pelvis as you perform the movement, as your back is going to want to arch.","Stay tight and return the working leg to the starting position."],"equipment":["Bodyweight"],"metric":"time","level":"beginner","src":"both"},{"id":"dead-stop-lunge","name":"Dead-Stop Lunge","group":"Legs","primary":"Quads","secondary":["Glutes"],"split":"legs","pattern":"Lunge","focus":"Quads/Glutes","guide":"Pause fully at bottom of each rep, removing momentum. Enhances control and overloads working leg.","steps":["Hold dumbbells at your sides and step back into a lunge.","Lower until the rear knee touches or nearly touches the floor and pause there for a second.","Drive up through the front foot without bouncing, then repeat."],"equipment":["Dumbbell","Barbell"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"dead-stop-press","name":"Dead-Stop Press","group":"Chest","primary":"Mid Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Press","focus":"Mid Chest","guide":"Pause the bar completely on safety pins at chest level. Removes momentum and emphasizes concentric drive. Great for strength and control.","steps":["Set safety pins in a rack at chest height and lie on the bench so the bar starts resting on the pins.","Brace, then press the bar from a dead stop to lockout.","Lower the bar back to the pins and let it settle fully before the next rep."],"equipment":["Barbell","Smith Machine"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"deadlift","name":"Deadlift","group":"Back","primary":"Lower Back","secondary":["Hamstrings","Glutes","Traps","Forearms","Quads"],"split":"pull","pattern":"Pull","focus":"Lats & Mid Back","guide":"Hinge at hips with neutral spine. Drive through floor, keep bar close to body, and lock out at the top. Engages full posterior chain.","steps":["Stand in front of a loaded barbell.","While keeping the back as straight as possible, bend your knees, bend forward and grasp the bar using a medium (shoulder width) overhand grip. This will be the starting position of the exercise. Tip: If it is difficult to hold on to the bar with this grip, alternate your grip or use wrist straps.","While holding the bar, start the lift by pushing with your legs while simultaneously getting your torso to the upright position as you breathe out. In the upright position, stick your chest out and contract the back by bringing the shoulder blades back. Think of how the soldiers in the military look when they are in standing in attention.","Go back to the starting position by bending at the knees while simultaneously leaning the torso forward at the waist while keeping the back straight. When the weights on the bar touch the floor you are back at the starting position and ready to perform another repetition.","Perform the amount of repetitions prescribed in the program."],"equipment":["Barbell","Trap Bar","Cable","Band","Machine"],"metric":"reps","level":"intermediate","src":"both"},{"id":"decline-press","name":"Decline Bench Press","group":"Chest","primary":"Mid Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Press","focus":"Lower Chest","guide":"Set decline bench to ~15–30°. Lower weight under control and press up to target lower chest.","steps":["Secure your legs at the end of the decline bench and slowly lay down on the bench.","Using a medium width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over you with your arms locked. The arms should be perpendicular to the floor. This will be your starting position. Tip: In order to protect your rotator cuff, it is best if you have a spotter help you lift the barbell off the rack.","As you breathe in, come down slowly until you feel the bar on your lower chest.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up).","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."],"equipment":["Barbell","Dumbbell","Machine","Smith Machine"],"metric":"reps","level":"beginner","src":"both"},{"id":"decline-crunch","name":"Decline Crunch","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Crunch","focus":"Abs","guide":null,"steps":["Secure your legs at the end of the decline bench and lie down.","Now place your hands lightly on either side of your head keeping your elbows in. Tip: Don't lock your fingers behind your head.","While pushing the small of your back down in the bench to better isolate your abdominal muscles, begin to roll your shoulders off it.","Continue to push down as hard as you can with your lower back as you contract your abdominals and exhale. Your shoulders should come up off the bench only about four inches, and your lower back should remain on the bench. At the top of the movement, contract your abdominals hard and keep the contraction for a second. Tip: Focus on slow, controlled movement - don't cheat yourself by using momentum.","After the one second contraction, begin to come down slowly again to the starting position as you inhale."],"equipment":["Bodyweight"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"decline-fly","name":"Decline Fly","group":"Chest","primary":"Mid Chest","secondary":["Front Delts"],"split":"push","pattern":"Fly","focus":"Lower Chest","guide":"Perform fly on slight decline. Allows deeper stretch and targets lower pec fibers.","steps":["Secure your legs at the end of the decline bench and lie down with a dumbbell on each hand on top of your thighs. The palms of your hand will be facing each other.","Once you are laying down, move the dumbbells in front of you at shoulder width. The palms of the hands should be facing each other and the arms should be perpendicular to the floor and fully extended. This will be your starting position.","With a slight bend on your elbows in order to prevent stress at the biceps tendon, lower your arms out at both sides in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms should remain stationary; the movement should only occur at the shoulder joint.","Return your arms back to the starting position as you squeeze your chest muscles and breathe out. Tip: Make sure to use the same arc of motion used to lower the weights.","Hold for a second at the contracted position and repeat the movement for the prescribed amount of repetitions."],"equipment":["Cable","Dumbbell"],"metric":"reps","level":"beginner","src":"both"},{"id":"decline-pullover","name":"Decline Pullover","group":"Chest","primary":"Mid Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Pullover","focus":"Mid Chest","guide":null,"steps":["Lie down on a decline bench with both legs securely locked in position. Reach for the barbell behind the head using a pronated grip (palms facing out). Make sure to grab the barbell wider than shoulder width apart for this exercise. Slowly lift the barbell up from the floor by using your arms.","When positioned properly, your arms should be fully extended and perpendicular to the floor. This is the starting position.","Begin by moving the barbell back down in a semicircular motion as if you were going to place it on the floor, but instead, stop when the arms are parallel to the floor. Tip: Keep the arms fully extended at all times. The movement should only happen at the shoulder joint. Inhale as you perform this portion of the movement.","Now bring the barbell up while exhaling until you are back at the starting position. Remember to keep full control of the barbell at all times.","Repeat the movement for the prescribed amount of repetitions of your training program.","When finished with your set, slowly lower the barbell back down until it is level with your head and release it."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"decline-push-up","name":"Decline Push-Up","group":"Chest","primary":"Mid Chest","secondary":[],"split":"push","pattern":"Calisthenics","focus":"Lower Chest","guide":"Feet elevated above hands. Increases loading and targets lower chest.","steps":["Lie on the floor face down and
