 place your hands about 36 inches apart while holding your torso up at arms length. Move your feet up to a box or bench. This will be your starting position.","Next, lower yourself downward until your chest almost touches the floor as you inhale.","Now breathe out and press your upper body back up to the starting position while squeezing your chest.","After a brief pause at the top contracted position, you can begin to lower yourself downward again for as many repetitions as needed."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"beginner","src":"both"},{"id":"decline-triceps-extension","name":"Decline Triceps Extension","group":"Arms","primary":"Triceps","secondary":[],"split":"push","pattern":"Extension","focus":"Triceps","guide":"Decline bench provides deep stretch for long head. Use slow tempo and full ROM.","steps":["Secure your legs at the end of the decline bench and slowly lay down on the bench.","Using a close grip (a grip that is slightly less than shoulder width), lift the bar from the rack and hold it straight over you with your arms locked and elbows in. The arms should be perpendicular to the floor. This will be your starting position. Tip: In order to protect your rotator cuff, it is best if you have a spotter help you lift the barbell off the rack.","Now lower the bar down to your lower chest as you breathe in. Keep the elbows in as you perform this movement.","Using the triceps to push the bar back up, press it back to the starting position as you exhale.","As you breathe in and you keep the upper arms stationary, bring the bar down slowly by moving your forearms in a semicircular motion towards you until you feel the bar slightly touch your forehead. Breathe in as you perform this portion of the movement.","Lift the bar back to the starting position by contracting the triceps and exhaling."],"equipment":["EZ Bar","Dumbbell","Barbell"],"metric":"reps","level":"intermediate","src":"both"},{"id":"deficit-deadlift","name":"Deficit Deadlift","group":"Back","primary":"Lower Back","secondary":["Forearms","Glutes","Hamstrings","Upper Back","Quads"],"split":"pull","pattern":"Hinge","focus":"Lower Back","guide":null,"steps":["Begin by having a platform or weight plates that you can stand on, usually 1-3 inches in height. Approach the bar so that it is centered over your feet. You feet should be about hip width apart. Bend at the hip to grip the bar at shoulder width, allowing your shoulder blades to protract. Typically, you would use an overhand grip or an over/under grip on heavier sets.","With your feet, and your grip set, take a big breath and then lower your hips and bend the knees until your shins contact the bar. Look forward with your head, keep your chest up and your back arched, and begin driving through the heels to move the weight upward. After the bar passes the knees, aggressively pull the bar back, pulling your shoulder blades together as you drive your hips forward into the bar.","Lower the bar by bending at the hips and guiding it to the floor."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"deficit-reverse-lunge","name":"Deficit Reverse Lunge","group":"Legs","primary":"Quads","secondary":["Glutes","Hamstrings"],"split":"legs","pattern":"Lunge","focus":"Quads","guide":null,"steps":["Position a bar onto a rack at shoulder height loaded to an appropriate weight. Place a short, raised platform behind you.","Rack the bar onto your upper back, keeping your back arched and tight. Step onto your raised platform with both feet. This will be your starting position.","Begin by stepping backwards with one leg. Descend by flexing your hips and knees until your knee touches the floor.","Pause, and extend through the hips and knees to rise up, returning all the way to the starting position before alternating."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"deficit-romanian-deadlift","name":"Deficit Romanian Deadlift","group":"Legs","primary":"Hamstrings","secondary":["Forearms","Glutes","Lower Back","Traps"],"split":"legs","pattern":"Hinge","focus":"Hamstrings","guide":null,"steps":["Begin standing while holding a bar at arm's length in front of you. You can stand on a raised platform to increase the range of motion.","Begin by flexing the knees slightly, and then flex at the hip, moving your butt back as far as possible, lowering the torso as far as flexibility allows. The back should remain in absolute extension at all times, and the bar should remain in contact with the legs. If done properly, there should be heavy tension felt in the hamstrings.","Reverse the motion to return to the starting position."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"depth-jump","name":"Depth Jump","group":"Legs","primary":"Quads","secondary":["Abductors","Adductors","Calves","Glutes","Hamstrings"],"split":"legs","pattern":"Plyometric","focus":"Quads","guide":null,"steps":["For this drill you will need two boxes or benches, one 12 to 16 inches high and the other 22 to 26 inches high.","Stand on one of the two boxes with arms at the sides; feet should be together and slightly off the edge as in the depth jump. Place the other box approximately two or three feet in front of and facing the performer.","Begin by dropping off the initial box, landing and simultaneously taking off with both feet.","Rebound by driving upward and outward as intensely as possible, using the arms and full extension of the body to jump onto the higher box. Again, allow the legs to absorb the impact."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"depth-push-up","name":"Depth Push-Up","group":"Chest","primary":"Upper Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Press","focus":"Upper Chest","guide":null,"steps":["For this drill you will need a box about 12 inches high, and two thick mats or aerobics steps.","Place the steps just outside of your shoulders, and place your feet on top of the box so that you are in an incline pushup position, your hands just inside the steps. This will be your starting position.","Begin by bending at the elbows to lower your body, quickly reversing position to push your body off of the ground. As you leave the ground, move your hands onto the steps, bending your elbows to absorb the impact."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"diagonal-bound","name":"Diagonal Bound","group":"Legs","primary":"Quads","secondary":["Abductors","Adductors","Calves","Glutes","Hamstrings"],"split":"legs","pattern":"Plyometric","focus":"Quads","guide":null,"steps":["Assume a comfortable stance with one foot slightly in front of the other.","Begin by pushing off with the front leg, driving the opposite knee forward and as high as possible before landing. Attempt to cover as much distance to each side with each bound.","It may help to use a line on the ground to guage distance from side to side."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"dip","name":"Dip","group":"Arms","primary":"Triceps","secondary":["Mid Chest","Front Delts"],"split":"push","pattern":"Press","focus":"Triceps","guide":"Keep torso upright to target triceps. Elbows track back, avoid flaring. Depth should allow triceps stretch without shoulder strain.","steps":["Stand between a set of parallel bars. Place a hand on each bar, and then take a small jump to help you get into the starting position with your arms locked out.","Begin by flexing the elbow, lowering your body until your arms break 90 degrees. Avoid swinging, and maintain good posture throughout the descent.","Reverse the motion by extending the elbow, pushing yourself back up into the starting position."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight","Machine"],"metric":"reps","level":"beginner","src":"both"},{"id":"donkey-calf-raise","name":"Donkey Calf Raise","group":"Legs","primary":"Calves","secondary":[],"split":"legs","pattern":"Raise","focus":"Calves (Gastrocnemius)","guide":"Hinge forward with straight legs. Excellent stretch and long-tension on gastroc.","steps":["For this exercise you will need access to a donkey calf raise machine. Start by positioning your lower back and hips under the padded lever provided. The tailbone area should be the one making contact with the pad.","Place both of your arms on the side handles and place the balls of your feet on the calf block with the heels extending off. Align the toes forward, inward or outward, depending on the area you wish to target, and straighten the knees without locking them. This will be your starting position.","Raise your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position by a second before you start to go back down.","Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched."],"equipment":["Machine","Bodyweight"],"metric":"reps","level":"intermediate","src":"both"},{"id":"drag-curl","name":"Drag Curl","group":"Arms","primary":"Biceps","secondary":["Forearms"],"split":"pull","pattern":"Curl","focus":"Biceps","guide":"Elbows stay back, bar or handle drags up torso. Prioritizes biceps over front delts. Keep tension throughout.","steps":["Grab a barbell with a supinated grip (palms facing forward) and get your elbows close to your torso and back. This will be your starting position.","As you exhale, curl the bar up while keeping the elbows to the back as you \"Drag\" the bar up by keeping it in contact with your torso. Tip: As you can see, you will not be keeping the elbows pinned to your sides, but instead you will be bringing them back. Also, do not lift your shoulders.","Slowly go back to the starting position as you keep the bar in contact with the torso at all times."],"equipment":["Barbell","EZ Bar","Cable","Dumbbell"],"metric":"reps","level":"intermediate","src":"both"},{"id":"drop-push-up","name":"Drop Push-Up","group":"Chest","primary":"Mid Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Press","focus":"Mid Chest","guide":null,"steps":["Position low boxes or other platforms 2-3 feet apart.","Move to a pushup position between them, supporting yourself by placing your hands on the boxes.","With good posture, drop from the platforms by pressing up and moving your hands to shoulder width, cushioning your landing by absorbing the impact through the arm."],"equipment":["Bodyweight"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"dual-cable-triceps-extension","name":"Dual Cable Triceps Extension","group":"Arms","primary":"Triceps","secondary":[],"split":"push","pattern":"Extension","focus":"Triceps","guide":"Use two high cables. Keep arms overhead in a Y-position, extend down and out. Big stretch and constant tension.","steps":["Set two high pulleys and stand between them with a handle in each hand, arms overhead and elbows bent.","Extend the elbows and push the hands up and out in a Y shape.","Return slowly to a deep stretch with the elbows pointing forward."],"equipment":["Cable"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"elliptical","name":"Elliptical","group":"Cardio","primary":null,"secondary":[],"split":"cardio","pattern":"Steady-State","focus":null,"guide":null,"steps":["To begin, step onto the elliptical and select the desired option from the menu. Most ellipticals have a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Elevation can be adjusted to change the intensity of the workout.","The handles can be used to monitor your heart rate to help you stay at an appropriate intensity."],"equipment":["Machine"],"metric":"duration","level":"intermediate","src":"freedb"},{"id":"external-rotation","name":"External Rotation","group":"Shoulders","primary":"Rear Delts","secondary":[],"split":"pull","pattern":"Raise","focus":"Rear Delts","guide":null,"steps":["Lie sideways on a flat bench with one arm holding a dumbbell and the other hand on top of the bench folded so that you can rest your head on it.","Bend the elbows of the arm holding the dumbbell so that it creates a 90-degree angle between the upper arm and the forearm. Tip: Keep the arm parallel to your torso.","Now bend the elbow while keeping the upper arm stationary. In this manner, the forearm will be parallel to the floor and perpendicular to your torso (Tip: So the forearm will be directly in front of you). The upper arm will be stationary by your torso and should be parallel to the floor (aligned with your torso at all times). This will be your starting position.","As you breathe out, externally rotate your forearm so that the dumbbell is lifted up in a semicircle motion as you maintain the 90 degree angle bend between the upper arms and the forearm. You will continue this external rotation until the forearm is perpendicular to the floor and the torso pointing towards the ceiling. At this point you will hold the contraction for a second.","As you breathe in, slowly go back to the starting position."],"equipment":["Dumbbell","Band","Cable"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"ez-bar-reverse-grip-skullcrusher","name":"EZ Bar Reverse Grip Skullcrusher","group":"Arms","primary":"Triceps","secondary":[],"split":"push","pattern":"Extension","focus":"Triceps","guide":"Pronated grip targets the medial and lateral heads more than supinated. Keep movement slow and tight.","steps":["Lie on a bench holding an EZ bar with a palms-down grip, arms straight above the chest.","Bend the elbows and lower the bar toward the forehead, keeping the upper arms still.","Extend the elbows to return to the top. Control the lowering."],"equipment":["EZ Bar"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"face-pull","name":"Face Pull","group":"Shoulders","primary":"Rear Delts","secondary":["Upper Back","Traps"],"split":"pull","pattern":"Isolation","focus":"Rear Delts","guide":"Rope attachment at upper chest height. Pull toward face with elbows flared. Emphasizes rear delts and external rotators.","steps":["Facing a high pulley with a rope or dual handles attached, pull the weight directly towards your face, separating your hands as you do so. Keep your upper arms parallel to the ground."],"equipment":["Cable","Band"],"metric":"reps","level":"intermediate","src":"both"},{"id":"farmer-carry","name":"Farmer Carry","group":"Full Body","primary":"Forearms","secondary":["Traps","Abs"],"split":"full","pattern":"Hold","focus":"Forearms","guide":"Grip heavy weights and walk while maintaining posture. Builds grip strength and forearm endurance.","steps":["There are various implements that can be used for the farmers walk. These can also be performed with heavy dumbbells or short bars if these implements aren't available. Begin by standing between the implements.","After gripping the handles, lift them up by driving through your heels, keeping your back straight and your head up.","Walk taking short, quick steps, and don't forget to breathe. Move for a given distance, typically 50-100 feet, as fast as possible."],"equipment":["Dumbbell","Trap Bar","Kettlebell","Bodyweight"],"metric":"distance","level":"intermediate","src":"both"},{"id":"finger-curl","name":"Finger Curl","group":"Arms","primary":"Forearms","secondary":[],"split":"pull","pattern":"Curl","focus":"Forearms","guide":null,"steps":["Hold a barbell with both hands and your palms facing up; hands spaced about shoulder width.","Place your feet flat on the floor, at a distance that is slightly wider than shoulder width apart. This will be your starting position.","Lower the bar as far as possible by extending the fingers. Allowing the bar to roll down the hands, catch the bar with the final joint in the fingers.","Now curl bar up as high as possible by closing your hands while exhaling. Hold the contraction at the top."],"equipment":["Barbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"floor-press","name":"Floor Press","group":"Chest","primary":"Mid Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Press","focus":"Mid Chest","guide":"Perform lying on floor to restrict range of motion. Focus on lockout and control.","steps":["Adjust the j-hooks so they are at the appropriate height to rack the bar. Begin lying on the floor with your head near the end of a power rack. Keeping your shoulder blades pulled together; pull the bar off of the hooks.","Lower the bar towards the bottom of your chest or upper stomach, squeezing the bar and attempting to pull it apart as you do so. Ensure that you tuck your elbows throughout the movement. Lower the bar until your upper arm contacts the ground and pause, preventing any slamming or bouncing of the weight.","Press the bar back up as fast as you can, keeping the bar, your wrists, and elbows in line as you do so."],"equipment":["Barbell","Dumbbell","Kettlebell"],"metric":"reps","level":"intermediate","src":"both"},{"id":"floor-triceps-press","name":"Floor Triceps Press","group":"Arms","primary":"Triceps","secondary":["Mid Chest","Front Delts"],"split":"push","pattern":"Press","focus":"Triceps","guide":"Similar to skullcrusher but done lying on floor. Reduces stretch, making it more joint-friendly. Keep elbows stationary.","steps":["Lie on the floor with a dumbbell in each hand and the arms bent, elbows touching the floor.","Extend the elbows and press the weights up.","Lower slowly until the upper arms touch the floor again."],"equipment":["Dumbbell","EZ Bar","Barbell"],"metric":"reps","level":"beginner","src":"ivan"},{"id":"flutter-kick","name":"Flutter Kick","group":"Core","primary":"Abs","secondary":["Quads"],"split":"core","pattern":"Leg Raise","focus":"Abs","guide":null,"steps":["On a flat bench lie facedown with the hips on the edge of the bench, the legs straight with toes high off the floor and with the arms on top of the bench holding on to the front edge.","Squeeze your glutes and hamstrings and straighten the legs until they are level with the hips. This will be your starting position.","Start the movement by lifting the left leg higher than the right leg.","Then lower the left leg as you lift the right leg.","Continue alternating in this manner (as though you are doing a flutter kick in water) until you have done the recommended amount of repetitions for each leg. Make sure that you keep a controlled movement at all times. Tip: You will breathe normally as you perform this movement."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"fly-press-hybrid","name":"Fly Press Hybrid","group":"Chest","primary":"Mid Chest","secondary":[],"split":"push","pattern":"Combo","focus":"Full Chest","guide":"Begin with wide fly motion, then finish by pressing arms together. Increases stretch and contraction in one motion.","steps":["Lie on a bench with dumbbells above the chest, palms facing each other.","Open the arms into a wide fly until you feel a stretch in the chest.","Bring the elbows in so the dumbbells come to the chest, then press straight up and squeeze at the top."],"equipment":["Dumbbell"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"front-box-squat","name":"Front Box Squat","group":"Legs","primary":"Quads","secondary":["Calves","Glutes","Hamstrings"],"split":"legs","pattern":"Squat","focus":"Quads","guide":null,"steps":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set a flat bench behind you and set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, bring your arms up under the bar while keeping the elbows high and the upper arm slightly above parallel to the floor. Rest the bar on top of the deltoids and cross your arms while grasping the bar for total control.","Lift the bar off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).","Begin to slowly lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until you touch the bench with your glutes. Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor mainly with the heel of your foot as you straighten the legs again and go back to the starting position."],"equipment":["Barbell"],"metric":"reps","level":"expert","src":"freedb"},{"id":"front-foot-elevated-split-squat","name":"Front Foot Elevated Split Squat","group":"Legs","primary":"Quads","secondary":["Glutes"],"split":"legs","pattern":"Lunge","focus":"Quads","guide":"Elevating front foot increases ROM. Stay vertical to emphasize quad loading.","steps":["Stand in a split stance with the front foot on a low plate or step and hold dumbbells at your sides.","Lower the back knee toward the floor while keeping the torso upright.","Drive through the front foot to return to the top. Finish the reps, then swap legs."],"equipment":["Dumbbell","Barbell","Smith Machine"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"front-lever","name":"Front Lever","group":"Back","primary":"Lats","secondary":["Abs","Upper Back"],"split":"pull","pattern":"Anti-Extension","focus":"Lats, Core","guide":"Hang from a bar and hold the body horizontal, arms straight. Progress tuck -> advanced tuck -> one-leg -> straddle -> full. Stop each hold before hips sag or arms bend.","steps":["Hang from a bar with straight arms and pull the shoulders down and back.","Raise the body until it is horizontal, hips in line with the shoulders. Start with a tuck, then advanced tuck, one-leg, straddle and full.","Hold the shape for as long as you can keep the hips up, then lower under control. Stop the hold before the hips sag."],"equipment":["Bodyweight","Assisted Bodyweight"],"metric":"time","level":"expert","src":"ivan"},{"id":"front-rack-carry","name":"Front Rack Carry","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Carry","focus":"Full Core","guide":"Hold weights in front rack position. Forces bracing through entire core and encourages good alignment.","steps":["Clean two kettlebells (or dumbbells) to the front rack position with the elbows tucked in.","Brace the core and stand tall with the ribs down.","Walk slowly for a set distance without leaning back, then lower the weights under control."],"equipment":["Kettlebell","Dumbbell","Barbell"],"metric":"distance","level":"intermediate","src":"ivan"},{"id":"front-raise","name":"Front Raise","group":"Shoulders","primary":"Front Delts","secondary":[],"split":"push","pattern":"Raise","focus":"Front Delts","guide":"Raise arms forward to shoulder height with straight or slightly bent elbows. Minimize swinging and use controlled tempo.","steps":["Grab a dumbbell in each arm and stand up straight with your arms extended by your sides with a slight bend at the elbows and your back straight. This will be your starting position. Tip: The dumbbell should be next to your thighs with the palm of your hands facing back.","Use your side shoulders to lift the dumbbells as you exhale. The dumbbells should be to the side of the body as you move them up. Continue to lift it until the dumbbells are nearly in line with your chin. Tip: Your elbows should drive the motion. As you lift the dumbbell, your elbow should always be higher than your forearm. Also, keep your torso stationary and pause for a second at the top of the movement.","Lower the dumbbells back down slowly to the starting position. Inhale as you perform this portion of the movement."],"equipment":["Dumbbell","Cable","Plate","Barbell"],"metric":"reps","level":"beginner","src":"both"},{"id":"front-raise-to-pullover","name":"Front Raise to Pullover","group":"Chest","primary":"Mid Chest","secondary":["Lats","Front Delts","Triceps"],"split":"push","pattern":"Pullover","focus":"Mid Chest","guide":null,"steps":["Lie on a flat bench while holding a barbell using a palms down grip that is about 15 inches apart.","Place the bar on your upper thighs, extend your arms and lock them while keeping a slight bend on the elbows. This will be your starting position.","Now raise the weight using a semicircular motion and keeping your arms straight as you inhale. Continue the same movement until the bar is on the other side above your head . (Tip: the bar will travel approximately 180-degrees). At this point your arms should be parallel to the floor with the palms of your hands facing the ceiling.","Now return the barbell to the starting position by reversing the motion as you exhale."],"equipment":["Barbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"front-squat","name":"Front Squat","group":"Legs","primary":"Quads","secondary":["Glutes"],"split":"legs","pattern":"Squat","focus":"Quads","guide":"Bar rests on front delts. Keep torso upright and elbows high. Focus on quad loading by minimizing hip hinge.","steps":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, bring your arms up under the bar while keeping the elbows high and the upper arm slightly above parallel to the floor. Rest the bar on top of the deltoids and cross your arms while grasping the bar for total control.","Lift the bar off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).","Begin to slowly lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor mainly with the middle of your foot as you straighten the legs again and go back to the starting position."],"equipment":["Barbell","Smith Machine","Kettlebell"],"metric":"reps","level":"expert","src":"both"},{"id":"glute-bridge","name":"Glute Bridge","group":"Legs","primary":"Glutes","secondary":["Hamstrings"],"split":"legs","pattern":"Hinge","focus":"Glutes","guide":"Shoulders on ground, feet flat. Thrust hips up and squeeze glutes. Smaller ROM than hip thrusts but great for activation.","steps":["Begin seated on the ground with a loaded barbell over your legs. Using a fat bar or having a pad on the bar can greatly reduce the discomfort caused by this exercise. Roll the bar so that it is directly above your hips, and lay down flat on the floor.","Begin the movement by driving through with your heels, extending your hips vertically through the bar. Your weight should be supported by your upper back and the heels of your feet.","Extend as far as possible, then reverse the motion to return to the starting position."],"equipment":["Barbell","Dumbbell","Bodyweight","Band"],"metric":"reps","level":"intermediate","src":"both"},{"id":"glute-ham-raise","name":"Glute Ham Raise","group":"Legs","primary":"Hamstrings","secondary":[],"split":"legs","pattern":"Curl","focus":"Hamstrings","guide":"Similar to Nordic but on GHD. Extend at knees and hips, then contract hamstrings to rise back up.","steps":["Begin by adjusting the equipment to fit your body. Place your feet against the footplate in between the rollers as you lie facedown. Your knees should be just behind the pad.","Start from the bottom of the movement. Keep your back arched as you begin the movement by flexing the knees. Drive your toes into the foot plate as you do so. Keep your upper body straight, and continue until your body is upright.","Return to the starting position, keeping your descent under control."],"equipment":["Bodyweight","Machine"],"metric":"reps","level":"intermediate","src":"both"},{"id":"glute-kickback","name":"Glute Kickback","group":"Legs","primary":"Glutes","secondary":["Hamstrings"],"split":"legs","pattern":"Hinge","focus":"Glutes","guide":"Maintain bent knee and hinge slightly forward. Extend leg behind and up while squeezing glute. Use full ROM and tension.","steps":["Hook a leather ankle cuff to a low cable pulley and then attach the cuff to your ankle.","Face the weight stack from a distance of about two feet, grasping the steel frame for support.","While keeping your knees and hips bent slightly and your abs tight, contract your glutes to slowly \"kick\" the working leg back in a semicircular arc as high as it will comfortably go as you breathe out. Tip: At full extension, squeeze your glutes for a second in order to achieve a peak contraction.","Now slowly bring your working leg forward, resisting the pull of the cable until you reach the starting position.","Repeat for the recommended amount of repetitions.","Switch legs and repeat the movement for the other side."],"equipment":["Cable","Machine","Band","Bodyweight"],"metric":"reps","level":"intermediate","src":"both"},{"id":"goblet-squat","name":"Goblet Squat","group":"Legs","primary":"Quads","secondary":["Glutes"],"split":"legs","pattern":"Squat","focus":"Quads/Glutes","guide":"Hold dumbbell or kettlebell at chest. Keep upright torso and sit deep. Great for beginners or for higher reps to reinforce form.","steps":["Stand up straight while holding a dumbbell on each hand (palms facing the side of your legs).","Position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section.","Begin to slowly lower your torso by bending the knees as you maintain a straight posture with the head up. Continue down until your thighs are parallel to the floor. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise your torso as you exhale by pushing the floor with the heel of your foot mainly as you straighten the legs again and go back to the starting position."],"equipment":["Dumbbell","Kettlebell"],"metric":"reps","level":"beginner","src":"both"},{"id":"good-morning","name":"Good Morning","group":"Legs","primary":"Hamstrings","secondary":["Glutes","Lower Back"],"split":"legs","pattern":"Hinge","focus":"Hamstrings","guide":"Bar on traps, hinge at hips while keeping knees soft. Go until hamstrings stretch, then return upright.","steps":["Begin with a bar on a rack at shoulder height. Rack the bar across the rear of your shoulders as you would a power squat, not on top of your shoulders. Keep your back tight, shoulder blades pinched together, and your knees slightly bent. Step back from the rack.","Begin by bending at the hips, moving them back as you bend over to near parallel. Keep your back arched and your cervical spine in proper alignment.","Reverse the motion by extending through the hips with your glutes and hamstrings. Continue until you have returned to the starting position."],"equipment":["Barbell","Smith Machine","Band"],"metric":"reps","level":"intermediate","src":"both"},{"id":"gorilla-chin-crunch","name":"Gorilla Chin Crunch","group":"Core","primary":"Abs","secondary":["Biceps","Lats"],"split":"core","pattern":"Vertical Pull","focus":"Abs","guide":null,"steps":["Hang from a chin-up bar using an underhand grip (palms facing you) that is slightly wider than shoulder width.","Now bend your knees at a 90 degree angle so that the calves are parallel to the floor while the thighs remain perpendicular to it. This will be your starting position.","As you exhale, pull yourself up while crunching your knees up at the same time until your knees are at chest level. You will stop going up as soon as your nose is at the same level as the bar. Tip: When you get to this point you should also be finishing the crunch at the same time.","Slowly start to inhale as you return to the starting position."],"equipment":["Bodyweight"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"guillotine-press","name":"Guillotine Press","group":"Chest","primary":"Upper Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Press","focus":"Upper Chest","guide":"Lower bar to neck level with flared elbows. Use light weight. Focus on upper chest stretch. Riskier on shoulders—use caution.","steps":["Lie back on a flat bench. Using a medium-width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over your neck with your arms locked. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on your neck.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up).","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."],"equipment":["Barbell","Smith Machine"],"metric":"reps","level":"intermediate","src":"both"},{"id":"hack-squat","name":"Hack Squat","group":"Legs","primary":"Quads","secondary":["Glutes"],"split":"legs","pattern":"Squat","focus":"Quads","guide":"Maintain flat back, heels down, and push knees forward. Prioritize depth and control to keep tension on quads.","steps":["Stand up straight while holding a barbell behind you at arms length and your feet at shoulder width. Tip: A shoulder width grip is best with the palms of your hands facing back. You can use wrist wraps for this exercise for a better grip. This will be your starting position.","While keeping your head and eyes up and back straight, squat until your upper thighs are parallel to the floor. Breathe in as you slowly go down.","Pressing mainly with the heel of the foot and squeezing the thighs, go back up as you breathe out."],"equipment":["Machine","Barbell"],"metric":"reps","level":"intermediate","src":"both"},{"id":"half-kneeling-1-arm-lat-pulldown","name":"Half-Kneeling Single-Arm Lat Pulldown","group":"Back","primary":"Lats","secondary":["Biceps","Upper Back"],"split":"pull","pattern":"Vertical Pull","focus":"Lats","guide":"Set pulley high. Kneel on one leg opposite the pulling arm. Pull elbow down and in with full ROM. Great unilateral lat activation and posture control.","steps":["Set a high pulley, kneel on the knee opposite to the working arm and take the handle with one hand.","Pull the elbow down and in toward the hip, keeping the torso tall.","Control the handle back up for a full lat stretch."],"equipment":["Cable"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"hammer-curl","name":"Hammer Curl","group":"Arms","primary":"Biceps","secondary":["Forearms"],"split":"pull","pattern":"Curl","focus":"Forearms","guide":"Neutral grip curl. Focus on brachialis and forearm mass. Keep upper arms tight and wrists aligned.","steps":["Stand up with your torso upright and a dumbbell on each hand being held at arms length. The elbows should be close to the torso.","The palms of the hands should be facing your torso. This will be your starting position.","Now, while holding your upper arm stationary, exhale and curl the weight forward while contracting the biceps. Continue to raise the weight until the biceps are fully contracted and the dumbbell is at shoulder level. Hold the contracted position for a brief moment as you squeeze the biceps. Tip: Focus on keeping the elbow stationary and only moving your forearm.","After the brief pause, inhale and slowly begin the lower the dumbbells back down to the starting position."],"equipment":["Dumbbell","Cable","Band"],"metric":"reps","level":"beginner","src":"both"},{"id":"handstand-push-up","name":"Handstand Push-Up","group":"Shoulders","primary":"Front Delts","secondary":["Triceps","Side Delts"],"split":"push","pattern":"Calisthenics","focus":"Full Delts","guide":"Press bodyweight vertically using shoulders and triceps. Keep core tight, elbows tracking inward. Use wall for support if needed.","steps":["With your back to the wall bend at the waist and place both hands on the floor at shoulder width.","Kick yourself up against the wall with your arms straight. Your body should be upside down with the arms and legs fully extended. Keep your whole body as straight as possible. Tip: If doing this for the first time, have a spotter help you. Also, make sure that you keep facing the wall with your head, rather than looking down.","Slowly lower yourself to the ground as you inhale until your head almost touches the floor. Tip: It is of utmost importance that you come down slow in order to avoid head injury.","Push yourself back up slowly as you exhale until your elbows are nearly locked."],"equipment":["Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"expert","src":"both"},{"id":"hang-clean","name":"Hang Clean","group":"Full Body","primary":"Quads","secondary":["Biceps","Calves","Forearms","Glutes","Lower Back"],"split":"full","pattern":"Olympic","focus":"Quads","guide":null,"steps":["Begin with a shoulder width, double overhand or hook grip, with the bar hanging at the mid thigh position. Your back should be straight and inclined slightly forward.","Begin by aggressively extending through the hips, knees and ankles, driving the weight upward. As you do so, shrug your shoulders towards your ears.","Immediately recover by driving through the heels, keeping the torso upright and elbows up. Continue until you have risen to a standing position."],"equipment":["Kettlebell","Barbell","Smith Machine"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"hang-snatch","name":"Hang Snatch","group":"Full Body","primary":"Hamstrings","secondary":["Abs","Calves","Forearms","Glutes","Lower Back"],"split":"full","pattern":"Olympic","focus":"Hamstrings","guide":null,"steps":["Begin with a wide grip on the bar, with an overhand or hook grip. The feet should be directly below the hips with the feet turned out. Your knees should be slightly bent, and the torso inclined forward. The spine should be fully extended and the head facing forward. The bar should be at the hips. This will be your starting position.","Aggressively extend through the legs and hips. At peak extension, shrug the shoulders and allow the elbows to flex to the side.","As you move your feet into the receiving position, forcefully pull yourself below the bar as you elevate the bar overhead. Receive the bar with your body as low as possible and the arms fully extended overhead.","Return to a standing position with the weight overhead. Follow by returning the weight to the ground under control."],"equipment":["Barbell"],"metric":"reps","level":"expert","src":"freedb"},{"id":"hanging-leg-raise","name":"Hanging Leg Raise","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Leg Raise","focus":"Lower Abs","guide":"Hang from bar, raise legs to 90° or higher. Avoid swinging and keep pelvis tucked under at top for lower ab activation.","steps":["Hang from a chin-up bar with both arms extended at arms length in top of you using either a wide grip or a medium grip. The legs should be straight down with the pelvis rolled slightly backwards. This will be your starting position.","Raise your legs until the torso makes a 90-degree angle with the legs. Exhale as you perform this movement and hold the contraction for a second or so.","Go back slowly to the starting position as you breathe in."],"equipment":["Bodyweight","Weighted Bodyweight"],"metric":"reps","level":"expert","src":"both"},{"id":"heavy-bag-thrust","name":"Heavy Bag Thrust","group":"Full Body","primary":"Mid Chest","secondary":["Abs","Front Delts","Triceps"],"split":"full","pattern":"Other","focus":"Mid Chest","guide":null,"steps":["Utilize a heavy bag for this exercise. Assume an upright stance next to the bag, with your feet staggered, fairly wide apart. Place your hand on the bag at about chest height. This will be your starting position.","Begin by twisting at the waist, pushing the bag forward as hard as possible. Perform this move quickly, pushing the bag away from your body.","Receive the bag as it swings back by reversing these steps."],"equipment":["Other"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"heel-touch","name":"Heel Touch","group":"Core","primary":"Obliques","secondary":[],"split":"core","pattern":"Other","focus":"Obliques","guide":null,"steps":["Lie on the floor with the knees bent and the feet on the floor around 18-24 inches apart. Your arms should be extended by your side. This will be your starting position.","Crunch over your torso forward and up about 3-4 inches to the right side and touch your right heel as you hold the contraction for a second. Exhale while performing this movement.","Now go back slowly to the starting position as you inhale.","Now crunch over your torso forward and up around 3-4 inches to the left side and touch your left heel as you hold the contraction for a second. Exhale while performing this movement and then go back to the starting position as you inhale. Now that both heels have been touched, that is considered 1 repetition.","Continue alternating sides in this manner until all prescribed repetitions are done."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"heel-elevated-goblet-squat","name":"Heel-Elevated Goblet Squat","group":"Legs","primary":"Quads","secondary":["Glutes"],"split":"legs","pattern":"Squat","focus":"Quads","guide":"Elevating heels and using a goblet hold maximizes quad bias with less spinal loading.","steps":["Place your heels on a plate or wedge and hold a dumbbell or kettlebell at the chest.","Sit straight down between the knees, keeping the chest tall and the knees tracking forward.","Drive up through the whole foot."],"equipment":["Dumbbell","Kettlebell"],"metric":"reps","level":"beginner","src":"ivan"},{"id":"hex-press","name":"Hex Press","group":"Chest","primary":"Mid Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Press","focus":"Mid Chest","guide":"Hold weights together through entire range, emphasizing chest squeeze.","steps":["Lie on a bench holding two dumbbells pressed together above the chest, palms facing in.","Keep squeezing the dumbbells together and lower them to the chest.","Press up while maintaining the squeeze."],"equipment":["Dumbbell"],"metric":"reps","level":"beginner","src":"ivan"},{"id":"high-cable-curl","name":"High Cable Curl","group":"Arms","primary":"Biceps","secondary":["Forearms"],"split":"pull","pattern":"Curl","focus":"Biceps","guide":"Arms outstretched in a “double biceps” pose. Constant tension from the cable makes this excellent for peak work.","steps":["Stand between a couple of high pulleys and grab a handle in each arm. Position your upper arms in a way that they are parallel to the floor with the palms of your hands facing you. This will be your starting position.","Curl the handles towards you until they are next to your ears. Make sure that as you do so you flex your biceps and exhale. The upper arms should remain stationary and only the forearms should move. Hold for a second in the contracted position as you squeeze the biceps.","Slowly bring back the arms to the starting position."],"equipment":["Cable"],"metric":"reps","level":"intermediate","src":"both"},{"id":"high-pull","name":"High Pull","group":"Back","primary":"Traps","secondary":["Side Delts","Upper Back"],"split":"pull","pattern":"Pull","focus":"Traps","guide":"Explosive upright row variation. Pull bar or handles to upper chest height using traps and delts. Keep wrists neutral and elbows high.","steps":["Hold a barbell at mid-thigh with a shoulder-width grip and a slight knee bend.","Extend the hips and shrug, pulling the bar up toward the upper chest with the elbows high and outside the wrists.","Lower the bar back to the thighs under control and reset."],"equipment":["Barbell","Dumbbell","Kettlebell","Cable"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"high-row","name":"High Row","group":"Back","primary":"Lats","secondary":["Upper Back","Rear Delts","Biceps"],"split":"pull","pattern":"Row","focus":"Upper Lats/Mid-back/Rear Delts","guide":"Use a machine where handles are set high and angled slightly. Pull elbows down and back at a 45° angle. Great for upper lat and rear delt engagement without lower back stress.","steps":["Select the appropriate weight using a pulley that is above your head. Attach a rope to the cable and kneel a couple of feet away, holding the rope out in front of you with both arms extended. This will be your starting position.","Initiate the movement by flexing the elbows and fully retracting your shoulders, pulling the rope toward your upper chest with your elbows out.","After pausing briefly, slowly return to the starting position."],"equipment":["Machine","Cable"],"metric":"reps","level":"beginner","src":"both"},{"id":"high-bar-squat","name":"High-Bar Squat","group":"Legs","primary":"Quads","secondary":["Calves","Glutes","Hamstrings"],"split":"legs","pattern":"Squat","focus":"Quads","guide":null,"steps":["Begin with a barbell supported on top of the traps. The chest should be up, and the head facing forward. Adopt a hip width stance with the feet turned out as needed.","Descend by flexing the knees, refraining from moving the hips back as much as possible. This requires that the knees travel forward; ensure that they stay aligned with the feet. The goal is to keep the torso as upright as possible. Continue all the way down, keeping the weight on the front of the heel.","At the moment the upper legs contact the lower, reverse the motion, driving the weight upward."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"hiking","name":"Hiking","group":"Cardio","primary":null,"secondary":[],"split":"cardio","pattern":"Outdoor Terrain","focus":"Legs, Core","guide":"Involves varied terrain and elevation. Builds leg endurance and improves heart rate with minimal impact.","steps":["Running or hiking on trails will get the blood pumping and heart beating almost immediately. Make sure you have good shoes. While you use the muscles in your calves and buttocks to pull yourself up a hill, the knees, joints and ankles absorb the bulk of the pounding coming back down. Take smaller steps as you walk downhill, keep your knees bent to reduce the impact and slow down to avoid falling.","A 150 lb person can burn over 200 calories for 30 minutes walking uphill, compared to 175 on a flat surface. If running the trail, a 150 lb person can burn well over 500 calories in 30 minutes."],"equipment":["Outdoor"],"metric":"duration","level":"beginner","src":"both"},{"id":"hip-abduction","name":"Hip Abduction","group":"Legs","primary":"Abductors","secondary":[],"split":"legs","pattern":"Isolation","focus":"Abductors","guide":"Push knees outward against pads. Lean slightly forward to engage glute medius more.","steps":["To begin, sit down on the abductor machine and select a weight you are comfortable with. When your legs are positioned properly, grip the handles on each side. Your entire upper body (from the waist up) should be stationary. This is the starting position.","Slowly press against the machine with your legs to move them away from each other while exhaling.","Feel the contraction for a second and begin to move your legs back to the starting position while breathing in. Note: Remember to keep your upper body stationary to prevent any injuries from occurring."],"equipment":["Machine"],"metric":"reps","level":"beginner","src":"both"},{"id":"hip-adduction","name":"Hip Adduction","group":"Legs","primary":"Adductors","secondary":[],"split":"legs","pattern":"Isolation","focus":"Adductors","guide":"Sit with knees apart and squeeze inward using inner thighs. Pause at peak contraction.","steps":["To begin, sit down on the adductor machine and select a weight you are comfortable with. When your legs are positioned properly on the leg pads of the machine, grip the handles on each side. Your entire upper body (from the waist up) should be stationary. This is the starting position.","Slowly press against the machine with your legs to move them towards each other while exhaling.","Feel the contraction for a second and begin to move your legs back to the starting position while breathing in. Note: Remember to keep your upper body stationary and avoid fast jerking motions in order to prevent any injuries from occurring."],"equipment":["Machine"],"metric":"reps","level":"beginner","src":"both"},{"id":"hip-thrust","name":"Hip Thrust","group":"Legs","primary":"Glutes","secondary":["Hamstrings"],"split":"legs","pattern":"Hinge","focus":"Glutes","guide":"Upper back on bench, bar over hips. Drive through heels and squeeze glutes at top. Keep ribs down to avoid lumbar extension.","steps":["Begin seated on the ground with a bench directly behind you. Have a loaded barbell over your legs. Using a fat bar or having a pad on the bar can greatly reduce the discomfort caused by this exercise.","Roll the bar so that it is directly above your hips, and lean back against the bench so that your shoulder blades are near the top of it.","Begin the movement by driving through your feet, extending your hips vertically through the bar. Your weight should be supported by your shoulder blades and your feet. Extend as far as possible, then reverse the motion to return to the starting position."],"equipment":["Barbell","Machine","Smith Machine","Dumbbell","Band"],"metric":"reps","level":"intermediate","src":"both"},{"id":"hollow-body-hold","name":"Hollow Body Hold","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Calisthenics","focus":"Full Core","guide":"Lie on back, lift legs and shoulders off floor with lower back pressed down. Hold position while maintaining tight hollow shape.","steps":["Lie on your back and press the lower back into the floor.","Lift the shoulders and straighten the legs a few inches off the floor, arms by the ears.","Hold the shape, breathing, with no arch in the lower back. Bend the knees if the back lifts."],"equipment":["Bodyweight"],"metric":"time","level":"intermediate","src":"ivan"},{"id":"hurdle-hop","name":"Hurdle Hop","group":"Legs","primary":"Hamstrings","secondary":["Abductors","Adductors","Calves","Glutes"],"split":"legs","pattern":"Plyometric","focus":"Hamstrings","guide":null,"steps":["Set up a row of hurdles or other small barriers, placing them a few feet apart.","Stand in front of the first hurdle with your feet shoulder width apart. This will be your starting position.","Begin by jumping with both feet over the first hurdle, swinging both arms as you jump.","Absorb the impact of landing by bending the knees, rebounding out of the first leap by jumping over the next hurdle. Continue until you have jumped over all of the hurdles."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"incline-press","name":"Incline Bench Press","group":"Chest","primary":"Upper Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Press","focus":"Upper Chest","guide":"Set bench to 30–45°. Use medium-width grip, elbows tucked, wrists stacked over forearms. Retract scapula and brace core for stable pressing.","steps":["Lie back on an incline bench. Using a medium-width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on you upper chest.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms in the contracted position, squeeze your chest, hold for a second and then start coming down slowly again. Tip: it should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."],"equipment":["Dumbbell","Barbell","Machine","Smith Machine"],"metric":"reps","level":"beginner","src":"both"},{"id":"incline-cable-press","name":"Incline Cable Press","group":"Chest","primary":"Upper Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Other","focus":"Upper Chest","guide":null,"steps":["Adjust the weight to an appropriate amount and be seated, grasping the handles. Your upper arms should be about 45 degrees to the body, with your head and chest up. The elbows should be bent to about 90 degrees. This will be your starting position.","Begin by extending through the elbow, pressing the handles together straight in front of you. Keep your shoulder blades retracted as you execute the movement.","After pausing at full extension, return to the starting position, keeping tension on the cables."],"equipment":["Cable"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"incline-curl","name":"Incline Curl","group":"Arms","primary":"Biceps","secondary":["Forearms"],"split":"pull","pattern":"Curl","focus":"Biceps","guide":"Performed seated on incline bench. Emphasizes stretch at bottom; reduces shoulder involvement. Keep upper arms perpendicular to floor.","steps":["Lie against an incline bench, with your arms holding a barbell and hanging down in a horizontal line. This will be your starting position.","While keeping the upper arms stationary, curl the weight up as high as you can while squeezing the biceps. Breathe out as you perform this portion of the movement. Tip: Only the forearms should move. Do not swing the arms.","After a second contraction, slowly go back to the starting position as you inhale. Tip: Make sure that you go all of the way down."],"equipment":["Dumbbell","Cable","Barbell"],"metric":"reps","level":"beginner","src":"both"},{"id":"incline-fly","name":"Incline Fly","group":"Chest","primary":"Upper Chest","secondary":["Front Delts"],"split":"push","pattern":"Fly","focus":"Upper Chest","guide":"On 30–45° incline, lower arms in a wide arc. Keep soft elbow bend. Focus on stretch and full contraction.","steps":["Hold a dumbbell on each hand and lie on an incline bench that is set to an incline angle of no more than 30 degrees.","Extend your arms above you with a slight bend at the elbows.","Now rotate the wrists so that the palms of your hands are facing you. Tip: The pinky fingers should be next to each other. This will be your starting position.","As you breathe in, start to slowly lower the arms to the side while keeping the arms extended and while rotating the wrists until the palms of the hand are facing each other. Tip: At the end of the movement the arms will be by your side with the palms facing the ceiling.","As you exhale start to bring the dumbbells back up to the starting position by reversing the motion and rotating the hands so that the pinky fingers are next to each other again. Tip: Keep in mind that the movement will only happen at the shoulder joint and at the wrist. There is no motion that happens at the elbow joint."],"equipment":["Cable","Dumbbell","Machine"],"metric":"reps","level":"beginner","src":"both"},{"id":"incline-fly-with-twist","name":"Incline Fly with Twist","group":"Chest","primary":"Upper Chest","secondary":["Front Delts"],"split":"push","pattern":"Fly","focus":"Upper Chest","guide":null,"steps":["Hold a dumbbell in each hand and lie on an incline bench that is set to an incline angle of no more than 30 degrees.","Extend your arms above you with a slight bend at the elbows.","Now rotate the wrists so that the palms of your hands are facing you. Tip: The pinky fingers should be next to each other. This will be your starting position.","As you breathe in, start to slowly lower the arms to the side while keeping the arms extended and while rotating the wrists until the palms of the hand are facing each other. Tip: At the end of the movement the arms will be by your side with the palms facing the ceiling.","As you exhale start to bring the dumbbells back up to the starting position by reversing the motion and rotating the hands so that the pinky fingers are next to each other again. Tip: Keep in mind that the movement will only happen at the shoulder joint and at the wrist. There is no motion that happens at the elbow joint."],"equipment":["Dumbbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"incline-front-raise","name":"Incline Front Raise","group":"Shoulders","primary":"Front Delts","secondary":["Traps"],"split":"push","pattern":"Raise","focus":"Front Delts","guide":null,"steps":["Place a bar on the ground behind the head of an incline bench.","Lay on the bench face down. With a pronated grip, pick the barbell up from the floor, keeping your arms straight. Allow the bar to hang straight down. This will be your starting position.","To begin, raise the barbell out in front of your head while keeping your arms extended.","Return to the starting position."],"equipment":["Dumbbell","Barbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"incline-hammer-curl","name":"Incline Hammer Curl","group":"Arms","primary":"Biceps","secondary":[],"split":"pull","pattern":"Curl","focus":"Biceps","guide":null,"steps":["Seat yourself on an incline bench with a dumbbell in each hand. You should pressed firmly against he back with your feet together. Allow the dumbbells to hang straight down at your side, holding them with a neutral grip. This will be your starting position.","Initiate the movement by flexing at the elbow, attempting to keep the upper arm stationary.","Continue to the top of the movement and pause, then slowly return to the start position."],"equipment":["Dumbbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"incline-lateral-raise","name":"Incline Lateral Raise","group":"Shoulders","primary":"Side Delts","secondary":[],"split":"push","pattern":"Raise","focus":"Side Delts","guide":null,"steps":["Lie down sideways on an incline bench press with a dumbbell in the hand. Make sure the shoulder is pressing against the incline bench and the arm is lying across your body with the palm around your navel.","Hold a dumbbell in your uppermost arm while keeping it extended in front of you parallel to the floor. This is your starting position.","While keeping the dumbbell parallel to the floor at all times, perform a lateral raise. Your arm should travel straight up until it is pointing at the ceiling. Tip: Exhale as you perform this movement. Hold the dumbbell in the position and feel the contraction in the shoulders for a second.","While inhaling lower the weight across your body back into the starting position.","Repeat the movement for the prescribed amount of repetitions.","Switch arms and repeat the movement."],"equipment":["Dumbbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"incline-push-up","name":"Incline Push-Up","group":"Chest","primary":"Upper Chest","secondary":[],"split":"push","pattern":"Calisthenics","focus":"Upper Chest","guide":"Feet on floor, hands elevated. Reduces load and emphasizes upper chest development.","steps":["Stand facing bench or sturdy elevated platform. Place hands on edge of bench or platform, slightly wider than shoulder width.","Position forefoot back from bench or platform with arms and body straight. Arms should be perpendicular to body. Keeping body straight, lower chest to edge of box or platform by bending arms.","Push body up until arms are extended. Repeat."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"beginner","src":"both"},{"id":"incline-shoulder-raise","name":"Incline Shoulder Raise","group":"Shoulders","primary":"Front Delts","secondary":["Upper Chest","Triceps"],"split":"push","pattern":"Raise","focus":"Front Delts","guide":null,"steps":["Lie back on an Incline Bench. Using a medium width grip (a grip that is slightly wider than shoulder width), lift the bar from the rack and hold it straight over you with your arms straight. This will be your starting position.","While keeping the arms straight, lift the bar by protracting your shoulder blades, raising the shoulders from the bench as you breathe out.","Bring back the bar to the starting position as you breathe in."],"equipment":["Barbell","Dumbbell","Smith Machine"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"incline-skullcrusher","name":"Incline Skullcrusher","group":"Arms","primary":"Triceps","secondary":[],"split":"push","pattern":"Extension","focus":"Triceps","guide":"Done on incline bench to increase long head stretch. Elbows stay fixed. Don't lock out harshly at top.","steps":["Hold a barbell with an overhand grip (palms down) that is a little closer together than shoulder width.","Lie back on an incline bench set at any angle between 45-75-degrees.","Bring the bar overhead with your arms extended and elbows in. The arms should be in line with the torso above the head. This will be your starting position.","Now lower the bar in a semicircular motion behind your head until your forearms touch your biceps. Inhale as you perform this movement. Tip: Keep your upper arms stationary and close to your head at all times. Only the forearms should move.","Return to the starting position as you breathe out and you contract the triceps. Hold the contraction for a second."],"equipment":["EZ Bar","Dumbbell","Cable","Barbell"],"metric":"reps","level":"intermediate","src":"both"},{"id":"inner-biceps-curl","name":"Inner-Biceps Curl","group":"Arms","primary":"Biceps","secondary":[],"split":"pull","pattern":"Curl","focus":"Biceps","guide":null,"steps":["Stand up with a dumbbell in each hand being held at arms length. The elbows should be close to the torso. Your legs should be at about shoulder's width apart from each other.","Rotate the palms of the hands so that they are facing inward in a neutral position. This will be your starting position.","While holding the upper arms stationary, curl the weights out while contracting the biceps as you breathe out. Your wrist should turn so that when the weights are fully elevated you have supinated grip (palms facing up).","Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Tip: Keep the forearms aligned with your outer deltoids.","Hold the contracted position for a second as you squeeze the biceps.","Slowly begin to bring the dumbbells back to the starting position as your breathe in. Remember to rotate the wrists as you lower the weight in order to switch back to a neutral grip."],"equipment":["Dumbbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"internal-rotation","name":"Internal Rotation","group":"Shoulders","primary":"Rear Delts","secondary":[],"split":"pull","pattern":"Raise","focus":"Rear Delts","guide":null,"steps":["Sit next to a low pulley sideways (with legs stretched in front of you or crossed) and grasp the single hand cable attachment with the arm nearest to the cable. Tip: If you can adjust the pulley's height, you can use a flat bench to sit on instead.","Position the elbow against your side with the elbow bent at 90° and the arm pointing towards the pulley. This will be your starting position.","Pull the single hand cable attachment toward your body by internally rotating your shoulder until your forearm is across your abs. You will be creating an imaginary semi-circle. Tip: The forearm should be perpendicular to your torso at all times.","Slowly go back to the initial position."],"equipment":["Cable","Band"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"inverted-row","name":"Inverted Row","group":"Back","primary":"Upper Back","secondary":["Lats","Biceps","Rear Delts"],"split":"pull","pattern":"Horizontal Row","focus":"Mid Back","guide":"Bodyweight row with feet on floor or bench. Keep body straight and row chest to bar. Adjust angle to increase difficulty.","steps":["Position a bar in a rack to about waist height. You can also use a smith machine.","Take a wider than shoulder width grip on the bar and position yourself hanging underneath the bar. Your body should be straight with your heels on the ground with your arms fully extended. This will be your starting position.","Begin by flexing the elbow, pulling your chest towards the bar. Retract your shoulder blades as you perform the movement.","Pause at the top of the motion, and return yourself to the start position."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight","Suspension"],"metric":"reps","level":"beginner","src":"both"},{"id":"iron-cross-raise","name":"Iron Cross Raise","group":"Shoulders","primary":"Side Delts","secondary":["Mid Chest","Glutes","Hamstrings","Lower Back","Quads"],"split":"push","pattern":"Fly","focus":"Side Delts","guide":null,"steps":["Stand holding light dumbbells at your sides.","Raise the arms out to the sides to shoulder height, then lift them a little higher so the body forms a cross.","Hold briefly, then lower slowly. Use very light weight and keep the shoulders down."],"equipment":["Dumbbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"isometric-chest-hold","name":"Isometric Chest Hold","group":"Chest","primary":"Mid Chest","secondary":[],"split":"push","pattern":"Isometric","focus":"Full Chest","guide":"Hold arms extended and actively squeeze pecs together. Increases mind-muscle connection and internal tension.","steps":["While either seating or standing, bend your arms at a 90-degree angle and place the palms of your hands together in front of your chest. Tip: Your hands should be open with the palms together and fingers facing forward (perpendicular to your torso).","Push both hands against each other as you contract your chest. Start with slow tension and increase slowly. Keep breathing normally as you execute this contraction.","Hold for the recommended number of seconds.","Now release the tension slowly.","Rest for the recommended amount of time and repeat."],"equipment":["Bodyweight","Plate"],"metric":"time","level":"beginner","src":"both"},{"id":"isometric-neck-hold","name":"Isometric Neck Hold","group":"Back","primary":"Neck","secondary":[],"split":"pull","pattern":"Stability","focus":"Neck","guide":null,"steps":["With your head and neck in a neutral position (normal position with head erect facing forward), place your left hand on the left side of your head.","Now gently push towards the left as you contract the left neck muscles but resisting any movement of your head. Start with slow tension and increase slowly. Keep breathing normally as you execute this contraction.","Hold for the recommended number of seconds.","Now release the tension slowly.","Rest for the recommended amount of time and repeat with your right hand placed on the right side of your head."],"equipment":["Bodyweight"],"metric":"time","level":"beginner","src":"freedb"},{"id":"isometric-squeeze-press","name":"Isometric Squeeze Press","group":"Chest","primary":"Mid Chest","secondary":["Front Delts"],"split":"push","pattern":"Fly","focus":"Mid Chest","guide":"Hold weights together at full extension and squeeze chest hard for time under tension.","steps":["Lie on a bench and press two dumbbells to full extension above the chest, palms facing in.","Squeeze the dumbbells hard together and hold, keeping the arms locked out.","Hold for time, then lower the weights with control."],"equipment":["Dumbbell"],"metric":"reps","level":"beginner","src":"ivan"},{"id":"janda-sit-up","name":"Janda Sit-Up","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Crunch","focus":"Abs","guide":null,"steps":["Position your body on the floor in the basic sit-up position; knees to a ninety degree angle with feet flat on the floor and arms either crossed over your chest or to the sides. This will be your starting position.","As you strongly tighten your glutes and hamstrings, fill your lungs with air and in a slow (three to six second count) ascent, slowly exhale. Tip: It is important to tighten the glutes and hamstrings as this will cause the hip flexors to be inactivated in a process called reciprocal inhibition, which basically means that opposite muscles to the contracted ones will relax.","As you inhale, slowly go back in a controlled manner to the starting position."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"jefferson-squat","name":"Jefferson Squat","group":"Legs","primary":"Quads","secondary":["Glutes"],"split":"legs","pattern":"Squat","focus":"Quads/Glutes","guide":"Straddle the barbell and squat with torso twist. Hits adductors, glutes, and quads in a unique range.","steps":["Place a barbell on the floor.","Stand in the middle of the bar length wise.","Bend down by bending at the knees and keeping your back straight and grasp the front of the bar with your right hand. Your palm should be in (neutral grip) facing the left side.","Grasp the rear of the bar with your left hand. The palm of your hand should be in neutral grip alignment (palms facing the right side). Tip: Ensure that your grip is even on the bar. Your torso should be positioned right in the middle of the bar and the distance between your torso and your right hand (which should be at the front) should be the same as the distance between your torso and your left hand (which should be to your back).","Now stand straight up with the weight. Tip: Your feet should be shoulder width apart and your toes slightly pointed out.","Squat down by bending at the knees and keeping your back straight until your upper thighs are parallel with the floor. Tip: Keep your back as vertical as possible with the floor and your head up. Also remember to not let your knees go past your toes. Inhale during this portion of the movement.","Now drive yourself back up to the starting position by pushing with the feet . Tip: Keep the bar hanging at arm's length and your elbows locked with a slight bend. The arms only serve as hooks. Avoid doing any lifting with them. Do the lifting with your thighs; not your arms."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"both"},{"id":"jerk-balance","name":"Jerk Balance","group":"Shoulders","primary":"Front Delts","secondary":["Glutes","Hamstrings","Quads","Triceps"],"split":"push","pattern":"Overhead Press","focus":"Front Delts","guide":null,"steps":["This drill helps you learn to drive yourself low enough during the jerk and corrects those who move backward during the movement. Begin with the bar racked in the jerk position, with the shoulders forward, torso upright, and the feet split slightly apart.","Initiate the movement as you would a normal jerk, dipping at the knees while keeping your torso vertical, and driving back up forcefully, using momentum and not your arms to elevate the weight.","Keep the rear foot in place, using it to drive your body forward into a full split as you jerk the weight. Recover by standing up with the weight overhead."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"jm-press","name":"JM Press","group":"Arms","primary":"Triceps","secondary":["Mid Chest"],"split":"push","pattern":"Press","focus":"Triceps","guide":"Hybrid of close-grip bench and skullcrusher. Lower bar to just above neck or chin, then press. Great long head activation.","steps":["Start the exercise the same way you would a close grip bench press. You will lie on a flat bench while holding a barbell at arms length (fully extended) with the elbows in. However, instead of having the arms perpendicular to the torso, make sure the bar is set in a direct line above the upper chest. This will be your starting position.","Now beginning from a fully extended position lower the bar down as if performing a lying triceps extension. Inhale as you perform this movement. When you reach the half way point, let the bar roll back about one inch by moving the upper arms towards your legs until they are perpendicular to the torso. Tip: Keep the bend at the elbows constant as you bring the upper arms forward.","As you exhale, press the bar back up by using the triceps to perform a close grip bench press.","Now go back to the starting position and start over."],"equipment":["Barbell","Smith Machine","EZ Bar"],"metric":"reps","level":"beginner","src":"both"},{"id":"jump-rope","name":"Jump Rope","group":"Cardio","primary":null,"secondary":[],"split":"cardio","pattern":"Calisthenics / Bodyweight","focus":"Full Body","guide":"Jump with soft knees. Keep wrists relaxed and use quick rotations. Improves foot speed, coordination, and endurance.","steps":["Hold an end of the rope in each hand. Position the rope behind you on the ground. Raise your arms up and turn the rope over your head bringing it down in front of you. When it reaches the ground, jump over it. Find a good turning pace that can be maintained. Different speeds and techniques can be used to introduce variation.","Rope jumping is exciting, challenges your coordination, and requires a lot of energy. A 150 lb person will burn about 350 calories jumping rope for 30 minutes, compared to over 450 calories running."],"equipment":["Other"],"metric":"duration","level":"intermediate","src":"both"},{"id":"jump-squat","name":"Jump Squat","group":"Legs","primary":"Quads","secondary":[],"split":"legs","pattern":"Calisthenics","focus":"Full Legs","guide":"Explode up from squat and land softly. Builds lower-body power and fast-twitch muscle.","steps":["Cross your arms over your chest.","With your head up and your back straight, position your feet at shoulder width.","Keeping your back straight and chest up, squat down as you inhale until your upper thighs are parallel, or lower, to the floor.","Now pressing mainly with the ball of your feet, jump straight up in the air as high as possible, using the thighs like springs. Exhale during this portion of the movement.","When you touch the floor again, immediately squat down and jump again."],"equipment":["Bodyweight","Dumbbell","Barbell"],"metric":"reps","level":"intermediate","src":"both"},{"id":"jumping-jacks","name":"Jumping Jacks","group":"Cardio","primary":null,"secondary":[],"split":"cardio","pattern":"Plyometrics","focus":"Glutes, Quads, Calves","guide":"Basic plyometric movement. Keep pace steady and land softly. Good for warm-up or light conditioning.","steps":["Stand with the feet together and arms at your sides.","Jump the feet out wide while raising the arms overhead.","Jump back to the start at a steady pace and land softly on the balls of the feet."],"equipment":["Bodyweight"],"metric":"duration","level":"beginner","src":"ivan"},{"id":"kang-squat","name":"Kang Squat","group":"Legs","primary":"Glutes","secondary":["Hamstrings","Quads"],"split":"legs","pattern":"Squat/Hinge Hybrid","focus":"Glutes/Hamstrings","guide":"Combines good morning + squat. Builds posterior chain strength and squat stability.","steps":["Set a barbell on the upper back, feet shoulder width apart.","Do a good morning: push the hips back and lower the torso until it is nearly parallel to the floor.","Return to upright, then squat down and stand up. That is one rep; use a light load."],"equipment":["Barbell"],"metric":"reps","level":"expert","src":"ivan"},{"id":"kas-glute-bridge","name":"Kas Glute Bridge","group":"Legs","primary":"Glutes","secondary":["Hamstrings"],"split":"legs","pattern":"Hinge","focus":"Glutes","guide":"Small ROM, high glute tension. Less hamstring involvement than hip thrust. Pause at top for max burn.","steps":["Lie on your back with a barbell over the hips and the knees bent. Keep the feet flat.","Drive the hips up to the top and stop before the lower back arches.","Lower only partway and keep the glutes under tension. Pause at the top."],"equipment":["Barbell","Smith Machine"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"keg-load","name":"Keg Load","group":"Full Body","primary":"Lower Back","secondary":["Abs","Biceps","Calves","Forearms","Glutes"],"split":"full","pattern":"Other","focus":"Lower Back","guide":null,"steps":["To load kegs, place the desired number a distance from the loading platform, typically 30-50 feet.","Begin by grabbing the close handle of the first keg, tilting it onto its side to grab the opposite edge of the bottom of the keg. Lift the keg up to your chest.","The higher you can place the keg, the faster you should be able to move to the platform. Shouldering is usually not allowed. Be sure to keep a firm hold on the keg. Move as quickly as possible to the platform, and load it, extending through your hips, knees, and ankles to get it as high as possible.","Return to the starting position to retrieve the next keg, and repeat until the event is completed."],"equipment":["Strongman"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"kettlebell-figure-8","name":"Kettlebell Figure 8","group":"Core","primary":"Obliques","secondary":["Hamstrings","Front Delts","Glutes"],"split":"core","pattern":"Rotation","focus":"Obliques","guide":null,"steps":["Place one kettlebell between your legs and take a wider than shoulder width stance. Bend over by pushing your butt out and keeping your back flat.","Pick up a kettlebell and pass it to your other hand between your legs. The receiving hand shoul
