function strongDefault(n, sug){
  var eq=STRONG.equipmentOf(n);
  if(sug.length && sug[0].score>=0.7) return {id:sug[0].m.id, eq:sug[0].eq};
  var g=STRONG.guessGroup(n), base=STRONG.splitName(n).base.replace(/\s+/g,' ').trim() || n.trim();
  return {create:true, name:base, group:g.group, primary:g.primary, eq:eq||'Other'};
}
function strongRows(P){
  var moves=allMoves(), sb=STRONG.setsByName(P), rows=[], sets={};
  P.workouts.forEach(function(w){ var t=P.todo[w.id]; if(!t) return;
    w.exercises.forEach(function(e){ if(t.indexOf(e.strong)>=0) sets[e.strong]=(sets[e.strong]||0)+e.sets.length; }); });
  Object.keys(sets).forEach(function(n){
    var saved=(ST.strongMap||{})[n], sug=STRONG.suggest(n, moves, 4), choice, auto=false, was=false;
    if(saved && saved.skip){ choice=strongDefault(n, sug); was=true; }
    else if(saved && saved.id && MV[saved.id]){ choice={id:saved.id, eq:saved.eq||STRONG.equipmentOf(n)}; auto=true; }
    else if(sug.length && sug[0].score>=0.88){ choice={id:sug[0].m.id, eq:sug[0].eq}; auto=true; }
    else choice=strongDefault(n, sug);
    rows.push({name:n, sets:sets[n], sug:sug, choice:choice, def:JSON.parse(JSON.stringify(choice)), auto:auto, wasSkipped:was, touched:false, metric:STRONG.metricOfSets(sb[n]||[])});

function focusAdds(m){
  if(!m.focus || !m.primary || m.focus.toLowerCase()===m.primary.toLowerCase()) return false;

function lineChart(pts, unit, eq, hlId, o){
  o=o||{};
  var box=h('div',{class:'plot',style:{marginTop:'12px'}});
  if(!pts.length){ box.appendChild(h('div',{class:'note',text:'No values recorded for this view yet.'})); return box; }
  var W=640, H=220, pad={t:24,r:46,b:26,l:44};
  var vals=pts.map(function(p){return p.v;}), lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals);

  if(minV>=0 && lo<0) lo=0;     /* weights and volume never go below zero */
  var n=pts.length;
  function X(i){ return n===1 ? (pad.l+W-pad.r)/2 : pad.l+i*(W-pad.l-pad.r)/(n-1); }
  function Y(v){ return pad.t+(hi-v)/(hi-lo)*(H-pad.t-pad.b); }
  var s=sv('svg',{class:'lc',viewBox:'0 0 '+W+' '+H,width:W,height:H,role:'img','aria-label':'Progress over '+n+' sessions'});
  s.style.width='100%';
  for(var g=0; g<=4; g++){ var v=lo+(hi-lo)*g/4, y=Y(v); s.appendChild(sv('line',{class:'grid',x1:pad.l,x2:W-pad.r,y1:y,y2:y}));
    var t=sv('text',{class:'tick',x:pad.l-7,y:y+3.5,'text-anchor':'end'}); t.textContent=isAssist(eq)&&(unit==='lb'||unit==='kg') ? (v<0?'−':'')+Math.abs(Math.round(v)) : Math.round(v); s.appendChild(t); }
  if(lo<0 && hi>0) s.appendChild(sv('line',{class:'zero',x1:pad.l,x2:W-pad.r,y1:Y(0),y2:Y(0)}));
  var d=''; pts.forEach(function(p,i){ d+=(i?'L':'M')+X(i)+' '+Y(p.v)+' '; });
  s.appendChild(sv('path',{class:'ar',d:d+'L'+X(n-1)+' '+(H-pad.b)+' L'+X(0)+' '+(H-pad.b)+' Z'}));
  s.appendChild(sv('path',{class:'ln',d:d}));
  var every=Math.ceil(n/7);
  var span=n>1 ? (parseISO(pts[n-1].date)-parseISO(pts[0].date))/864e5 : 0;
  function tickTxt(d){ return span>300 ? parseISO(d).toLocaleDateString(undefined,{month:'short'})+' ’'+String(parseISO(d).getFullYear()).slice(2) : fmtDate(d); }
  pts.forEach(function(p,i){ if((i%every===0 && (n-1-i)>=every*0.6) || i===n-1){ var t=sv('text',{class:'tick',x:X(i),y:H-8,'text-anchor':i===n-1&&n>1?'end':'middle'}); t.textContent=tickTxt(p.date); s.appendChild(t); } });
  pts.forEach(function(p,i){ var on=hlId && p.e && p.e.w && p.e.w.id===hlId; s.appendChild(sv('circle',{class:'dt'+(on?' hl':'')+(p.e&&p.e.record?' rec':''),cx:X(i),cy:Y(p.v),r:on?7.5:(i===n-1?6:4.5)})); });
  var lp=pts[n-1], lx=Math.min(Math.max(X(n-1),pad.l+24),W-pad.r+30);
  var et=sv('text',{class:'endl',x:lx,y:Math.max(Y(lp.v)-12,pad.t-6),'text-anchor':X(n-1)>W-pad.r-30?'end':'middle'});
  et.textContent=(isAssist(eq)&&(unit==='lb'||unit==='kg')?(lp.v===0?'0':'−'+fmtW(Math.abs(lp.v))):fmtW(lp.v))+' '+unit; s.appendChild(et);
  var cross=sv('line',{class:'cross',y1:pad.t,y2:H-pad.b,x1:-9,x2:-9}); s.appendChild(cross);
  var tip=h('div',{class:'tt'}); tip.hidden=true;
  var hit=sv('rect',{x:pad.l,y:pad.t,width:W-pad.l-pad.r,height:H-pad.t-pad.b,fill:'transparent'});
  function show(cx){
    var r=s.getBoundingClientRect(), mx=(cx-r.left)*(W/r.width), bi=0, bd=1e9;
    pts.forEach(function(p,i){ var dd=Math.abs(X(i)-mx); if(dd<bd){bd=dd;bi=i;} });
    var p=pts[bi]; cross.setAttribute('x1',X(bi)); cross.setAttribute('x2',X(bi));
    tip.hidden=false; tip.innerHTML='';
    tip.appendChild(h('b',{text:fmtDateY(p.date,{weekday:'short'})}));
    /* only the set behind the number (the whole session is one tap away in the list) */
    var M=o.M||METRIC.reps, txt;
    function one(st){ return (showW(eq,st.weight)!==''?showW(eq,st.weight)+' × ':'')+(st.amount!=null?fmtW(amtOut(o.mk||'reps',st.amount,o.mid))+(o.mk?amtShort(o.mk,o.mid):M.short):'—')+(st.rir!=null&&ST.showRir?' @'+st.rir:''); }
    if(p.how==='vol') txt=Math.round(p.v).toLocaleString()+' '+wU()+' · '+p.e.work.length+' set'+(p.e.work.length===1?'':'s');
    else if(o.metric==='e1rm' && p.best) txt=one(p.best)+' → '+Math.round(p.v);
    else txt=p.best ? one(p.best) : fmtW(p.v)+' '+unit;
    tip.appendChild(h('span',{text:txt}));
    var px=X(bi)/W*r.width; tip.style.left=Math.max(0,Math.min(px+10, r.width-170))+'px'; tip.style.top='0px';
  }
  hit.addEventListener('pointermove',function(e){ show(e.clientX); });
  hit.addEventListener('pointerdown',function(e){ show(e.clientX); });
  hit.addEventListener('pointerleave',function(){ tip.hidden=true; cross.setAttribute('x1',-9); cross.setAttribute('x2',-9); });
  s.appendChild(hit);
  box.appendChild(s); box.appendChild(tip);
  return box;
}
function openCustomForm(opts){
  opts=opts||{};
  var f={name:opts.name||'', group:'Chest', primary:'Upper Chest', secondary:[], equipment:[], metric:'reps', guide:''};
  var err=h('div',{class:'banner warn',hidden:true});
  var body=h('div',{class:'formgrid'});
  body.appendChild(err);
  body.appendChild(h('div',{class:'field'}, h('label',{text:'Name'}), h('input',{type:'text',value:f.name,placeholder:'e.g. Landmine Row',oninput:function(e){ f.name=e.target.value; }})));
  var musSel=h('select',{onchange:function(e){ f.primary=e.target.value; }});
  function fillMus(){ musSel.innerHTML=''; var g=GROUPS.find(function(x){ return x.name===f.group; });
    f.primary = g.muscles.length ? g.muscles[0] : null;
    (g.muscles.length? g.muscles : ['(whole group)']).forEach(function(m){ musSel.appendChild(h('option',{value:m,text:m})); }); musSel.disabled=!g.muscles.length; }
  body.appendChild(h('div',{class:'formrow'},
    h('div',{class:'field'}, h('label',{text:'Muscle group'}), h('select',{onchange:function(e){ f.group=e.target.value; fillMus(); }}, GROUP_NAMES.map(function(g){ return h('option',{value:g,text:g}); }))),
    h('div',{class:'field'}, h('label',{text:'Main muscle'}), musSel)));
  fillMus();
  body.appendChild(h('div',{class:'field'}, h('label',{text:'Logged as'}), h('select',{onchange:function(e){ f.metric=e.target.value; }},
      h('option',{value:'reps',text:'Weight × reps'}), h('option',{value:'time',text:'Weight × seconds'}), h('option',{value:'distance',text:'Weight × metres'}), h('option',{value:'duration',text:'Minutes'}))));
  function checks(list, arr){ return h('div',{class:'checks'}, list.map(function(x){ return h('label',null, h('input',{type:'checkbox',onchange:function(e){
    var i=arr.indexOf(x); if(e.target.checked && i<0) arr.push(x); if(!e.target.checked && i>=0) arr.splice(i,1); }}), x); })); }
  body.appendChild(h('div',{class:'field'}, h('span',{class:'flabel',text:'Equipment it can be done with'}), checks(EQUIPMENT, f.equipment)));
  body.appendChild(h('div',{class:'field'}, h('span',{class:'flabel',text:'Secondary muscles'}), checks(MUSCLES, f.secondary)));
  body.appendChild(h('div',{class:'field'}, h('label',{text:'How to perform (optional)'}), h('textarea',{oninput:function(e){ f.guide=e.target.value; }})));
  openSheet('New exercise', body, [h('button',{class:'btn',onclick:function(){ closeOverlay(); }},'Cancel'), h('button',{class:'btn primary',onclick:function(){
    var nm=f.name.trim();
    if(!nm){ err.hidden=false; err.textContent='Give the exercise a name.'; return; }
    if(allMoves().some(function(m){ return m.name.toLowerCase()===nm.toLowerCase(); })){ err.hidden=false; err.textContent='“'+nm+'” already exists — find it in the list.'; return; }
    if(!f.equipment.length){ err.hidden=false; err.textContent='Pick at least one piece of equipment.'; return; }
    var split = f.group==='Full Body' ? 'full' : f.group==='Cardio' ? 'cardio' : SPLIT_OF[f.primary];
    var m={ id:'c-'+nm.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Math.random().toString(36).slice(2,6),
      name:nm, group:f.group, split:split, primary:f.primary, secondary:f.secondary.filter(function(x){return x!==f.primary;}), focus:f.primary,
      pattern:'', guide:f.guide.trim(), steps:[], equipment:f.equipment.slice(), metric:f.metric, custom:true };
    saveCustomMove(m); closeOverlay();
    if(opts.onDone){ opts.onDone(m); toast(m.name+' created'); return; }
    ui.exDetail=m.id; render(); window.scrollTo(0,0); toast('Exercise added');
  }},'Add exercise')]);
}

/* =====================================================================
   BOOT
   ===================================================================== */
render();
initCloud();
})();
</script>
