<style>*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

:root{
  color-scheme:light;
  --ground:#f3f5f7;
  --surface:#ffffff;
  --surface-2:#eef1f4;
  --surface-3:#e4e8ec;
  --ink:#12161c;
  --ink-2:#4f5965;
  --ink-3:#848d99;
  --line:#e1e6ea;
  --line-strong:#c8d0d8;
  --accent:#1c5cab;
  --accent-ink:#1c5cab;
  --accent-soft:#e8f0fa;
  --on-accent:#ffffff;
  --series-1:#2a78d6;
  --done-bg:#e6f4e6;
  --done-ink:#0b6b0b;
  --good:#0ca30c;
  --good-ink:#006300;
  --good-soft:rgba(12,163,12,.11);
  --warn:#fab219;
  --warn-ink:#865700;
  --warn-soft:rgba(250,178,25,.16);
  --serious:#ec835a;
  --serious-ink:#9c4418;
  --serious-soft:rgba(236,131,90,.15);
  --critical:#d03b3b;
  --critical-ink:#a92222;
  --critical-soft:rgba(208,59,59,.1);
  --t-warm:#b86a00;
  --t-fail:#c03030;
  --t-drop:#1c5cab;
  --focus:#2a78d6;
  --shadow:0 1px 2px rgba(18,22,28,.06),0 1px 1px rgba(18,22,28,.04);
  --shadow-lg:0 10px 34px rgba(18,22,28,.18);
  --scrim:rgba(14,18,24,.42);
  --heat-0:#e4e8ec;--heat-1:#cde2fb;--heat-2:#9ec5f4;--heat-3:#6da7ec;--heat-4:#3987e5;--heat-5:#1c5cab;--body-base:#d5dbe1;--body-edge:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0c0f13;
    --surface:#15191e;
    --surface-2:#1d2229;
    --surface-3:#262c34;
    --ink:#eef1f4;
    --ink-2:#a6afbb;
    --ink-3:#77818d;
    --line:#252b33;
    --line-strong:#38414c;
    --accent:#4d8fe6;

    --accent-soft:#16243a;

    --done-bg:#122515;

    --warn:#fab219;
    --warn-ink:#f2bb45;

    --serious:#ec835a;
    --serious-ink:#f09c79;
    --serious-soft:rgba(236,131,90,.14);
    --critical:#e05a5a;
    --critical-ink:#f28a8a;
    --critical-soft:rgba(224,90,90,.14);

  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0c0f13;
  --surface:#15191e;
  --surface-2:#1d2229;
  --surface-3:#262c34;
  --ink:#eef1f4;
  --ink-2:#a6afbb;
  --ink-3:#77818d;
  --line:#252b33;
  --line-strong:#38414c;
  --accent:#4d8fe6;
  --accent-ink:#8dbbf3;
  --accent-soft:#16243a;
  --on-accent:#ffffff;
  --series-1:#3987e5;
  --done-bg:#122515;
  --done-ink:#5fd35f;
  --good:#0ca30c;
  --good-ink:#47cc47;
  --good-soft:rgba(12,163,12,.16);
  --warn:#fab219;
  --warn-ink:#f2bb45;

  --serious-ink:#f09c79;

  --critical-ink:#f28a8a;
  --critical-soft:rgba(224,90,90,.14);
  --t-warm:#f0a640;
  --t-fail:#f07878;
  --t-drop:#8dbbf3;

  --heat-0:#262c34;--heat-1:#17345a;--heat-2:#1c5cab;--heat-3:#2a78d6;--heat-4:#5598e7;--heat-5:#9ec5f4;--body-base:#323942;--body-edge:#15191e;
}

body{
  background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:Archivo,system-ui,sans-serif;margin:0;letter-spacing:-.01em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:Archivo,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-3)}

/* ---------------- shell ---------------- */
.app{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.topbar-in{max-width:1000px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px;min-height:52px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .blk{font-family:Archivo,sans-serif;font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--on-accent);background:var(--accent);padding:3px 7px;border-radius:4px}
.brand .nm{font-family:Archivo,sans-serif;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.syncpill{margin-left:0;font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.syncpill .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.syncpill.ok .dot{background:var(--good)}
.syncpill.local .dot{background:var(--warn)}
.syncpill.err .dot{background:var(--critical)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.navbtn{appearance:none;border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3);font-size:10.5px;font-weight:500;letter-spacing:.01em}
.navbtn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navbtn[aria-current="page"]{color:var(--accent-ink)}
.navbtn .badge{position:absolute;margin-left:18px;margin-top:-2px;width:8px;height:8px;border-radius:50%;background:var(--critical);border:2px solid var(--surface)}
.navbtn .ic{position:relative;display:flex}
@media (min-width:900px){
  .app{padding-bottom:40px}
  .nav{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);z-index:39}
  .nav-in{max-width:1000px;display:flex;gap:4px;padding:0 18px}
  .navbtn{flex-direction:row;gap:7px;padding:11px 12px;font-size:14px;border-bottom:2px solid transparent;border-radius:0}
  .navbtn svg{width:18px;height:18px}
  .navbtn[aria-current="page"]{border-bottom-color:var(--accent);font-weight:600}
  .navbtn .badge{margin-left:12px}
}

.page{max-width:760px;margin:0 auto;padding:18px 16px 28px}
.page.wide{max-width:1000px}
.ph{display:flex;align-items:flex-end;gap:12px;margin:4px 0 16px;flex-wrap:wrap}
.ph h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
.ph .sub{font-size:13px;color:var(--ink-3);width:100%;margin-top:-6px}
.ph .act{margin-left:auto}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sec-h h2{font-size:17px;font-weight:600}
.sec-h p{margin:0;font-size:12.5px;color:var(--ink-3);flex-basis:100%}
.sec-h .act{margin-left:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:14px 15px}
.note{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.empty{padding:26px 16px;text-align:center;color:var(--ink-3);font-size:13.5px;border:1px dashed var(--line-strong);border-radius:12px;background:var(--surface)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:10px;font-size:13px;margin-bottom:12px;border:1px solid var(--line);background:var(--surface)}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn-ink)}
.banner.info{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.banner b{font-weight:600}

/* ---------------- buttons & inputs ---------------- */
.btn{appearance:none;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:9px 15px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff;font-weight:600}
.btn.danger{color:var(--critical-ink);border-color:var(--line-strong)}
.btn.danger.solid{background:var(--critical);border-color:var(--critical);color:#fff}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.block{width:100%;padding:12px 15px;font-size:15px}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);font-weight:600}
.iconbtn{appearance:none;border:0;background:none;color:var(--ink-3);width:34px;height:34px;border-radius:8px;display:inline-grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
input[type=text],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:9px 11px;font-size:16px;width:100%}
textarea{resize:vertical;min-height:70px}
.search{position:relative}
.search input{padding-left:36px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--ink-3);fill:none;stroke-width:2;stroke-linecap:round}
.field{display:flex;flex-direction:column;gap:5px}
.field>label,.flabel{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.fchip{appearance:none;flex:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:500}
.tag{display:inline-flex;align-items:center;font-size:11px;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;font-weight:500}
.tag.tech{background:var(--accent-soft);color:var(--accent-ink)}
.tag.key{background:var(--warn-soft);color:var(--warn-ink)}
.tag.grp{background:var(--accent);color:var(--on-accent);font-family:"IBM Plex Mono",monospace}

/* ---------------- home ---------------- */
.hero{padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.hero .k{font-size:12px;color:var(--ink-3);font-weight:500}
.hero h2{font-size:22px;font-weight:700;letter-spacing:-.02em}
.hero .meta{font-size:13px;color:var(--ink-2)}
.hero .row{display:flex;gap:8px;flex-wrap:wrap}
.hero.live{border-color:var(--accent);background:linear-gradient(0deg,var(--surface),var(--surface)) padding-box}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.tile .v{font-family:Archivo,sans-serif;font-weight:700;font-size:26px;line-height:1.1;letter-spacing:-.02em}
.tile .v small{font-size:14px;color:var(--ink-3);font-weight:600}
.tile .l{font-size:12px;color:var(--ink-2);margin-top:2px}
.tile.good .v{color:var(--good-ink)} .tile.warn .v{color:var(--serious-ink)} .tile.crit .v{color:var(--critical-ink)}
.queue{display:flex;flex-direction:column;gap:8px}
.qrow{display:grid;grid-template-columns:26px 1fr;gap:11px;padding:12px 13px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.qmark{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-size:13px;font-family:"IBM Plex Mono",monospace}
.qmark.ready{background:var(--good-soft);color:var(--good-ink)}
.qmark.stall{background:var(--warn-soft);color:var(--warn-ink)}
.qmark.flag{background:var(--critical-soft);color:var(--critical-ink)}
.qmark.drift{background:var(--serious-soft);color:var(--serious-ink)}
.qt{font-weight:600;font-size:14.5px}
.qt .w{font-weight:400;font-size:12px;color:var(--ink-3);margin-left:6px}
.qm{font-size:13px;color:var(--ink-2);margin-top:2px}
.qa{font-size:12.5px;color:var(--accent-ink);margin-top:5px;font-family:"IBM Plex Mono",monospace;font-weight:500}

.vol{display:flex;flex-direction:column}
.volrow{display:grid;grid-template-columns:96px 1fr 62px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.volrow:last-child{border-bottom:0}
.vl{font-size:12.5px;color:var(--ink-2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vt{position:relative;height:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px}
.vf{position:absolute;left:-1px;top:-1px;bottom:-1px;background:var(--series-1);border-radius:4px}
.vf.over{background:var(--series-1)}
.vv{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}
.vv b{color:var(--ink);font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);align-items:center;flex-wrap:wrap;margin-bottom:8px}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------------- program ---------------- */
.dayc{margin-bottom:12px;overflow:hidden}
.dayh{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}
.dayh .t{min-width:0}
.dayh .d1{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-family:Archivo,sans-serif}
.dayh .d2{font-family:Archivo,sans-serif;font-size:18px;font-weight:700;letter-spacing:-.01em}
.dayh .d3{font-size:12px;color:var(--ink-3)}
.dayh .btn{margin-left:auto}
.slotl{list-style:none;margin:0;padding:0}
.slotl li{padding:10px 15px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start}
.slotl li:last-child{border-bottom:0}
.slotl .n{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3);padding-top:2px}
.slotl .l1{font-weight:600;font-size:14.5px}
.slotl .l2{font-size:12.5px;color:var(--ink-2)}
.slotl .tg{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);white-space:nowrap;text-align:right}
.deflist{display:grid;grid-template-columns:180px 1fr}
.deflist dt{font-weight:600;font-size:13px;padding:9px 12px 9px 0;border-bottom:1px solid var(--line)}
.deflist dd{margin:0;font-size:13.5px;color:var(--ink-2);padding:9px 0;border-bottom:1px solid var(--line)}
.deflist .grp{grid-column:1/-1;font-family:Archivo,sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:18px 0 4px;font-weight:700}
@media (max-width:620px){.deflist{grid-template-columns:1fr}.deflist dt{border-bottom:0;padding-bottom:1px}.deflist dd{padding-top:0}}
details.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:13px 15px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);transition:transform .15s}
details.fold[open]>summary::after{transform:rotate(225deg)}
details.fold .fb{padding:0 15px 14px}

/* ---------------- workout ---------------- */
.wohead{position:sticky;top:0;z-index:30;background:var(--ground);padding:10px 0 10px;margin:-6px 0 6px;display:flex;align-items:center;gap:10px}
@media (min-width:900px){.wohead{top:96px}}
.wohead .wn{min-width:0;flex:1}
.wohead .wn input{border:0;background:none;padding:0;font-size:20px!important;font-family:Archivo,sans-serif;font-weight:700;font-size:20px;letter-spacing:-.01em;width:100%;border-radius:4px}
.wohead .wn input:focus{background:var(--surface)}
.wohead .wt{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-3)}
.exc{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.exgrp{position:relative;margin-bottom:12px;padding-left:12px}
.exgrp::before{content:"";position:absolute;left:0;top:30px;bottom:6px;width:3px;border-radius:3px;background:var(--accent)}
.exgrp>.gl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);font-family:Archivo,sans-serif;margin:0 0 6px;display:flex;gap:8px;align-items:center}
.exgrp>.gl span{font-family:"IBM Plex Sans",sans-serif;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink-3)}
.exgrp .exc{margin-bottom:8px}
.exh{padding:13px 12px 0 15px}
.ex1{display:flex;align-items:flex-start;gap:8px}
.ex1 .nm{font-family:Archivo,sans-serif;font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.2;color:var(--accent-ink);flex:1;min-width:0;padding-top:3px}
.ex1 .tag.grp{margin-top:5px}
.ex2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--ink-2)}

.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 14px 10px 18px;border-bottom:1px solid var(--line)}

.qual{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}

/* ---------------- history ---------------- */
.wgrp{margin-top:18px}

svg.lc{display:block;font-family:"IBM Plex Mono",monospace;max-width:100%;height:auto}

.plot{position:relative}

table.data td.n{font-family:"IBM Plex Mono",monospace}
.scrollx{overflow-x:auto}
.toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--surface);padding:9px 15px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow-lg);max-width:92vw}
.up{color:var(--good-ink);font-weight:600} .down{color:var(--critical-ink);font-weight:600}

/* ---- autofill: suggested values read as filled, not as hints ---- */
.cell.af::placeholder{color:var(--ink-2);font-weight:500}

/* ---- shared exercise filters ---- */
.filters{margin-top:10px;display:grid;gap:8px}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg.sm button{padding:5px 10px;font-size:12.5px}

.tag.sp.push{background:var(--accent-soft);color:var(--accent-ink)}
.tag.sp.pull{background:var(--good-soft);color:var(--good-ink)}
.tag.sp.legs{background:var(--warn-soft);color:var(--warn-ink)}

/* ---- body figure ---- */
.bodyfig{display:flex;justify-content:center;gap:4%;padding:6px 0 2px}

.bodysvg .mz.l3{fill:var(--heat-3)}
.bodysvg .mz.l4{fill:var(--heat-4)}

.heatlg{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;justify-content:center;font-size:12px;color:var(--ink-2);margin-top:10px}

.sw.l3{background:var(--heat-3)}.sw.l4{background:var(--heat-4)}.sw.l5{background:var(--heat-5)}

/* ---- analyze ---- */
.anctl{display:grid;gap:10px}
.tog{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2)}

.anside{display:grid;gap:12px}
.figh{font-size:13px;color:var(--ink-2)}

.selh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}

/* ---- v4: set rows as a swipeable grid ---- */
.sets{margin-top:10px;--cols:38px minmax(0,1fr) 68px 58px 46px 40px}
.sets.norir{--cols:38px minmax(0,1fr) 78px 68px 40px}
.shead,.sfg{display:grid;grid-template-columns:var(--cols);gap:5px;align-items:center;padding:3px 10px}
.shead{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:center;padding-top:2px;padding-bottom:2px}
.shead .l{text-align:left}
.shead svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}

.sfg{position:relative;z-index:1;background:var(--surface);touch-action:pan-y;transition:transform .18s ease;text-align:center}
.srow.swiping .sfg{transition:none}
.srow.done .sfg{background:var(--done-bg)}
.sdel{position:absolute;inset:0 0 0 auto;width:100%;border:0;background:var(--critical);color:#fff;font-weight:600;font-size:13.5px;display:flex;align-items:center;justify-content:flex-end;padding-right:22px}
.srow.far .sdel{background:#b42323}
.srow.done .setno{background:transparent}
.srow.done .cell,.srow.done .rirsel{background:transparent}
.srow.done .chk{background:var(--good);color:#fff}
.prev{display:flex;flex-direction:column;align-items:flex-start;min-width:0;cursor:pointer;line-height:1.25}
.prev .pv{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.prev .tg{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--accent-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cell{max-width:none}
.rirsel{width:100%}
.chk{width:100%}

/* +/− toolbar under the row being edited */
.kbar{display:flex;gap:6px;align-items:center;padding:6px 10px 8px;background:var(--surface-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kb{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;min-width:54px;height:36px;padding:0 10px;font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600}
.kb.txt{font-family:inherit;font-size:13.5px;min-width:0}
.kb.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.kbar .sp{flex:1}
.kb:active{transform:translateY(1px)}

/* prescription chips + goal line + pinned note */
.rx{font-size:12px;font-weight:500;color:var(--ink-2);background:var(--surface-2);border-radius:5px;padding:2px 7px;white-space:nowrap}
.goal{margin:9px 0 0;font-size:13px;padding:8px 10px;border-radius:8px;display:flex;gap:9px;align-items:flex-start;background:var(--accent-soft);color:var(--ink)}
.goal .gk{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-ink);padding-top:2px}
.goal .gt{flex:1;line-height:1.4}
.goal.good{background:var(--good-soft)} .goal.good .gk{color:var(--good-ink)}
.goal.warn{background:var(--warn-soft)} .goal.warn .gk{color:var(--warn-ink)}
.goal.drift{background:var(--serious-soft)} .goal.drift .gk{color:var(--serious-ink)}
.goal .use{flex:none;appearance:none;border:0;border-radius:6px;background:var(--good);color:#fff;font-weight:600;font-size:12.5px;padding:4px 10px}
.pnotew{margin-top:7px}
.pnote{display:block;width:100%;resize:none;border:0;border-left:2px solid var(--line-strong);border-radius:0;background:transparent;padding:2px 0 2px 9px;font:inherit;font-size:16px;line-height:1.45;color:var(--ink-2);max-height:2.95em;overflow:hidden;transition:max-height .15s}
@media (min-width:600px){.pnote{font-size:13px}}
.pnote:focus{max-height:none;outline:none;border-left-color:var(--accent);color:var(--ink);background:var(--surface-2);border-radius:0 6px 6px 0}
.pnotew.empty .pnote{max-height:1.6em}

/* toast with action */
.toast.act{display:flex;align-items:center;gap:14px}
.toast.act button{appearance:none;border:0;background:none;color:var(--accent-soft);font-weight:700;font-size:14px;padding:2px 4px;text-decoration:underline}

/* finish popup + picker create row */
.openlist{list-style:none;margin:0;padding:0}
.openlist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.openlist .r{color:var(--ink-3);font-size:12.5px;white-space:nowrap}
.picklist li.create{border-bottom:1px solid var(--line)}
.picklist li.create .plus{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.picklist li.create .plus svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.picklist li.create .l1{color:var(--accent-ink)}

/* settings */
.gearbtn{margin-left:4px}
.gearbtn[aria-current="page"]{color:var(--accent-ink);background:var(--accent-soft)}
.sgroup{margin-top:18px}
.sgroup .eyebrow{margin:0 2px 6px}
.srowset{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 15px;border-bottom:1px solid var(--line)}
.srowset:last-child{border-bottom:0}
.srowset.col{flex-direction:column;align-items:stretch;gap:8px}
.srowset .st{font-size:14.5px;font-weight:500}
.srowset .sh{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.ssel{width:auto;font-size:16px;padding:5px 8px}
.snum{width:84px;font-size:16px;text-align:right;padding:5px 8px}
.sinline{display:flex;gap:8px;align-items:center}
.chiprow.wrap{flex-wrap:wrap;overflow:visible}
input[type=range]{width:150px;accent-color:var(--accent)}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;border-radius:999px;background:var(--line-strong);position:relative;cursor:pointer;transition:background .15s;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch:checked{background:var(--good)}
.switch:checked::after{transform:translateX(18px)}
.switch:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* plate calculator */
.pcin{display:flex;gap:6px;align-items:center}
.pcin input{text-align:center;font-size:16px;min-width:0}
.barvis{display:flex;align-items:center;height:120px;margin:14px 0 6px;padding:0 6px}
.barvis .sleeve{width:44px;height:12px;background:var(--ink-3);border-radius:2px 0 0 2px;flex:none}
.barvis .plate{flex:none;width:22px;margin-left:2px;background:var(--accent);border-radius:3px;position:relative;display:flex;align-items:flex-end;justify-content:center}
.barvis .plate b{position:absolute;bottom:-18px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-2);font-weight:500}
.barvis .collar{width:8px;height:26px;background:var(--ink-2);border-radius:2px;margin-left:2px;flex:none}
.barvis::after{content:"";flex:1;height:12px;background:var(--ink-3);opacity:.5;border-radius:0 2px 2px 0}
.pcres{margin-top:22px}
.pcres .big{font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:600}
.pnote{min-height:0;width:100%}
.srow{clip-path:inset(0)}
.srowset .snum{width:90px;flex:none}
.srowset .st{min-width:0}
.ssel{flex:none}
.srow:not(.open):not(.swiping) .sdel{visibility:hidden}
.srow.open .prev,.srow.open .setno,.srow.swiping .prev{opacity:0;transition:opacity .12s}

/* ---- v6: collapsible day cards ---- */
.dayc .dayh{border-bottom:0;padding:6px 12px 6px 4px}
.dayc.open .dayh{border-bottom:1px solid var(--line)}
.dtog{appearance:none;border:0;background:none;color:inherit;text-align:left;flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:7px 4px 7px 11px;border-radius:9px}
.dtog:hover{background:var(--surface-2)}
.dtog .t{display:flex;flex-direction:column;min-width:0}
.dtog .d3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dchev{flex:none;margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);margin-right:6px;transition:transform .15s}
.dayc.open .dchev{transform:rotate(225deg)}
.dayc .dayh .btn{margin-left:4px;flex:none}

/* ---- v6: slim exercise card ---- */
.ex1 button.nm{appearance:none;border:0;background:none;text-align:left;padding:3px 0 0;display:inline-flex;align-items:center;gap:4px;font:inherit;font-family:Archivo,sans-serif;font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.2;color:var(--accent-ink);flex:1;min-width:0;border-radius:6px}
.ex1 button.nm span{min-width:0}
.ex1 button.nm svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.flagdot{appearance:none;border:0;flex:none;width:22px;height:22px;border-radius:50%;background:var(--critical-soft);color:var(--critical-ink);font-weight:700;font-size:13px;font-family:"IBM Plex Mono",monospace;display:inline-grid;place-items:center;margin-top:4px;padding:0}
.pvlist .flagdot{width:18px;height:18px;font-size:11px;margin:0 0 0 6px;vertical-align:1px}
.gline{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink);background:var(--surface-2);border-radius:6px;padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%}
.gline b{font-family:"IBM Plex Sans",sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-ink)}
.gline.good{background:var(--good-soft)} .gline.good b{color:var(--good-ink)}
.gline.warn{background:var(--warn-soft)} .gline.warn b{color:var(--warn-ink)}
.gline.drift{background:var(--serious-soft)} .gline.drift b{color:var(--serious-ink)}
.exh{padding-bottom:2px}

/* ---- v6: exercise detail pop-up ---- */
.exd .ex3{margin-top:10px}
.exd .goal{margin-top:12px}
.dnote{font-size:16px;line-height:1.45;min-height:72px}

/* ---- v6: pre-start preview ---- */
.pvlist{list-style:none;margin:0;padding:0}
.pvlist li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:4px 10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.pvlist .n{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3);padding-top:2px}
.pvlist .l1{font-weight:600;font-size:14.5px}
.pvlist .l2{font-size:12.5px;color:var(--ink-3);overflow-wrap:anywhere}
.pvg{grid-column:2;justify-self:start;display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink);background:var(--surface-2);border-radius:6px;padding:3px 8px;max-width:100%}
.pvg::before{content:"Goal";font-family:"IBM Plex Sans",sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-ink)}
.pvg small{font-family:"IBM Plex Sans",sans-serif;font-size:11px;font-weight:600}
.pvg.good{background:var(--good-soft)} .pvg.good small{color:var(--good-ink)}
.pvg.warn{background:var(--warn-soft)} .pvg.warn small{color:var(--warn-ink)}
.pvg.drift{background:var(--serious-soft)} .pvg.drift small{color:var(--serious-ink)}

/* v7 movement guide (stop-motion figure) */
.mv{margin:12px 0 4px}
.mv-stage{-webkit-tap-highlight-color:transparent;user-select:none;outline:none;display:block;width:100%;max-height:230px;background:var(--surface-2);border-radius:12px;cursor:pointer}
.mv-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12.5px;color:var(--ink-3)}
.mv-ph{font-weight:600;color:var(--accent-ink)}
.mv-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.mv-strip svg{width:100%;height:auto;background:var(--surface-2);border-radius:6px}
.mv-cue{text-align:left;margin:8px 0 0;font-size:13px;color:var(--ink-2)}
.mv{--mv-bar:var(--ink-2)}
.mv svg line,.mv svg path{stroke-linecap:round;stroke-linejoin:round}
.mv svg .mv-edge{stroke:var(--surface-2)}
.mv svg .mv-bd{stroke:var(--body-base)}
.mv svg .mv-p1{stroke:var(--heat-5)}
.mv svg .mv-p2{stroke:var(--heat-2)}
.mv svg .mv-head{fill:var(--body-base);stroke:var(--surface-2);stroke-width:1.5}
.mv svg .mv-floor{stroke:var(--line-strong);stroke-width:2}
.mv svg .mv-furnl{stroke:var(--line-strong)}
.mv svg .mv-furn{fill:var(--line-strong)}
.mv svg .mv-bar{fill:var(--mv-bar);opacity:.9}
.mv svg .mv-hub{fill:var(--surface)}
.mv svg .mv-cable{stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:3 3}
.mv-var{font-size:12px;color:var(--ink-3)}
@media (max-width:359px){.brand .blk{display:none}}

/* v11 program library: folders, current block, routines, drag and drop, routine editor */
.phacts{display:flex;gap:6px}
.phacts .btn svg,.addr svg,.btn.soft svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.fold-sec{margin:0 0 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);padding:4px 10px 8px;transition:box-shadow .12s,border-color .12s}
.fold-sec.current{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.fold-sec:not(.open){padding-bottom:4px}
.fh{display:flex;align-items:center;gap:6px}
.ftog{appearance:none;border:0;background:none;flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:9px 4px;text-align:left;color:var(--ink);cursor:pointer}
.ftog:disabled{cursor:default;opacity:1}
.ft{display:flex;flex-direction:column;gap:2px;min-width:0}
.ft .fn{font-family:Archivo,sans-serif;font-size:18px;font-weight:700;letter-spacing:-.01em}
.ft .fc{font-size:12px;color:var(--ink-3)}
.ftog .dchev{margin-left:auto}
.fold-sec.open>.fh .dchev{transform:rotate(225deg)}
.fsub{margin:0 4px 10px;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.fb2 .dayc:last-of-type{margin-bottom:8px}
.tag.cur{background:var(--accent);color:var(--on-accent);font-family:Archivo,sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:10px;align-self:flex-start}
.folderpick .l1{display:flex;gap:8px;align-items:center}
.addr{margin:2px 0 0;color:var(--accent-ink)}
.dropzone{padding:18px 12px;margin-bottom:8px}
.dayh .grip{appearance:none;border:0;background:none;width:22px;height:38px;margin:-6px 0 -6px -8px;flex:none;cursor:grab;touch-action:none;display:grid;place-items:center;border-radius:6px;color:var(--ink-3)}
.dayh .grip span{width:8px;height:16px;background-image:radial-gradient(currentColor 1.3px,transparent 1.4px);background-size:4px 5.3px;opacity:.75}
.dayh .grip:hover{background:var(--surface-2)}
.dayh .rmenu{margin-right:-8px}
.dayh .dtog{flex:1;min-width:0}
.dayc.dragging{opacity:.35}
.dragghost{position:fixed;z-index:90;pointer-events:none;margin:0;box-shadow:var(--shadow-lg);transform:rotate(1.2deg);opacity:.95}
.dragghost .slotl{display:none}
body.dragging-on{user-select:none;-webkit-user-select:none;cursor:grabbing}
.dayc.drop-before{box-shadow:0 -3px 0 0 var(--accent)}
.dayc.drop-after{box-shadow:0 3px 0 0 var(--accent)}
.fold-sec.drop-into{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.slotl li.slotempty{grid-template-columns:26px 1fr auto;align-items:center}
input[type=number]{background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:9px 10px;font-size:16px;width:100%;min-width:0;font-family:"IBM Plex Mono",monospace}
.slotform .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slotform .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.slotform .rng{display:flex;align-items:center;gap:6px}
.slotform .rng span{font-size:12px;color:var(--ink-3)}
.exrowx{display:flex;align-items:center;gap:10px;justify-content:space-between}
.exrowx b{font-size:15px}
.chiprow.wrap{flex-wrap:wrap;overflow:visible}
.slotform .tog{align-items:flex-start;line-height:1.35}
.slotform .tog input{margin-top:2px;flex:none}
.rlist{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:8px}
.rlist li{display:grid;grid-template-columns:28px 1fr auto;gap:6px;align-items:center;padding:6px 6px 6px 12px;position:relative}
.rlist li.linked::after{content:"";position:absolute;left:20px;bottom:-10px;height:12px;border-left:2px solid var(--accent)}
.rlist .n{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}
.rmain{appearance:none;border:0;background:none;text-align:left;display:flex;flex-direction:column;gap:2px;padding:6px 0;min-width:0;color:var(--ink);cursor:pointer}
.rmain .l1{font-weight:600;font-size:15px}
.rmain .l2{font-size:12.5px;color:var(--ink-2)}
.rmain .l3{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.mv2{display:flex;flex-direction:column}
.mv2 .iconbtn{height:28px}
.mv2 .iconbtn:disabled{opacity:.3}
.arr{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor}
.arr.up{transform:rotate(225deg);margin-top:4px}
.arr.dn{transform:rotate(45deg);margin-top:-4px}
.edfoot{display:flex;gap:10px;margin-top:16px}
.edfoot .btn{flex:1;padding:12px 15px;font-size:15px}
@media (max-width:420px){ .slotform .three{grid-template-columns:1fr 1fr} .slotform .three .field:last-child{grid-column:span 2} }
.mv2 .iconbtn{color:var(--ink-2)}
@media (max-width:359px){.dayh .dtog .dchev{display:none}}

/* v12 session timer */
.wohead{flex-wrap:wrap}
.stimer{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;width:100%;display:flex;align-items:center;gap:10px;padding:6px 12px 6px 8px;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.string{width:44px;height:44px;flex:none}
.string .trk{stroke:var(--surface-3);stroke-width:4.5}
.string .tarc{stroke:var(--accent);stroke-width:4.5;stroke-linecap:round;transition:stroke-dashoffset .4s}
.string .parc{stroke:var(--good);stroke-width:4.5;stroke-linecap:round;transition:stroke-dashoffset .4s}
.stimer.over .tarc{stroke:var(--critical,#d03b3b)}
.stx{display:flex;flex-direction:column;min-width:0;flex:1;gap:1px}

.stx .s1 b{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.stimer.over .s1 b{color:var(--critical-ink)}
.stx .s2{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pace{font-weight:600}
.pace.ahead,.pace.done{color:var(--good-ink)}
.pace.on{color:var(--accent-ink)}
.pace.behind{color:var(--warn-ink)}
.pace.over{color:var(--critical-ink)}
.pace.start{font-weight:500}
.spct{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.spct b{font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:600}
.spct small{font-size:11px;color:var(--ink-3)}

/* v13 workout report */
.report .sec{margin-top:14px}
.prcard{margin-top:12px}
.prrow{font-size:14px;margin-top:6px}
.prrow .star{color:var(--warn);margin-right:6px}
.radarcard{margin-top:14px}
.rch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.rch h2{font-size:17px;font-weight:700;margin:0 0 2px}
.radar{display:block;width:100%;max-width:440px;margin:4px auto 0;overflow:visible}
.radar .rgrid{fill:none;stroke:var(--line);stroke-width:1}
.radar .raxis{stroke:var(--line);stroke-width:1}
.radar .rplan{fill:none;stroke:var(--ink-3);stroke-width:1.6;stroke-dasharray:5 4}
.radar .rnow{fill:var(--accent);fill-opacity:.22;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}
.radar .rdot{fill:var(--accent)}
.radar .rlab{font-size:11.5px;fill:var(--ink-2);font-weight:600}
.radar .rlab.zero{fill:var(--ink-3);font-weight:400}
.radar .rtick{font-size:9.5px;fill:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.rlegend{display:flex;gap:16px;justify-content:center;font-size:12.5px;color:var(--ink-2);margin:2px 0 10px;flex-wrap:wrap}
.rlegend .sw{display:inline-block;width:16px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.rlegend .sw.now{background:color-mix(in srgb,var(--accent) 30%,transparent);border:2px solid var(--accent)}
.rlegend .sw.plan{border:1.6px dashed var(--ink-3)}
.radarcard{container-type:inline-size}
.rtable{display:grid;grid-template-columns:1fr;gap:0 22px;border-top:1px solid var(--line);padding-top:6px}
@container (min-width:500px){.rtable{grid-template-columns:1fr 1fr}}
.rtr{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:12px;row-gap:4px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.rtr .rk{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

button.rtr{appearance:none;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;font-size:13.5px;width:100%;text-align:left;border-radius:0;padding:7px 6px;margin:0;cursor:pointer}

/* v15: Strong import */
.srev{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}

/* v15.1: skip-the-rest bar, warning, skipped rows */
.sbar{position:sticky;top:-1px;z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:12px 0 4px;box-shadow:0 4px 12px -8px rgba(0,0,0,.25)}

/* v15.2: import progress screen */
.sprog{padding:4px 0 8px}
.sp-head{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.sp-title{font-size:17px;font-weight:600}

.sp-spin{width:30px;height:30px;flex:none;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spspin .9s linear infinite}
@keyframes spspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sp-spin{animation-duration:2.5s}}
.sp-ok{width:30px;height:30px;flex:none;border-radius:50%;background:var(--good,#1f8a4c);color:#fff;display:grid;place-items:center;font-weight:700}
.sp-steps{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:7px}
.sp-step{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink-3)}

.sp-step.done{color:var(--ink-2,var(--ink))}

.sp-bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}

.sp-count{margin-top:10px;font-size:14px;font-variant-numeric:tabular-nums}

.sp-stall{margin-top:12px}

.sp-foot{display:flex;gap:10px;width:100%}

/* v16: collapsible Analyze cards */
.card.foldable{padding-top:0}
.colh{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:13px 0 10px;margin:0;color:var(--ink);text-align:left;cursor:pointer;font:inherit}

.sess-sets li{display:flex;justify-content:space-between;border:0;padding:4px 0;font-size:13px}

/* v16: imported exercises */
.snsearch{width:100%;font-size:16px;margin:10px 0}
.snrow{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.sn-a{flex:1;min-width:0;display:flex;flex-direction:column}

.snrow .chev{display:inline-flex;color:var(--ink-3)} .snrow .chev svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}

/* v17: home */
.cons-n{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:end}

.cal{display:grid;grid-template-columns:repeat(52,1fr);gap:2px}
.cal-h{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin:2px 0 6px}
.cal-col{height:44px;width:100%;display:flex;align-items:flex-end}

.cal-m{font-size:9px;color:var(--ink-3);height:12px;line-height:12px;margin-top:2px}
.cal-lg{margin-top:6px}
.coach .qgroup{margin-bottom:8px}
.colh .qmark{width:22px;height:22px;font-size:12px;flex:none}
.qmark.pr{background:var(--accent-soft);color:var(--accent-ink)}
.qline{border-top:1px solid var(--line)}
.qline:first-of-type{border-top:0}
.ql-h,.qline.pr{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:9px 0;color:var(--ink);font:inherit;text-align:left;cursor:pointer;flex-wrap:wrap}
.qline.pr{border-top:1px solid var(--line)}
.ql-n{flex:1 1 140px;min-width:0;font-size:14px}
.ql-e{color:var(--ink-3);font-size:12.5px}
.ql-s{font-size:12.5px;color:var(--ink-2,var(--ink-3));flex:1 1 100%;order:3}
.ql-h .chev{display:inline-flex;color:var(--ink-3);transition:transform .18s ease;margin-left:auto}
.ql-h .chev svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}

.ql-d{display:none;padding:0 0 10px}

.empty.sm{padding:8px 0;font-size:13px}
.volnav{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}

.pbar{position:relative;height:8px;border-radius:999px;background:linear-gradient(90deg,var(--heat-1),var(--heat-5));margin:10px 0 8px}

.pbar .pm{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--surface);border:3px solid var(--ink)}
.pr-s{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;font-size:13px}
.pr-d{color:var(--ink-3);font-size:12px}
/* v17: session quality bar */
.qbar{padding:2px 2px 0;user-select:none;-webkit-user-select:none;outline:none}
.qb-val{font-size:15px;font-weight:600;margin-bottom:10px}

.qb-thumb{position:absolute;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);box-shadow:var(--shadow-lg);transition:left .12s ease}

.qb-ticks{position:relative;height:40px;margin:6px 30px 0}
.qb-tick{position:absolute;top:0;transform:translateX(-50%);min-width:44px;background:none;border:0;padding:4px 0;white-space:nowrap;color:var(--ink-3);font:inherit;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}

.cell.padfocus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--accent-soft)}
.npad{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--line-strong);box-shadow:0 -8px 24px -12px rgba(0,0,0,.35);padding:8px 10px calc(10px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.np-head{display:flex;align-items:center;gap:8px;padding:2px 4px 8px}

.np-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1.15fr;gap:6px}
.np-k{appearance:none;border:0;border-radius:10px;background:var(--surface-2,var(--line));color:var(--ink);font:600 22px/1 'IBM Plex Mono',monospace;height:52px;touch-action:manipulation;cursor:pointer}

/* plate view */

.pv-gym,.pv-gymn{font-size:14px}

.pv-bar{position:relative;display:flex;align-items:center;height:96px;padding-left:0}
.pv-sleeve{flex:none;width:70px;height:16px;border-radius:3px;background:#b9c0c8;color:#2c333a;font:600 11px/16px 'IBM Plex Sans',sans-serif;text-align:center;margin-right:2px}
.pv-pl{flex:none;width:30px;margin-right:3px;border-radius:4px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}

.c-red{background:#d64545;color:#fff}.c-blue{background:#3b7fd9;color:#fff}.c-yellow{background:#e8b923;color:#222}
.c-green{background:#2f9e5b;color:#fff}.c-white{background:#f2f4f6;color:#222}.c-black{background:#2a2f35;color:#fff}
.c-gray{background:#8a939c;color:#fff}.c-silver{background:#c8ced4;color:#222}

.gymrow{border-bottom:1px solid var(--line)}

.gym-h .chev{display:inline-flex;color:var(--ink-3)} .gym-h .chev svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}

.livebar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:43;display:flex;justify-content:center;padding:0 10px 8px;pointer-events:none}

.ph{align-items:center}

.page{padding-top:12px}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}

.hs-custom.on{background:var(--accent-soft)}
.hs-ch{display:flex;align-items:center;gap:12px}
.hs-picks{display:flex;gap:10px;margin-top:10px}
.hs-pick{flex:1 1 0;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:7px 10px;color:var(--ink);font:inherit;font-size:13px}

.cp{display:flex;flex-direction:column;gap:14px}
.cp-top{display:flex;align-items:center;gap:12px}
.cp-chip{width:56px;height:40px;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.45)}
.cp-hex{font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--ink-2)}
.cp-row{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)}
.cp-track{position:relative;height:30px;border-radius:15px;background:var(--cp-bg);box-shadow:inset 0 0 0 1px rgba(128,128,128,.4)}

.cp-track input::-webkit-slider-runnable-track{height:30px;background:none}
.cp-track input::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid #1b1f24;box-shadow:0 1px 3px rgba(0,0,0,.4)}

.cp-track input::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid #1b1f24}
.cp-pl{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.cp-prev i{width:34px}

<script id="app-data" type="application/json">{"library":{"movements":[{"id":"45-degree-hyperextension","name":"45-Degree Hyperextension","group":"Back","primary":"Lower Back","secondary":[],"split":"pull","pattern":"Extension","focus":"Erectors","guide":"Similar to back extension, but done at an angle. Emphasizes lower back and glutes. Go through full range with control.","steps":["Set the pad just below your hip crease and hook your heels under the rollers. Cross your arms over your chest.","Hinge at the hips and lower your torso until you feel a stretch in the hamstrings, back flat.","Squeeze the glutes and raise your torso until your body forms a straight line. Do not arch past neutral."],"equipment":["Bodyweight","Plate","Dumbbell"],"metric":"reps","level":"beginner","src":"ivan"},{"id":"ab-wheel-rollout","name":"Ab Wheel Rollout","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Rollout","focus":"Full Core","guide":"Kneel and roll forward while keeping hips and spine aligned. Focus on eccentric control and maintaining tight core.","steps":["For this exercise you will need to get into a pushup position, but instead of having your hands of the floor, you will be grabbing on to an Olympic barbell (loaded with 5-10 lbs on each side) instead. This will be your starting position.","While keeping a slight arch on your back, lift your hips and roll the barbell towards your feet as you exhale. Tip: As you perform the movement, your glutes should be coming up, you should be keeping the abs tight and should maintain your back posture at all times. Also your arms should be staying perpendicular to the floor throughout the movement. If you don't, you will work out your shoulders and back more than the abs.","After a second contraction at the top, start to roll the barbell back forward to the starting position slowly as you inhale."],"equipment":["Ab Wheel","Barbell"],"metric":"reps","level":"intermediate","src":"both"},{"id":"above-the-knee-rack-pull","name":"Above-the-Knee Rack Pull","group":"Back","primary":"Traps","secondary":["Lower Back","Upper Back"],"split":"pull","pattern":"Pull","focus":"Traps, Erectors, Upper Back","guide":"Set bar just above knees in rack. Pull explosively to lockout. Emphasizes traps and lockout power with minimal leg drive.","steps":["Set the safety pins so the bar sits just above your knees. Stand close, feet hip width, and grip the bar just outside the legs.","Brace, pull the shoulders back and keep the bar against your thighs.","Drive the hips forward to lockout, squeeze the glutes and upper back, then lower with control."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"air-bike","name":"Air Bike","group":"Cardio","primary":null,"secondary":[],"split":"cardio","pattern":"Intervals","focus":"Full Body","guide":"Push/pull handles while pedaling. Intense full-body cardio. Use for sprints or mixed intervals.","steps":["Adjust the seat so your knee is slightly bent at the bottom of the pedal stroke.","Push and pull the handles while pedalling. Effort and speed set the resistance.","Work in intervals (for example 20 seconds hard, 40 easy) or at a steady pace. Stay tall through the chest."],"equipment":["Other"],"metric":"duration","level":"beginner","src":"ivan"},{"id":"alternating-overhead-press","name":"Alternating Overhead Press","group":"Shoulders","primary":"Front Delts","secondary":["Triceps"],"split":"push","pattern":"Overhead Press","focus":"Front Delts","guide":null,"steps":["Stand with a dumbbell in each hand. Raise the dumbbells to your shoulders with your palms facing forward and your elbows pointed out. This will be your starting position.","Extend one arm to press the dumbbell straight up, keeping your off hand in place. Do not lean or jerk the weight during the movement.","After a brief pause, return the weight to the starting position."],"equipment":["Cable","Kettlebell","Dumbbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"anti-gravity-press","name":"Anti-Gravity Press","group":"Shoulders","primary":"Front Delts","secondary":["Upper Back","Traps","Triceps"],"split":"push","pattern":"Other","focus":"Front Delts","guide":null,"steps":["Place a bar on the ground behind the head of an incline bench.","Lay on the bench face down. With a pronated grip, pick the barbell up from the floor. Flex the elbows, performing a reverse curl to bring the bar near your chest. This will be your starting position.","To begin, press the barbell out in front of your head by extending your elbows. Keep your arms parallel to the ground throughout the movement.","Return to the starting position and repeat to complete the set."],"equipment":["Barbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"archer-pull-up","name":"Archer Pull-Up","group":"Back","primary":"Upper Back","secondary":[],"split":"pull","pattern":"Calisthenics","focus":"Full Back","guide":"Pull to one side with alternating reps. Increases lat isolation and core stability demand.","steps":["Grab the pull-up bar with the palms facing forward using a wide grip.","As you have both arms extended in front of you holding the bar at a wide grip, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","Pull your torso up while leaning to the left hand side until the bar almost touches your upper chest by drawing the shoulders and the upper arms down and back. Exhale as you perform this portion of the movement. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary as it moves through space (no swinging) and only the arms should move. The forearms should do no other work other than hold the bar.","After a second of contraction, inhale as you go back to the starting position.","Now, pull your torso up while leaning to the right hand side until the bar almost touches your upper chest by drawing the shoulders and the upper arms down and back. Exhale as you perform this portion of the movement. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary as it moves through space and only the arms should move. The forearms should do no other work other than hold the bar.","After a second of contraction, inhale as you go back to the starting position."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"intermediate","src":"both"},{"id":"arnold-press","name":"Arnold Press","group":"Shoulders","primary":"Front Delts","secondary":["Triceps","Side Delts"],"split":"push","pattern":"Press","focus":"Front Delts","guide":"Begin with palms facing you, rotate as you press overhead. Targets front delts while encouraging a full range of motion.","steps":["Sit on an exercise bench with back support and hold two dumbbells in front of you at about upper chest level with your palms facing your body and your elbows bent. Tip: Your arms should be next to your torso. The starting position should look like the contracted portion of a dumbbell curl.","Now to perform the movement, raise the dumbbells as you rotate the palms of your hands until they are facing forward.","Continue lifting the dumbbells until your arms are extended above you in straight arm position. Breathe out as you perform this portion of the movement.","After a second pause at the top, begin to lower the dumbbells to the original position by rotating the palms of your hands towards you. Tip: The left arm will be rotated in a counter clockwise manner while the right one will be rotated clockwise. Breathe in as you perform this portion of the movement."],"equipment":["Dumbbell","Kettlebell"],"metric":"reps","level":"intermediate","src":"both"},{"id":"around-the-world-fly","name":"Around-the-World Fly","group":"Chest","primary":"Mid Chest","secondary":["Side Delts"],"split":"push","pattern":"Fly","focus":"Mid Chest","guide":null,"steps":["Lay down on a flat bench holding a dumbbell in each hand with the palms of the hands facing towards the ceiling. Tip: Your arms should be parallel to the floor and next to your thighs. To avoid injury, make sure that you keep your elbows slightly bent. This will be your starting position.","Now move the dumbbells by creating a semi-circle as you displace them from the initial position to over the head. All of the movement should happen with the arms parallel to the floor at all times. Breathe in as you perform this portion of the movement.","Reverse the movement to return the weight to the starting position as you exhale."],"equipment":["Dumbbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"around-the-world-raise","name":"Around-the-World Raise","group":"Shoulders","primary":"Front Delts","secondary":[],"split":"push","pattern":"Raise","focus":"Full Delts","guide":"Combine front raise and lateral raise in circular motion. Light weight, high control, activates all three delt heads.","steps":["Stand tall with light dumbbells at your thighs, palms facing in.","Raise the arms out to the side and then overhead in a wide arc, keeping the elbows soft.","Reverse the arc slowly back to your sides. Keep the ribs down and do not shrug."],"equipment":["Dumbbell","Plate"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"atlas-stone-load","name":"Atlas Stone Load","group":"Full Body","primary":"Lower Back","secondary":["Abs","Adductors","Biceps","Calves","Forearms"],"split":"full","pattern":"Other","focus":"Lower Back","guide":null,"steps":["Begin with the atlas stone between your feet. Bend at the hips to wrap your arms vertically around the Atlas Stone, attempting to get your fingers underneath the stone. Many stones will have a small flat portion on the bottom, which will make the stone easier to hold.","Pulling the stone into your torso, drive through the back half of your feet to pull the stone from the ground.","As the stone passes the knees, lap it by sitting backward, pulling the stone on top of your thighs.","Sit low, getting the stone high onto your chest as you change your grip to reach over the stone. Stand, driving through with your hips. Close distance to the loading platform, and lean back, extending the hips to get the stone as high as possible."],"equipment":["Strongman"],"metric":"reps","level":"expert","src":"freedb"},{"id":"axle-deadlift","name":"Axle Deadlift","group":"Back","primary":"Lower Back","secondary":["Forearms","Glutes","Hamstrings","Upper Back","Quads"],"split":"pull","pattern":"Hinge","focus":"Lower Back","guide":null,"steps":["Approach the bar so that it is centered over your feet. You feet should be about hip width apart. Bend at the hip to grip the bar at shoulder width, allowing your shoulder blades to protract. Typically, you would use an over/under grip.","With your feet and your grip set, take a big breath and then lower your hips and flex the knees until your shins contact the bar. Look forward with your head, keep your chest up and your back arched, and begin driving through the heels to move the weight upward.","After the bar passes the knees, aggressively pull the bar back, pulling your shoulder blades together as you drive your hips forward into the bar.","Lower the bar by bending at the hips and guiding it to the floor."],"equipment":["Strongman"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"b-stance-rdl","name":"B-Stance RDL","group":"Legs","primary":"Hamstrings","secondary":["Glutes","Lower Back"],"split":"legs","pattern":"Hinge","focus":"Hamstrings/Glutes","guide":"Back leg provides balance, front leg does the work. Great for unilateral posterior chain work.","steps":["Stand with the front foot flat and the back foot a half step behind, toes light on the floor. Hold dumbbells in front of you.","Push the hips back and lower the weights down the front leg, keeping the back flat. Most of the load stays on the front leg.","Drive the hips forward to stand tall. Complete the reps, then swap legs."],"equipment":["Dumbbell","Barbell"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"back-extension","name":"Back Extension","group":"Back","primary":"Lower Back","secondary":[],"split":"pull","pattern":"Extension","focus":"Erectors","guide":"Hinge at hips, avoid hyperextending spine. Squeeze glutes and spinal erectors at top. Keep neutral spine throughout.","steps":["With someone holding down your legs, slide yourself down to the edge a flat bench until your hips hang off the end of the bench. Tip: Your entire upper body should be hanging down towards the floor. Also, you will be in the same position as if you were on a hyperextension bench but the range of motion will be shorter due to the height of the flat bench vs. that of the hyperextension bench.","With your body straight, cross your arms in front of you (my preference) or behind your head. This will be your starting position. Tip: You can also hold a weight plate for extra resistance in front of you under your crossed arms.","Start bending forward slowly at the waist as far as you can while keeping your back flat. Inhale as you perform this movement. Keep moving forward until you almost touch the floor or you feel a nice stretch on the hamstrings (whichever comes first). Tip: Never round the back as you perform this exercise.","Slowly raise your torso back to the initial position as you exhale. Tip: Avoid the temptation to arch your back past a straight line. Also, do not swing the torso at any time in order to protect the back from injury."],"equipment":["Bodyweight","Plate","Machine"],"metric":"reps","level":"intermediate","src":"both"},{"id":"back-squat","name":"Back Squat","group":"Legs","primary":"Quads","secondary":["Glutes","Abs"],"split":"legs","pattern":"Squat","focus":"Quads","guide":"Bar on upper traps, feet shoulder-width. Keep chest up, knees tracking over toes, and hips breaking parallel for full quad recruitment.","steps":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack to just below shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section).","Begin to slowly lower the bar by bending the knees and hips as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees. Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor with the heel of your foot as you straighten the legs again and go back to the starting position."],"equipment":["Barbell","Smith Machine","Band"],"metric":"reps","level":"beginner","src":"both"},{"id":"band-pull-apart","name":"Band Pull-Apart","group":"Shoulders","primary":"Rear Delts","secondary":["Upper Back","Traps"],"split":"pull","pattern":"Raise","focus":"Rear Delts","guide":null,"steps":["Begin with your arms extended straight out in front of you, holding the band with both hands.","Initiate the movement by performing a reverse fly motion, moving your hands out laterally to your sides.","Keep your elbows extended as you perform the movement, bringing the band to your chest. Ensure that you keep your shoulders back during the exercise.","Pause as you complete the movement, returning to the starting position under control."],"equipment":["Band"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"banded-hip-flexion","name":"Banded Hip Flexion","group":"Legs","primary":"Quads","secondary":[],"split":"legs","pattern":"Other","focus":"Quads","guide":null,"steps":["Secure one end of the band to the lower portion of a post and attach the other to one ankle.","Face away from the attachment point of the band.","Keeping your head and your chest up, raise your knee up to 90 degrees and pause.","Return the leg to the starting position."],"equipment":["Band"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"battle-ropes","name":"Battle Ropes","group":"Cardio","primary":null,"secondary":[],"split":"cardio","pattern":"Mixed-Modality","focus":"Core, Shoulders, Conditioning","guide":"Perform waves, slams, or alternating arms. Keep core tight and knees slightly bent. Used for explosive conditioning.","steps":["For this exercise you will need a heavy rope anchored at its center 15-20 feet away. Standing in front of the rope, take an end in each hand with your arms extended at your side. This will be your starting position.","Initiate the movement by rapidly raising one arm to shoulder level as quickly as you can.","As you let that arm drop to the starting position, raise the opposite side.","Continue alternating your left and right arms, whipping the ropes up and down as fast as you can."],"equipment":["Other"],"metric":"duration","level":"beginner","src":"both"},{"id":"bayesian-curl","name":"Bayesian Curl","group":"Arms","primary":"Biceps","secondary":["Forearms"],"split":"pull","pattern":"Curl","focus":"Biceps","guide":"Cable curl from behind body in a staggered stance. Provides stretch under load and great tension curve throughout.","steps":["Set the cable low and stand facing away from it. Hold the handle in the hand behind you with the arm pulled back and the elbow behind the torso.","Curl the handle up toward the shoulder without moving the upper arm forward.","Lower slowly until the biceps is fully stretched behind you."],"equipment":["Cable"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"bear-crawl","name":"Bear Crawl","group":"Full Body","primary":"Front Delts","secondary":["Abs","Quads"],"split":"full","pattern":"Calisthenics","focus":"Shoulders, Core, Quads","guide":"Crawl on all fours, keeping knees close to floor. Activates shoulders, core, and legs while training coordination and endurance.","steps":["Start on hands and toes with the knees hovering just off the floor and the back flat.","Move the opposite hand and foot forward together, taking small controlled steps.","Keep the hips low and level. Crawl a set distance, then reverse or rest."],"equipment":["Bodyweight"],"metric":"distance","level":"beginner","src":"ivan"},{"id":"bear-crawl-sled-drag","name":"Bear Crawl Sled Drag","group":"Full Body","primary":"Quads","secondary":["Calves","Glutes","Hamstrings"],"split":"full","pattern":"Carry","focus":"Quads","guide":null,"steps":["Wearing either a harness or a loose weight belt, attach the chain to the back so that you will be facing away from the sled. Bend down so that your hands are on the ground. Your back should be flat and knees bent. This is your starting position.","Begin by driving with legs, alternating left and right. Use your hands to maintain balance and to help pull. Try to keep your back flat as you move over a given distance."],"equipment":["Sled"],"metric":"distance","level":"beginner","src":"freedb"},{"id":"behind-the-back-cable-curl","name":"Behind-the-Back Cable Curl","group":"Arms","primary":"Biceps","secondary":["Forearms"],"split":"pull","pattern":"Curl","focus":"Biceps","guide":"Similar to Bayesian curl, emphasizes stretch and constant tension. Use light weight and strict control.","steps":["Stand with a low cable behind you and take the handle with the arm pulled back, elbow behind the body.","Curl the handle toward your shoulder, keeping the elbow in place.","Lower slowly to a full stretch. Use light weight and strict form."],"equipment":["Cable"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"behind-the-back-shrug","name":"Behind-the-Back Shrug","group":"Back","primary":"Traps","secondary":["Forearms","Upper Back","Front Delts"],"split":"pull","pattern":"Shrug","focus":"Traps","guide":null,"steps":["Stand up straight with your feet at shoulder width as you hold a barbell with both hands behind your back using a pronated grip (palms facing back). Tip: Your hands should be a little wider than shoulder width apart. You can use wrist wraps for this exercise for better grip. This will be your starting position.","Raise your shoulders up as far as you can go as you breathe out and hold the contraction for a second. Tip: Refrain from trying to lift the barbell by using your biceps. The arms should remain stretched out at all times.","Slowly return to the starting position as you breathe in."],"equipment":["Barbell","Smith Machine"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"behind-the-back-wrist-curl","name":"Behind-the-Back Wrist Curl","group":"Arms","primary":"Forearms","secondary":[],"split":"pull","pattern":"Curl","focus":"Forearms","guide":null,"steps":["Start by standing straight and holding a barbell behind your glutes at arm's length while using a pronated grip (palms will be facing back away from the glutes) and having your hands shoulder width apart from each other.","You should be looking straight forward while your feet are shoulder width apart from each other. This is the starting position.","While exhaling, slowly elevate the barbell up by curling your wrist in a semi-circular motion towards the ceiling. Note: Your wrist should be the only body part moving for this exercise.","Hold the contraction for a second and lower the barbell back down to the starting position while inhaling.","Repeat for the recommended amount of repetitions.","When finished, lower the barbell down to the squat rack or the floor by bending the knees. Tip: It is easiest to either pick it up from a squat rack or have a partner hand it to you."],"equipment":["Barbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"behind-the-head-skullcrusher","name":"Behind-the-Head Skullcrusher","group":"Arms","primary":"Triceps","secondary":[],"split":"push","pattern":"Extension","focus":"Triceps","guide":null,"steps":["While holding a barbell or EZ Curl bar with a pronated grip (palms facing forward), lie on your back on a flat bench with your head close to the end of the bench. Tip: If you are holding a barbell grab it using a shoulder-width grip and if you are using an E-Z Bar grab it on the inner handles.","Extend your arms in front of you and slowly bring the bar back in a semi circular motion (while keeping the arms extended) to a position over your head. At the end of this step your arms should be overhead and parallel to the floor. This will be your starting position. Tip: Keep your elbows in at all times.","As you inhale, lower the bar by bending at the elbows and while keeping the upper arm stationary. Keep lowering the bar until your forearms are perpendicular to the floor.","As you exhale bring the bar back up to the starting position by pushing the bar up in a semi-circular motion until the lower arms are also parallel to the floor. Contract the triceps hard at the top of the movement for a second. Tip: Again, only the forearms should move. The upper arms should remain stationary at all times."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"behind-the-neck-press","name":"Behind-the-Neck Press","group":"Shoulders","primary":"Front Delts","secondary":["Triceps","Side Delts"],"split":"push","pattern":"Press","focus":"Full Delts","guide":"Bar lowers behind head. Only for lifters with excellent shoulder mobility. Keep elbows stacked under wrists and core braced.","steps":["This exercise is best performed inside a squat rack for easier pick up of the bar. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Your back should be kept straight while performing this exercise. This will be your starting position.","Elevate the barbell overhead by fully extending your arms while breathing out.","Hold the contraction for a second and lower the barbell back down to the starting position by inhaling."],"equipment":["Barbell","Smith Machine"],"metric":"reps","level":"intermediate","src":"both"},{"id":"behind-the-neck-pull-up","name":"Behind-the-Neck Pull-Up","group":"Back","primary":"Lats","secondary":["Biceps","Upper Back","Front Delts"],"split":"pull","pattern":"Vertical Pull","focus":"Lats","guide":null,"steps":["Grab the pull-up bar with the palms facing forward using a wide grip.","As you have both arms extended in front of you holding the bar, bring your torso forward and head so that there is an imaginary line from the pull-up bar to the back of your neck. This is your starting position.","Pull your torso up until the bar is near the back of your neck. To do this, draw the shoulders and upper arms down and back while slightly leaning your head forward. Exhale as you perform this portion of the movement. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary as it moves through space and only the arms should move. The forearms should do no other work other than hold the bar.","After a second on the contracted position, start to inhale and slowly lower your torso back to the starting position when your arms are fully extended and the lats are fully stretched."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"behind-the-neck-pulldown","name":"Behind-the-Neck Pulldown","group":"Back","primary":"Lats","secondary":["Biceps","Upper Back"],"split":"pull","pattern":"Vertical Pull","focus":"Lats","guide":"Pull bar behind head with light weight. Maintain upright torso and scapular control. Use caution with shoulder mobility.","steps":["Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than your shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso and head forward. Think of an imaginary line from the center of the bar down to the back of your neck. This is your starting position.","As you breathe out, bring the bar down until it touches the back of your neck by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the bar; therefore do not try to pull down the bar using the forearms.","After a second on the contracted position squeezing your shoulder blades together, slowly raise the bar back to the starting position when your arms are fully extended and the lats are fully stretched. Inhale during this portion of the movement."],"equipment":["Cable","Machine"],"metric":"reps","level":"intermediate","src":"both"},{"id":"bench-dip","name":"Bench Dip","group":"Arms","primary":"Triceps","secondary":["Mid Chest","Front Delts"],"split":"push","pattern":"Press","focus":"Triceps","guide":null,"steps":["For this exercise you will need to place a bench behind your back. With the bench perpendicular to your body, and while looking away from it, hold on to the bench on its edge with the hands fully extended, separated at shoulder width. The legs will be extended forward, bent at the waist and perpendicular to your torso. This will be your starting position.","Slowly lower your body as you inhale by bending at the elbows until you lower yourself far enough to where there is an angle slightly smaller than 90 degrees between the upper arm and the forearm. Tip: Keep the elbows as close as possible throughout the movement. Forearms should always be pointing down.","Using your triceps to bring your torso up again, lift yourself back to the starting position."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"bench-jump","name":"Bench Jump","group":"Legs","primary":"Quads","secondary":["Calves","Glutes","Hamstrings"],"split":"legs","pattern":"Plyometric","focus":"Quads","guide":null,"steps":["Begin with a box or bench 1-2 feet in front of you. Stand with your feet shoulder width apart. This will be your starting position.","Perform a short squat in preparation for the jump; swing your arms behind you.","Rebound out of this position, extending through the hips, knees, and ankles to jump as high as possible. Swing your arms forward and up.","Jump over the bench, landing with the knees bent, absorbing the impact through the legs.","Turn around and face the opposite direction, then jump back over the bench."],"equipment":["Bodyweight"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"flat-press","name":"Bench Press","group":"Chest","primary":"Mid Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Press","focus":"Mid Chest","guide":"Press from a flat surface with medium-width grip. Keep elbows tucked, core tight, and shoulder blades retracted.","steps":["Begin by lying on the bench, getting your head beyond the bar if possible. Tuck your feet underneath you and arch your back. Using the bar to help support your weight, lift your shoulder off the bench and retract them, squeezing the shoulder blades together. Use your feet to drive your traps into the bench. Maintain this tight body position throughout the movement.","However wide your grip, it should cover the ring on the bar. Pull the bar out of the rack without protracting your shoulders. Focus on squeezing the bar and trying to pull it apart.","Lower the bar to your lower chest or upper stomach. The bar, wrist, and elbow should stay in line at all times.","Pause when the barbell touches your torso, and then drive the bar up with as much force as possible. The elbows should be tucked in until lockout."],"equipment":["Barbell","Dumbbell","Machine","Smith Machine","Band"],"metric":"reps","level":"intermediate","src":"both"},{"id":"bent-press","name":"Bent Press","group":"Core","primary":"Abs","secondary":["Glutes","Hamstrings","Lower Back","Quads","Front Delts"],"split":"core","pattern":"Overhead Press","focus":"Abs","guide":null,"steps":["Clean a kettlebell to your shoulder. Clean the kettlebell to your shoulders by extending through the legs and hips as you raise the ke
