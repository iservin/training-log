d reach from behind the legs. Go back and forth for several repetitions."],"equipment":["Kettlebell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"kettlebell-lunge-pass-through","name":"Kettlebell Lunge Pass-Through","group":"Legs","primary":"Hamstrings","secondary":["Calves","Glutes","Quads"],"split":"legs","pattern":"Lunge","focus":"Hamstrings","guide":null,"steps":["Stand with your torso upright holding a kettlebell in your right hand. This will be your starting position.","Step forward with your left foot and lower your upper body down by flexing the hip and the knee, keeping the torso upright. Lower your back knee until it nearly touches the ground.","As you lunge, pass the kettlebell under your front leg to your opposite hand.","Pressing through the heel of your foot, return to the starting position."],"equipment":["Kettlebell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"kettlebell-swing","name":"Kettlebell Swing","group":"Full Body","primary":"Glutes","secondary":["Hamstrings","Abs"],"split":"full","pattern":"Hinge + Swing","focus":"Glutes, Hamstrings, Core","guide":"Drive hips back and snap forward, swinging bell to shoulder height. Use glutes and hamstrings, not arms. Keep shoulders packed.","steps":["Allow the dumbbell to hang at arms length between your legs, holding it with both hands. Keep your back straight and your head up.","Swing the dumbbell between your legs, flexing at the hips and bending the knees slightly.","Powerfully reverse the motion by extending at the hips, knees, and ankles to propel yourself upward, swinging the dumbell over your head.","As you land, absorb the impact through your legs and draw the dumbbell to your torso before the next repetition."],"equipment":["Kettlebell","Dumbbell"],"metric":"reps","level":"beginner","src":"both"},{"id":"kickback","name":"Kickback","group":"Arms","primary":"Triceps","secondary":[],"split":"push","pattern":"Extension","focus":"Triceps","guide":"Bend at hips, upper arms stay parallel to torso. Extend elbows without swinging. Focus on full contraction.","steps":["Start with a dumbbell in each hand and your palms facing your torso. Keep your back straight with a slight bend in the knees and bend forward at the waist. Your torso should be almost parallel to the floor. Make sure to keep your head up. Your upper arms should be close to your torso and parallel to the floor. Your forearms should be pointed towards the floor as you hold the weights. There should be a 90-degree angle formed between your forearm and upper arm. This is your starting position.","Now, while keeping your upper arms stationary, exhale and use your triceps to lift the weights until the arm is fully extended. Focus on moving the forearm.","After a brief pause at the top contraction, inhale and slowly lower the dumbbells back down to the starting position."],"equipment":["Dumbbell","Cable"],"metric":"reps","level":"beginner","src":"both"},{"id":"kneeling-cable-triceps-extension","name":"Kneeling Cable Triceps Extension","group":"Arms","primary":"Triceps","secondary":[],"split":"push","pattern":"Extension","focus":"Triceps","guide":null,"steps":["Place a bench sideways in front of a high pulley machine.","Hold a straight bar attachment above your head with your hands about 6 inches apart with your palms facing down.","Face away from the machine and kneel.","Place your head and the back of your upper arms on the bench. Your elbows should be bent with the forearms pointing towards the high pulley. This will be your starting position.","While keeping your upper arms close to your head at all times with the elbows in, press the bar out in a semicircular motion until the elbows are locked and your arms are parallel to the floor. Contract the triceps hard and keep this position for a second. Exhale as you perform this movement.","Slowly return to the starting position as you breathe in."],"equipment":["Cable"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"kneeling-jump-squat","name":"Kneeling Jump Squat","group":"Legs","primary":"Glutes","secondary":["Calves","Hamstrings","Quads"],"split":"legs","pattern":"Squat","focus":"Glutes","guide":null,"steps":["Begin kneeling on the floor with a barbell racked across the back of your shoulders, or you can use your body weight for this exercise. This can be done inside of a power rack to make unracking easier.","Sit back with your hips until your glutes touch your feet, keeping your head and chest up.","Explode up with your hips, generating enough power to land with your feet flat on the floor.","Continue with the squat by driving through your heels and extending the knees to come to a standing position."],"equipment":["Barbell"],"metric":"reps","level":"expert","src":"freedb"},{"id":"kneeling-lat-pullover","name":"Kneeling Lat Pullover","group":"Back","primary":"Lats","secondary":["Biceps","Upper Back"],"split":"pull","pattern":"Vertical Pull","focus":"Lats","guide":"Kneeling or bent-over, pull cable down in a sweeping arc. Maintain straight arms and constant tension on lats.","steps":["Set a high cable with a straight bar or rope and kneel facing it, then lean slightly forward with the arms straight.","Sweep the bar down in an arc to your thighs, keeping the elbows nearly straight.","Let the bar rise back up slowly until you feel a full lat stretch."],"equipment":["Cable"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"kneeling-leg-curl-with-sliders","name":"Kneeling Leg Curl with Sliders","group":"Legs","primary":"Hamstrings","secondary":[],"split":"legs","pattern":"Curl","focus":"Hamstrings","guide":"Bodyweight hamstring curl using sliders. Constant tension and high eccentric load.","steps":["For this movement a wooden floor or similar is needed. Lay on your back with your legs extended. Place a gym towel or a light weight underneath your heel. This will be your starting position.","Begin the movement by flexing the knee, keeping your other leg straight.","Continue bringing the heel closer to you, sliding it on the floor.","At full knee flexion, reverse the movement to return to the starting position."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"both"},{"id":"kneeling-squat","name":"Kneeling Squat","group":"Legs","primary":"Glutes","secondary":["Quads"],"split":"legs","pattern":"Squat","focus":"Glutes/Quads","guide":"Hinge dominant, glute-focused squat from knees. Ideal for minimizing knee and ankle stress.","steps":["Set the bar to the proper height in a power rack. Kneel behind the bar; it may be beneficial to put a mat down to pad your knees. Slide under the bar, racking it across the back of your shoulders. Your shoulder blades should be retracted and the bar tight across your back. Unrack the weight.","With your head looking forward, sit back with your butt until you touch your calves.","Reverse the motion, returning the torso to an upright position."],"equipment":["Barbell","Smith Machine"],"metric":"reps","level":"intermediate","src":"both"},{"id":"kroc-row","name":"Kroc Row","group":"Back","primary":"Lats","secondary":["Forearms","Biceps","Upper Back"],"split":"pull","pattern":"Horizontal Row","focus":"Lats, Grip","guide":"Heavy, high-rep dumbbell rows with slight body English. Emphasizes lat hypertrophy and grip strength. Developed by Matt Kroczaleski.","steps":["Place one hand and knee on a bench or rack and hold a heavy dumbbell in the other hand.","Row the dumbbell up to the hip with a slight body English, keeping the back flat.","Lower to a full stretch and repeat for high reps."],"equipment":["Dumbbell"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"l-sit","name":"L-Sit","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Calisthenics","focus":"Full Core","guide":"Support body using parallel bars or floor. Keep legs extended in front of you. Extremely challenging for entire core.","steps":["Support yourself on parallel bars or the floor with straight arms and the shoulders pressed down.","Lift the legs straight out in front, parallel to the floor.","Hold with the knees locked and toes pointed. Tuck the knees if you cannot yet hold straight legs."],"equipment":["Bodyweight"],"metric":"time","level":"expert","src":"ivan"},{"id":"landmine-jammer","name":"Landmine Jammer","group":"Shoulders","primary":"Front Delts","secondary":["Abs","Calves","Mid Chest","Hamstrings","Quads"],"split":"push","pattern":"Overhead Press","focus":"Front Delts","guide":null,"steps":["Position a bar into landmine or, lacking one, securely anchor it in a corner. Load the bar to an appropriate weight and position the handle attachment on the bar.","Raise the bar from the floor, taking the handles to your shoulders. This will be your starting position.","In an athletic stance, squat by flexing your hips and setting your hips back, keeping your arms flexed.","Reverse the motion by powerfully extending through the hips, knees, and ankles, while also extending the elbows to straighten the arms. This movement should be done explosively, coming out of the squat to full extension as powerfully as possible.","Return to the starting position."],"equipment":["Landmine"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"landmine-press","name":"Landmine Press","group":"Shoulders","primary":"Front Delts","secondary":["Triceps","Side Delts"],"split":"push","pattern":"Press","focus":"Full Delts","guide":"Press bar in arcing path upward. Great for shoulder-friendly pressing. Slight torso rotation allowed for unilateral control.","steps":["Set one end of a barbell in a landmine and hold the other end at your shoulder with one or two hands.","Press the bar up and forward in an arc until the arm is straight.","Lower slowly to the shoulder."],"equipment":["Landmine"],"metric":"reps","level":"beginner","src":"ivan"},{"id":"landmine-rotational-press","name":"Landmine Rotational Press","group":"Full Body","primary":"Obliques","secondary":["Front Delts","Glutes"],"split":"full","pattern":"Rotation + Press","focus":"Shoulders, Core, Hips","guide":"Rotate from hips and drive bar upward at an angle. Great for power transfer, core, and shoulder health.","steps":["Stand in a split stance holding the end of the landmine bar at one shoulder.","Rotate the hips and pivot the back foot as you press the bar up and across.","Lower with control and rotate back to the start. Finish the reps, then switch sides."],"equipment":["Landmine"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"landmine-twist","name":"Landmine Twist","group":"Core","primary":"Obliques","secondary":[],"split":"core","pattern":"Rotation","focus":"Obliques","guide":"Hold bar with both hands and rotate side to side in semicircle motion. Pivot feet and keep core braced throughout.","steps":["Position a bar into a landmine or securely anchor it in a corner. Load the bar to an appropriate weight.","Raise the bar from the floor, taking it to shoulder height with both hands with your arms extended in front of you. Adopt a wide stance. This will be your starting position.","Perform the movement by rotating the trunk and hips as you swing the weight all the way down to one side. Keep your arms extended throughout the exercise.","Reverse the motion to swing the weight all the way to the opposite side.","Continue alternating the movement until the set is complete."],"equipment":["Landmine"],"metric":"reps","level":"beginner","src":"both"},{"id":"lat-prayer","name":"Lat Prayer","group":"Back","primary":"Lats","secondary":[],"split":"pull","pattern":"Isolation","focus":"Lats","guide":"Kneel or stand, cable behind you. Straight arms, push hands forward and downward like a pullover/prayer. Intense lat stretch and contraction.","steps":["Set a high cable with a rope and kneel or stand facing away from it, leaning slightly forward.","With straight arms, push the hands forward and down in a pullover arc.","Return slowly to a full lat stretch. Do not bend the elbows."],"equipment":["Cable","Machine"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"lat-pulldown","name":"Lat Pulldown","group":"Back","primary":"Lats","secondary":["Biceps","Upper Back"],"split":"pull","pattern":"Vertical Pull","focus":"Lats","guide":"Pull bar toward upper chest, keeping elbows angled down and back. Avoid leaning too far back; focus on squeezing lats.","steps":["Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","As you breathe out, bring the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the bar; therefore do not try to pull down the bar using the forearms.","After a second at the contracted position squeezing your shoulder blades together, slowly raise the bar back to the starting position when your arms are fully extended and the lats are fully stretched. Inhale during this portion of the movement."],"equipment":["Cable","Machine"],"metric":"reps","level":"beginner","src":"both"},{"id":"lateral-band-walk","name":"Lateral Band Walk","group":"Legs","primary":"Abductors","secondary":[],"split":"legs","pattern":"Lateral Movement","focus":"Abductors","guide":"Step side-to-side with band above knees or ankles. Maintain constant tension and soft knees.","steps":["Place a band above the knees or around the ankles and stand in a quarter squat with the feet hip width apart.","Step sideways, leading with one foot, and keep tension on the band.","Take steps in one direction, then back. Keep the knees pushed out and the toes forward."],"equipment":["Band"],"metric":"reps","level":"beginner","src":"ivan"},{"id":"lateral-bound","name":"Lateral Bound","group":"Legs","primary":"Adductors","secondary":["Abductors","Calves","Glutes","Hamstrings","Quads"],"split":"legs","pattern":"Plyometric","focus":"Adductors","guide":null,"steps":["Assume a half squat position facing 90 degrees from your direction of travel. This will be your starting position.","Allow your lead leg to do a countermovement inward as you shift your weight to the outside leg.","Immediately push off and extend, attempting to bound to the side as far as possible.","Upon landing, immediately push off in the opposite direction, returning to your original start position.","Continue back and forth for several repetitions."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"lateral-box-jump","name":"Lateral Box Jump","group":"Legs","primary":"Adductors","secondary":["Abductors","Calves","Glutes","Hamstrings","Quads"],"split":"legs","pattern":"Plyometric","focus":"Adductors","guide":null,"steps":["Assume a comfortable standing position, with a short box positioned next to you. This will be your starting position.","Quickly dip into a quarter squat to initiate the stretch reflex, and immediately reverse direction to jump up and to the side.","Bring your knees high enough to ensure your feet have good clearance over the box.","Land on the center of the box, using your legs to absorb the impact.","Carefully jump down to the other side of the box, and continue going back and forth for several repetitions."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"lateral-broad-jump","name":"Lateral Broad Jump","group":"Legs","primary":"Quads","secondary":["Calves","Glutes","Hamstrings"],"split":"legs","pattern":"Plyometric","focus":"Quads","guide":null,"steps":["Begin standing with your feet hip width apart in an athletic stance. Your head and chest should be up, knees and hips slightly bent. This will be your starting position.","Leaning to your right, extend through your hips, knees, and ankles to jump into the air. Block with the arms to lead the movement, jumping as far to your right as you can.","Land facing the same direction with your feet hip width apart, absorbing the impact through your lower body."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"lateral-hop","name":"Lateral Hop","group":"Legs","primary":"Adductors","secondary":["Abductors","Calves","Glutes","Hamstrings","Quads"],"split":"legs","pattern":"Plyometric","focus":"Adductors","guide":null,"steps":["Position a number of cones in a row several feet apart.","Stand next to the end of the cones, facing 90 degrees to the direction of travel. This will be your starting position.","Begin the jump by dipping with the knees to initiate a stretch reflex, and immediately reverse direction to push off the ground, jumping up and sideways over the cone.","Use your legs to absorb impact upon landing, and rebound into the next jump, continuing down the row of cones."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"lateral-raise","name":"Lateral Raise","group":"Shoulders","primary":"Side Delts","secondary":[],"split":"push","pattern":"Raise","focus":"Side Delts","guide":"Raise arms out to sides, slightly in front of body. Keep slight bend in elbows and lead with elbows, not hands. Pause at top.","steps":["Pick a couple of dumbbells and stand with a straight torso and the dumbbells by your side at arms length with the palms of the hand facing you. This will be your starting position.","While maintaining the torso in a stationary position (no swinging), lift the dumbbells to your side with a slight bend on the elbow and the hands slightly tilted forward as if pouring water in a glass. Continue to go up until you arms are parallel to the floor. Exhale as you execute this movement and pause for a second at the top.","Lower the dumbbells back down slowly to the starting position as you inhale."],"equipment":["Dumbbell","Cable","Machine","Band"],"metric":"reps","level":"beginner","src":"both"},{"id":"lateral-to-front-raise","name":"Lateral-to-Front Raise","group":"Shoulders","primary":"Side Delts","secondary":["Traps"],"split":"push","pattern":"Raise","focus":"Side Delts","guide":null,"steps":["In a standing position, hold a pair of dumbbells at your side. This will be your starting position.","Keeping your elbows slightly bent, raise the weights directly in front of you to shoulder height, avoiding any swinging or cheating.","At the top of the exercise move the weights out in front of you, keeping your arms extended.","Lower the weights with a controlled motion.","On the next repetition, raise the weights in front of you to shoulder height before moving the weights laterally to your sides.","Lower the weights to the starting position."],"equipment":["Dumbbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"lean-away-lateral-raise","name":"Lean-Away Lateral Raise","group":"Shoulders","primary":"Side Delts","secondary":[],"split":"push","pattern":"Raise","focus":"Side Delts","guide":"Leaning increases range and overloads top of movement. Maintain control through full range of motion.","steps":["Hold a cable handle or a fixed upright and lean away from the cable with the working arm straight.","Raise the arm out to the side to shoulder height or a little higher.","Lower slowly. The lean lengthens the range of the top of the movement."],"equipment":["Cable","Dumbbell"],"metric":"reps","level":"beginner","src":"ivan"},{"id":"leg-extension","name":"Leg Extension","group":"Legs","primary":"Quads","secondary":[],"split":"legs","pattern":"Extension","focus":"Quads","guide":"Sit upright, pad above ankles. Fully contract quads at top. Control the descent for eccentric loading.","steps":["For this exercise you will need to use a leg extension machine. First choose your weight and sit on the machine with your legs under the pad (feet pointed forward) and the hands holding the side bars. This will be your starting position. Tip: You will need to adjust the pad so that it falls on top of your lower leg (just above your feet). Also, make sure that your legs form a 90-degree angle between the lower and upper leg. If the angle is less than 90-degrees then that means the knee is over the toes which in turn creates undue stress at the knee joint. If the machine is designed that way, either look for another machine or just make sure that when you start executing the exercise you stop going down once you hit the 90-degree angle.","Using your quadriceps, extend your legs to the maximum as you exhale. Ensure that the rest of the body remains stationary on the seat. Pause a second on the contracted position.","Slowly lower the weight back to the original position as you inhale, ensuring that you do not go past the 90-degree angle limit."],"equipment":["Machine"],"metric":"reps","level":"beginner","src":"both"},{"id":"leg-press","name":"Leg Press","group":"Legs","primary":"Quads","secondary":[],"split":"legs","pattern":"Combo","focus":"Full Legs","guide":"Feet shoulder-width and flat. Control descent, stopping just before hips round. Foot placement shifts emphasis (lower = quads, higher = glutes/hamstrings).","steps":["Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a medium (shoulder width) foot stance. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).","Lower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you. Tip: Make sure that you do not lock your knees. Your torso and the legs should make a perfect 90-degree angle. This will be your starting position.","As you inhale, slowly lower the platform until your upper and lower legs make a 90-degree angle.","Pushing mainly with the heels of your feet and using the quadriceps go back to the starting position as you exhale."],"equipment":["Machine"],"metric":"reps","level":"beginner","src":"both"},{"id":"log-press","name":"Log Press","group":"Full Body","primary":"Front Delts","secondary":["Abs","Mid Chest","Glutes","Hamstrings","Lower Back"],"split":"full","pattern":"Overhead Press","focus":"Front Delts","guide":null,"steps":["Begin standing with the log in front of you. Grasp the handles, and begin to clean the log. As you are bent over to start the clean, attempt to get the log as high as possible, pulling it into your chest. Extend through the hips and knees to bring it up to complete the clean.","Push your head back and look up, creating a shelf on your chest to rest the log. Begin the press by dipping, flexing slightly through the knees and reversing the motion. This push press will generate momentum to start the log moving vertically. Continue by extending through the elbows to press the log above your head. There are no strict rules on form, so use whatever techniques you are most efficient with. As the log is pressed, ensure that you push your head through on each repetition, looking forward."],"equipment":["Strongman"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"low-cable-triceps-extension","name":"Low Cable Triceps Extension","group":"Arms","primary":"Triceps","secondary":[],"split":"push","pattern":"Extension","focus":"Triceps","guide":null,"steps":["Select the desired weight and lay down face up on the bench of a seated row machine that has a rope attached to it. Your head should be pointing towards the attachment.","Grab the outside of the rope ends with your palms facing each other (neutral grip).","Position your elbows so that they are bent at a 90 degree angle and your upper arms are perpendicular (90 degree angle) to your torso. Tip: Keep the elbows in and make sure that the upper arms point to the ceiling while your forearms point towards the pulley above your head. This will be your starting position.","As you breathe out, extend your lower arms until they are straight and vertical. The upper arms and elbows remain stationary throughout the movement. Only the forearms should move. Contract the triceps hard for a second.","As you breathe in slowly return to the starting position."],"equipment":["Cable"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"low-row","name":"Low Row","group":"Back","primary":"Upper Back","secondary":["Lats","Biceps","Rear Delts"],"split":"pull","pattern":"Row","focus":"Mid-back/Lats/Rhomboids","guide":"Sit upright and pull from a low horizontal position. Elbows travel close to body. Focuses on mid-back density with minimal lower back strain.","steps":["Load an appropriate weight onto the pins and adjust the seat height so that the handles are at chest level. Grasp the handles with either a neutral or pronated grip. This will be your starting position.","Pull the handles towards your torso, retracting your shoulder blades as you flex the elbow.","Pause at the bottom of the motion, and then slowly return the handles to the starting position. For multiple repetitions, avoid completely returning the weight to the stops to keep tension on the muscles being worked."],"equipment":["Machine","Cable"],"metric":"reps","level":"beginner","src":"both"},{"id":"low-to-high-cable-crossover","name":"Low-to-High Cable Crossover","group":"Chest","primary":"Upper Chest","secondary":["Front Delts"],"split":"push","pattern":"Fly","focus":"Upper Chest","guide":null,"steps":["To move into the starting position, place the pulleys at the low position, select the resistance to be used and grasp a handle in each hand.","Step forward, gaining tension in the pulleys. Your palms should be facing forward, hands below the waist, and your arms straight. This will be your starting position.","With a slight bend in your arms, draw your hands upward and toward the midline of your body. Your hands should come together in front of your chest, palms facing up.","Return your arms back to the starting position after a brief pause."],"equipment":["Cable"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"lunge","name":"Lunge","group":"Legs","primary":"Quads","secondary":["Calves","Glutes","Hamstrings"],"split":"legs","pattern":"Lunge","focus":"Quads","guide":null,"steps":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack just below shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and step forward with your right leg and squat down through your hips, while keeping the torso upright and maintaining balance. Inhale as you go down. Note: Do not allow your knee to go forward beyond your toes as you come down, as this will put undue stress on the knee joint. li>","Using mainly the heel of your foot, push up and go back to the starting position as you exhale."],"equipment":["Barbell","Dumbbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"lying-cable-curl","name":"Lying Cable Curl","group":"Arms","primary":"Biceps","secondary":[],"split":"pull","pattern":"Curl","focus":"Biceps","guide":null,"steps":["Grab a straight bar or E-Z bar attachment that is attached to the low pulley with both hands, using an underhand (palms facing up) shoulder-width grip.","Lie flat on your back on top of an exercise mat in front of the weight stack with your feet flat against the frame of the pulley machine and your legs straight.","With your arms extended and your elbows close to your body slightly bend your arms. This will be your starting position.","While keeping your upper arms stationary and the elbows close to your body, curl the bar up slowly toward your chest as you breathe out and you squeeze the biceps.","After a second squeeze at the top of the movement, slowly return to the starting position."],"equipment":["Cable"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"lying-curl","name":"Lying Curl","group":"Arms","primary":"Biceps","secondary":[],"split":"pull","pattern":"Curl","focus":"Biceps","guide":null,"steps":["Lie down on a flat bench face up while holding a dumbbell in each arm on top of your thighs.","Bring the dumbbells to the sides with the arms extended and the palms of the hands facing your thighs (neutral grip).","While keeping the arms close to your torso and elbows in, slowly lower your arms (as you keep them extended with a slight bend at the elbows) as far down towards the floor as you can go. Once you cannot go down any further, lock your upper arms in that position and that will be your starting position.","As you breathe out, slowly begin to curl the weights up as you simultaneously rotate your wrists so that the palms of the hands face up. Continue curling the weight until your biceps are fully contracted and squeeze hard at the top position for a second. Tip: Only the forearms should move. Upper arms should remain stationary and elbows should stay in throughout the movement.","Return back to the starting position very slowly."],"equipment":["Dumbbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"lying-knee-tuck","name":"Lying Knee Tuck","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Leg Raise","focus":"Abs","guide":null,"steps":["Lie on an exercise mat with your legs extended and your hands either palms facing down next to you or under your glutes. Tip: My preference is with the hands next to me. This will be your starting position.","Bend your knees and pull your upper thighs into your midsection as you breathe out. Continue the motion until your knees are around chest level. Contract your abs as you execute this movement and hold for a second at the top. Tip: As you perform the motion, the lower legs (calves) should always remain parallel to the floor.","Return to the starting position as you inhale."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"lying-leg-curl","name":"Lying Leg Curl","group":"Legs","primary":"Hamstrings","secondary":[],"split":"legs","pattern":"Curl","focus":"Hamstrings","guide":"Pad behind ankles. Flex knees to pull pad up. Focus on controlled concentric and slow eccentric.","steps":["Adjust the machine lever to fit your height and lie face down on the leg curl machine with the pad of the lever on the back of your legs (just a few inches under the calves). Tip: Preferably use a leg curl machine that is angled as opposed to flat since an angled position is more favorable for hamstrings recruitment.","Keeping the torso flat on the bench, ensure your legs are fully stretched and grab the side handles of the machine. Position your toes straight (or you can also use any of the other two stances described on the foot positioning section). This will be your starting position.","As you exhale, curl your legs up as far as possible without lifting the upper legs from the pad. Once you hit the fully contracted position, hold it for a second.","As you inhale, bring the legs back to the initial position. Repeat for the recommended amount of repetitions."],"equipment":["Machine"],"metric":"reps","level":"beginner","src":"both"},{"id":"lying-leg-raise","name":"Lying Leg Raise","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Leg Raise","focus":"Lower Abs","guide":"Lie flat, raise legs without arching lower back. Keep abs engaged and control lowering phase to emphasize eccentric.","steps":["Lie with your back flat on a bench and your legs extended in front of you off the end.","Place your hands either under your glutes with your palms down or by the sides holding on to the bench. This will be your starting position.","As you keep your legs extended, straight as possible with your knees slightly bent but locked raise your legs until they make a 90-degree angle with the floor. Exhale as you perform this portion of the movement and hold the contraction at the top for a second.","Now, as you inhale, slowly lower your legs back down to the starting position."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"both"},{"id":"lying-rear-delt-raise","name":"Lying Rear Delt Raise","group":"Shoulders","primary":"Rear Delts","secondary":["Upper Back"],"split":"pull","pattern":"Raise","focus":"Rear Delts","guide":null,"steps":["While holding a dumbbell in each hand, lay with your chest down on a flat bench.","Position the palms of the hands in a neutral manner (palms facing your torso) as you keep the arms extended with the elbows slightly bent. This will be your starting position.","Now raise the arms to the side until your elbows are at shoulder height and your arms are roughly parallel to the floor as you exhale. Tip: Maintain your arms perpendicular to the torso while keeping them extended throughout the movement. Also, keep the contraction at the top for a second.","Slowly lower the dumbbells to the starting position as you inhale."],"equipment":["Dumbbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"lying-side-lateral-raise","name":"Lying Side Lateral Raise","group":"Shoulders","primary":"Side Delts","secondary":[],"split":"push","pattern":"Raise","focus":"Side Delts","guide":"Lateral raise while lying on side isolates the working delt by eliminating momentum. Brutal and effective.","steps":["While holding a dumbbell in one hand, lay with your chest down on a flat bench. The other hand can be used to hold to the leg of the bench for stability.","Position the palm of the hand that is holding the dumbbell in a neutral manner (palms facing your torso) as you keep the arm extended with the elbow slightly bent. This will be your starting position.","Now raise the arm with the dumbbell to the side until your elbow is at shoulder height and your arm is roughly parallel to the floor as you exhale. Tip: Maintain your arm perpendicular to the torso while keeping your arm extended throughout the movement. Also, keep the contraction at the top for a second.","Slowly lower the dumbbell to the starting position as you inhale."],"equipment":["Dumbbell"],"metric":"reps","level":"intermediate","src":"both"},{"id":"man-maker","name":"Man Maker","group":"Full Body","primary":"Quads","secondary":["Front Delts","Upper Back","Mid Chest","Triceps","Abs"],"split":"full","pattern":"Combo","focus":"Total Body + Conditioning","guide":"Dumbbell burpee into row + clean + press. Extremely demanding. Focus on clean transitions and consistent bracing throughout.","steps":["Stand holding a dumbbell in each hand. Place them on the floor, jump the feet back and do a push-up.","Row each dumbbell in turn, jump the feet back in, and clean both weights to the shoulders.","Stand up into a thruster and press the dumbbells overhead. Lower and repeat."],"equipment":["Dumbbell"],"metric":"reps","level":"expert","src":"ivan"},{"id":"meadows-row","name":"Meadows Row","group":"Back","primary":"Upper Back","secondary":["Lats","Biceps","Rear Delts"],"split":"pull","pattern":"Horizontal Row","focus":"Mid Back","guide":"Staggered stance, use landmine attachment. Row with a pronated grip and controlled movement. Emphasizes upper lats and mid traps.","steps":["Position a bar into a landmine or in a corner to keep it from moving. Load an appropriate weight onto your end.","Stand next to the bar, and take a grip with one hand close to the collar. Using your hips and legs, rise to a standing position.","Assume a bent-knee stance with your hips back and your chest up. Your arm should be extended. This will be your starting position.","Pull the weight to your side by retracting the shoulder and flexing the elbow. Do not jerk the weight or cheat during the movement.","After a brief pause, return to the starting position."],"equipment":["Landmine","T-Bar"],"metric":"reps","level":"beginner","src":"both"},{"id":"med-ball-backward-throw","name":"Med-Ball Backward Throw","group":"Full Body","primary":"Front Delts","secondary":[],"split":"full","pattern":"Row","focus":"Front Delts","guide":null,"steps":["This exercise is best done with a partner. If you lack a partner, the ball can be thrown and retrieved or thrown against a wall.","Begin standing a few meters in front of your partner, both facing the same direction. Begin holding the ball between your legs.","Squat down and then forcefully reverse direction, coming to full extension and you toss the ball over your head to your partner.","Your partner can then roll the ball back to you. Repeat for the desired number of repetitions."],"equipment":["Med Ball"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"med-ball-chest-pass","name":"Med-Ball Chest Pass","group":"Chest","primary":"Mid Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Throw","focus":"Mid Chest","guide":null,"steps":["You will need a partner for this exercise. Lacking one, this movement can be performed against a wall.","Begin facing your partner holding the medicine ball at your torso with both hands.","Pull the ball to your chest, and reverse the motion by extending through the elbows. For sports applications, you can take a step as you throw.","Your partner should catch the ball, and throw it back to you.","Receive the throw with both hands at chest height."],"equipment":["Med Ball"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"med-ball-chest-push","name":"Med-Ball Chest Push","group":"Chest","primary":"Mid Chest","secondary":["Abs","Front Delts","Triceps"],"split":"push","pattern":"Throw","focus":"Mid Chest","guide":null,"steps":["Begin in an athletic stance with the knees bent, hips back, and back flat. Hold the medicine ball near your legs. This will be your starting position.","While taking your first step draw the medicine ball into your chest.","As you take the second step, explosively push the ball forward, immediately sprinting for 10 yards after the release. If you are really fast, you can catch your own pass!"],"equipment":["Med Ball"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"med-ball-overhead-throw","name":"Med-Ball Overhead Throw","group":"Full Body","primary":"Lats","secondary":["Abs","Mid Chest","Front Delts"],"split":"full","pattern":"Row","focus":"Lats","guide":null,"steps":["Begin standing while facing a wall or a partner.","Using both hands, position the ball behind your head, stretching as much as possible, and forcefully throw the ball forward.","Ensure that you follow your throw through, being prepared to receive your rebound from your throw. If you are throwing against the wall, make sure that you stand close enough to the wall to receive the rebound, and aim a little higher than you would with a partner."],"equipment":["Med Ball"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"med-ball-rotational-throw","name":"Med-Ball Rotational Throw","group":"Full Body","primary":"Obliques","secondary":["Glutes","Front Delts"],"split":"full","pattern":"Rotation","focus":"Obliques, Hips","guide":"Side-on to a wall. Load the back hip, then rotate hard and release the ball into the wall. Speed is the point - stop when power drops.","steps":["Stand side-on to a wall with a medicine ball held at the hip furthest from the wall.","Load the back hip, then rotate hard and release the ball into the wall.","Catch it, reset and repeat. Stop when power drops."],"equipment":["Med Ball"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"med-ball-scoop-toss","name":"Med-Ball Scoop Toss","group":"Full Body","primary":"Front Delts","secondary":["Abs","Hamstrings","Quads"],"split":"full","pattern":"Throw","focus":"Front Delts","guide":null,"steps":["Assume a semisquat stance with a medicine ball in your hands. Your arms should hang so the ball is near your feet.","Begin by thrusting the hips forward as you extend through the legs, jumping up.","As you do, swing your arms up and over your head, keeping them extended, releasing the ball at the peak of your movement. The goal is to throw the ball the greatest distance behind you."],"equipment":["Med Ball"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"med-ball-slam","name":"Med-Ball Slam","group":"Full Body","primary":"Lats","secondary":["Front Delts"],"split":"full","pattern":"Throw","focus":"Lats","guide":null,"steps":["Hold a medine ball with both hands and stand with your feet at shoulder width. This will be your starting position.","Initiate the countermovement by raising the ball above your head and fully extending your body.","Reverse the motion, slamming the ball into the ground directly in front of you as hard as you can.","Receive the ball with both hands on the bounce and repeat the movement."],"equipment":["Med Ball"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"med-ball-supine-chest-throw","name":"Med-Ball Supine Chest Throw","group":"Chest","primary":"Mid Chest","secondary":["Triceps","Front Delts"],"split":"push","pattern":"Row","focus":"Mid Chest","guide":null,"steps":["This drill is great for chest passes when you lack a partner or a wall of sufficient strength. Lay on the ground on your back with your knees bent.","Begin with the ball on your chest, held with both hands on the bottom.","Explode up, extending through the elbow to throw the ball directly above you as high as possible.","Catch the ball with both hands as it comes down."],"equipment":["Med Ball"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"med-ball-supine-overhead-throw","name":"Med-Ball Supine Overhead Throw","group":"Core","primary":"Abs","secondary":["Mid Chest","Lats","Front Delts"],"split":"core","pattern":"Row","focus":"Abs","guide":null,"steps":["Lay on the ground on your back with your knees bent.","Hold the ball with both hands, extending the arms fully behind your head. This will be your starting position.","Initiate the movement at the shoulder, throwing the ball directly forward of you as you sit up, attempting to go for maximum distance.","The ball can be thrown to a partner or bounced off of a wall."],"equipment":["Med Ball"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"med-ball-twist","name":"Med-Ball Twist","group":"Core","primary":"Obliques","secondary":["Front Delts"],"split":"core","pattern":"Rotation","focus":"Obliques","guide":null,"steps":["For this exercise you will need a medicine ball and a partner. Stand back to back with your partner, spaced 2-3 feet apart. This will be your starting position.","Hold the ball in front of the trunk. Open the hips and turn the shoulders at the same time as your partner.","For full rotation, you and your partner should twist in the same direction, i.e. counter-clockwise.","Pass the ball to your partner, and both of you can now twist in the opposite direction to repeat the procedure."],"equipment":["Med Ball"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"mixed-grip-pull-up","name":"Mixed-Grip Pull-Up","group":"Back","primary":"Upper Back","secondary":["Biceps","Lats"],"split":"pull","pattern":"Vertical Pull","focus":"Upper Back","guide":null,"steps":["Using a spacing that is just about 1 inch wider than shoulder width, grab a pull-up bar with the palms of one hand facing forward and the palms of the other hand facing towards you. This will be your starting position.","Now start to pull yourself up as you exhale. Tip: With the arm that has the palms facing up concentrate on using the back muscles in order to perform the movement. The elbow of that arm should remain close to the torso. With the other arm that has the palms facing forward, the elbows will be away but in line with the torso. You will concentrate on using the lats to pull your body up.","After a second contraction at the top, start to slowly come down as you inhale.","Repeat for the recommended amount of repetitions.","On the following set, switch grips; so if you had the right hand with the palms facing you and the left one with the palms facing forward, on the next set you will have the palms facing forward for the right hand and facing you for the left."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"expert","src":"freedb"},{"id":"monster-walk","name":"Monster Walk","group":"Legs","primary":"Abductors","secondary":[],"split":"legs","pattern":"Carry","focus":"Abductors","guide":null,"steps":["Place a band around both ankles and another around both knees. There should be enough tension that they are tight when your feet are shoulder width apart.","To begin, take short steps forward alternating your left and right foot.","After several steps, do just the opposite and walk backward to where you started."],"equipment":["Band"],"metric":"distance","level":"beginner","src":"freedb"},{"id":"mountain-climber","name":"Mountain Climber","group":"Legs","primary":"Quads","secondary":["Mid Chest","Hamstrings","Front Delts"],"split":"legs","pattern":"Other","focus":"Quads","guide":null,"steps":["Begin in a pushup position, with your weight supported by your hands and toes. Flexing the knee and hip, bring one leg until the knee is approximately under the hip. This will be your starting position.","Explosively reverse the positions of your legs, extending the bent leg until the leg is straight and supported by the toe, and bringing the other foot up with the hip and knee flexed. Repeat in an alternating fashion for 20-30 seconds."],"equipment":["Bodyweight"],"metric":"duration","level":"beginner","src":"freedb"},{"id":"muscle-snatch","name":"Muscle Snatch","group":"Full Body","primary":"Hamstrings","secondary":["Glutes","Lower Back","Quads","Front Delts","Triceps"],"split":"full","pattern":"Olympic","focus":"Hamstrings","guide":null,"steps":["Begin with a loaded barbell held at the mid thigh position with a wide grip. The feet should be directly below the hips, with the feet turned out as needed. Lower the hips, with the chest up and the head looking forward. The shoulders should be just in front of the bar. This will be the starting position.","Begin the pull by driving through the front of the heels, raising the bar. Transition into the second pull by extending through the hips knees and ankles, driving the bar up as quickly as possible. The bar should be close to the body.","Continue raising the bar to the overhead position, without rebending the knees."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"muscle-up","name":"Muscle-Up","group":"Full Body","primary":"Lats","secondary":["Abs","Biceps","Forearms","Upper Back","Front Delts"],"split":"full","pattern":"Vertical Pull","focus":"Lats","guide":null,"steps":["Grip the rings using a false grip, with the base of your palms on top of the rings. Initiate a pull up by pulling the elbows down to your side, flexing the elbows.","As you reach the top position of the pull-up, pull the rings to your armpits as you roll your shoulders forward, allowing your elbows to move straight back behind you. This puts you into the proper position to continue into the dip portion of the movement.","Maintaining control and stability, extend through the elbow to complete the motion.","Use care when lowering yourself to the ground."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"narrow-stance-squat","name":"Narrow-Stance Squat","group":"Legs","primary":"Quads","secondary":["Calves","Glutes","Hamstrings","Lower Back"],"split":"legs","pattern":"Row","focus":"Quads","guide":null,"steps":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a less-than-shoulder-width narrow stance with the toes slightly pointed out. Feet should be around 3-6 inches apart. Keep your head up at all times (looking down will get you off balance) and maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section).","Begin to slowly lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor with the heel of your foot mainly as you straighten the legs again and go back to the starting position."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"neck-harness-extension","name":"Neck Harness Extension","group":"Back","primary":"Neck","secondary":[],"split":"pull","pattern":"Extension","focus":"Neck","guide":null,"steps":["Place a neck strap on the floor at the end of a flat bench. Once you have selected the weights, sit at the end of the flat bench with your feet wider than shoulder width apart from each other. Your toes should be pointed out.","Slowly move your torso forward until it is almost parallel with the floor. Using both hands, securely position the neck strap around your head. Tip: Make sure the weights are still lying on the floor to prevent any strain on the neck. Now grab the weight with both hands while elevating your torso back until it is almost perpendicular to the floor. Note: Your head and torso needs to be slightly tilted forward to perform this exercise.","Now place both hands on top of your knees. This is the starting position.","Slowly lower your neck down until your chin touches the upper part of your chest while breathing in.","While exhaling, bring your neck back to the starting position."],"equipment":["Other"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"neutral-grip-bench-press","name":"Neutral-Grip Bench Press","group":"Chest","primary":"Mid Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Press","focus":"Mid Chest","guide":null,"steps":["Take a dumbbell in each hand and lay back onto a flat bench. Your feet should be flat on the floor and your shoulder blades retracted.","Maintaining a neutral grip, palms facing each other, begin with your arms extended directly above you, perpendicular to the floor. This will be your starting position.","Begin the movement by flexing the elbow, lowering the upper arms to the side. Descend until the dumbbells are to your torso.","Pause, then extend the elbow and return to the starting position."],"equipment":["Dumbbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"neutral-grip-incline-press","name":"Neutral-Grip Incline Press","group":"Chest","primary":"Upper Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Other","focus":"Upper Chest","guide":null,"steps":["Lie back on an incline bench with a dumbbell on each hand on top of your thighs. The palms of your hand will be facing each other.","By using your thighs to help you get the dumbbells up, clean the dumbbells one arm at a time so that you can hold them at shoulder width.","Once at shoulder width, keep the palms of your hands with a neutral grip (palms facing each other). Keep your elbows flared out with the upper arms in line with the shoulders (perpendicular to the torso) and the elbows bent creating a 90-degree angle between the upper arm and the forearm. This will be your starting position.","Now bring down the weights slowly to your side as you breathe in. Keep full control of the dumbbells at all times.","As you breathe out, push the dumbbells up using your pectoral muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the dumbbells back in your thighs and then on the floor. This is the safest manner to dispose of the dumbbells."],"equipment":["Dumbbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"neutral-grip-overhead-press","name":"Neutral-Grip Overhead Press","group":"Shoulders","primary":"Front Delts","secondary":["Triceps"],"split":"push","pattern":"Overhead Press","focus":"Front Delts","guide":null,"steps":["Start by having a dumbbell in each hand with your arm fully extended to the side using a neutral grip. Your feet should be shoulder width apart from each other. Now slowly lift the dumbbells up until you create a 90 degree angle with your arms. Note: Your forearms should be perpendicular to the floor. This the starting position.","Continue to maintain a neutral grip throughout the entire exercise. Slowly lift the dumbbells up until your arms are fully extended.","While inhaling lower the weights down until your arm is at a 90 degree angle again."],"equipment":["Dumbbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"neutral-grip-pull-up","name":"Neutral-Grip Pull-Up","group":"Back","primary":"Lats","secondary":["Biceps","Upper Back","Front Delts"],"split":"pull","pattern":"Vertical Pull","focus":"Lats","guide":null,"steps":["Start by placing the middle of the V-bar in the middle of the pull-up bar (assuming that the pull-up station you are using does not have neutral grip handles). The V-Bar handles will be facing down so that you can hang from the pull-up bar through the use of the handles.","Once you securely place the V-bar, take a hold of the bar from each side and hang from it. Stick your chest out and lean yourself back slightly in order to better engage the lats. This will be your starting position.","Using your lats, pull your torso up while leaning your head back slightly so that you do not hit yourself with the chin-up bar. Continue until your chest nearly touches the V-bar. Exhale as you execute this motion.","After a second hold on the contracted position, slowly lower your body back to the starting position as you breathe in."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"nordic-hamstring-curl","name":"Nordic Hamstring Curl","group":"Legs","primary":"Hamstrings","secondary":[],"split":"legs","pattern":"Curl","focus":"Hamstrings","guide":"Kneel with ankles anchored. Lower torso forward slowly using hamstring strength. Assist back up if needed.","steps":["You can use a partner for this exercise or brace your feet under something stable.","Begin on your knees with your upper legs and torso upright. If using a partner, they will firmly hold your feet to keep you in position. This will be your starting position.","Lower yourself by extending at the knee, taking care to NOT flex the hips as you go forward.","Place your hands in front of you as you reach the floor. This movement is very difficult and you may be unable to do it unaided. Use your arms to lightly push off the floor to aid your return to the starting position."],"equipment":["Bodyweight"],"metric":"reps","level":"intermediate","src":"both"},{"id":"oblique-crunch","name":"Oblique Crunch","group":"Core","primary":"Obliques","secondary":[],"split":"core","pattern":"Crunch","focus":"Obliques","guide":null,"steps":["Lie flat on the floor with your lower back pressed to the ground. For this exercise, you will need to put one hand beside your head and the other to the side against the floor.","Make sure your feet are elevated and resting on a flat surface.","Now lift the shoulder in which your hand is touching your head.","Simply elevate your shoulder and body upward until you touch your knee. For example, if you have your right hand besides your head, then you want to elevate your body upwards until your right elbow touches your left knee. The same variation can be applied doing the inverse and using your left elbow to touch your right knee.","After your knee touches your elbow, lower your body until you have reached the starting position.","Remember to breathe in during the eccentric (lowering) part of the exercise and to breathe out during the concentric (upward) part of the exercise.","Continue alternating in this manner until all of the recommended repetitions for each side have been completed."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"otis-up","name":"Otis-Up","group":"Core","primary":"Abs","secondary":["Mid Chest","Front Delts","Triceps"],"split":"core","pattern":"Other","focus":"Abs","guide":null,"steps":["Secure your feet and lay back on the floor. Your knees should be bent. Hold a weight with both hands to your chest. This will be your starting position.","Initiate the movement by flexing the hips and spine to raise your torso up from the ground.","As you move up, press the weight up so that it is above your head at the top of the movement.","Return the weight to your chest as you reverse the sit-up motion, ensuring not to go all the way down to the floor."],"equipment":["Plate"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"overhead-carry","name":"Overhead Carry","group":"Full Body","primary":"Front Delts","secondary":["Abs","Upper Back"],"split":"full","pattern":"Carry","focus":"Shoulders, Core, Upper Back","guide":"Walk while holding weights overhead. Forces shoulder stability and full core engagement. Keep ribs down and arms locked out.","steps":["Press a dumbbell or kettlebell overhead with the arm locked out.","Keep the ribs down, the shoulder packed and the biceps near the ear.","Walk slowly for a set distance. Switch arms."],"equipment":["Dumbbell","Kettlebell","Barbell"],"metric":"distance","level":"intermediate","src":"ivan"},{"id":"overhead-front-raise","name":"Overhead Front Raise","group":"Shoulders","primary":"Front Delts","secondary":[],"split":"push","pattern":"Raise","focus":"Front Delts","guide":null,"steps":["To begin, stand straight with a barbell in your hands. You should grip the bar with palms facing down and a closer than shoulder width grip apart from each other.","Your feet should be shoulder width apart from each other. Your elbows should be slightly bent. This is the starting position.","Lift the barbell up until it is directly over your head while exhaling. Make sure to keep your elbows slightly bent when performing each repetition.","Once you feel the contraction, begin to lower the barbell back down to the starting position as you inhale."],"equipment":["Dumbbell","Barbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"overhead-press","name":"Overhead Press","group":"Shoulders","primary":"Front Delts","secondary":["Triceps","Side Delts"],"split":"push","pattern":"Press","focus":"Front Delts","guide":"Stand or sit upright, press directly overhead with elbows under wrists. Keep core tight and avoid over-arching lower back.","steps":["Sit on a bench with back support in a squat rack. Position a barbell at a height that is just above your head. Grab the barbell with a pronated grip (palms facing forward).","Once you pick up the barbell with the correct grip width, lift the bar up over your head by locking your arms. Hold at about shoulder level and slightly in front of your head. This is your starting position.","Lower the bar down to the shoulders slowly as you inhale.","Lift the bar back up to the starting position as you exhale."],"equipment":["Barbell","Dumbbell","Machine","Smith Machine","Kettlebell","Cable","Band"],"metric":"reps","level":"intermediate","src":"both"},{"id":"overhead-squat","name":"Overhead Squat","group":"Full Body","primary":"Quads","secondary":["Abs","Calves","Glutes","Hamstrings","Lower Back"],"split":"full","pattern":"Squat","focus":"Quads","guide":null,"steps":["Start out by having a barbell in front of you on the floor. Your feet should be wider than shoulder width apart from each other.","Bend the knees and use a pronated grip (palms facing you) to grab the barbell. Your hands should be at a wider than shoulder width apart from each other before lifting. Once you are positioned, lift the barbell up until you can rest it on your chest.","Move the barbell over and slightly behind your head and make sure your arms are fully extended. Keep your head up at all times and also maintain a straight back. Retract your shoulder blades. This is your starting position.","Slowly lower the weight by bending your knees until your thighs are parallel to the ground while inhaling. Tip: Keep your back straight while performing this exercise to avoid any injuries and your arms should remain extended and over your head at all times.","Now use your feet and legs to help bring the weight back up to the starting position while exhaling."],"equipment":["Barbell"],"metric":"reps","level":"expert","src":"freedb"},{"id":"overhead-triceps-extension","name":"Overhead Triceps Extension","group":"Arms","primary":"Triceps","secondary":[],"split":"push","pattern":"Extension","focus":"Triceps","guide":"Elbows stay close to head, extend arms fully overhead. Emphasizes long head of triceps. Maintain control during both phases.","steps":["To begin, stand up holding a barbell or e-z bar using a pronated grip (palms facing forward) with your hands closer than shoulder width apart from each other. Your feet should be about shoulder width apart.","Now elevate the barbell above your head until your arms are fully extended. Keep your elbows in. This will be your starting position.","Keeping your upper arms close to your head and elbows in, perpendicular to the floor, lower the resistance in a semicircular motion behind your head until your forearms touch your biceps. Tip: The upper arms should remain stationary and only the forearms should move. Breathe in as you perform this step.","Go back to the starting position by using the triceps to raise the barbell. Breathe out as you perform this step."],"equipment":["Cable","Dumbbell","EZ Bar","Band","Barbell"],"metric":"reps","level":"beginner","src":"both"},{"id":"pallof-press","name":"Pallof Press","group":"Core","primary":"Obliques","secondary":[],"split":"core","pattern":"Anti-Rotation","focus":"Full Core","guide":"Stand or kneel perpendicular to cable, press straight out to resist rotation. Keep core braced and spine neutral.","steps":["Connect a standard handle to a tower, and—if possible—position the cable to shoulder height. If not, a low pulley will suffice.","With your side to the cable, grab the handle with both hands and step away from the tower. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable.","With your feet positioned hip-width apart and knees slightly bent, hold the cable to the middle of your chest. This will be your starting position.","Press the cable away from your chest, fully extending both arms. You core should be tight and engaged.","Hold the repetition for several seconds before returning to the starting position.","At the conclusion of the set, repeat facing the other direction."],"equipment":["Cable","Band"],"metric":"reps","level":"beginner","src":"both"},{"id":"pallof-press-with-rotation","name":"Pallof Press with Rotation","group":"Core","primary":"Obliques","secondary":["Mid Chest","Front Delts","Triceps"],"split":"core","pattern":"Raise","focus":"Obliques","guide":null,"steps":["Connect a standard handle to a tower, and position the cable to shoulder height.","With your side to the cable, grab the handle with one hand and step away from the tower. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable. Align outstretched arm with cable.","With your feet positioned hip-width apart, pull the cable into your chest and grab the handle with your other hand. Both hands should be on the handle at this time.","Facing forward, press the cable away from your chest. You core should be tight and engaged.","Keeping your hips straight, twist your torso away from the pulley until you get a full quarter rotation.","Maintain your rigid stance and straight arms. Return to the neutral position in a slow and controlled manner. Your arms should be extended in front of you.","With the side tension still engaging your core, bring your hands to your chest and immediately press outward to a fully extended position. This constitutes one rep.","Repeat to failure.","Then, reposition and repeat the same series of movements on the opposite side."],"equipment":["Cable"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"pendlay-row","name":"Pendlay Row","group":"Back","primary":"Lats","secondary":["Traps","Upper Back","Biceps"],"split":"pull","pattern":"Horizontal Row","focus":"Lats, Traps, Rhomboids","guide":"Barbell starts from floor each rep. Explosive pull to upper abs with flat back. Focus on strict form and explosive power.","steps":["Stand over a barbell with the torso parallel to the floor and the bar on the floor. Grip just outside the knees.","Row the bar explosively to the lower chest, keeping the torso flat and still.","Return the bar to the floor and reset before the next rep."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"pendulum-squat","name":"Pendulum Squat","group":"Legs","primary":"Quads","secondary":["Glutes"],"split":"legs","pattern":"Squat","focus":"Quads","guide":"Shoulders under the pads, feet mid-platform. Sit deep into the arc with the knees travelling forward; drive up without locking hard. Safe place to train to failure.","steps":["Step onto the machine with the shoulders under the pads and the feet mid-platform.","Lower into the arc with the knees travelling forward until you are in a deep squat.","Drive up without locking the knees hard. Keep the hips against the support."],"equipment":["Machine"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"pike-push-up","name":"Pike Push-Up","group":"Shoulders","primary":"Front Delts","secondary":[],"split":"push","pattern":"Calisthenics","focus":"Full Delts","guide":"Hips high in a downward dog position. Lower head to floor, push through shoulders. Bodyweight version of overhead press.","steps":["Start in a downward-dog shape with the hips high and the hands shoulder width apart.","Bend the elbows and lower the top of the head toward the floor between the hands.","Press back up until the arms are straight."],"equipment":["Bodyweight"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"pin-press","name":"Pin Press","group":"Arms","primary":"Triceps","secondary":["Mid Chest","Forearms","Lats","Upper Back","Front Delts"],"split":"push","pattern":"Press","focus":"Triceps","guide":null,"steps":["Pin presses remove the eccentric phase of the bench press, developing starting strength. They also allow you to train a desired range of motion.","The bench should be set up in a power rack. Set the pins to the desired point in your range of motion, whether it just be lockout or an inch off of your chest. The bar should be moved to the pins and prepared for lifting.","Begin by lying on the bench, with the bar directly above the contact point during your regular bench. Tuck your feet underneath you and arch your back. Using the bar to help support your weight, lift your shoulder off the bench and retract them, squeezing the shoulder blades together. Use your feet to drive your traps into the bench. Maintain this tight body position throughout the movement.","You can take a standard bench grip, or shoulder width to focus on the triceps. The bar, wrist, and elbow should stay in line at all times. Focus on squeezing the bar and trying to pull it apart.","Drive the bar up with as much force as possible. The elbows should be tucked in until lockout.","Return the bar to the pins, pausing before beginning the next repetition."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"pirate-ship","name":"Pirate Ship","group":"Shoulders","primary":"Front Delts","secondary":["Abs"],"split":"push","pattern":"Other","focus":"Front Delts","guide":null,"steps":["With a wide stance, hold a kettlebell with both hands. Allow it to hang at waist level with your arms extended. This will be your starting position.","Initiate the movement by turning to one side, swinging the kettlebell to head height. Briefly pause at the top of the motion.","Allow the bell to drop as you rotate to the opposite side, again raising the kettlebell to head height."],"equipment":["Kettlebell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"pistol-squat","name":"Pistol Squat","group":"Legs","primary":"Quads","secondary":["Glutes","Abs"],"split":"legs","pattern":"Calisthenics","focus":"Full Legs","guide":"Single-leg squat with other leg extended. Requires mobility, strength, and balance. Use assistance or box for modification.","steps":["Pick up a kettlebell with two hands and hold it by the horns. Hold one leg off of the floor and squat down on the other.","Squat down by flexing the knee and sitting back with the hips, holding the kettlebell up in front of you.","Hold the bottom position for a second and then reverse the motion, driving through the heel and keeping your head and chest up.","Lower yourself again and repeat."],"equipment":["Bodyweight","Assisted Bodyweight","Dumbbell","Kettlebell"],"metric":"reps","level":"expert","src":"both"},{"id":"plank","name":"Plank","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Stability","focus":"Full Core","guide":"Maintain a straight line from head to heels, engage glutes and abs. Avoid sagging hips or elevated butt.","steps":["Get into a prone position on the floor, supporting your weight on your toes and your forearms. Your arms are bent and directly below the shoulder.","Keep your body straight at all times, and hold this position as long as possible. To increase difficulty, an arm or leg can be raised."],"equipment":["Bodyweight","Weighted Bodyweight"],"metric":"time","level":"beginner","src":"both"},{"id":"plate-neck-extension","name":"Plate Neck Extension","group":"Back","primary":"Neck","secondary":[],"split":"pull","pattern":"Extension","focus":"Neck","guide":null,"steps":["Lie face down with your whole body straight on a flat bench while holding a weight plate behind your head. Tip: You will need to position yourself so that your shoulders are slightly above the end of a flat bench in order for the upper chest, neck and face to be off the bench. This will be your starting position.","While keeping the plate secure on the back of your head slowly lower your head (as in saying \"yes\") as you breathe in.","Raise your head back up to the starting position in a semi-circular motion as you breathe out. Hold the contraction for a second."],"equipment":["Plate"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"plate-neck-flexion","name":"Plate Neck Flexion","group":"Back","primary":"Neck","secondary":[],"split":"pull","pattern":"Other","focus":"Neck","guide":null,"steps":["Lie face up with your whole body straight on a flat bench while holding a weight plate on top of your forehead. Tip: You will need to position yourself so that your shoulders are slightly above the end of a flat bench in order for the traps, neck and head to be off the bench. This will be your starting position.","While keeping the plate secure on your forehead slowly lower your head back in a semi-circular motion as you breathe in.","Raise your head back up to the starting position in a semi-circular motion as you breathe out. Hold the contraction for a second."],"equipment":["Plate"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"plate-pinch-hold","name":"Plate Pinch Hold","group":"Arms","primary":"Forearms","secondary":[],"split":"pull","pattern":"Hold","focus":"Forearms","guide":"Pinch plates together using only fingers. Builds finger strength and crushing grip. Hold for time.","steps":["Grab two wide-rimmed plates and put them together with the smooth sides facing outward","Use your fingers to grip the outside part of the plate and your thumb for the other side thus holding both plates together. This is the starting position.","Squeeze the plate with your fingers and thumb. Hold this position for as long as you can.","Repeat for the recommended amount of sets prescribed in your program.","Switch arms and repeat the movements."],"equipment":["Plate"],"metric":"time","level":"intermediate","src":"both"},{"id":"plate-pinch-press","name":"Plate Pinch Press","group":"Chest","primary":"Mid Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Isometric Press","focus":"Full Chest","guide":"Pinch two smooth plates and press forward slowly. Demands isometric contraction and grip, good burnout finisher.","steps":["Begin in a standing position.","Press two lightweight plates together with your hands. Hold the plates together close to your chest to create an isometric contraction in your chest muscles. Your fingers should be pointed forward. This is your starting position.","Squeeze the plates between your palms and extend your arms directly out in front of you in a controlled motion.","Pause at the top of the motion, and then slowly return to the starting position."],"equipment":["Plate"],"metric":"reps","level":"beginner","src":"both"},{"id":"plate-squeeze","name":"Plate Squeeze","group":"Arms","primary":"Forearms","secondary":["Biceps"],"split":"pull","pattern":"Other","focus":"Forearms","guide":null,"steps":["To begin, stand straight while holding a weight plate by the ridge at arm's length in each hand using a neutral grip (palms facing in). You feet should be shoulder width apart from each other. This will be your starting position.","Lower the plates until the fingers are nearly extended but can still hold weights. Inhale as you lower the plates.","Now raise the plates back to the starting position as you exhale by closing your hands."],"equipment":["Plate"],"metric":"time","level":"beginner","src":"freedb"},{"id":"plyo-push-up","name":"Plyo Push-Up","group":"Chest","primary":"Mid Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Press","focus":"Mid Chest","guide":null,"steps":["Move into a prone position on the floor, supporting your weight on your hands and toes.","Your arms should be fully extended with the hands around shoulder width. Keep your body straight throughout the movement. This will be your starting position.","Descend by flexing at the elbow, lowering your chest towards the ground.","At the bottom, reverse the motion by pushing yourself up through elbow extension as quickly as possible. Attempt to push your upper body up until your hands leave the ground.","Return to the starting position and repeat the exercise.","For added difficulty, add claps into the movement while you are air borne."],"equipment":["Kettlebell","Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"power-clean","name":"Power Clean","group":"Full Body","primary":"Hamstrings","secondary":["Calves","Forearms","Glutes","Lower Back","Upper Back"],"split":"full","pattern":"Olympic","focus":"Hamstrings","guide":null,"steps":["Stand with your feet slightly wider than shoulder width apart and toes pointing out slightly.","Squat down and grasp bar with a closed, pronated grip. Your hands should be slightly wider than shoulder width apart outside knees with elbows fully extended.","Place the bar about 1 inch in front of your shins and over the balls of your feet.","Your back should be flat or slightly arched, your chest held up and out and your shoulder blades should be retracted.","Keep your head in a neutral position (in line with vertebral column and not tilted or rotated) with your eyes focused straight ahead. Inhale during this phase.","Lift the bar from the floor by forcefully extending the hips and the knees as you exhale. Tip: The upper torso should maintain the same angle. Do not bend at the waist yet and do not let the hips rise before the shoulders (this would have the effect of pushing the glutes in the air and stretching the hamstrings.","Keep elbows fully extended with the head in a neutral position and the shoulders over the bar.","As the bar raises keep it as close to the shins as possible.","As the bar passes the knees, thrust your hips forward and slightly bend the knees to avoid locking them. Tip: At this point your thighs should be against the bar.","Keep the back flat or slightly arched, elbows fully extended and your head neutral. Tip: You will hold your breath until the next phase.","Inhale and then forcefully and quickly extend your hips and knees and stand on your toes.","Keep the bar as close to your body as possible. Tip: Your back should be flat with the elbows pointed out to the sides and your head in a neutral position. Also, keep your shoulders over the bar and arms straight as long as possible.","When your lower body joints are fully extended, shrug the shoulders upward rapidly without letting the elbows flex yet. Exhale during this portion of the movement.","As the shoulders reach their highest elevation flex your elbows to begin pulling your body under the bar.","Continue to pull the arms as high and as long as possible. Tip: Due to the explosive nature of this phase, your torso will be erect or with an arched back, your head will be tilted back slightly and your feet may lose contact with the floor.","After the lower body has fully extended and the bar reaches near maximal height, pull your body under the bar and rotate the arms around and under the bar.","Simultaneously, flex the hips and knees into a quarter squat position.","Once the arms are under the bar, inhale and then lift your elbows to position the upper arms parallel to the floor. Rack the bar across the front of your collar bones and front shoulder muscles.","Catch the bar with an erect and tight torso, a neutral head position and flat feet. Exhale during this movement.","Stand up by extending the hips and knees to a fully erect position.","Lower the bar by gradually reducing the muscular tension of the arms to allow a controlled descent of the bar to the thighs. Inhale during this movement.","Simultaneously flex the hips and knees to cushion the impact of the b
