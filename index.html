sition.","Avoid returning the weight all the way to the stops until the set is complete to keep tension on the muscles being worked."],"equipment":["Machine"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"triceps-pushdown","name":"Triceps Pushdown","group":"Arms","primary":"Triceps","secondary":[],"split":"push","pattern":"Extension","focus":"Triceps","guide":"Elbows pinned to sides, push straight down. Great for lateral and medial tricep heads. Avoid rocking torso.","steps":["Attach a straight or angled bar to a high pulley and grab with an overhand grip (palms facing down) at shoulder width.","Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the bar. This is your starting position.","Using the triceps, bring the bar down until it touches the front of your thighs and the arms are fully extended perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.","After a second hold at the contracted position, bring the bar slowly up to the starting point. Breathe in as you perform this step."],"equipment":["Cable"],"metric":"reps","level":"beginner","src":"both"},{"id":"tuck-crunch","name":"Tuck Crunch","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Crunch","focus":"Abs","guide":null,"steps":["To begin, lie down on the floor or an exercise mat with your back pressed against the floor. Your arms should be lying across your sides with the palms facing down.","Your legs should be crossed by wrapping one ankle around the other. Slowly elevate your legs up in the air until your thighs are perpendicular to the floor with a slight bend at the knees. Note: Your knees and toes should be parallel to the floor as opposed to the thighs.","Move your arms from the floor and cross them so they are resting on your chest. This is the starting position.","While keeping your lower back pressed against the floor, slowly lift your torso. Remember to exhale while perform this part of the exercise.","Slowly begin to lower your torso back down to the starting position while inhaling."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"tuck-jump","name":"Tuck Jump","group":"Legs","primary":"Hamstrings","secondary":["Abductors","Adductors","Calves","Glutes","Quads"],"split":"legs","pattern":"Plyometric","focus":"Hamstrings","guide":null,"steps":["Begin in a comfortable standing position with your knees slightly bent. Hold your hands in front of you, palms down with your fingertips together at chest height. This will be your starting position.","Rapidly dip down into a quarter squat and immediately explode upward. Drive the knees towards the chest, attempting to touch them to the palms of the hands.","Jump as high as you can, raising your knees up, and then ensure a good land be re-extending your legs, absorbing impact through be allowing the knees to rebend."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"turkish-get-up","name":"Turkish Get-Up","group":"Full Body","primary":"Abs","secondary":["Front Delts","Glutes"],"split":"full","pattern":"Calisthenics","focus":"Core, Shoulders, Hips","guide":"Move from lying to standing while holding weight overhead. Controlled movement challenges stability, mobility, and strength in all planes.","steps":["Lie on your back on the floor and press a kettlebell to the top position by extending the elbow. Bend the knee on the same side as the kettlebell.","Keeping the kettlebell locked out at all times, pivot to the opposite side and use your non- working arm to assist you in driving forward to the lunge position. Using your free hand, push yourself to a seated position, then progressing to one knee.","While looking up at the kettlebell, slowly stand up. Reverse the motion back to the starting position and repeat."],"equipment":["Kettlebell","Dumbbell"],"metric":"reps","level":"intermediate","src":"both"},{"id":"typewriter-pull-up","name":"Typewriter Pull-Up","group":"Back","primary":"Upper Back","secondary":[],"split":"pull","pattern":"Calisthenics","focus":"Full Back","guide":"Pull up, then move side-to-side in the top position. Emphasizes scapular control and lat engagement.","steps":["Hang from a wide grip and pull up until your chin is over the bar.","Shift your body sideways toward one hand while staying at the top, then slide across to the other hand.","Return to the middle and lower slowly."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"expert","src":"ivan"},{"id":"upright-row","name":"Upright Row","group":"Shoulders","primary":"Side Delts","secondary":[],"split":"push","pattern":"Raise","focus":"Side Delts","guide":"Pull to upper chest with elbows flared out. Use moderate grip width. Emphasizes side delts and upper traps. Use caution with shoulder impingement issues.","steps":["Grasp a barbell with an overhand grip that is slightly less than shoulder width. The bar should be resting on the top of your thighs with your arms extended and a slight bend in your elbows. Your back should also be straight. This will be your starting position.","Now exhale and use the sides of your shoulders to lift the bar, raising your elbows up and to the side. Keep the bar close to your body as you raise it. Continue to lift the bar until it nearly touches your chin. Tip: Your elbows should drive the motion, and should always be higher than your forearms. Remember to keep your torso stationary and pause for a second at the top of the movement.","Lower the bar back down slowly to the starting position. Inhale as you perform this portion of the movement."],"equipment":["Barbell","EZ Bar","Cable","Dumbbell","Smith Machine","Band"],"metric":"reps","level":"beginner","src":"both"},{"id":"v-up","name":"V-Up","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Leg Raise","focus":"Lower Abs","guide":"Simultaneously raise arms and legs to meet at top. Keep core tight and avoid collapsing spine on descent.","steps":["Lie flat on the floor (or exercise mat) on your back with your arms extended straight back behind your head and your legs extended also. This will be your starting position.","As you exhale, bend at the waist while simultaneously raising your legs and arms to meet in a jackknife position. Tip: The legs should be extended and lifted at approximately a 35-45 degree angle from the floor and the arms should be extended and parallel to your legs. The upper torso should be off the floor.","While inhaling, lower your arms and legs back to the starting position."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"both"},{"id":"vacuum-hold","name":"Vacuum Hold","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Compression","focus":"Transverse Abdominis","guide":"Draw navel toward spine and hold while breathing normally. Strengthens inner core and improves posture.","steps":["Stand or kneel and exhale fully.","Draw the navel toward the spine as far as possible and hold.","Breathe shallowly while keeping the belly drawn in. Rest and repeat."],"equipment":["Bodyweight"],"metric":"time","level":"beginner","src":"ivan"},{"id":"walking","name":"Walking","group":"Cardio","primary":null,"secondary":[],"split":"cardio","pattern":"Steady-State","focus":"Full Body (Low-Impact)","guide":"Maintain brisk pace with upright posture and natural arm swing. Low-impact, accessible, and great for recovery or fat burning.","steps":["To begin, step onto the treadmill and select the desired option from the menu. Most treadmills have a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Elevation can be adjusted to change the intensity of the workout.","Treadmills offer convenience, cardiovascular benefits, and usually have less impact than walking outside. When walking, you should move at a moderate to fast pace, not a leisurely one. Being an activity of lower intensity, walking doesn't burn as many calories as some other activities, but still provides great benefit. A 150 lb person will burn about 175 calories walking 4 miles per hour for 30 minutes, compared to 450 calories running twice as fast. Maintain proper posture as you walk, and only hold onto the handles when necessary, such as when dismounting or checking your heart rate."],"equipment":["Outdoor","Treadmill"],"metric":"duration","level":"beginner","src":"both"},{"id":"walking-lunge","name":"Walking Lunge","group":"Legs","primary":"Quads","secondary":["Glutes"],"split":"legs","pattern":"Lunge","focus":"Quads","guide":"Step forward into long stride, keeping torso upright. Push off front heel. Works quads dynamically while also challenging stability.","steps":["Begin standing with your feet shoulder width apart and a barbell across your upper back.","Step forward with one leg, flexing the knees to drop your hips. Descend until your rear knee nearly touches the ground. Your posture should remain upright, and your front knee should stay above the front foot.","Drive through the heel of your lead foot and extend both knees to raise yourself back up.","Step forward with your rear foot, repeating the lunge on the opposite leg."],"equipment":["Dumbbell","Barbell","Bodyweight"],"metric":"reps","level":"beginner","src":"both"},{"id":"wall-ball-shot","name":"Wall Ball Shot","group":"Full Body","primary":"Quads","secondary":["Front Delts","Abs"],"split":"full","pattern":"Calisthenics","focus":"Quads, Shoulders, Core","guide":"Squat with med ball and throw to target on wall. Catch in squat and repeat. Targets legs, shoulders, and heart rate.","steps":["Stand facing a wall holding a medicine ball at the chest, about an arm's length away.","Squat to depth, then drive up and throw the ball at a target above the head.","Catch it on the way down and move straight into the next squat."],"equipment":["Med Ball"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"wall-sit","name":"Wall Sit","group":"Legs","primary":"Quads","secondary":[],"split":"legs","pattern":"Calisthenics","focus":"Full Legs","guide":"Hold squat position against a wall at 90°. Keep back flat and knees stacked over ankles. Great for isometric strength and quad burn.","steps":["Lean your back against a wall and slide down until the thighs are parallel to the floor.","Keep the knees over the ankles and the back flat on the wall.","Hold for time. Do not rest your hands on your legs."],"equipment":["Bodyweight","Plate"],"metric":"time","level":"beginner","src":"ivan"},{"id":"weighted-vest-walk","name":"Weighted Vest Walk","group":"Cardio","primary":null,"secondary":[],"split":"cardio","pattern":"Outdoor Carry","focus":"Legs, Core, Grip","guide":"Walk with a weighted vest to increase load. Keeps heart rate elevated and strengthens posture/core under resistance.","steps":["Put on a weighted vest that fits snugly and does not bounce.","Walk at a brisk, steady pace on flat or inclined ground with a tall posture.","Build duration and weight gradually."],"equipment":["Outdoor","Treadmill"],"metric":"duration","level":"beginner","src":"ivan"},{"id":"wide-grip-bench-press","name":"Wide-Grip Bench Press","group":"Chest","primary":"Mid Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Press","focus":"Mid Chest","guide":null,"steps":["Lie back on a flat bench with feet firm on the floor. Using a wide, pronated (palms forward) grip that is around 3 inches away from shoulder width (for each hand), lift the bar from the rack and hold it straight over you with your arms locked. The bar will be perpendicular to the torso and the floor. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on your middle chest.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"wide-grip-curl","name":"Wide-Grip Curl","group":"Arms","primary":"Biceps","secondary":[],"split":"pull","pattern":"Curl","focus":"Biceps","guide":null,"steps":["Stand up with your torso upright while holding a barbell at the wide outer handle. The palm of your hands should be facing forward. The elbows should be close to the torso. This will be your starting position.","While holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Tip: Only the forearms should move.","Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.","Slowly begin to bring the bar back to starting position as your breathe in."],"equipment":["Barbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"wide-grip-decline-bench-press","name":"Wide-Grip Decline Bench Press","group":"Chest","primary":"Mid Chest","secondary":["Front Delts","Triceps"],"split":"push","pattern":"Press","focus":"Mid Chest","guide":null,"steps":["Lie back on a decline bench with the feet securely locked at the front of the bench. Using a wide, pronated (palms forward) grip that is around 3 inches away from shoulder width (for each hand), lift the bar from the rack and hold it straight over you with your arms locked. The bar will be perpendicular to the torso and the floor. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on your lower chest.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"wide-grip-push-up","name":"Wide-Grip Push-Up","group":"Chest","primary":"Mid Chest","secondary":[],"split":"push","pattern":"Calisthenics","focus":"Full Chest","guide":"Hands placed wider to shift more load to pecs. Lower chest to just above ground with controlled tempo.","steps":["With your hands wide apart, support your body on your toes and hands in a plank position. Your elbows should be extended and your body straight. Do not allow your hips to sag. This will be your starting position.","To begin, allow the elbows to flex, lowering your chest to the floor as you inhale.","Using your pectoral muscles, press your upper body back up to the starting position by extending the elbows. Exhale as you perform this step.","After pausing at the contracted position, repeat the movement for the prescribed amount of repetitions."],"equipment":["Bodyweight","Weighted Bodyweight","Assisted Bodyweight"],"metric":"reps","level":"beginner","src":"both"},{"id":"wide-stance-squat","name":"Wide-Stance Squat","group":"Legs","primary":"Quads","secondary":["Calves","Glutes","Hamstrings","Lower Back"],"split":"legs","pattern":"Squat","focus":"Quads","guide":null,"steps":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a wider-than-shoulder-width stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance, and also maintain a straight back. This will be your starting position.","Begin to slowly lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor with the heel of your foot as you straighten the legs again and go back to the starting position."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"wide-stance-stiff-leg-deadlift","name":"Wide-Stance Stiff-Leg Deadlift","group":"Legs","primary":"Hamstrings","secondary":["Adductors","Glutes","Lower Back"],"split":"legs","pattern":"Hinge","focus":"Hamstrings","guide":null,"steps":["Begin with a barbell loaded on the floor. Adopt a wide stance, and then bend at the hips to grab the bar. Your hips should be as far back as possible, and your legs nearly straight. Keep your back straight, and your head and chest up. This will be your starting position.","Begin the movement be engaging the hips, driving them forward as you allow the arms to hang straight. Continue until you are standing straight up, and then slowly return the weight to the starting position. For successive reps, the weight need not touch the floor."],"equipment":["Barbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"windmill","name":"Windmill","group":"Core","primary":"Obliques","secondary":["Glutes","Hamstrings","Front Delts","Triceps"],"split":"core","pattern":"Rotation","focus":"Obliques","guide":null,"steps":["Place a kettlebell in front of your lead foot and clean and press it overhead with your opposite arm. Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulders. Rotate your wrist as you do so, so that the palm faces forward. Press it overhead by extending the elbow.","Keeping the kettlebell locked out at all times, push your butt out in the direction of the locked out kettlebell. Turn your feet out at a forty-five degree angle from the arm with the locked out kettlebell. Bending at the hip to one side, sticking your butt out, slowly lean until you can touch the floor with your free hand. Keep your eyes on the kettlebell that you hold over your head at all times.","Pause for a second after reaching the ground and reverse the motion back to the starting position."],"equipment":["Kettlebell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"wrist-curl","name":"Wrist Curl","group":"Arms","primary":"Forearms","secondary":[],"split":"pull","pattern":"Curl","focus":"Forearms","guide":"Palms up, curl wrists toward body. Focus on controlled movement and avoid letting weight roll out of hands.","steps":["Hold a barbell with both hands and your palms facing up; hands spaced about shoulder width.","Place your feet flat on the floor, at a distance that is slightly wider than shoulder width apart.","Lean forward and place your forearms on top of your upper thighs with your palms up. Tip: Make sure that the front of the wrists lay on top of your knees. This will be your starting position.","Lower the bar as far as possible while inhaling and keeping a tight grip.","Now curl bar up as high as possible while flexing the forearms and exhaling. Hold the contraction at the top for a second and Tip: Only the wrist should move."],"equipment":["Dumbbell","Barbell","Cable"],"metric":"reps","level":"beginner","src":"both"},{"id":"wrist-pronation","name":"Wrist Pronation","group":"Arms","primary":"Forearms","secondary":[],"split":"pull","pattern":"Other","focus":"Forearms","guide":null,"steps":["Lie on a flat bench face down with one arm holding a dumbbell and the other hand on top of the bench folded so that you can rest your head on it.","Bend the elbows of the arm holding the dumbbell so that it creates a 90-degree angle between the upper arm and the forearm.","Now raise the upper arm so that the forearm is perpendicular to the floor and the upper arm is perpendicular to your torso. Tip: The upper arm should be parallel to the floor and also creating a 90-degree angle with your torso. This will be your starting position.","As you breathe out, externally rotate your forearm so that the dumbbell is lifted forward as you maintain the 90 degree angle bend between the upper arms and the forearm. You will continue this external rotation until the forearm is parallel to the floor. At this point you will hold the contraction for a second.","As you breathe in, slowly go back to the starting position."],"equipment":["Dumbbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"wrist-roller","name":"Wrist Roller","group":"Arms","primary":"Forearms","secondary":[],"split":"pull","pattern":"Rotation","focus":"Forearms","guide":"Roll weight up and down using a wrist roller. Great for overall forearm size and endurance. Keep shoulders relaxed.","steps":["To begin, stand straight up grabbing a wrist roller using a pronated grip (palms facing down). Your feet should be shoulder width apart.","Slowly lift both arms until they are fully extended and parallel to the floor in front of you. Note: Make sure the rope is not wrapped around the roller. Your entire body should be stationary except for the forearms. This is the starting position.","Rotate one wrist at a time in an upward motion to bring the weight up to the bar by rolling the rope around the roller.","Once the weight has reached the bar, slowly begin to lower the weight back down by rotating the wrist in a downward motion until the weight reaches the starting position."],"equipment":["Other"],"metric":"reps","level":"beginner","src":"both"},{"id":"wrist-rotation","name":"Wrist Rotation","group":"Arms","primary":"Forearms","secondary":[],"split":"pull","pattern":"Raise","focus":"Forearms","guide":null,"steps":["Hold a barbell with both hands and your palms facing down; hands spaced about shoulder width. This will be your starting position.","Alternating between each of your hands, perform the movement by extending the wrist as though you were rolling up a newspaper. Continue alternating back and forth until failure.","Reverse the motion by flexing the wrist, rolling the opposite direction. Continue the alternating motion until failure."],"equipment":["Barbell"],"metric":"reps","level":"beginner","src":"freedb"},{"id":"wrist-supination","name":"Wrist Supination","group":"Arms","primary":"Forearms","secondary":[],"split":"pull","pattern":"Other","focus":"Forearms","guide":null,"steps":["Lie sideways on a flat bench with one arm holding a dumbbell and the other hand on top of the bench folded so that you can rest your head on it.","Bend the elbows of the arm holding the dumbbell so that it creates a 90-degree angle between the upper arm and the forearm.","Now raise the upper arm so that the forearm is parallel to the floor and perpendicular to your torso (Tip: So the forearm will be directly in front of you). The upper arm will be stationary by your torso and should be parallel to the floor (aligned with your torso at all times). This will be your starting position.","As you breathe out, externally rotate your forearm so that the dumbbell is lifted up in a semicircle motion as you maintain the 90 degree angle bend between the upper arms and the forearm. You will continue this external rotation until the forearm is perpendicular to the floor and the torso pointing towards the ceiling. At this point you will hold the contraction for a second.","As you breathe in, slowly go back to the starting position."],"equipment":["Dumbbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"yates-row","name":"Yates Row","group":"Back","primary":"Lats","secondary":["Upper Back","Biceps"],"split":"pull","pattern":"Horizontal Row","focus":"Lats, Mid Back","guide":"Use a supinated grip and more upright torso. Pull bar low toward hips. Emphasizes lower lats and biceps. Developed by Dorian Yates.","steps":["Stand holding a barbell with an underhand grip and hinge to about 45° from the floor.","Row the bar toward the lower belly, keeping the elbows close to the body.","Lower under control without letting the torso rise."],"equipment":["Barbell","Smith Machine"],"metric":"reps","level":"intermediate","src":"ivan"},{"id":"yoke-walk","name":"Yoke Walk","group":"Full Body","primary":"Quads","secondary":["Abs","Abductors","Adductors","Calves","Glutes"],"split":"full","pattern":"Carry","focus":"Quads","guide":null,"steps":["The yoke is usually done with a yoke apparatus, but is sometimes seen with refrigerators or other heavy objects.","Begin by racking the apparatus across the back of the shoulders. With your head looking forward and back arched, lift the yoke by driving through the heels.","Begin walking as quickly as possible using short, quick steps. You may hold the side posts of the yoke to help steady it and hold it in position. Continue for the given distance as fast as possible, usually 75-100 feet."],"equipment":["Strongman"],"metric":"distance","level":"intermediate","src":"freedb"},{"id":"z-press","name":"Z Press","group":"Shoulders","primary":"Front Delts","secondary":["Triceps","Side Delts"],"split":"push","pattern":"Press","focus":"Front Delts","guide":"Performed seated on floor with legs extended. Forces strict overhead press mechanics and core engagement.","steps":["Sit on the floor with the legs straight in front and a barbell at the shoulders.","Brace the core and press the bar straight overhead without leaning back.","Lower to the shoulders under control."],"equipment":["Barbell","Dumbbell"],"metric":"reps","level":"expert","src":"ivan"},{"id":"zercher-carry","name":"Zercher Carry","group":"Full Body","primary":"Upper Back","secondary":["Abs","Quads"],"split":"full","pattern":"Carry","focus":"Upper Back, Core, Quads","guide":"Hold bar in crook of elbows, brace core, and walk. Great for building midline strength and posture control.","steps":["Lift a barbell and hold it in the crook of the elbows against the torso.","Brace the core and stand tall.","Walk slowly for a set distance, then put the bar down with control."],"equipment":["Barbell"],"metric":"distance","level":"intermediate","src":"ivan"},{"id":"zercher-squat","name":"Zercher Squat","group":"Legs","primary":"Quads","secondary":["Glutes"],"split":"legs","pattern":"Squat","focus":"Full Legs","guide":"Hold bar in crook of elbows. More upright torso and deep ROM. Great for quads, core, and glutes.","steps":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. The correct height should be anywhere above the waist but below the chest. Once the correct height is chosen and the bar is loaded, lock your hands together and place the bar on top of your arms in between the forearm and upper arm.","Lift the bar up so that it is resting on top of your forearms. If you are holding the bar properly, it should look as if you have your arms crossed but with a bar running across them.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section).","Begin to lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor with the ball of your foot mainly as you straighten the legs again and go back to the starting position."],"equipment":["Barbell"],"metric":"reps","level":"expert","src":"both"},{"id":"zottman-curl","name":"Zottman Curl","group":"Arms","primary":"Biceps","secondary":["Forearms"],"split":"pull","pattern":"Curl","focus":"Biceps","guide":"Curl up with supinated grip, rotate to pronated, lower slowly. Hits biceps and forearms in a single movement.","steps":["Stand up with your torso upright and a dumbbell in each hand being held at arms length. The elbows should be close to the torso.","Make sure the palms of the hands are facing each other. This will be your starting position.","While holding the upper arm stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Your wrist should rotate so that you have a supinated (palms up) grip. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a second as you squeeze the biceps.","Now during the contracted position, rotate your wrist until you now have a pronated (palms facing down) grip with the thumb at a higher position than the pinky.","Slowly begin to bring the dumbbells back down using the pronated grip.","As the dumbbells close your thighs, start rotating the wrist so that you go back to a neutral (palms facing your body) grip."],"equipment":["Dumbbell"],"metric":"reps","level":"intermediate","src":"both"},{"id":"zottman-preacher-curl","name":"Zottman Preacher Curl","group":"Arms","primary":"Biceps","secondary":["Forearms"],"split":"pull","pattern":"Curl","focus":"Biceps","guide":null,"steps":["Grab a dumbbell in each hand and place your upper arms on top of the preacher bench or the incline bench. The dumbbells should be held at shoulder height and the elbows should be flexed. Hold the dumbbells with the palms of your hands facing down. This will be your starting position.","As you breathe in, slowly lower the dumbbells keeping the palms down until your upper arm is extended and your biceps are fully stretched.","Now rotate your wrists once you are at the bottom of the movement so that the palms of the hands are facing up.","As you exhale, use your biceps to curl the weights up until they are fully contracted and the dumbbells are at shoulder height. Again, remember that to ensure full contraction you need to bring that small finger higher than the thumb.","Squeeze the biceps hard for a second at the contracted position and rotate your wrists so that the palms are facing down again."],"equipment":["Dumbbell"],"metric":"reps","level":"intermediate","src":"freedb"},{"id":"scapular-push-up","name":"Scapular Push-Up","group":"Chest","primary":"Mid Chest","secondary":["Front Delts","Upper Back"],"split":"push","pattern":"Calisthenics","focus":"Mid Chest","guide":"Arms stay straight. Let the shoulder blades sink together, then push them apart. Teaches shoulder-blade control for push-ups.","steps":["Start in a push-up position with straight arms.","Let your chest sink between the shoulder blades without bending the elbows.","Push the floor away, spreading the shoulder blades wide, and repeat."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"v8"},{"id":"diamond-push-up","name":"Diamond Push-Up","group":"Arms","primary":"Triceps","secondary":["Mid Chest","Front Delts"],"split":"push","pattern":"Calisthenics","focus":"Triceps","guide":"Hands together under the chest in a diamond. Elbows tight to the ribs. Triceps-heavy push-up.","steps":["Set up in a push-up position with the thumbs and index fingers touching under your chest.","Lower the chest to the hands with the elbows close to the body.","Press back up to straight arms."],"equipment":["Bodyweight","Weighted Bodyweight"],"metric":"reps","level":"intermediate","src":"v8"},{"id":"archer-push-up","name":"Archer Push-Up","group":"Chest","primary":"Mid Chest","secondary":["Triceps","Front Delts"],"split":"push","pattern":"Calisthenics","focus":"Mid Chest","guide":"Wide hands. Lower toward one hand while the other arm stays straight. Bridges toward one-arm push-ups.","steps":["Start in a wide push-up with the hands well outside the shoulders.","Bend one elbow and lower toward that hand while the other arm stays straight.","Press back up and alternate sides."],"equipment":["Bodyweight","Weighted Bodyweight"],"metric":"reps","level":"expert","src":"v8"},{"id":"pseudo-planche-push-up","name":"Pseudo Planche Push-Up","group":"Shoulders","primary":"Front Delts","secondary":["Mid Chest","Triceps"],"split":"push","pattern":"Calisthenics","focus":"Front Delts","guide":"Hands by the hips, fingers turned out, body leaning far forward over the hands. Heavy on the front delts.","steps":["Start in a push-up with the hands beside the lower ribs and the fingers turned out.","Lean the shoulders far forward past the hands and keep the arms close to the body.","Lower under control and press back up while holding the lean."],"equipment":["Bodyweight","Weighted Bodyweight"],"metric":"reps","level":"expert","src":"v8"},{"id":"svend-press","name":"Svend Press","group":"Chest","primary":"Mid Chest","secondary":["Front Delts"],"split":"push","pattern":"Press","focus":"Mid Chest","guide":"Squeeze two plates together at the chest and press out in front. Light weight, constant squeeze.","steps":["Stand holding two small plates together in front of the chest and squeeze them hard.","Press the plates straight out in front while squeezing.","Return to the chest, still squeezing, and repeat."],"equipment":["Plate"],"metric":"reps","level":"beginner","src":"v8"},{"id":"landmine-row","name":"Landmine Row","group":"Back","primary":"Upper Back","secondary":["Lats","Biceps"],"split":"pull","pattern":"Horizontal Row","focus":"Upper Back","guide":"Straddle the bar with a V-handle. Hinge, flat back, row to the lower chest. Easy on the lower back.","steps":["Load the landmine bar, straddle it and hold the handle under the plates with a hip hinge and flat back.","Row the bar to the lower chest, driving the elbows back.","Lower slowly to straight arms."],"equipment":["Landmine","T-Bar"],"metric":"reps","level":"beginner","src":"v8"},{"id":"dead-hang","name":"Dead Hang","group":"Back","primary":"Forearms","secondary":["Lats","Upper Back"],"split":"pull","pattern":"Hold","focus":"Forearms","guide":"Hang from a bar with relaxed shoulders. Builds grip and decompresses the spine. Progress to active hangs.","steps":["Grab a bar with an overhand grip, hands shoulder width, and hang with straight arms.","Keep the body still. For an active hang, pull the shoulders down slightly.","Hold for time, then step down."],"equipment":["Bodyweight","Weighted Bodyweight"],"metric":"time","level":"beginner","src":"v8"},{"id":"pull-up-negative","name":"Pull-Up Negative","group":"Back","primary":"Lats","secondary":["Biceps","Upper Back"],"split":"pull","pattern":"Vertical Pull","focus":"Lats","guide":"Jump or step to the top of a pull-up and lower yourself over 3–5 seconds. Builds the strength for a full pull-up.","steps":["Use a box or jump so the chin is over the bar.","Lower yourself slowly, taking 3–5 seconds, until the arms are straight.","Reset to the top and repeat."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"v8"},{"id":"dragon-flag","name":"Dragon Flag","group":"Core","primary":"Abs","secondary":["Lower Back"],"split":"core","pattern":"Leg Raise","focus":"Abs","guide":"Hold a bench behind your head, lift the whole body as one board, and lower with straight hips.","steps":["Lie on a bench holding it behind your head, shoulders pinned down.","Raise the legs and hips until the body is a straight line on the shoulders.","Lower slowly as a single straight line without touching the bench, then repeat. Bend the knees to make it easier."],"equipment":["Bodyweight"],"metric":"reps","level":"expert","src":"v8"},{"id":"hanging-knee-raise","name":"Hanging Knee Raise","group":"Core","primary":"Abs","secondary":["Forearms"],"split":"core","pattern":"Leg Raise","focus":"Abs","guide":"Hang from a bar and curl the knees up toward the chest, tucking the pelvis. No swinging.","steps":["Hang from a bar with the arms straight and the shoulders set.","Curl the pelvis up and bring the knees to the chest.","Lower slowly to a dead hang without swinging."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"v8"},{"id":"plank-shoulder-tap","name":"Plank Shoulder Tap","group":"Core","primary":"Abs","secondary":["Obliques","Front Delts"],"split":"core","pattern":"Anti-Rotation","focus":"Abs","guide":"High plank, feet wider than hips. Tap each shoulder while keeping hips still.","steps":["Start in a high plank with the feet a little wider than the hips.","Tap one shoulder with the opposite hand without letting the hips rotate.","Place the hand back and alternate sides."],"equipment":["Bodyweight"],"metric":"reps","level":"beginner","src":"v8"},{"id":"body-saw","name":"Body Saw","group":"Core","primary":"Abs","secondary":["Front Delts"],"split":"core","pattern":"Plank","focus":"Abs","guide":"Forearm plank with feet on sliders. Rock the body back and forth by a few inches.","steps":["Set up in a forearm plank with the feet on sliders or a towel on a smooth floor.","Rock the body back so the feet slide away a few inches, then forward again.","Keep the hips level and the abs braced throughout."],"equipment":["Bodyweight"],"metric":"time","level":"intermediate","src":"v8"},{"id":"hollow-rock","name":"Hollow Rock","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Isometric","focus":"Abs","guide":"Hold the hollow-body shape and rock from the shoulders to the hips like a bowl.","steps":["Lie in a hollow-body hold with the arms overhead and the lower back pressed down.","Rock back and forth along the spine while holding the shape.","Keep the legs and shoulders off the floor. Stop if the back arches."],"equipment":["Bodyweight"],"metric":"reps","level":"intermediate","src":"v8"},{"id":"stir-the-pot","name":"Stir the Pot","group":"Core","primary":"Abs","secondary":["Obliques"],"split":"core","pattern":"Anti-Rotation","focus":"Abs","guide":"Forearms on a stability ball in a plank. Draw small circles with the elbows while the body stays still.","steps":["Set up in a plank with the forearms on a stability ball.","Draw slow circles with the forearms, as if stirring a pot.","Keep the hips and ribs still. Reverse direction halfway."],"equipment":["Stability Ball"],"metric":"reps","level":"intermediate","src":"v8"},{"id":"reverse-plank","name":"Reverse Plank","group":"Core","primary":"Glutes","secondary":["Lower Back","Hamstrings"],"split":"core","pattern":"Plank","focus":"Glutes","guide":"Sit with hands behind you, lift the hips until the body is a straight line, face up.","steps":["Sit with the legs straight and the hands on the floor behind you.","Press the hips up until the body is one straight line.","Hold, keeping the glutes tight and the chin neutral."],"equipment":["Bodyweight"],"metric":"time","level":"beginner","src":"v8"},{"id":"ab-crunch-machine","name":"Ab Crunch Machine","group":"Core","primary":"Abs","secondary":[],"split":"core","pattern":"Crunch","focus":"Abs","guide":"Curl the torso down against the pad, exhaling at the bottom. Keep hips planted.","steps":["Sit in the machine and set the weight. Hold the handles or pads.","Curl the ribs toward the pelvis and exhale hard.","Return slowly without letting the weight stack touch down."],"equipment":["Machine"],"metric":"reps","level":"beginner","src":"v8"},{"id":"handstand-hold","name":"Handstand Hold","group":"Shoulders","primary":"Front Delts","secondary":["Triceps","Abs"],"split":"push","pattern":"Calisthenics","focus":"Front Delts","guide":"Kick up to a wall, stack the wrists, shoulders and hips. Squeeze the glutes and push tall through the shoulders.","steps":["Place the hands about a foot from a wall and kick up so the heels rest on the wall.","Push tall through the shoulders and keep the ribs in and the glutes tight.","Hold, then come down with control."],"equipment":["Bodyweight"],"metric":"time","level":"expert","src":"v8"},{"id":"wall-walk","name":"Wall Walk","group":"Shoulders","primary":"Front Delts","secondary":["Abs","Triceps"],"split":"push","pattern":"Calisthenics","focus":"Front Delts","guide":"Start in a plank with feet at the wall and walk the hands in as the feet walk up.","steps":["Start in a plank with the feet against a wall.","Walk the feet up the wall and the hands toward the wall until the chest nearly touches it.","Walk back down the same way."],"equipment":["Bodyweight"],"metric":"reps","level":"intermediate","src":"v8"},{"id":"planche-lean","name":"Planche Lean","group":"Shoulders","primary":"Front Delts","secondary":["Abs","Forearms"],"split":"push","pattern":"Calisthenics","focus":"Front Delts","guide":"In a push-up position, lean the shoulders far past the hands. Hold with locked arms and a hollow body.","steps":["Start in a push-up position with the fingers turned slightly out.","Lean the shoulders forward over and past the hands, arms straight and the body hollow.","Hold, then rock back."],"equipment":["Bodyweight"],"metric":"time","level":"intermediate","src":"v8"},{"id":"tuck-planche","name":"Tuck Planche","group":"Shoulders","primary":"Front Delts","secondary":["Abs","Forearms"],"split":"push","pattern":"Calisthenics","focus":"Front Delts","guide":"Support on straight arms, knees tucked in, lift the feet off the floor. Hips level, back rounded.","steps":["Squat with the hands flat on the floor and the arms straight.","Lean the shoulders forward and lift the feet while tucking the knees to the chest.","Hold, keeping the arms straight and the shoulders pressed forward."],"equipment":["Bodyweight"],"metric":"time","level":"expert","src":"v8"},{"id":"back-lever","name":"Back Lever","group":"Back","primary":"Lats","secondary":["Abs","Biceps"],"split":"pull","pattern":"Calisthenics","focus":"Lats","guide":"Hang from rings or a bar, rotate to face down with a straight body in line with the arms. Progress from a tuck.","steps":["Hang from a bar or rings and tuck the knees up.","Roll backward through the skin-the-cat position until the body is horizontal and face down.","Extend the legs as you are able and hold, keeping the shoulders protected."],"equipment":["Bodyweight"],"metric":"time","level":"expert","src":"v8"},{"id":"human-flag","name":"Human Flag","group":"Core","primary":"Obliques","secondary":["Lats","Upper Back"],"split":"core","pattern":"Calisthenics","focus":"Obliques","guide":"Grip a vertical pole with both hands and hold the body out horizontally. Top arm pulls, bottom arm pushes.","steps":["Grip a vertical pole with the top hand overhand and the bottom hand underhand, wide apart.","Press with the bottom arm and pull with the top arm, lifting the hips and legs sideways.","Hold the body in a line parallel to the floor. Start with a tuck."],"equipment":["Bodyweight"],"metric":"time","level":"expert","src":"v8"},{"id":"belt-squat","name":"Belt Squat","group":"Legs","primary":"Quads","secondary":["Glutes"],"split":"legs","pattern":"Squat","focus":"Quads","guide":"Load hangs from a belt around the hips, so the spine stays unloaded. Sit deep and drive up.","steps":["Attach the belt and stand on the platform with the weight hanging from the hips.","Sit down with the chest tall into a deep squat.","Drive up through the whole foot."],"equipment":["Machine"],"metric":"reps","level":"beginner","src":"v8"},{"id":"landmine-squat","name":"Landmine Squat","group":"Legs","primary":"Quads","secondary":["Glutes"],"split":"legs","pattern":"Squat","focus":"Quads","guide":"Hold the end of the landmine bar at the chest and squat. The bar path counterbalances you into a deeper squat.","steps":["Hold the end of the landmine bar at the chest with both hands.","Squat down, letting the knees travel forward and the chest stay up.","Stand and push the bar slightly away to return."],"equipment":["Landmine"],"metric":"reps","level":"beginner","src":"v8"},{"id":"hip-airplane","name":"Hip Airplane","group":"Legs","primary":"Glutes","secondary":["Abductors"],"split":"legs","pattern":"Stability","focus":"Glutes","guide":"Balance on one leg in a hinge and rotate the pelvis open and closed over the standing hip.","steps":["Stand on one leg in a slight hip hinge, with a wall or rail nearby for balance.","Rotate the pelvis and chest open, away from the standing leg, then close it again.","Keep the knee soft and the foot rooted. Finish the reps, then switch legs."],"equipment":["Bodyweight"],"metric":"reps","level":"intermediate","src":"v8"},{"id":"frog-pump","name":"Frog Pump","group":"Legs","primary":"Glutes","secondary":["Adductors"],"split":"legs","pattern":"Hinge","focus":"Glutes","guide":"On your back with soles of the feet together and knees out. Drive the hips up for a high-rep glute pump.","steps":["Lie on your back with the soles of the feet together and the knees wide.","Drive the hips straight up and squeeze the glutes.","Lower slowly and repeat for high reps."],"equipment":["Bodyweight","Weighted Bodyweight"],"metric":"reps","level":"beginner","src":"v8"},{"id":"single-leg-press","name":"Single-Leg Press","group":"Legs","primary":"Quads","secondary":["Glutes"],"split":"legs","pattern":"Squat","focus":"Quads","guide":"One foot on the leg-press platform at a time. Fixes imbalances.","steps":["Sit in the leg press with one foot centred on the platform.","Lower the platform until the knee is bent to 90° or deeper.","Press back up without locking the knee. Finish the reps, then switch legs."],"equipment":["Machine"],"metric":"reps","level":"beginner","src":"v8"},{"id":"banded-good-morning","name":"Banded Good Morning","group":"Legs","primary":"Hamstrings","secondary":["Glutes","Lower Back"],"split":"legs","pattern":"Hinge","focus":"Hamstrings","guide":"Band under the feet and over the neck. Hinge at the hips with a flat back.","steps":["Stand on a band and loop the other end behind the neck, feet shoulder width apart.","Push the hips back, keeping a flat back and soft knees, until the torso is near parallel.","Squeeze the glutes to stand tall."],"equipment":["Band"],"metric":"reps","level":"beginner","src":"v8"},{"id":"kettlebell-clean","name":"Kettlebell Clean","group":"Full Body","primary":"Glutes","secondary":["Hamstrings","Traps","Front Delts"],"split":"full","pattern":"Olympic","focus":"Glutes","guide":"Hike the bell back, snap the hips, and guide the bell to the rack without banging the forearm.","steps":["Hike the kettlebell back between the legs with a hinge.","Snap the hips forward and pull the elbow close so the bell travels up the body.","Rotate the hand around the bell and catch it in the rack position. Lower it back down with control."],"equipment":["Kettlebell"],"metric":"reps","level":"intermediate","src":"v8"},{"id":"kettlebell-snatch","name":"Kettlebell Snatch","group":"Full Body","primary":"Glutes","secondary":["Hamstrings","Traps","Front Delts"],"split":"full","pattern":"Olympic","focus":"Glutes","guide":"Hike, snap the hips, and punch the hand through so the bell lands overhead in one motion.","steps":["Hike the bell back and drive the hips forward explosively.","Pull the elbow high and punch the hand through at the top so the bell lands overhead.","Lock out, then drop the bell back to the hike with a hinge. Swap hands."],"equipment":["Kettlebell"],"metric":"reps","level":"expert","src":"v8"},{"id":"kettlebell-halo","name":"Kettlebell Halo","group":"Shoulders","primary":"Front Delts","secondary":["Triceps","Upper Back","Abs"],"split":"push","pattern":"Rotation","focus":"Front Delts","guide":"Circle the kettlebell around the head, tight to the body, with the ribs down.","steps":["Hold a kettlebell upside down by the horns at chest height, elbows tucked.","Circle the bell around your head, keeping it close and the torso still.","Reverse direction halfway through the set."],"equipment":["Kettlebell"],"metric":"reps","level":"beginner","src":"v8"},{"id":"sandbag-carry","name":"Sandbag Carry","group":"Full Body","primary":"Upper Back","secondary":["Abs","Glutes","Forearms"],"split":"full","pattern":"Carry","focus":"Upper Back","guide":"Hug a sandbag to your chest and walk. Awkward load, big core and back demand.","steps":["Lift the sandbag and hold it in a bear hug against your chest.","Brace the core and walk with short, steady steps.","Set it down with control at the end of the distance."],"equipment":["Strongman"],"metric":"distance","level":"beginner","src":"v8"},{"id":"swimming","name":"Swimming","group":"Cardio","primary":null,"secondary":[],"split":"cardio","pattern":"Steady-State","focus":"","guide":"Low-impact full-body cardio. Keep a steady, comfortable pace and breathe rhythmically.","steps":["Warm up with a few easy lengths.","Swim at a steady pace using a stroke you can hold with good technique.","Cool down with a few easy lengths."],"equipment":["Outdoor"],"metric":"duration","level":"beginner","src":"v8"},{"id":"incline-treadmill-walk","name":"Incline Treadmill Walk","group":"Cardio","primary":null,"secondary":["Glutes","Calves"],"split":"cardio","pattern":"Steady-State","focus":"","guide":"Set a steep incline and walk briskly without holding the rails. Joint-friendly cardio that works the glutes and calves.","steps":["Set the treadmill to a 6–12% incline and a pace you can sustain.","Walk tall without gripping the handrails.","Cool down on a flat setting."],"equipment":["Treadmill"],"metric":"duration","level":"beginner","src":"v8"},{"id":"shadow-boxing","name":"Shadow Boxing","group":"Cardio","primary":null,"secondary":["Front Delts","Obliques"],"split":"cardio","pattern":"Mixed-Modality","focus":"","guide":"Throw punches in combinations with footwork. Keep hands up and rotate through the hips.","steps":["Stand in a boxing stance with the hands up and the knees soft.","Throw jabs, crosses and hooks in combinations, turning the hips with each punch.","Work in rounds of 2–3 minutes with short rests."],"equipment":["Other"],"metric":"duration","level":"beginner","src":"v8"},{"id":"stair-run","name":"Stair Run","group":"Cardio","primary":null,"secondary":["Quads","Glutes","Calves"],"split":"cardio","pattern":"Intervals","focus":"","guide":"Sprint up a flight of stairs and walk down to recover. Intense for the legs and the heart.","steps":["Warm up with a light jog and a few easy climbs.","Run up the stairs at a hard pace, then walk down slowly.","Repeat for rounds, resting as needed."],"equipment":["Outdoor"],"metric":"duration","level":"intermediate","src":"v8"}],"techniques":[{"name":"Superset","desc":"Two exercises back to back with no rest between them, then rest. Marked A1 / A2.","how":"Do A1, then immediately A2, then rest. Two rounds unless the note says otherwise."},{"name":"Drop Set","desc":"Performing an exercise to failure, then reducing the weight and continuing to failure again.","how":"1. Start with a weight you can lift for about 6–8 reps to failure. \n 2. After failure, reduce weight by 10–30% and continue. \n 3. Repeat drops 2–3 times until you reach failure again."},{"name":"Partials","desc":"Performing partial reps after reaching full-range-of-motion failure can be an effective intensity technique to push past fatigue and potentially enhance muscle growth. These partial reps, often done in the stretched or shortened range of the movement,.","how":"1. Reach Full Range Failure\n2. Perform Partial Reps. Once full range failure is reached, continue performing half ROM reps. \n3. Focus on the stretched (long-length) range of motion \n4. Control the Reps"},{"name":"Myo-Reps","desc":"Performing as many sets as possible with a given weight, resting briefly between mini-sets.","how":"1. Activation Set: Start with a set of 12 reps with a weight that allows you to go close to, but not completely to, muscle failure. \n2. Short Rest Period: Rest for 5 seconds (about 3 deep breaths). \n3. Back-Off Sets: Perform back-off sets of 6 reps with the same weight, aiming for good form and control.\n4. Repeat steps 2 and 3 until you can no longer perform at least 3 reps."},{"name":"Pause","desc":"Pausing during a lift to eliminate momentum, increasing time under tension and muscle recruitment.","how":"1. Perform an exercise and pause for 2–3 seconds at a specific point (e.g., bottom of a squat or top of a bench press). \n 2. Maintain tension during the pause, then continue the movement."},{"name":"Tempo","desc":"Controlling the speed of each phase (eccentric, isometric, concentric) of a lift to increase muscle tension and time under tension.","how":"1. Choose a tempo for each part of the lift (e.g., 3-0-1-0 for squats: 3 seconds down, 0 pause, 1 second up). \n 2. Stick to the tempo throughout the set. \n 3. Adjust for goals: slower for hypertrophy, faster for power."},{"name":"Negatives","desc":"Focusing on the eccentric phase of the lift (lowering the weight) for greater time under tension.","how":"1. Perform the concentric phase (lifting) as usual. \n 2. Lower the weight slowly (3–5 seconds on the eccentric phase). \n 3. Use a weight that you can control for slower eccentric movement."},{"name":"Reverse Grip","desc":"Using an underhand (palms-up) grip to alter muscle recruitment and emphasize different muscle areas, particularly the biceps or lower muscle portion.","how":"1. Use an underhand (palms-up) grip on a barbell, dumbbell, or cable. \n 2. Perform the exercise as usual (e.g., rows or curls) with the palms facing you. \n 3. Focus on muscle activation with this different grip position."},{"name":"Wrist Wraps","desc":"Supportive straps wrapped around the wrists to stabilize the joint during heavy pressing or overhead lifts.","how":"1. Wrap snugly around the wrist joint (not hand). \n 2. Use during heavy presses like bench or overhead press. \n 3. Avoid overuse to maintain wrist strength."},{"name":"Hip Bands","desc":"Elastic bands used around thighs to increase glute activation or add resistance to lower body exercises.","how":"1. Place band above knees or at thighs. \n 2. Use for warm-ups, squats, lunges, or lateral walks. \n 3. Keep tension throughout movement."},{"name":"Lifting Belt","desc":"A supportive belt used to brace the core during heavy compound lifts (e.g., squats, deadlifts).","how":"1. Position just above hips, tighten snugly. \n 2. Inhale into your belly to press against the belt before lifting. \n 3. Use for 80%+ loads or max effort sets."},{"name":"Rest-Pause","desc":"Take a set to failure, rest briefly, then squeeze out more reps with the same load.","how":"To failure, then rest ~15 breaths and do 3-5 more reps. Belongs on machines where failure is safe."},{"name":"Mechanical Drop","desc":"At failure, switch to a mechanically easier variation of the same movement and keep going.","how":"Example: overhead extension to failure, then slide straight into close-grip press to failure."},{"name":"Static Hold","desc":"An isometric hold for time rather than reps.","how":"Stop each hold about 2 s before form breaks. Progress the variation, not the effort."}],"groups":[{"name":"Chest","muscles":["Upper Chest","Mid Chest"]},{"name":"Back","muscles":["Lats","Upper Back","Traps","Lower Back","Neck"]},{"name":"Shoulders","muscles":["Front Delts","Side Delts","Rear Delts"]},{"name":"Arms","muscles":["Biceps","Triceps","Forearms"]},{"name":"Core","muscles":["Abs","Obliques"]},{"name":"Legs","muscles":["Quads","Hamstrings","Glutes","Abductors","Adductors","Calves"]},{"name":"Full Body","muscles":[]},{"name":"Cardio","muscles":[]}],"splits":["push","pull","legs","core","full","cardio"],"equipment":["Barbell","Dumbbell","Machine","Cable","Smith Machine","EZ Bar","Kettlebell","Trap Bar","Landmine","T-Bar","Plate","Band","Bodyweight","Weighted Bodyweight","Assisted Bodyweight","Suspension","Sled","Med Ball","Ab Wheel","Stability Ball","Strongman","Treadmill","Stationary Bike","Rower","Outdoor","Other"],"sources":{"freedb":"free-exercise-db by yuhonas (Unlicense)"}},"program":{"id":"P7","name":"Period 7","title":"TRAINING PROGRAM — PERIOD 7 (P7)","subtitle":"6-day Mentzer-influenced hybrid: hypertrophy + calisthenics + functional. City Sports Saratoga. Sunday = rest.","days":[{"id":"d5","label":"Day 1","weekday":"Monday","name":"Push A","focus":"Primary: Chest · Secondary: Shoulders, Triceps · ~40 min lifting + 5 min warm-up","slots":[{"id":"e8","movementId":"incline-press","equipment":"Dumbbell","alternatives":[],"group":null,"cue":null,"notes":"2 ramp sets first. Set 1 @ 1 RIR, Set 2 to technical failure. Rest 3 min. Full stretch, no bounce.","techniques":[],"sets":2,"reps":"6-10","repRange":{"min":6,"max":10},"metric":"reps","rirMax":0,"rirFloor":null,"keyLift":false,"cls":"upper","override":null,"beyondOk":false,"muscle":"Chest","seedWeight":100,"priorP6":100,"rest":180,"warmups":2},{"id":"e9","movementId":"dip","equipment":"Weighted Bodyweight","alternativ ","v":"6 lifting (Mon-Sat) + 2-3 Peloton conditioning. Sunday off."},{"k":"Working sets per session","v":"10-13 taken to or near failure. That is the HIT budget - do not add sets, add load."},{"k":"Movement patterns covered 2x/wk","v":"Horizontal press, vertical press, horizontal pull, vertical pull, squat, hip hinge, lunge/single-leg, carry."},{"k":"Calisthenics exposure","v":"5 days: weighted dip (Mon), front lever (Wed), HSPU progression + carries (Thu), pistol (Fri), weighted chin (Sat)."},{"k":"Functional / athletic exposure","v":"4 days: sled push (Tue), farmer carry (Wed), suitcase carry (Thu), rotational power (Fri), sled drag (Sat)."},{"k":"Core frequency","v":"3 dedicated blocks (Mon hanging flexion, Thu anti-rotation + carry, Sat anti-extension) + front lever Wed."},{"k":"Conditioning","v":"2-3x/wk Peloton. 1x Zone 2 35-45 min (Sun). 1-2x intervals 8-10 x 45 s hard / 75 s easy - Wed or Sat only, 6+ h after lifting. Never the day before Legs A or Legs B."},{"k":"Heaviest recovery days","v":"Tue (squat) and Fri (RDL). Protect them: no intervals Mon or Thu evening, and no running the day before either."}],"legend":[{"k":"CONVENTIONS","v":null},{"k":"Technique tags","v":"Uses your Technique_List vocabulary (Superset / Drop Set / MYO / Pause / Partials / Rest-Pause / Static Hold). Multi-technique entries are intentional - that's why D is warn-not-block."},{"k":"Supersets","v":"Marked A1 / A2 in the Exercise column. Do A1, then A2 back to back, then rest. Two rounds unless the note says otherwise."},{"k":"What counts as a set","v":"Working sets only. Warm-up and ramp sets are never counted and never taken near failure."},{"k":"Failure convention","v":"'Technical failure' = the next rep would break form. That's the stopping point almost everywhere. Squat and RDL stay at 1-2 RIR permanently - failure on those buys fatigue, not muscle."},{"k":"PROGRESSION RULE (double progression)","v":null},{"k":"Start load","v":"Week 1: pick a load that lands you mid-range at the target RIR. If you blow past the top of the range, it was too light - add load next session, never add sets."},{"k":"Increase when","v":"You hit the TOP of the rep range on every prescribed working set, with clean technique, at the target RIR."},{"k":"Increase by","v":"Isolation/cable +2.5-5 lb · Upper compound +5 lb (or next dumbbell) · Lower compound +10 lb · Weighted calisthenics +2.5-5 lb."},{"k":"Stall definition","v":"Same load AND same reps for 2 consecutive exposures (i.e. 2 weeks)."},{"k":"Stall protocol","v":"In order: (1) audit sleep/food/rest length; (2) add ONE intensity technique to the last set only for 2 weeks; (3) drop 10% and rebuild with strict tempo for 2 weeks; (4) only then rotate the variation - at a block boundary, not mid-block."},{"k":"What to track","v":"Load, reps, RIR, and a 1-5 session quality score. Two 2s in a row is an early deload signal."},{"k":"RIR","v":null},{"k":"What to log","v":"The RIR of the LAST working set of that exercise — the set that decides whether you add load next time. Set 1 is a ramp into it and isn't the signal."},{"k":"Scale","v":"-2 = well past failure (forced/assisted reps) · -1 = one rep past · 0 = technical failure · 1-2 = reps left · 3 = deload only."},{"k":"Where 0 belongs","v":"Nearly everything: dips, pec deck, laterals, triceps, hack squat, leg curl, rows, curls, rear delts."},{"k":"Where 1-2 belongs","v":"Back squat and RDL, permanently. If either logs a 0, that's a miss, not a win."},{"k":"Where -1/-2 belongs","v":"Only sets carrying an intensity technique: rest-pause, myo-reps, drop set, mechanical drop, lengthened partials."},{"k":"Reading it back","v":"Weight up + RIR unchanged = real progress. Weight unchanged + RIR drifting down = you're paying more effort for the same load, which is the earliest stall signal you get."},{"k":"Negative weights","v":"Assisted/deficit work (front lever -15, HSPU -10, pistol -16) is logged as negative load. Change still reads correctly: -16 to -10 shows +6 and goes /* =====================================================================
   SESSION TIMER — a time target per workout, a countdown, a progress ring and pace.
   Progress is weighted by planned time: each set counts for its work time plus the rest
   that follows it, so a heavy compound with 3-minute rests weighs more than a curl.
   Pace compares where you are with where that plan says you'd be on a target-length session.
   ===================================================================== */
var SETUP_SEC=45;                                    /* moving to the next exercise / loading */
function targetFor(day){ return (day && day.timeTarget) || ST.sessionTarget || 50; }
function workSec(metric, amount, rr){
  if(metric==='time') return (amount || (rr&&rr.max) || 30) + 10;
  if(metric==='duration') return (amount || (rr&&rr.max) || 20) * 60;
  if(metric==='distance') return 60;
  return 40;
}
/* planned seconds for a routine that hasn't started yet (Start preview, editor) */
function estimateSlots(slots){
  var t=0;
  slots.forEach(function(s, i){
    var n=slots[i+1], linked = s.group && n && n.group && String(n.group).charAt(0)===String(s.group).charAt(0);
    var rest = linked ? 15 : (s.rest || (s.cls==='gpp' ? 60 : ST.defaultRest));
    var metric=s.metric||'reps', first = !(i>0 && slots[i-1].group && s.group && String(slots[i-1].group).charAt(0)===String(s.group).charAt(0));
    if(first) t+=SETUP_SEC;
    t += (s.warmups||0)*(30+60);
    t += (s.sets||1)*(workSec(metric, null, s.repRange) + rest);
  });
  return t;
}

function sessionPlan(w){
  var total=0, done=0, nDone=0;
  (w.exercises||[]).forEach(function(ex){
    var metric=metricOf(ex), s=ex.slotId&&SLOT[ex.slotId], rr=s&&s.movementId===ex.movementId ? s.repRange : null;
    var g=groupMembers(ex), first=g[0]===ex, rest=restFor(ex);
    var setup = first ? SETUP_SEC : 0, exTot=setup, exDone=0;
    ex.sets.forEach(function(st){
      var sec = st.type==='W' ? 30+60 : st.type==='D' ? workSec(metric, st.amount, rr)*0.7+10 : workSec(metric, st.amount, rr) + (g.length>1 && !rest ? 15 : rest);
      exTot+=sec; if(st.done){ exDone+=sec; nDone++; }
    });
    if(exDone>0) exDone+=setup;

  });

function sessionStatus(w, now){
  var T=(w.target||ST.sessionTarget||50)*60, el=Math.max(0,(now-w.startedAt)/1000), P=sessionPlan(w);

  if(P.total && P.frac>=0.999){ r.kind='done'; r.text='All sets done'; return r; }
  if(el>T){ r.kind='over'; r.text='Over target by '+fmtSecs(el-T); }

    else { r.kind='behind'; r.text='Behind by '+mins+' min'; }
  }

var drag=null;
function startDrag(e, f, d, card){
  if(e.button!=null && e.button!==0) return;
  e.preventDefault(); closeMenu();
  var r=card.getBoundingClientRect();
  var ghost=card.cloneNode(true); ghost.classList.add('dragghost'); ghost.removeAttribute('data-day'); ghost.removeAttribute('data-folder');
  ghost.style.width=r.width+'px'; ghost.style.left=r.left+'px'; ghost.style.top=r.top+'px';
  document.body.appendChild(ghost); card.classList.add('dragging'); document.body.classList.add('dragging-on');

  if(e.clientY<70) window.scrollBy(0,-14); else if(e.clientY>window.innerHeight-110) window.scrollBy(0,14);
  drag.ghost.style.visibility='hidden'; var el=document.elementFromPoint(e.clientX, e.clientY); drag.ghost.style.visibility='';
  clearDropMarks(); drag.target=null;
  if(!el) return;
  var rc=el.closest('.dayc[data-day]'), fs=el.closest('.fold-sec');
  if(rc && rc!==drag.card){
    var rr=rc.getBoundingClientRect(), after=e.clientY>rr.top+rr.height/2;
    rc.classList.add(after?'drop-after':'drop-before');
    drag.target={folder:FOLDER[rc.dataset.folder], day:rc.dataset.day, after:after};
  } else if(fs && !rc){
    fs.classList.add('drop-into'); drag.target={folder:FOLDER[fs.dataset.folder]};

  document.removeEventListener('pointermove', dragMove); document.removeEventListener('pointerup', dragEnd); document.removeEventListener('pointercancel', dragCancel);

  var to=D.target.folder, list=to.days.filter(function(x){ return x!==D.d; }), idx=list.length;
  if(D.target.day){ var j=list.findIndex(function(x){ return x.id===D.target.day; }); if(j>=0) idx=j+(D.target.after?1:0); }
  if(e && e.altKey){ copyRoutine(D.d, to, to===D.f ? to.days.indexOf(D.d)+1 : idx); return; }   /* hold Alt / Option on a computer to copy */
  if(to===D.f && D.f.days.indexOf(D.d)===idx) return;
  moveRoutine(D.f, D.d, to, idx);
}

/* tap an exercise's name: everything that used to crowd the card, plus recent history and the chart */

function autoGrow(t){ t.style.height='auto'; t.style.height=t.scrollHeight+'px'; }
function fmtRest(sec){ return sec>=60 ? (sec%60 ? fmtSecs(sec) : sec/60+' min') : sec+' s'; }

  return (rr.min===rr.max ? rr.min : rr.min+'–'+rr.max)+u; }

/* today's goal, in words: what to load and what to hit */
function goalWeight(a, slot){
  if(a.status==='ready' && a.sugWeight!=null) return a.sugWeight;
  if(a.last && a.last.top!=null) return a.last.top;
  if(slot && slot.seedWeight!=null) return slot.seedWeight;
  return null;
}
function goalFor(ex, a, slot, metric){
  var eq=ex.equipment, gw=goalWeight(a, slot), lb=function(w){ return showW(eq,w)+(isAssist(eq)?' assist':' '+wU()); };
  var rr = slot && slot.repRange ? rangeTxt(slot.repRange, metric) : null;
  var rir = ST.showRir && slot && slot.rirMax!=null ? ', last set at RIR '+(slot.rirFloor!=null&&slot.rirFloor!==slot.rirMax? slot.rirFloor+'–'+slot.rirMax : slot.rirMax) : '';
  var out={kind:'plain', w:gw};
  if(a.status==='ready'){
    out.kind='good';
    var why = a.suggestion ? a.suggestion.replace(/\.\s*$/,'') : 'ready to progress';
    out.text = a.sugWeight!=null ? lb(a.sugWeight)+(rr?' × '+rr:'')+rir+'. You earned it: '+why+'.' : 'You earned it: '+why+'.';
    /* fills only sets with no weight yet — anything you typed stays */
    if(a.sugWeight!=null) out.use=function(){ ex.sets.forEach(function(s){ if(s.type!=='W' && s.type!=='D' && !s.done && s.weight==null) s.weight=a.sugWeight; }); touchActive(); rerenderCard(ex); };
  } else if(a.status==='stalled'){
    out.kind='warn';
    out.text = lb(a.last.top)+' again — stalled at '+repsSig(a.last)+' twice. Add ONE intensity technique to the last set.';
  } else if(a.status==='drift'){
    out.kind='drift';
    out.text = 'Hold '+lb(a.last.top)+' and get the last set back to RIR '+a.driftFrom+' (it slid to '+a.driftTo+').';
  } else if(a.status==='holding' && a.last){
    var need = slot && slot.repRange ? slot.repRange.max : null;
    out.text = lb(a.last.top!=null?a.last.top:0)+' — beat '+repsSig(a.last)+(need?'. Reach '+need+' on every set'+rir+' to add load.':'.');
    if(a.last.top==null) out.text='Beat '+repsSig(a.last)+(need?' — '+need+' on every set'+rir+' to progress.':'.');
  } else if(slot && slot.seedWeight!=null){
    out.text = 'Start at '+lb(slot.seedWeight)+(rr?' × '+rr:'')+rir+' (from the program'+(slot.priorP6!=null?'; last block was '+showW(eq,slot.priorP6):'')+').';
  } else if(rr){
    out.text = 'First time: pick a load you can do for '+rr+rir+'.';
  } else if(slot && slot.reps){
    out.text = slot.sets+' × '+slot.reps+(a.last && a.last.top!=null ? ' — last time '+lb(a.last.top) : '')+'.';
  } else return null;
  return out;
}
/* the small target line under "previous" on each row */
var RAMP = {1:[[.6,5]], 2:[[.5,8],[.75,4]], 3:[[.4,8],[.6,5],[.8,3]], 4:[[.4,8],[.55,5],[.7,3],[.85,2]]};
function roundTo(v, step){ return Math.max(0, Math.round(v/step)*step); }
function setTarget(s, isLastWork, slot, goal, eq, metric, ex, idx){
  var gw = goal ? goal.w : null;
  if(s.type==='W'){
    var ws=ex.sets.filter(function(x){ return x.type==='W'; }), wi=ws.indexOf(s), plan=RAMP[Math.min(4,ws.length)];
    if(gw==null || gw<=0 || !plan || isAssist(eq) || metric!=='reps') return 'warm-up';
    var r=plan[Math.min(wi, plan.length-1)];
    return '≈'+fmtW(roundTo(gw*r[0], stepFor(eq)))+' × '+r[1];
  }
  if(s.type==='D') return gw!=null && gw>0 && !isAssist(eq) ? '≈'+fmtW(roundTo(gw*0.8, stepFor(eq)))+' to fail' : 'drop';
  if(!slot || !slot.repRange) return null;
  var t = rangeTxt(slot.repRange, metric).replace(' reps','');
  if(s.type==='F') return t+' · fail';
  if(isLastWork && ST.showRir && slot.rirMax!=null) t+=' @'+slot.rirMax;
  return t;
}
function stepFor(eq){ return (eq==='Dumbbell'||eq==='Kettlebell') ? ST.dbStep : ST.wStep; }

/* iOS-style swipe left to delete a set row */
var openSwipe=null;
function swipeable(row, fg, onDelete){
  var x0=0, y0=0, dx=0, mode=null, pid=null, base=0;
  fg.addEventListener('pointerdown', function(e){
    if(e.pointerType==='mouse' && e.button!==0) return;
    if(openSwipe && openSwipe!==row) closeSwipe();
    x0=e.clientX; y0=e.clientY; dx=0; mode=null; pid=e.pointerId; base=row.classList.contains('open') ? -88 : 0;
  });
  fg.addEventListener('pointermove', function(e){
    if(e.pointerId!==pid) return;
    var mx=e.clientX-x0, my=e.clientY-y0;
    if(!mode){ if(Math.abs(mx)>10 && Math.abs(mx)>Math.abs(my)*1.3){ mode='swipe'; try{ fg.setPointerCapture(pid); }catch(_){} row.classList.add('swiping'); var a=document.activeElement; if(a && fg.contains(a)) a.blur(); }
               else if(Math.abs(my)>10){ mode='scroll'; } }
    if(mode==='swipe'){ dx=Math.min(0, base+mx); fg.style.transform='translateX('+dx+'px)'; row.classList.toggle('far', dx < -row.offsetWidth*0.55); e.preventDefault(); }
  });
  function end(e){
    if(e.pointerId!==pid) return; pid=null;
    if(mode!=='swipe') return;
    row.classList.remove('swiping');
    if(dx < -row.offsetWidth*0.55){ fg.style.transform='translateX(-100%)'; setTimeout(onDelete, 160); return; }
    if(dx < -44){ fg.style.transform='translateX(-88px)'; row.classList.add('open'); openSwipe=row; }
    else { fg.style.transform=''; row.classList.remove('open'); if(openSwipe===row) openSwipe=null; }
    /* swallow the click that follows a drag */
    var sw=function(ev){ ev.stopPropagation(); ev.preventDefault(); fg.removeEventListener('click', sw, true); };
    fg.addEventListener('click', sw, true); setTimeout(function(){ fg.removeEventListener('click', sw, true); }, 350);
    setTimeout(function(){ mode=null; }, 0);
  }
  fg.addEventListener('pointerup', end); fg.addEventListener('pointercancel', end);
}
function closeSwipe(){ if(!openSwipe) return; var f=openSwipe.querySelector('.sfg'); if(f) f.style.transform=''; openSwipe.classList.remove('open'); openSwipe=null; }
document.addEventListener('pointerdown', function(e){ if(openSwipe && !openSwipe.contains(e.target)) closeSwipe(); }, true);

/* what an empty cell shows — and what ✓ accepts without typing. Only empty cells are ever
   filled; logging one set never rewrites the sets below it.
   1. a load increase the history has earned, with the bottom of the rep range
   2. the matching set from last time (legacy set info wins over today's set above)
   3. the closest set above it already logged this session (same kind: warm-up / work / drop),
      for sets with no match last time
   4. last time's final set of that kind, if you added sets
   5. the sheet's seed weight on a first-ever exposure */
function setKind(t){ return t==='W' ? 'W' : t==='D' ? 'D' : 'N'; }
function autofillFor(ex, idx, p, prev, a, slot){
  var s=ex.sets[idx], k=setKind(s.type), out={w:null, a:null, src:null};
  if(p && setKind(p.type)!==k) p=null;
  var fallback=null;
  if(!p && prev){ var same=prev.sets.filter(function(x){ return setKind(x.type)===k; }); fallback=same.length ? same[same.length-1] : null; }
  if(k!=='W' && a.status==='ready' && a.sugWeight!=null){
    out.w=a.sugWeight; out.src='ready';
    out.a = slot && slot.repRange ? slot.repRange.min : ((p||fallback) ? (p||fallback).amount : null);
    return out;
  }
  if(p){ out.w=p.weight; out.a=p.amount; out.src='prev'; return out; }
  for(var i=idx-1;i>=0;i--){
    var t=ex.sets[i];
    if(t.done && setKind(t.type)===k && (t.weight!=null || t.amount!=null)){ out.w=t.weight; out.a=t.amount; out.src='session'; return out; }
  }
  p=fallback;
  if(p){ out.w=p.weight; out.a=p.amount; out.src='prev'; return out; }
  if(k!=='W' && slot && slot.seedWeight!=null && !prev){ out.w=slot.seedWeight; out.src='seed'; }
  return out;
}
function hintEl(kind, mark, text, action){

    action? h('button',{class:'use',onclick:action.fn},action.label):null);
}
/* in-session feedback, recomputed as you type — no re-render, so focus stays put */

  var box=card.querySelector('.livefb'); if(!box) return; box.innerHTML='';
  var slot = ex.slotId && SLOT[ex.slotId] && SLOT[ex.slotId].movementId===ex.movementId ? SLOT[ex.slotId] : slotForKey(keyOf(ex.movementId,ex.equipment));

    box.appendChild(hintEl(slot.keyLift?'crit':'warn','✕', slot.keyLift ? 'RIR '+last.rir+' on a lift that stays at 1–2 RIR permanently. Failure here buys fatigue, not muscle.' : 'Below this movement’s '+slot.rirFloor+' RIR floor.'));

    return;
  }

     (last.rir==null || ((slot.rirMax==null||last.rir<=slot.rirMax) && (slot.rirFloor==null||last.rir>=slot.rirFloor)))){

var audioCtx=null;

/* rest-over alert: sound (chime / beep / bell), vibration, optional notification — all set in Settings */
function playTone(kind, vol){
  try{
    if(!audioCtx) return;
    var t0=audioCtx.currentTime, v=Math.max(0.02, Math.min(1, vol==null?0.7:vol))*0.35;
    var notes = kind==='beep' ? [[880,0,.16,'square'],[880,.24,.16,'square']]
              : kind==='bell' ? [[1046.5,0,1.4,'sine'],[1318.5,0,1.2,'sine'],[1568,0,1.0,'sine']]
              : [[659.3,0,.5,'sine'],[880,.18,.7,'sine']];
    notes.forEach(function(n){
      var o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type=n[3]; o.frequency.value=n[0];
      g.gain.setValueAtTime(0.0001,t0+n[1]); g.gain.exponentialRampToValueAtTime(v*(n[3]==='square'?0.5:1),t0+n[1]+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+n[1]+n[2]);
      o.connect(g); g.connect(audioCtx.destination); o.start(t0+n[1]); o.stop(t0+n[1]+n[2]+0.05);
    });
  }catch(e){}
}

/* ------------------ shared exercise filters (Exercises tab + picker) ------------------ */
function newFilter(){ return {by:'muscle', group:'All', sub:'All', equip:'All', logged:false, q:''}; }
var Q_ALIAS={db:'dumbbell', bb:'barbell', kb:'kettlebell', ohp:'overhead press', bw:'bodyweight', rdl:'romanian', sldl:'stiff-leg', ghr:'glute ham', hspu:'handstand'};
function matchQuery(m, q){
  if(!q) return true;
  var hay=(m.name+' '+(m.pattern||'')+' '+(m.primary||'')+' '+(m.group||'')+' '+(SPLIT_LABEL[m.split]||'')+' '+m.equipment.join(' ')+' '+(m.secondary||[]).join(' ')).toLowerCase();
  /* each word must start a word in the name/muscles/equipment ("rdl" ≠ hu-rdl-e) */
  function has(t){ return new RegExp('(^|[^a-z0-9])'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(hay); }
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(function(t){ return has(t) || (Q_ALIAS[t] && has(Q_ALIAS[t])); });
}
/* how well the name itself matches: 0 exact, 1 starts with, 2 contains phrase, 3 every word in name, 4 elsewhere */
function nameRank(m, q){
  q=(q||'').trim().toLowerCase(); if(!q) return 0;
  var n=m.name.toLowerCase();
  if(n===q) return 0; if(n.indexOf(q)===0) return 1; if(n.indexOf(q)>=0) return 2;
  return q.split(/\s+/).every(function(t){ return n.indexOf(Q_ALIAS[t]||t)>=0 || n.indexOf(t)>=0; }) ? 3 : 4;
}
function subsFor(st){
  if(st.group==='All') return [];
  if(st.by==='split') return splitMuscles(st.group);

/* -> {direct:[...], also:[...]} ; "also" = movements that hit the chosen muscle as a secondary */
function filterMoves(st, counts){
  var direct=[], also=[];
  allMoves().forEach(function(m){
    if(st.logged && !counts[m.id]) return;
    if(st.equip!=='All' && m.equipment.indexOf(st.equip)<0) return;
    if(!matchQuery(m, st.q.trim())) return;
    if(st.group!=='All'){
      if(st.by==='split' ? m.split!==st.group : m.group!==st.group){
        /* a sub-muscle still pulls in movements from other groups that train it secondarily */
        if(st.sub!=='All' && (m.secondary||[]).indexOf(st.sub)>=0) also.push(m);
        return;
      }

    if(st.sub!=='All' && m.primary!==st.sub){ if((m.secondary||[]).indexOf(st.sub)>=0) also.push(m); return; }
    direct.push(m);

}

function qualityBar(w){

  var track=h('div',{class:'qb-track'}), thumb=h('div',{class:'qb-thumb'}), val=h('div',{class:'qb-val'});

    h('b',{text:String(n)}), h('span',{text:QWORD[n-1]})); }));
  track.appendChild(thumb);

function bulkSaveWorkouts(list, onProg){
  var at={}; S.workouts.forEach(function(w, i){ at[w.id]=i; });
  list.forEach(function(r){ if(r.id in at) S.workouts[at[r.id]]=r; else { at[r.id]=S.workouts.length; S.workouts.push(r); } });
  sortWorkouts(); cacheWorkouts();

    if(list.length<=150){ S.pending=S.pending.filter(function(p){ return !list.some(function(r){ return r.id===p.id; }); }); list.forEach(function(r){ S.pending.push(r); }); lsSet(LS.pending, S.pending); }
    return Promise.resolve({ok:list.length, failed:0});
  }
  var ok=0, failed=0, i=0, B=10;
  return new Promise(function(done){
    function next(){
      if(i>=list.length){ setSync(failed?'err':'ok'); done({ok:ok, failed:failed}); return; }
      var batch=list.slice(i, i+B); i+=B;
      Promise.all(batch.map(function(r){
        var w=new Promise(function(res, rej){ var t=setTimeout(function(){ rej(new Error('timeout')); }, 25000);
          refs.workouts.doc(r.id).set(r).then(function(){ clearTimeout(t); res(); }, function(e){ clearTimeout(t); rej(e); }); });
        return w.then(function(){ ok++; }).catch(function(){ failed++; S.pending.push(r); });
      })).then(function(){ lsSet(LS.pending, S.pending); if(onProg) onProg(Math.min(i,list.length), list.length); next(); });
    }
    next();
  });
}

/* decide what each Strong exercise name becomes: a library exercise, a new one of yours, or skipped.
